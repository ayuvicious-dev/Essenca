M[0].bq[8]=[["Berdasarkan survey tahun 1999 oleh majalah Fortune, sekitar 70% permasalahan yang berkaitan dengan strategi terletak pada...", ["Perencanaannya", "Eksekusinya", "Penetapan visi", "Penyusunan anggaran"], 1, "Menurut survey Fortune 1999 (Kaplan dan Norton 2001), 70% masalah strategi bukan pada perencanaan, melainkan pada eksekusinya."], ["Survey pada awal tahun 80an menemukan bahwa rencana stratejik yang betul-betul efektif dilaksanakan hanya sekitar...", ["10%", "30%", "50%", "70%"], 0, "Hanya 10% dari rencana stratejik yang betul-betul efektif dilaksanakan."], ["Perencanaan jangka panjang perusahaan, biasanya tiga atau lima tahunan, disebut...", ["Anggaran", "Rencana stratejik (strategic plan)", "Belief system", "Boundary"], 1, "Rencana jangka panjang disebut rencana stratejik; rencana tahunan salah satunya diwujudkan dalam anggaran."], ["Menurut Anthony dan Govindarajan (2007), sistem pengendalian manajemen adalah proses di mana manajer berusaha...", ["Menghitung laba perusahaan", "Mempengaruhi anggota organisasi untuk menjalankan strateji perusahaan", "Menyusun laporan keuangan eksternal", "Mengaudit karyawan"], 1, "Karena fokusnya implementasi strateji, sistem ini sering disebut sistem pengendalian stratejik."], ["Menurut agency theory dalam modul, pihak yang bertindak sebagai principal dan agen adalah...", ["Karyawan sebagai principal, manajemen sebagai agen", "Manajemen sebagai principal, karyawan sebagai agen", "Pemegang saham sebagai agen, kreditur sebagai principal", "Pelanggan sebagai principal, pemasok sebagai agen"], 1, "Dalam pendekatan ini manajemen adalah principal dan karyawan adalah agen yang tujuannya bisa berbeda dari perusahaan."], ["Pendekatan Simons (2000) berpandangan bahwa pada dasarnya orang-orang yang bekerja dalam perusahaan...", ["Selalu mementingkan diri sendiri", "Memiliki itikad yang baik", "Tidak ingin berinovasi", "Hanya bekerja karena pengawasan"], 1, "Simons: orang ingin berkontribusi, melakukan hal yang benar, menyelesaikan tugas dengan baik, dan berinovasi."], ["Hal-hal yang menghambat orang melakukan pekerjaan yang kompeten bagi perusahaan disebut...", ["Strategic boundary", "Organizational block", "Emergent strategy", "Strategic uncertainties"], 1, "Organizational block dihilangkan dengan konsep Four Levers of Control."], ["Yang BUKAN termasuk Four Levers of Control adalah...", ["Belief system", "Boundary system", "Budgetary control system", "Interactive control system"], 2, "Empat levers: belief, boundary, diagnostic control, dan interactive control system."], ["Belief system dipakai untuk mengatasi organizational block berupa...", ["Orang tidak tahu batas perilaku", "Orang terhalang untuk memberikan kontribusi bagi perusahaan", "Strateji menjadi usang", "KPI tidak diukur"], 1, "Belief system mengatasi penghalang orang untuk memberikan kontribusi bagi perusahaan."], ["Definisi organisasi yang dipakai dalam belief system adalah...", ["Anggaran dan laporan keuangan", "Pernyataan misi dan nilai (values)", "KPI dan balanced scorecard", "Strategic boundary dan business conduct boundary"], 1, "Belief system memakai mission statement dan values."], ["Misi 3M, yaitu to solved unsolved problem innovatively, dipakai dalam modul sebagai contoh misi yang...", ["Menginspirasikan perubahan", "Hanya berorientasi laba", "Dapat diukur dengan KPI", "Bersifat jangka pendek"], 0, "Misi harus dapat menginspirasikan perubahan; misi 3M mendorong inovasi produk baru yang mempermudah kehidupan orang."], ["Menurut Niven (2010), misi ditulis untuk jangka waktu yang lama, bahkan sampai...", ["5 tahun", "10 tahun", "50 tahun", "100 tahun"], 3, "Misi bersifat jangka panjang, bahkan sampai 100 tahun, walaupun visi dan strateji terus berubah."], ["Misi Disneyland yang disederhanakan menjadi to make people happy dijalankan antara lain dengan...", ["Mengurangi jumlah karyawan", "Mengingatkan karyawan bahwa mereka adalah aktor dan aktris yang menyenangkan pengunjung", "Menaikkan harga tiket", "Menghapus nilai perusahaan"], 1, "Apa pun posisinya, karyawan diingatkan bahwa mereka adalah aktor dan aktris yang bertugas menyenangkan pengunjung."], ["Menurut penelitian Collin dan Porras (2002), perusahaan berumur panjang adalah perusahaan yang...", ["Hanya memiliki satu misi, yaitu memaksimalkan kekayaan pemegang saham", "Memiliki sekumpulan misi, dengan kekayaan pemegang saham hanya salah satunya", "Tidak memiliki misi", "Hanya fokus pada pesaing"], 1, "Memaksimalkan kekayaan pemegang saham hanya salah satu misi, dan bukan yang terutama."], ["Boundary system dibutuhkan karena misi dan nilai perusahaan...", ["Terlalu sempit", "Masih bersifat terlalu umum", "Selalu berubah tiap tahun", "Tidak dapat dikomunikasikan"], 1, "Boundary system memberi pagar agar orang memahami apa yang diperbolehkan dan tidak diperbolehkan."], ["Dua jenis boundary system menurut modul adalah...", ["Strategic boundary dan business conduct boundary", "Belief boundary dan diagnostic boundary", "Financial boundary dan operating boundary", "Internal boundary dan external boundary"], 0, "Strategic boundary membatasi keputusan stratejik; business conduct boundary membatasi perilaku."], ["Contoh strategic boundary pada General Electric (GE) adalah...", ["Investasi hanya pada perusahaan berpotensi nomor satu atau nomor dua di bidangnya", "Larangan semua akuisisi", "Karyawan dilarang mencari target akuisisi", "Investasi hanya pada perusahaan baru"], 0, "GE mendorong akuisisi, tetapi dibatasi: hanya perusahaan yang berpotensi nomor satu atau dua di bidangnya."], ["Yang BUKAN termasuk empat macam strategic boundaries menurut modul adalah...", ["Minimal posisi persaingan", "Minimal tingkat pengembalian yang diperoleh", "Produk atau jasa yang bukan kompetensi perusahaan", "Jumlah karyawan maksimal tiap departemen"], 3, "Empat macamnya: minimal posisi persaingan, minimal tingkat pengembalian, produk atau jasa di luar kompetensi, serta posisi dan pesaing yang harus dihindari."], ["Business conduct boundaries memberi batasan pada...", ["Anggaran tahunan", "Values yang dianggap masih terlalu luas", "KPI perusahaan", "Struktur organisasi"], 1, "Business conduct boundaries memperjelas perilaku orang dalam perusahaan yang diperbolehkan dan tidak diperbolehkan."], ["Fungsi diagnostic control system adalah...", ["Menetapkan misi perusahaan", "Memeriksa apakah strateji sudah dijalankan serta tujuan dan visi sudah tercapai", "Mendeteksi strategic uncertainties", "Memberi batasan perilaku karyawan"], 1, "Diagnostic control system memeriksa atau mendiagnosa pelaksanaan strateji dan pencapaian tujuan serta visi."], ["Visi awal Starbucks 2000 by 2000, yaitu 2000 gerai pada tahun 2000, adalah contoh visi yang...", ["Concise (tidak bertele-tele)", "Inspirasional saja", "Tidak dapat diukur", "Bertentangan dengan misi"], 0, "Visi yang sederhana mudah diingat oleh orang-orang dalam organisasi."], ["Visi yang baik harus dapat dibuktikan (verifiable), artinya...", ["Dibuat sepanjang mungkin", "Memiliki KPI dan tenggat waktu pencapaian", "Hanya mewakili pemegang saham", "Tidak boleh diukur"], 1, "Visi yang verifiable dapat diukur: memiliki KPI untuk mengukur ketercapaian dan tenggat waktu pencapaian."], ["Visi yang baik tidak memihak (appeal to stakeholders), artinya...", ["Hanya fokus pada pemegang saham", "Mewakili semua stakeholders penting perusahaan", "Mengabaikan karyawan", "Hanya untuk pelanggan"], 1, "Visi tidak memfokuskan pada pihak tertentu saja, seperti pemegang saham."], ["Konsep yang paling baik untuk memilih tolok ukur yang sesuai dengan strateji perusahaan adalah...", ["Balanced scorecard", "Whale curve", "Pricing waterfall", "Drum-buffer-rope"], 0, "Menurut modul, balanced scorecard adalah konsep terbaik untuk memilih tolok ukur yang sesuai dengan strateji."], ["Tujuan interactive control system adalah...", ["Menetapkan batasan perilaku", "Mendeteksi strategic uncertainties sedini mungkin", "Menyusun anggaran tahunan", "Menghitung biaya produk"], 1, "Interactive control system mendeteksi ketidakpastian strateji akibat perubahan lingkungan eksternal."], ["Kondisi ancaman dan kesempatan baru akibat perubahan lingkungan eksternal yang membuat strateji menjadi usang disebut...", ["Organizational block", "Strategic uncertainties", "Boundary system", "Realized strategy"], 1, "Perubahan lingkungan menimbulkan strategic uncertainties atau ketidakpastian strateji."], ["Pada industri yang sudah mature, KPI yang dapat dipilih untuk interactive control system adalah...", ["Market share, pendapatan per produk, dan pengiriman barang per produk", "Hanya laba bersih", "Jumlah karyawan", "Biaya sewa kantor"], 0, "KPI harus menangkap tindakan pesaing (promosi, diskon) dan perubahan kebiasaan membeli pelanggan."], ["Elemen kedua interactive control system, selain KPI, adalah...", ["Pertemuan yang dihadiri setiap jenjang termasuk manajemen puncak", "Audit tahunan", "Penyusunan anggaran induk", "Pemberian bonus"], 0, "Pertemuan khusus membahas KPI interaktif dan harus menghasilkan tindakan untuk mengatasi masalah."], ["Strateji yang tidak terdapat dalam rencana stratejik, tetapi muncul karena perubahan lingkungan, disebut...", ["Realized strategy", "Emergent strategy", "Intended strategy", "Boundary strategy"], 1, "Emergent strategy muncul dari interactive control system."], ["Realized strategy adalah...", ["Strateji awal saja", "Emergent strategy saja", "Gabungan strateji awal dengan emergent strategy", "Strateji yang tidak pernah dijalankan"], 2, "Strateji yang benar-benar dijalankan perusahaan adalah gabungan strateji awal dan emergent strategy."], ["Menurut modul, sistem yang memakai punishment system jika batas dilanggar adalah...", ["Belief system", "Boundary system", "Diagnostic control system", "Interactive control system"], 1, "Dengan boundary yang jelas dan punishment system yang berjalan baik, orang diharapkan melakukan yang diperbolehkan."], ["Sistem yang membuat orang fokus pada hal yang diinginkan perusahaan melalui KPI yang diturunkan dari rencana stratejik adalah...", ["Belief system", "Boundary system", "Diagnostic control system", "Interactive control system"], 2, "Diagnostic control system mengarahkan orang bekerja sesuai KPI, sehingga sumber daya tidak terbuang untuk hal di luar strateji."], ["Sistem yang memberi kesempatan pegawai lebih innovative mencari cara mengatasi perubahan lingkungan eksternal adalah...", ["Belief system", "Boundary system", "Diagnostic control system", "Interactive control system"], 3, "Interactive control system mendorong inovasi menghadapi perubahan lingkungan eksternal."]];

Object.assign(FIGS,{tw:"<svg viewBox=\"0 0 520 400\" role=\"img\" aria-label=\"Gambar 10.1 Three wheel of profit planning: cash wheel, profit wheel, dan ROE wheel, dihubungkan oleh sales dan profits\"><circle cx=\"260\" cy=\"82\" r=\"60\" class=\"fr\"/><circle cx=\"260\" cy=\"192\" r=\"60\" class=\"fr\"/><circle cx=\"260\" cy=\"302\" r=\"60\" class=\"fr\"/><text x=\"260\" y=\"86\" class=\"fb\">Cash Wheel</text><text x=\"260\" y=\"196\" class=\"fb\">Profit Wheel</text><text x=\"260\" y=\"306\" class=\"fb\">ROE Wheel</text><text x=\"260\" y=\"16\" class=\"fl\">Operating Cash</text><text x=\"196\" y=\"70\" class=\"fl\" text-anchor=\"end\">Accounts</text><text x=\"196\" y=\"83\" class=\"fl\" text-anchor=\"end\">Receivable</text><text x=\"332\" y=\"78\" class=\"fl\" text-anchor=\"start\">Inventory</text><text x=\"260\" y=\"139\" class=\"fl\">Sales</text><text x=\"196\" y=\"182\" class=\"fl\" text-anchor=\"end\">Operating</text><text x=\"196\" y=\"195\" class=\"fl\" text-anchor=\"end\">Expenses</text><text x=\"332\" y=\"182\" class=\"fl\" text-anchor=\"start\">Investments</text><text x=\"332\" y=\"195\" class=\"fl\" text-anchor=\"start\">in Assets</text><text x=\"260\" y=\"249\" class=\"fl\">Profits</text><text x=\"196\" y=\"292\" class=\"fl\" text-anchor=\"end\">Asset</text><text x=\"196\" y=\"305\" class=\"fl\" text-anchor=\"end\">Utilization</text><text x=\"332\" y=\"292\" class=\"fl\" text-anchor=\"start\">Stockholders’</text><text x=\"332\" y=\"305\" class=\"fl\" text-anchor=\"start\">Equity</text><text x=\"260\" y=\"382\" class=\"fl\">Return on Equity</text></svg>"});
Object.assign(FNOTE,{tw:"<b>Cara membaca:</b> tiga roda ditumpuk dari atas ke bawah. <b>Cash wheel</b> (operating cash, accounts receivable, inventory) menyambung ke <b>profit wheel</b> lewat <i>sales</i>; <b>profit wheel</b> (operating expenses, investments in assets) menyambung ke <b>ROE wheel</b> lewat <i>profits</i>; <b>ROE wheel</b> (asset utilization, stockholders’ equity) bermuara pada <i>return on equity</i>."});
Object.assign(M[0].mat,{
"10.1":["<b>Anggaran</b> merupakan suatu kegiatan yang penting bagi perusahaan. Dalam anggaran, perusahaan menganggarkan biaya-biaya yang akan dikeluarkan untuk tindakan-tindakan yang akan dilakukan pada periode mendatang. Anggaran juga dapat dipergunakan sebagai <b>alat pengendalian</b>, untuk melihat apakah kegiatan-kegiatan perusahaan sudah berjalan sesuai dengan rencana.", "Permasalahannya adalah, anggaran merupakan suatu alat manajemen yang sudah ada sejak lama sekali. Buku pertama mengenai anggaran ditulis oleh <b>James O. McKinsey pada tahun 1922</b>, dengan demikian konsep anggaran sudah hampir berusia <b>100 tahun</b>. Permasalahannya apakah konsep anggaran yang dikemukakan pada tahun 1922 tersebut masih bisa diterapkan untuk kondisi sekarang, dimana situasi bisnis yang dihadapi pada kedua era tersebut sama sekali berbeda.", "Teknis cara penyusunan anggaran tidak akan dibahas dalam modul ini, peserta dapat melakukan <i>review</i> kembali dari bahan bacaan yang disarankan pada modul ini."],
"10.2":["Anggaran merupakan <b>rencana jangka pendek</b> perusahaan yang bersifat <b>kuantitatif</b>. Biasanya periode anggaran adalah <b>satu tahun</b>. Terdapat perbedaan yang mendasar antara anggaran, rencana (<i>plan</i>), target dan <i>forecast</i>. <b>Target</b> merupakan suatu tujuan yang ingin dicapai perusahaan. Misalkan, perusahaan menginginkan target <i>Return on Equity</i> sebesar 20%. Untuk mencapai target tersebut perusahaan harus membuat <b>rencana tindakan (<i>plan</i>)</b> sehingga target dapat tercapai. <b>Anggaran</b> adalah biaya yang diperlukan untuk menjalankan rencana (<i>plan</i>) tersebut.", "Kebanyakan proses penyusunan anggaran perusahaan dimulai pada <b>bulan September</b>, dan dibutuhkan sekitar <b>tiga atau empat bulan</b> untuk menyusun anggaran tersebut. Seperti yang telah dikatakan sebelumnya, anggaran disusun berdasarkan <b>asumsi</b> apa yang akan terjadi pada periode mendatang, misalkan asumsi mengenai tingkat inflasi, kurs dollar, dan sebagainya. Masalahnya adalah, sering sekali terjadi perbedaan antara asumsi yang dibuat perusahaan dengan kenyataan yang terjadi. Hal tersebut akan menyebabkan anggaran sering bukan membantu, namun menghambat kegiatan operasional perusahaan.", "Karena itu muncul <b><i>forecast</i></b> yang kemudian dipergunakan sebagai alat untuk membantu pengelolaan perusahaan untuk mencapai target yang diinginkan. Perbedaan antara anggaran dengan <i>forecast</i> adalah, segala sesuatu yang ada pada <i>forecast</i> harus didasarkan pada <b>asumsi yang terkini</b>. Karena itu, <i>forecast</i> akan terus menerus diperbaharui sesuai dengan perubahan kondisi yang dihadapi perusahaan. Fokus dalam modul ini adalah mengenai cara penyusunan anggaran, namun karena semakin lama peranan <i>forecast</i> semakin penting, maka pada bagian akhir dari modul ini topic mengenai <i>forecast</i> juga akan dibahas.", "Ada beberapa tujuan perusahaan menyusun anggaran, diantaranya:", "- <b>1. Mengharuskan manajer membuat rencana.</b> Penyusunan anggaran menjadi sangat penting ketika terjadi pemisahan antara pemilik dengan pengelola perusahaan. Sebagai pengelola perusahaan, dewan direksi (BOD) harus memperlihatkan rencana-rencana yang akan mereka lakukan pada periode mendatang, dan meminta persetujuan dari pemilik perusahaan.", "- <b>2. Memberikan informasi yang dapat dipergunakan untuk memudahkan perusahaan dalam mengambil keputusan.</b> Biasanya, semua hal-hal apapun yang akan dilakukan pada periode mendatang, seperti keputusan investasi dan lain lainnya, diputuskan pada saat penyusunan anggaran. Misalkan penyusunan anggaran untuk tahun 20X4 akan dilakukan pada tahun 20X3. Pada proses ini, semua kegiatan yang akan dilakukan pada tahun 20X4 akan diputuskan pada proses penyusunan anggaran tahun 20X3. Apa yang terjadi pada tahun 20X4 merupakan pelaksanaan keputusan yang diambil. Hal ini menyebabkan hanya sesuatu yang sudah disetujui dalam anggaran yang boleh dilaksanakan, sedangkan yang tidak sesuai dengan anggaran tidak boleh dilakukan, kecuali mendapatkan persetujuan lebih lanjut. Bagi seorang <i>controller</i>, hal tersebut akan memudahkan mereka mendapatkan persetujuan untuk mengambil keputusan.", "- <b>3. Dapat dipergunakan sebagai alat pengendalian dan penilaian kinerja.</b> Hasil-hasil pelaksanaan pekerjaan akan diperbandingkan dengan apa yang direncanakan dalam anggaran. Jika terdapat hal yang tidak sesuai maka harus terdapat tindakan untuk melakukan perbaikan. Dalam hal ini anggaran berfungsi sebagai patokan <i>feedback</i> untuk hal-hal yang dilakukan perusahaan. Selain itu, angka-angka yang terdapat dalam anggaran juga akan dikaitkan dengan sistem penilaian kinerja perusahaan untuk lebih memicu orang-orang untuk bekerja mencapai apa yang ditargetkan dalam anggaran.", "- <b>4. Sebagai alat untuk komunikasi dan koordinasi.</b> Anggaran dibuat untuk mencegah terjadinya <b>suboptimalisasi</b> kegiatan yang hanya akan mengoptimalkan departemen-departemen tertentu, namun merugikan perusahaan secara keseluruhan. Misalkan, dengan adanya anggaran, diharapkan terdapat koordinasi antara bagian produksi dengan bagian pemasaran, sehingga bagian produksi hanya memproduksi apa yang dapat dijual dan sebaliknya."],
"10.3":["Kelemahan-kelemahan anggaran antara lain:", "- <b>1. Penyusunan anggaran memakan waktu yang lama.</b> Kebanyakan perusahaan memulai penyusunan anggaran pada bulan September, dan akan berlangsung selama empat bulan. Penyusunan anggaran yang lama lebih banyak dikarenakan dilakukannya proses <i>bottom-up</i>, yang menyebabkan banyaknya negosiasi yang dilakukan.", "- <b>2. Anggaran sulit disesuaikan dengan lingkungan yang cepat berubah.</b> Anggaran disusun berdasarkan suatu asumsi tertentu yang dibuat saat anggaran dibuat. Dalam kondisi seperti sekarang ini, dimana terdapat ketidakpastian yang tinggi, seringkali perusahaan tetap mengacu pada asumsi yang dibuat pada saat menyusun anggaran, walaupun keadaannya tidak demikian.", "- <b>3. Terdapat kecenderungan untuk membuat “<i>slack</i>” dalam penyusunan anggaran.</b> “<i>Slack</i>” terjadi saat orang-orang dalam perusahaan tidak mengatakan yang sesungguhnya, dan cenderung untuk mempertinggi biaya yang diminta dibandingkan dengan yang seharusnya, dan sebaliknya selalu mencoba menegosiasikan target yang lebih rendah dari yang seharusnya.", "- <b>4. Terdapat kecenderungan untuk melakukan “<i>gaming</i>”.</b> “<i>Gaming</i>” terjadi apabila orang-orang yang bekerja pada perusahaan berusaha untuk mencapai angka-angka yang telah dianggarkan dengan segala macam cara, termasuk dengan cara-cara yang sebenarnya merugikan perusahaan."],
"10.4":["Terdapat <b>tiga cara</b> untuk menyusun anggaran, yaitu:", "- <b>1. <i>Authoritative budgeting</i>.</b> Dengan cara ini, proses penyusunan anggaran sepenuhnya dilakukan oleh manajemen tingkat atas, dan bawahan hanya diberikan angka-angka anggaran yang telah ditetapkan. Penyusunan anggaran jenis ini dilakukan apabila pihak atasan ingin menetapkan target-target yang tinggi (<i>stretch target</i>) yang harus dicapai bawahan. Penyusunan anggaran jenis ini juga akan menghilangkan “<i>slack</i>” yang biasanya dibuat oleh bawahan. Penyusunan anggaran seperti ini tidak akan optimal apabila atasan hanya memiliki informasi yang terbatas mengenai proses-proses yang dianggarkan.", "- <b>2. <i>Participative budgeting</i></b>, sering dikenal dengan pendekatan <i>bottom-up</i>. Dalam pendekatan ini semua orang yang ada dalam perusahaan terlibat dalam penyusunan anggaran. Penyusunan anggaran dimulai dari bawah, dan kemudian diakumulasikan pada tingkatan yang lebih atas untuk dinegosiasikan dan dimintakan persetujuannya. Anggaran ini diharapkan akan meningkatkan tingkat komitmen semua pegawai dalam menjalankan program yang dianggarkan, karena mereka terlibat langsung dalam penyusunan anggaran tersebut. Kelemahan dari penyusunan anggaran dengan cara ini adalah memakan waktu yang lama, serta kecenderungan bawahan membangun <i>slack</i>.", "- <b>3. <i>Consultative budgeting</i></b>, cara ini mirip dengan <i>authoritative budgeting</i>, hanya dalam proses penyusunan anggaran, atasan melakukan konsultasi dan meminta pendapat dari bawahan. Namun demikian, proses penyusunan anggaran dan keputusan tetap oleh pihak atasan."],
"10.5":["Dalam bukunya, <b>Simons (2000)</b> menjelaskan bahwa salah satu cara penyusunan anggaran yang baik adalah dengan mempergunakan konsep <b><i>three wheels of profit plan</i></b>.", "##F|Gambar 10.1|Three Wheel Of Profit Planning|tw", "Dalam konsep <i>three wheel of profit plan</i>, terdapat <b>tiga tahapan</b> yang akan dilalui dalam proses penyusunan anggaran, yaitu:", "- <b>1.</b> <i>Profit wheel</i>", "- <b>2.</b> <i>Return on Equity</i> (ROE) <i>wheel</i>", "- <b>3.</b> <i>Cash wheel</i>", "<b>Profit wheel.</b> Dalam <i>profit wheel</i>, perusahaan akan membuat <b>anggaran penjualan</b> dan semua <b>anggaran biaya</b> untuk menentukan besarnya <b>anggaran laba</b> perusahaan. Selain itu, perusahaan juga harus menentukan besarnya <b>anggaran aset</b> yang akan dikelola untuk menghasilkan target keuntungan tersebut. Rincian pelaksanaan <i>profit wheel</i> akan dibahas pada bagian penyusunan anggaran induk.", "<b>ROE wheel.</b> Angka anggaran laba yang dihasilkan pada <i>profit wheel</i> tidak serta merta dapat dijadikan sebagai angka final anggaran, karena angka profit tersebut harus diperbandingkan dengan target <i>return on equity</i> perusahaan. <i>Return on equity</i> merupakan tingkat pengembalian kepada pemegang saham. Angka inilah yang akan dijadikan acuan dalam penentuan laba, dimana anggaran laba yang diperoleh harus dapat memenuhi target ROE perusahaan. Jika target ROE belum tercapai, maka pencapaian tersebut dapat dilakukan dengan <b>tiga cara</b> yang terdapat dalam ROE <i>wheel</i>, yaitu:", "- <b>1. Mengulangi <i>profit wheel</i></b>, dengan melakukan revisi terhadap anggaran penjualan dan anggaran biaya, sehingga diperoleh anggaran laba yang sesuai dengan target ROE.", "- <b>2. Meningkatkan utilitas aset perusahaan</b>, dengan cara peningkatan penjualan (melalui <i>profit wheel</i>), maupun mengurangi aset-aset yang tidak diproduktif. Peningkatan utilitas aset perusahaan akan meningkatkan rasio <i>total assets turn over</i>, yang pada akhirnya akn meningkatkan ROA perusahaan. Peningkatan ROA akan meningkatkan ROE perusahaan (lihat pembahasan dalam modul yang terkait dengan pusat investasi).", "- <b>3. Mengubah struktur permodalan (<i>capital structure</i>) perusahaan.</b> Salah satu cara untuk meningkatkan ROE adalah dengan meningkatkan utang perusahaan, misalkan mendanai pembelian aset dengan utang. Peningkatan utang perusahaan akan menyebabkan peningkatan <i>leverage ratio</i> dan menyebabkan peningkatan ROE perusahaan (lihat pembahasan dalam modul yang terkait dengan pusat investasi).", "<b>Cash wheel.</b> Setelah <i>profit wheel</i> dan ROE <i>wheel</i> dapat menghasilkan tingkat keuntungan yang sesuai dengan target ROE peruahaan, maka tahapan berikutnya adalah melihat <i>cash wheel</i>. Tujuan dari <i>cash wheel</i> adalah untuk memastikan bahwa perusahaan memiliki <b>arus kas yang positif</b> untuk mendanai semua kegiatan yang dianggarkan. Jika terdapat kekurangan kas, maka harus dipastikan terdapat sumber pendanaan yang dapat dipakai untuk menutupi kekurangan kas tersebut. Penambahan arus kas dapat dilakukan tiga cara, yaitu:", "- <b>1.</b> Menurunkan tingkat piutang", "- <b>2.</b> Menurunkan tingkat persediaan", "- <b>3.</b> Mempertimbangkan kembali investasi aset yang dibutuhkan (dalam <i>profit wheel</i>)", "Tujuan akhir dari <i>profit wheel</i> adalah menyusun anggaran yang menghasilkan tingkat laba yang sesuai dengan target ROE perusahaan, dan memiliki jumlah kas yang dibutuhkan untuk melaksanakan kegiatan perusahaan."]
});

"10.1":["<b>Anggaran</b> itu penting: perusahaan menganggarkan <b>biaya yang akan dikeluarkan</b> untuk tindakan di periode mendatang, sekaligus jadi <b>alat pengendalian</b> untuk melihat apakah kegiatan sudah sesuai rencana.||anggaran itu catatan belanja bulanan rumah tangga: direncanakan di awal, dicek di akhir.", "Masalahnya, anggaran itu alat lama. Buku pertamanya ditulis <b>James O. McKinsey tahun 1922</b>, hampir <b>100 tahun</b> lalu. Pertanyaannya: apakah konsep 1922 masih cocok untuk kondisi sekarang, padahal situasi bisnisnya <b>sama sekali berbeda</b>?", "Teknis cara menyusun anggaran <b>tidak dibahas</b> di modul ini; peserta diminta me-<i>review</i> dari bahan bacaan yang disarankan."],
"10.2":["<b>Anggaran</b> = rencana <b>jangka pendek</b> yang bersifat <b>kuantitatif</b>, biasanya <b>satu tahun</b>. Bedakan istilahnya:@@<b>Target:</b> tujuan yang ingin dicapai (contoh: ROE 20%)@@<b>Rencana (<i>plan</i>):</b> tindakan untuk mencapai target@@<b>Anggaran:</b> biaya yang diperlukan untuk menjalankan rencana@@<b><i>Forecast</i>:</b> perkiraan berbasis asumsi terkini, terus diperbarui||target = tiba di Surabaya, rencana = naik kereta, anggaran = uang tiket dan bekal, forecast = cek terus apakah keretanya telat.", "Proses anggaran biasanya mulai <b>September</b> dan butuh <b>3 sampai 4 bulan</b>. Anggaran disusun berdasarkan <b>asumsi</b> (inflasi, kurs dollar, dll.). Masalahnya, asumsi sering <b>berbeda dengan kenyataan</b>, sehingga anggaran malah <b>menghambat</b> kegiatan operasional.", "Karena itu muncul <b><i>forecast</i></b>: alat bantu mengelola perusahaan untuk mencapai target. Bedanya, di <i>forecast</i> semua harus didasarkan pada <b>asumsi terkini</b>, jadi terus diperbarui sesuai perubahan kondisi. Modul fokus ke penyusunan anggaran, tapi <i>forecast</i> juga dibahas di bagian akhir karena perannya makin penting.", "<b>Empat tujuan menyusun anggaran:</b>@@<b>Mengharuskan manajer membuat rencana.</b> Penting saat pemilik dan pengelola terpisah: direksi (BOD) harus memperlihatkan rencana dan minta persetujuan pemilik@@<b>Memudahkan pengambilan keputusan.</b> Semua kegiatan periode depan (misal investasi) diputuskan saat menyusun anggaran. Anggaran 20X4 dibuat di 20X3, jadi 20X4 tinggal melaksanakan keputusan itu. Yang tidak ada di anggaran tidak boleh dilakukan, kecuali ada persetujuan lebih lanjut. Bagi <i>controller</i>, ini memudahkan mendapat persetujuan@@<b>Alat pengendalian dan penilaian kinerja.</b> Hasil dibandingkan dengan anggaran; kalau tidak sesuai, ada tindakan perbaikan (anggaran = patokan <i>feedback</i>). Angka anggaran dikaitkan dengan penilaian kinerja supaya orang terpicu mencapai target@@<b>Alat komunikasi dan koordinasi.</b> Mencegah <b>suboptimalisasi</b> (departemen optimal tapi perusahaan rugi). Contoh: produksi hanya memproduksi apa yang bisa dijual pemasaran, dan sebaliknya||produksi bikin 10.000 unit padahal pemasaran cuma sanggup jual 6.000: departemen 'rajin', perusahaan menumpuk stok."],
"10.3":["<b>Empat kelemahan anggaran:</b>@@<b>Memakan waktu lama.</b> Mulai September, berlangsung empat bulan, terutama karena proses <i>bottom-up</i> yang penuh negosiasi@@<b>Sulit menyesuaikan dengan lingkungan yang cepat berubah.</b> Anggaran berdasarkan asumsi saat dibuat; walau ketidakpastian tinggi, perusahaan sering tetap mengacu asumsi lama@@<b>Kecenderungan membuat <i>slack</i>.</b> Orang tidak jujur: biaya yang diminta dipertinggi, dan target yang dinegosiasikan sengaja dibuat lebih rendah dari seharusnya@@<b>Kecenderungan melakukan <i>gaming</i>.</b> Orang berusaha mencapai angka anggaran dengan segala cara, termasuk cara yang merugikan perusahaan||<i>slack</i>: minta uang jajan lebih dari kebutuhan supaya aman. <i>Gaming</i>: sales menunda pengiriman atau memaksa diskon besar akhir bulan demi capai target, walau perusahaan dirugikan."],
"10.4":["<b>Tiga cara menyusun anggaran:</b>@@<b><i>Authoritative budgeting</i>:</b> sepenuhnya oleh manajemen tingkat atas, bawahan hanya diberi angka. Dipakai bila atasan ingin menetapkan <b>target tinggi (<i>stretch target</i>)</b>, dan sekaligus menghilangkan <i>slack</i>. Kurang optimal bila atasan hanya punya informasi terbatas tentang proses yang dianggarkan@@<b><i>Participative budgeting</i> (<i>bottom-up</i>):</b> semua orang terlibat; dimulai dari bawah, diakumulasikan ke atas untuk dinegosiasikan dan disetujui. Komitmen pegawai meningkat karena terlibat langsung. Kelemahan: <b>lama</b> dan bawahan cenderung membangun <i>slack</i>@@<b><i>Consultative budgeting</i>:</b> mirip <i>authoritative</i>, tapi atasan <b>berkonsultasi dan meminta pendapat</b> bawahan. Proses dan keputusan tetap di tangan atasan||authoritative = bos langsung tulis angkanya, participative = semua rapat dan usul angka dulu, consultative = bos tanya pendapat tim, lalu bos yang memutuskan."],
"10.5":["Menurut <b>Simons (2000)</b>, salah satu cara menyusun anggaran yang baik adalah konsep <b><i>three wheels of profit plan</i></b>.", "##F|Gambar 10.1|Three Wheel Of Profit Planning|tw", "Tiga tahapan: <b><i>profit wheel</i></b>, <b>ROE <i>wheel</i></b>, dan <b><i>cash wheel</i></b>.||tiga roda yang harus 'nyambung': untung dulu, lalu cukup untung buat pemegang saham, terakhir pastikan uang kasnya ada.", "<b><i>Profit wheel</i>:</b> buat <b>anggaran penjualan</b> dan semua <b>anggaran biaya</b> untuk menentukan <b>anggaran laba</b>. Juga tentukan <b>anggaran aset</b> yang akan dikelola untuk menghasilkan target laba. Rinciannya dibahas di penyusunan anggaran induk.", "<b>ROE <i>wheel</i>:</b> anggaran laba dari <i>profit wheel</i> belum final, harus dibandingkan dengan <b>target ROE</b> (<i>return on equity</i> = tingkat pengembalian kepada pemegang saham). Kalau target ROE belum tercapai, ada <b>tiga cara</b>:@@<b>Mengulangi <i>profit wheel</i>:</b> revisi anggaran penjualan dan biaya sampai labanya sesuai target ROE@@<b>Meningkatkan utilitas aset:</b> naikkan penjualan (lewat <i>profit wheel</i>) atau kurangi aset tidak produktif. Rasio <i>total assets turn over</i> naik, ROA naik, lalu ROE naik@@<b>Mengubah struktur permodalan (<i>capital structure</i>):</b> misalnya menambah utang untuk mendanai pembelian aset. <i>Leverage ratio</i> naik, sehingga ROE naik||ROE = laba untuk pemegang saham dibanding modal sendiri. Modal sendiri yang sama dengan aset lebih produktif, atau diganti sebagian dengan utang, membuat persentasenya naik. (Detail ROA dan ROE ada di modul pusat investasi.)", "<b><i>Cash wheel</i>:</b> setelah laba sesuai target ROE, pastikan perusahaan punya <b>arus kas positif</b> untuk mendanai semua kegiatan yang dianggarkan. Kalau kas kurang, pastikan ada sumber pendanaan untuk menutupnya. Tiga cara menambah arus kas:@@<b>Menurunkan tingkat piutang</b>@@<b>Menurunkan tingkat persediaan</b>@@<b>Mempertimbangkan kembali investasi aset</b> yang dibutuhkan (dalam <i>profit wheel</i>)", "<b>Tujuan akhir:</b> anggaran yang menghasilkan <b>laba sesuai target ROE</b> dan memiliki <b>jumlah kas yang dibutuhkan</b> untuk menjalankan kegiatan perusahaan. (Di teks modul kalimat ini tertulis sebagai tujuan akhir 'profit wheel', maknanya tujuan akhir ketiga roda.)"]
});

'10.3':'Penjualan = unit terjual × harga jual per unit (kuartal I: 100.000 × 360 = 36.000.000; satuan 000 Rupiah). Total unit terjual dan total penjualan = jumlah empat kuartal (36.000.000 + 43.200.000 + 53.200.000 + 60.800.000 = 193.200.000). Harga jual berbeda tiap kuartal (360 lalu 380), sehingga kolom total harga jual dikosongkan.',
'10.4':'Unit terjual diambil dari Tabel 10.3. Target persediaan akhir = 10% × unit terjual kuartal berikutnya (kuartal I: 10% × 120.000 = 12.000; kuartal IV memakai target penjualan kuartal I tahun 20X4 sebesar 180.000 unit). Jumlah yang harus tersedia = unit terjual + target persediaan akhir. Persediaan awal = persediaan akhir kuartal sebelumnya (persediaan awal kuartal I = 10.000 unit, data soal). Unit diproduksi = jumlah yang harus tersedia − persediaan awal. Kolom total: persediaan akhir tahun = akhir kuartal IV, persediaan awal tahun = awal kuartal I.',
'10.5':'Unit diproduksi diambil dari Tabel 10.4. Jumlah BML = unit diproduksi × 5 kg (kuartal I: 102.000 × 5 = 510.000 kg). Biaya BML = jumlah BML × Rp35 per kg (510.000 × 35 = 17.850.000; satuan 000 Rupiah). Kolom total memakai total unit produksi setahun (528.000 × 5 = 2.640.000 kg; × 35 = 92.400.000).'
});

'10.3':(r,c)=>{const t='10.3';
if(r==='Unit Terjual'&&c===5)return{w:'Jumlah unit terjual keempat kuartal',e:op('+',L(t,r,1),L(t,r,2),L(t,r,3),L(t,r,4))};
if(r==='Penjualan'){if(c===5)return{w:'Jumlah penjualan keempat kuartal',e:op('+',L(t,r,1),L(t,r,2),L(t,r,3),L(t,r,4))};
return{w:'Unit terjual × harga jual per unit',e:op('×',L(t,'Unit Terjual',c),L(t,'Harga Jual',c))}}
return null},
'10.4':(r,c)=>{const t='10.4';
if(r==='Unit Terjual')return{w:'Sama dengan unit terjual di Tabel 10.3',e:L('10.3','Unit Terjual',c)};
if(r==='Target Persediaan Akhir'){

return{w:'10% × unit terjual kuartal berikutnya',e:op('×',K(.1,'10%'),L(t,'Unit Terjual',c+1))}}
if(r==='Jumlah yang Harus Tersedia')return{w:'Unit terjual + target persediaan akhir',e:op('+',L(t,'Unit Terjual',c),L(t,'Target Persediaan Akhir',c))};
if(r==='Persediaan Awal'){
if(c===5)return{w:'Persediaan awal tahun = persediaan awal kuartal I',e:L(t,r,1)};
if(c>=2)return{w:'Sama dengan target persediaan akhir kuartal sebelumnya',e:L(t,'Target Persediaan Akhir',c-1)};
return null}
if(r==='Jumlah Unit yang Diproduksi')return{w:'Jumlah yang harus tersedia − persediaan awal',e:op('-',L(t,'Jumlah yang Harus Tersedia',c),L(t,'Persediaan Awal',c))};
return null},
'10.5':(r,c)=>{const t='10.5';
if(r==='Jumlah Unit yang Diproduksi')return{w:'Sama dengan jumlah unit diproduksi di Tabel 10.4',e:L('10.4','Jumlah Unit yang Diproduksi',c)};
if(r==='Jumlah BML untuk Produksi')return{w:'Unit diproduksi × standar pemakaian BML per unit',e:op('×',L(t,'Jumlah Unit yang Diproduksi',c),L(t,'Standar Pemakaian BML Per Unit',c))};
if(r==='Biaya Bahan Mentah Langsung (BML)')return{w:'Jumlah BML × harga BML per kilogram',e:op('×',L(t,'Jumlah BML untuk Produksi',c),L(t,'Harga BML per Kilogram',c))};
return null}

Object.assign(M[0].mat,{"10.6": ["Dalam <b>Gambar 10.2</b> diperlihatkan cara penyusunan <b>anggaran induk</b> (<i>master budget</i>) untuk perusahaan manufaktur. Dalam modul ini yang diambil sebagai contoh adalah perusahaan manufaktur, karena perusahaan manufaktur memiliki <b>jenis-jenis biaya yang paling lengkap</b> dibandingkan dengan perusahaan jasa maupun dagang.", "##F|Gambar 10.2|Anggaran Induk|mb", "Anggaran induk (<i>master budget</i>) yang dibuat perusahaan dapat dibagi menjadi <b>tiga bagian</b>, yaitu:", "- <b>1. Anggaran operasional (<i>operating budget</i>).</b> Anggaran operasional berisi anggaran penjualan dan anggaran biaya yang dikeluarkan perusahaan. Hasil akhir dari anggaran operasional adalah <b>anggaran laporan laba-rugi</b>. Modul ini akan berfokus pada penyusunan anggaran operasional.", "- <b>2. Anggaran finansial (<i>financial budget</i>).</b> Anggaran ini berisi konsekuensi dari anggaran operasional yang disusun. Anggaran finansial terdiri dari <b>anggaran kas</b> dan <b>anggaran posisi keuangan</b>. Penyusunan anggaran finansial tidak akan dibahas dalam modul ini, karena modul ini tidak membahas unsur teknis penyusunan anggaran. Namun demikian, cara penyusunan anggaran kas dan anggaran posisi keuangan dapat dipelajari dalam buku <i>cost management</i> karangan Guan, Hansen dan Mowen pada bab 8.", "- <b>3. Anggaran modal (<i>capital budget</i>).</b> Anggaran ini mengenai perkiraan <b>investasi aset tetap</b> yang akan dilakukan perusahaan pada periode anggaran. Topik mengenai penganggaran modal tidak akan dibahas pada modul ini, karena merupakan bagian dari mata kuliah manajemen keuangan."], "10.7": ["Penyusunan anggaran induk biasanya dimulai dengan menyusun <b>anggaran penjualan</b>, meskipun dalam beberapa industri terdapat pengecualian. Misalnya dalam <b>industri pertambangan emas</b>. Dalam industri ini, perusahaan rata-rata akan menyusun anggaran produksinya terlebih dahulu, karena semua yang diproduksi perusahaan pasti dapat terjual. Namun keadaan seperti ini hanya terdapat pada beberapa industri tertentu, sehingga rata-rata perusahaan memulai penyusunan anggaran dengan membuat anggaran penjualan.", "##T|Tabel 10.3: Anggaran Penjualan PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (dalam 000 Rupiah; Gambar 10.3 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Unit Terjual~100.000~120.000~140.000~160.000~520.000|Harga Jual~360~360~380~380~-|*Penjualan~36.000.000~43.200.000~53.200.000~60.800.000~193.200.000", "Seperti terlihat pada Gambar 10.3, terdapat <b>dua hal</b> yang harus diperkirakan perusahaan dalam menyusun anggaran penjualan, yaitu <b>harga jual per unit</b> dan <b>unit terjual</b>. Ada beberapa cara yang dapat dilakukan untuk memperkirakan anggaran <b>unit terjual</b> perusahaan secara keseluruhan, yaitu:", "- <b>1. <i>Sales Department Estimates</i>.</b> Dalam metode ini, masing-masing tenaga penjualan akan disuruh membuat perkiraan unit yang mereka bisa jual pada periode mendatang. Angka itu kemudian akan digabungkan menjadi angka unit terjual perusahaan secara keseluruhan.", "- <b>2. <i>Customer Survey Method</i>.</b> Metode ini kebanyakan dipakai untuk perusahaan yang tidak memiliki pelanggan dalam jumlah banyak (<i>Business to Business</i>). Dalam metode ini, perusahaan akan menanyakan pada pelanggan mereka berapa jumlah unit barang yang akan mereka pesan dari perusahaan. Angka-angka tersebut yang akan dijadikan sebagai dasar untuk menyusun anggaran penjualan.", "- <b>3. <i>Share of the Market Method</i>.</b> Dalam metode ini, perusahaan akan menentukan besarnya <b>target pangsa pasar</b> yang akan dicapai pada periode mendatang, dan perusahaan akan menentukan jumlah unit yang harus dijual untuk mencapai target pangsa pasar tersebut.", "- <b>4. <i>Survey of Executive Opinion</i>.</b> Dalam metode ini, anggaran penjualan akan disusun berdasarkan opini dari dewan direksi perusahaan.", "- <b>5. <i>Delphi Process</i>.</b> Dalam metode ini, perusahaan akan menanyakan kepada ahli-ahli untuk membentuk asumsi-asumsi yang akan terjadi di periode mendatang. Setelah diperoleh <b>konsensus</b> dari para ahli tersebut, barulah kemudian disusun anggaran penjualan.", "- <b>6. Analisis Regresi.</b> Dalam model ini, perusahaan membentuk model statistik untuk menentukan faktor-faktor apa saja yang secara <i>significant</i> akan mempengaruhi penjualan perusahaan. Berdasarkan model tersebut, perusahaan akan memperkirakan unit terjualnya.", "Satu hal yang tidak boleh dilupakan adalah <b>unit terjual dan harga jual adalah dua komponen yang saling terkait</b>. Apabila perusahaan ingin meningkatkan volume penjualan, maka harga jual harus diturunkan, dan sebaliknya.", "Permasalahan timbul apabila perusahaan memproduksi dan menjual <b>banyak jenis produk</b>. Hampir semua <i>textbook</i> yang membahas anggaran hanya memberikan contoh perusahaan yang memproduksi satu jenis barang. Bagaimana jika perusahaan memproduksi puluhan jenis barang (seperti Samsung), maupun ratusan jenis barang (seperti perusahaan yang memproduksi <i>spare-parts</i> mobil)? Jika mengikuti konsep secara teoritis, maka perusahaan harus menyusun anggaran penjualan sebanyak jenis barang yang dibuat perusahaan. Dalam hal ini, jika perusahaan membuat 50 jenis barang, maka akan terdapat <b>50 anggaran penjualan</b>.", "Belum lagi ada masalah bagi beberapa perusahaan, terutama perusahaan yang memproduksi berdasarkan <b>pesanan (<i>job order</i>)</b>. Bagi perusahaan jenis ini sulit sekali untuk memprediksi unit terjual. Misalkan sebuah perusahaan kontraktor berskala sedang. Bagi kontraktor ini, untuk memperkirakan unit terjual, perusahaan harus memprediksi <b>siapa <i>customer</i></b> yang akan memakai jasa kontraktornya pada periode mendatang, dan juga <b>jenis rumah apa</b> yang akan dibangun oleh <i>customer</i> tersebut.", "Karena itu, banyak perusahaan yang menyusun anggaran penjualan tidak seperti yang dianjurkan di atas. Perusahaan-perusahaan tersebut hanya memberikan <b>angka total target penjualan</b> di masa mendatang, seperti peningkatan 10% dari penjualan tahun sebelumnya, tanpa merinci berapa unit terjual maupun harga jualnya. Penyusunan anggaran dengan cara ini bukan merupakan cara yang benar, karena tanpa adanya informasi unit terjual, perusahaan <b>tidak dapat membuat anggaran produksi</b>, dan tanpa adanya anggaran produksi, perusahaan tidak dapat memperkirakan anggaran biaya produksi, kecuali semua biaya produksi tersebut juga dianggarkan secara total."], "10.8": ["Setelah anggaran penjualan dibuat, maka tahapan berikutnya adalah menyusun <b>anggaran produksi</b>. Rumus untuk menyusun anggaran produksi adalah:", "- <b>Anggaran produksi = anggaran penjualan + target persediaan barang jadi akhir &minus; persediaan barang jadi awal</b>", "Dengan asumsi bahwa <b>target persediaan akhir</b> perusahaan adalah <b>10% dari target penjualan pada periode berikutnya</b>, sedangkan <b>persediaan awal</b> tahun barang jadi adalah <b>10.000 unit</b> dan target penjualan perusahaan pada kuartal I tahun 20X4 adalah <b>180.000 unit</b>, maka dapat disusun anggaran produksi sebagai berikut:", "##T|Tabel 10.4: Anggaran Produksi PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (unit; Gambar 10.4 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Unit Terjual~100.000~120.000~140.000~160.000~520.000|Target Persediaan Akhir~12.000~14.000~16.000~18.000~18.000|Jumlah yang Harus Tersedia~112.000~134.000~156.000~178.000~538.000|Persediaan Awal~10.000~12.000~14.000~16.000~10.000|*Jumlah Unit yang Diproduksi~102.000~122.000~142.000~162.000~528.000", "Seperti terlihat pada Gambar 10.4 (di teks modul ditulis ‘gambar 4’), anggaran produksi disusun berdasarkan <b>unit terjual</b> yang terdapat pada anggaran penjualan. Jika anggaran penjualan tidak dibuat secara rinci, maka anggaran produksi tidak akan bisa dibuat. Untuk <b>perusahaan dagang</b>, anggaran produksi akan diganti dengan <b>anggaran pembelian barang dagang</b>, sedangkan untuk <b>perusahaan jasa</b> tidak ada anggaran produksi maupun pembelian."], "10.9": ["Penyusunan <b>anggaran biaya</b> perusahaan manufaktur dapat dibagi menjadi <b>dua bagian</b>, yaitu:", "- <b>1.</b> Penyusunan anggaran <b>biaya produksi</b>, seperti biaya bahan mentah langsung, biaya buruh langsung, dan biaya <i>overhead</i> pabrik, yang disusun berdasarkan <b>output dalam anggaran produksi</b>", "- <b>2.</b> Penyusunan anggaran <b>biaya periode</b>, seperti biaya umum, administrasi, dan penjualan, yang disusun berdasarkan <b>anggaran penjualan</b>.", "Cara penyusunan anggaran biaya dapat dilakukan dengan beberapa cara, di antaranya:", "- <b>1. Mempergunakan standar.</b> Konsep ini akan dibahas secara spesifik dalam bagian berikutnya (10.9.1).", "- <b>2. <i>Incremental budget</i>.</b> Dalam konsep ini perusahaan akan melakukan ekstrapolasi angka anggaran dan realisasi periode sebelumnya. Angka tersebut kemudian digabungkan dengan asumsi-asumsi yang dibuat mengenai periode anggaran, untuk mendapatkan jumlah biaya yang akan dianggarkan.", "- <b>3. <i>Zero Based Budget</i>.</b> Konsep ini menganggap bahwa <i>incremental budgeting</i> memiliki kelemahan utama, yaitu menggantungkan pada angka-angka anggaran dan realisasi pada periode sebelumnya, padahal angka-angka tersebut belum tentu mencerminkan angka yang efisien. Karena itu dalam konsep ini, anggaran-anggaran yang dibuat pada periode sebelumnya dianggap sama sekali tidak ada, dan perusahaan menyusun anggaran dari nol, yaitu seolah-olah perusahaan baru berdiri. Kelemahan penyusunan anggaran ini adalah <b>memakan waktu yang lama</b>.", "- <b>4. <i>Kaizen Budget</i>.</b> Merupakan anggaran yang banyak dipakai oleh perusahaan-perusahaan Jepang, dan biasanya dikaitkan dengan <b>siklus hidup</b> dari suatu produk. <i>Kaizen</i> berarti <b>perbaikan yang berkelanjutan</b>. Dalam anggaran ini, untuk mengantisipasi harga produk yang cenderung semakin menurun seiring dengan siklus hidup produk tersebut, maka biaya-biaya yang dianggarkan untuk produk tersebut harus terus menerus diefisienkan, agar produk tersebut terus dapat dijual dengan menguntungkan.", "- <b>5. <i>Activity Based Budgeting</i>.</b> Dalam konsep ini, anggaran disusun berdasarkan <b>aktivitas-aktivitas</b> yang dilakukan perusahaan. Konsep ini akan dibahas lebih rinci pada bagian lain dalam modul ini (di daftar isi: 10.9.5)."], "10.9.1": ["Saat ini perusahaan menghadapi keadaan yang <b>tidak pasti</b>, yang menyebabkan asumsi-asumsi yang dibuat waktu perusahaan menyusun anggaran kemungkinan besar tidak realistis lagi. Hal ini menyebabkan perusahaan harus bisa menyusun anggaran yang <b>fleksibel</b> sehingga dapat disesuaikan dengan perubahan lingkungan tersebut.", "Supaya hal tersebut terjadi, maka semua anggaran biaya yang dibuat perusahaan harus dikaitkan dengan <b>anggaran penjualan atau anggaran produksi</b> perusahaan, yaitu dengan membuat <b>standar</b>. Ada <b>dua standar</b> yang harus dibuat perusahaan, yaitu:", "- <b>1. Standar kuantitas</b> (<i>quantity standard</i>)", "- <b>2. Standar harga</b> (<i>price standard</i>)", "Standar-standar inilah yang dipakai untuk menghubungkan anggaran biaya dengan unit yang akan diproduksi atau dijual perusahaan (di teks modul kalimat ini tertulis ‘standar harga inilah’, tetapi konteksnya mencakup kedua standar)."], "10.9.2": ["Biaya bahan mentah langsung merupakan contoh dari anggaran biaya yang dapat dihubungkan dengan anggaran produksi melalui standar. <b>Standar kuantitas</b> ditetapkan berdasarkan rancangan produk perusahaan yang tertuang dalam <i>bill of material</i> (BOM), sedangkan <b>standar harga</b> bahan mentah langsung ditetapkan dengan melakukan <i>survey</i> terhadap harga jual yang akan dipatok pemasok pada perusahaan. Misalkan perusahaan menentukan standar kuantitas adalah <b>1 unit = 5 kg</b> bahan mentah, dan standar harga bahan mentah langsung ditetapkan <b>1 Kg = Rp 35</b>. Dengan mengacu pada anggaran produksi pada Gambar 10.4 (di teks modul ditulis ‘gambar 4’), maka dapat disusun anggaran biaya bahan mentah langsung sebagai berikut:", "##T|Tabel 10.5: Anggaran Pemakaian Bahan Mentah Langsung PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (dalam 000 Rupiah; Gambar 10.5 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Jumlah Unit yang Diproduksi~102.000~122.000~142.000~162.000~528.000|Standar Pemakaian BML Per Unit~5~5~5~5~5|Jumlah BML untuk Produksi~510.000~610.000~710.000~810.000~2.640.000|Harga BML per Kilogram~35~35~35~35~35|*Biaya Bahan Mentah Langsung (BML)~17.850.000~21.350.000~24.850.000~28.350.000~92.400.000", "Yang menarik dari anggaran tersebut adalah, jika angka yang terdapat pada anggaran produksi berubah, maka perusahaan dapat <b>secara otomatis menyesuaikan</b> angka yang terdapat pada biaya bahan mentah langsung. Hal ini amat penting, karena perusahaan dapat menyusun anggaran sesuai dengan jumlah aktual yang diproduksi perusahaan. Misalkan, jika perusahaan tidak memproduksi 528.000 unit, namun memproduksi sebanyak 585.000 unit, maka nilai anggaran biaya bahan mentah langsung dapat diubah menjadi 585.000 unit &times; 5 kg &times; Rp 35 = Rp 112.554.000 (angka menurut teks modul).", "<b>Catatan angka di modul:</b> hasil kali 585.000 &times; 5 &times; 35 sebenarnya <b>102.375.000</b> (dalam 000 Rupiah, satuan yang sama dengan Tabel 10.5), bukan 112.554.000. Untuk soal hitungan, pakai rumusnya.", "Hal ini penting sekali, karena dalam ketidakpastian yang tinggi, angka unit produksi yang dianggarkan kemungkinan besar akan berbeda dengan hasil produksi aktual. Dengan memiliki kedua standar tersebut, maka perusahaan dapat secara otomatis menyesuaikan anggaran biaya bahan mentah langsung sesuai dengan jumlah aktual produksi perusahaan. Penyusunan anggaran biaya bahan mentah langsung merupakan contoh dari penyusunan anggaran untuk <b>biaya variabel</b>."], "10.9.3": ["Hampir semua buku akuntansi manajemen menganggap <b>biaya buruh langsung sebagai biaya variabel</b>. Bila demikian keadaannya, maka penyusunan anggaran biaya buruh langsung memiliki kesamaan dengan penyusunan anggaran biaya bahan mentah langsung. Misalkan <b>standar kuantitas</b> untuk pengerjaan satu unit barang adalah <b>5 jam</b>, dan <b>standar tarif</b> buruh langsung adalah <b>Rp 10 per jam</b>, maka anggaran biaya buruh langsung adalah:", "Halaman modul yang tersedia berakhir di bagian ini; tabel anggaran biaya buruh langsung ada di halaman berikutnya."]});
Object.assign(M[0].sum,{"10.6": ["Anggaran induk (<i>master budget</i>) di modul ini dicontohkan lewat <b>perusahaan manufaktur</b> (Gambar 10.2), soalnya manufaktur punya <b>jenis biaya paling lengkap</b> dibanding perusahaan jasa atau dagang.||jenis biaya manufaktur itu kayak menu lengkap restoran; jasa dan dagang cuma punya sebagian menunya.", "##F|Gambar 10.2|Anggaran Induk|mb", "Anggaran induk dibagi <b>tiga bagian</b>:@@<b>Anggaran operasional (<i>operating budget</i>):</b> isinya anggaran penjualan dan anggaran biaya. Hasil akhirnya <b>anggaran laporan laba-rugi</b>. Inilah fokus modul ini@@<b>Anggaran finansial (<i>financial budget</i>):</b> konsekuensi dari anggaran operasional, terdiri dari <b>anggaran kas</b> dan <b>anggaran posisi keuangan</b>. <b>Nggak dibahas</b> di modul ini karena modul nggak membahas unsur teknis penyusunan anggaran; belajar sendiri di buku <i>cost management</i> Guan, Hansen, dan Mowen bab 8@@<b>Anggaran modal (<i>capital budget</i>):</b> perkiraan <b>investasi aset tetap</b> pada periode anggaran. <b>Nggak dibahas</b> karena bagian dari mata kuliah manajemen keuangan||operasional = rencana jualan dan belanja bulanan, finansial = apakah uang kasnya cukup, modal = rencana beli motor baru untuk usaha."], "10.7": ["Anggaran induk <b>biasanya mulai dari anggaran penjualan</b>. Pengecualian ada di beberapa industri, misalnya <b>pertambangan emas</b>: perusahaan menyusun anggaran produksi dulu, karena semua yang diproduksi <b>pasti terjual</b>. Tapi itu cuma di industri tertentu, jadi rata-rata perusahaan tetap mulai dari anggaran penjualan.||penjual emas nggak khawatir emasnya nggak laku; penjual kue harus mikir dulu berapa yang bakal dibeli orang.", "##T|Tabel 10.3: Anggaran Penjualan PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (dalam 000 Rupiah; Gambar 10.3 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Unit Terjual~100.000~120.000~140.000~160.000~520.000|Harga Jual~360~360~380~380~-|*Penjualan~36.000.000~43.200.000~53.200.000~60.800.000~193.200.000", "Di anggaran penjualan ada <b>dua hal</b> yang harus diperkirakan: <b>harga jual per unit</b> dan <b>unit terjual</b>. Ada <b>enam cara</b> memperkirakan unit terjual:@@<b><i>Sales Department Estimates</i>:</b> tiap tenaga penjual memperkirakan unit yang bisa dijualnya, lalu digabung jadi angka seluruh perusahaan@@<b><i>Customer Survey Method</i>:</b> menanyakan langsung ke pelanggan berapa unit yang akan mereka pesan. Dipakai untuk perusahaan yang <b>pelanggannya nggak banyak</b> (<i>Business to Business</i>)@@<b><i>Share of the Market Method</i>:</b> tentukan <b>target pangsa pasar</b> dulu, lalu hitung unit yang harus dijual untuk mencapainya@@<b><i>Survey of Executive Opinion</i>:</b> berdasarkan opini <b>dewan direksi</b>@@<b><i>Delphi Process</i>:</b> tanya para <b>ahli</b> soal asumsi kejadian di masa depan; setelah ada <b>konsensus</b>, baru disusun anggaran penjualan@@<b>Analisis regresi:</b> bikin model statistik untuk mencari faktor yang <b>signifikan</b> memengaruhi penjualan, lalu perkirakan unit terjualnya||pabrik seragam sekolah: tanya tiap sales (sales estimates), tanya sekolah langganan (customer survey), tetapkan target 20% pasar kota (share of the market), tanya direksi (executive opinion), tanya ahli dunia pendidikan (Delphi), atau hitung dari jumlah siswa dan daya beli (regresi).", "Satu hal yang <b>nggak boleh dilupakan</b>: unit terjual dan harga jual itu <b>saling terkait</b>. Mau volume penjualan naik, harga jual harus <b>turun</b>, dan sebaliknya.||obral diskon bikin yang beli lebih banyak; harga dinaikkan, pembeli berkurang.", "<b>Masalah kalau produknya banyak.</b> Hampir semua <i>textbook</i> cuma memberi contoh perusahaan dengan <b>satu jenis barang</b>. Padahal ada yang punya puluhan jenis (seperti Samsung) atau ratusan jenis (<i>spare-parts</i> mobil). Menurut teori, anggaran penjualan harus dibuat <b>sebanyak jenis barangnya</b>: 50 jenis barang berarti <b>50 anggaran penjualan</b>.", "<b>Masalah perusahaan berbasis pesanan (<i>job order</i>).</b> Susah memprediksi unit terjual. Contohnya <b>kontraktor</b> berskala sedang: harus menebak <b>siapa <i>customer</i></b> yang akan memakai jasanya dan <b>jenis rumah apa</b> yang akan dibangun.||kayak tukang jahit langganan: nggak tahu siapa yang bakal pesan dan modelnya apa sebelum ada yang datang.", "Akibatnya banyak perusahaan menyusun anggaran penjualan <b>nggak sesuai anjuran</b>: cuma menetapkan <b>angka total</b> target penjualan, misalnya naik 10% dari tahun lalu, tanpa rincian unit dan harga. Ini <b>bukan cara yang benar</b>, karena tanpa info unit terjual perusahaan <b>nggak bisa menyusun anggaran produksi</b>, dan tanpa anggaran produksi nggak bisa memperkirakan anggaran biaya produksi (kecuali semua biaya produksi juga dianggarkan sebagai angka total)."], "10.8": ["Setelah anggaran penjualan jadi, giliran <b>anggaran produksi</b>. Rumusnya:@@<b>Anggaran produksi = anggaran penjualan + target persediaan barang jadi akhir &minus; persediaan barang jadi awal</b>||mau jual 100 pcs, mau sisa 12 pcs di gudang di akhir, tapi di awal sudah ada 10 pcs: berarti cukup produksi 100 + 12 &minus; 10 = 102 pcs.", "Asumsi contoh: <b>target persediaan akhir = 10%</b> dari target penjualan periode berikutnya, <b>persediaan awal tahun = 10.000 unit</b>, dan target penjualan kuartal I tahun 20X4 = <b>180.000 unit</b> (dipakai untuk persediaan akhir kuartal IV).", "##T|Tabel 10.4: Anggaran Produksi PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (unit; Gambar 10.4 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Unit Terjual~100.000~120.000~140.000~160.000~520.000|Target Persediaan Akhir~12.000~14.000~16.000~18.000~18.000|Jumlah yang Harus Tersedia~112.000~134.000~156.000~178.000~538.000|Persediaan Awal~10.000~12.000~14.000~16.000~10.000|*Jumlah Unit yang Diproduksi~102.000~122.000~142.000~162.000~528.000", "Anggaran produksi disusun dari <b>unit terjual</b> di anggaran penjualan (di teks modul ditulis ‘gambar 4’, maksudnya Gambar 10.4). Kalau anggaran penjualan nggak dibuat rinci, <b>anggaran produksi nggak bisa dibuat</b>.", "Untuk <b>perusahaan dagang</b>, anggaran produksi diganti <b>anggaran pembelian barang dagang</b>. Untuk <b>perusahaan jasa</b>, <b>nggak ada</b> anggaran produksi maupun pembelian.||toko baju beli barang jadi dari pemasok (anggaran pembelian); salon cuma jual jasa, jadi nggak ada produksi dan nggak ada beli barang dagang."], "10.9": ["Anggaran biaya perusahaan manufaktur dibagi <b>dua bagian</b>:@@<b>Anggaran biaya produksi</b> (bahan mentah langsung, buruh langsung, <i>overhead</i> pabrik): disusun berdasarkan <b>output di anggaran produksi</b>@@<b>Anggaran biaya periode</b> (biaya umum, administrasi, penjualan): disusun berdasarkan <b>anggaran penjualan</b>", "Ada <b>lima cara</b> menyusun anggaran biaya:@@<b>Pakai standar:</b> dibahas khusus di 10.9.1@@<b><i>Incremental budget</i>:</b> <b>ekstrapolasi</b> anggaran dan realisasi periode lalu, lalu digabung dengan asumsi periode anggaran@@<b><i>Zero based budget</i>:</b> anggaran periode lalu dianggap <b>nggak ada</b>, menyusun <b>dari nol</b> seolah perusahaan baru berdiri. Alasannya: incremental punya kelemahan, karena bergantung pada angka lama yang <b>belum tentu efisien</b>. Kelemahan ZBB: <b>makan waktu lama</b>@@<b><i>Kaizen budget</i>:</b> banyak dipakai perusahaan <b>Jepang</b>, dikaitkan dengan <b>siklus hidup produk</b>. <i>Kaizen</i> = perbaikan berkelanjutan. Harga produk cenderung turun seiring siklus hidup, jadi biaya yang dianggarkan harus <b>terus diefisienkan</b> supaya produk tetap menguntungkan@@<b><i>Activity based budgeting</i>:</b> anggaran disusun berdasarkan <b>aktivitas</b>; dibahas lebih rinci di bagian lain (di daftar isi: 10.9.5)||incremental = tinggal naikkan 5% dari uang jajan tahun lalu; zero based = hitung ulang dari nol, jajan apa saja yang benar-benar perlu; kaizen = target jajan harus turun terus tiap bulan."], "10.9.1": ["Kondisi sekarang <b>nggak pasti</b>, jadi asumsi yang dibuat waktu menyusun anggaran bisa saja <b>nggak realistis lagi</b>. Makanya anggaran harus <b>fleksibel</b> supaya bisa menyesuaikan perubahan lingkungan.", "Caranya: semua anggaran biaya <b>dikaitkan dengan anggaran penjualan atau anggaran produksi</b> lewat <b>standar</b>. Ada <b>dua standar</b>:@@<b>Standar kuantitas</b> (<i>quantity standard</i>)@@<b>Standar harga</b> (<i>price standard</i>)||biaya bahan per porsi = takaran per porsi &times; harga per takaran. Jumlah porsi berubah, biaya otomatis ikut berubah.", "Standar-standar inilah yang menghubungkan anggaran biaya dengan <b>unit yang diproduksi atau dijual</b>. (Di teks modul tertulis ‘standar harga inilah’, konteksnya mencakup kedua standar.)"], "10.9.2": ["<b>Biaya bahan mentah langsung (BML)</b> adalah contoh anggaran biaya yang dihubungkan ke anggaran produksi lewat standar:@@<b>Standar kuantitas:</b> dari rancangan produk di <i>bill of material</i> (BOM)@@<b>Standar harga:</b> dari <i>survey</i> harga jual yang akan dipatok pemasok||BOM itu daftar bahan resep: tepung berapa gram per roti. Standar harga = harga tepung per kilo dari toko langganan.", "Contoh modul: <b>1 unit = 5 kg</b> bahan mentah dan <b>1 kg = Rp 35</b> (dalam 000 Rupiah, jadi Rp35.000 per kg), dengan unit produksi dari Gambar 10.4 (di teks modul ditulis ‘gambar 4’).", "##T|Tabel 10.5: Anggaran Pemakaian Bahan Mentah Langsung PT Selamat Berjaya, Tahun Anggaran yang Berakhir 31 Desember 20x3 (dalam 000 Rupiah; Gambar 10.5 pada modul)|~Kuartal I~Kuartal II~Kuartal III~Kuartal IV~Total|Jumlah Unit yang Diproduksi~102.000~122.000~142.000~162.000~528.000|Standar Pemakaian BML Per Unit~5~5~5~5~5|Jumlah BML untuk Produksi~510.000~610.000~710.000~810.000~2.640.000|Harga BML per Kilogram~35~35~35~35~35|*Biaya Bahan Mentah Langsung (BML)~17.850.000~21.350.000~24.850.000~28.350.000~92.400.000", "Yang menarik: kalau angka di anggaran produksi berubah, anggaran BML <b>otomatis menyesuaikan</b>. Contoh modul: produksi aktual <b>585.000 unit</b>, bukan 528.000, jadi BML = 585.000 &times; 5 kg &times; Rp 35. Ini penting karena ketika ketidakpastian tinggi, unit produksi yang dianggarkan kemungkinan besar beda dari hasil aktual.||kalau pesanan katering naik dari 100 jadi 120 porsi, biaya bahan langsung dihitung ulang dari takaran dan harga yang sama.", "<b>Catatan angka di modul:</b> teks modul menulis hasilnya <b>Rp 112.554.000</b>, padahal 585.000 &times; 5 &times; 35 = <b>102.375.000</b> (dalam 000 Rupiah, satuan yang sama dengan Tabel 10.5). Untuk soal hitungan, pakai rumusnya.", "Penyusunan anggaran BML adalah contoh anggaran untuk <b>biaya variabel</b>."], "10.9.3": ["Hampir semua buku akuntansi manajemen menganggap <b>biaya buruh langsung sebagai biaya variabel</b>, jadi cara menyusun anggarannya <b>sama dengan anggaran BML</b>: standar kuantitas &times; standar tarif &times; unit produksi.", "Contoh modul: <b>standar kuantitas 5 jam per unit</b> dan <b>standar tarif Rp 10 per jam</b>.||per unit = 5 jam &times; Rp 10 = Rp 50 (dalam 000 Rupiah). Kalau dipakai unit produksi setahun di Tabel 10.4 (528.000 unit): 528.000 &times; 5 = 2.640.000 jam, &times; Rp 10 = 26.400.000. Ini hitungan ilustrasi dari data yang ada, bukan tabel modul.", "Halaman modul yang tersedia berakhir di bagian ini; tabel anggaran biaya buruh langsung ada di halaman berikutnya."]});
Object.assign(M[0].map,{"10.6": {"c": "Penyusunan Anggaran Induk (Master Budget)", "r": [{"t": "Contoh perusahaan manufaktur", "k": [{"t": "Gambar 10.2: alur dari planning sampai operations."}, {"t": "Jenis biaya paling lengkap dibanding jasa dan dagang."}]}, {"t": "Anggaran operasional", "k": [{"t": "Anggaran penjualan dan anggaran biaya."}, {"t": "Hasil akhir: anggaran laporan laba-rugi."}, {"t": "Fokus modul ini."}]}], "l": [{"t": "Anggaran finansial", "k": [{"t": "Konsekuensi dari anggaran operasional."}, {"t": "Anggaran kas dan anggaran posisi keuangan."}, {"t": "Tidak dibahas: lihat Guan, Hansen, Mowen bab 8."}]}, {"t": "Anggaran modal", "k": [{"t": "Perkiraan investasi aset tetap."}, {"t": "Tidak dibahas: mata kuliah manajemen keuangan."}]}]}, "10.7": {"c": "Penyusunan Anggaran Penjualan", "r": [{"t": "Titik awal", "k": [{"t": "Anggaran induk biasanya dimulai dari anggaran penjualan."}, {"t": "Pengecualian: pertambangan emas, produksi dulu karena pasti terjual."}]}, {"t": "Dua hal diperkirakan", "k": [{"t": "Harga jual per unit."}, {"t": "Unit terjual."}, {"t": "Saling terkait: volume naik, harga turun, dan sebaliknya."}]}, {"t": "Enam cara memperkirakan unit terjual", "k": [{"t": "Sales department estimates."}, {"t": "Customer survey method (Business to Business)."}, {"t": "Share of the market method."}]}], "l": [{"t": "Enam cara (lanjutan)", "k": [{"t": "Survey of executive opinion (dewan direksi)."}, {"t": "Delphi process (konsensus ahli)."}, {"t": "Analisis regresi (model statistik)."}]}, {"t": "Banyak jenis produk", "k": [{"t": "Teori: satu anggaran penjualan per jenis barang."}, {"t": "Contoh: 50 jenis barang = 50 anggaran penjualan."}]}, {"t": "Perusahaan job order", "k": [{"t": "Sulit memprediksi unit terjual."}, {"t": "Contoh kontraktor: siapa customer dan jenis rumah apa."}]}, {"t": "Praktik yang kurang tepat", "k": [{"t": "Hanya angka total, misalnya naik 10% dari tahun lalu."}, {"t": "Tanpa unit terjual, anggaran produksi tidak bisa dibuat."}]}]}, (()=>{const e=$('#rdm');let x0=0,y0=0,t0=0,mode=0,dx=0,on=0;

on=1;rs(-d*w,'transform .16s ease-in');setTimeout(()=>{goPage(np);rs(d*w*.35,'none');e.getBoundingClientRect();rs(0,'transform .2s ease-out');setTimeout(()=>{on=0;rs(0)},220)},160)};

function render(){$('#ttl').textContent={home:'Beranda',mod:'Modul',ujian:'Ujian',jadwal:'Jadwal',setting:'Setting'}[tab];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const v=$('#view');

else{const p=S.plan,pl=plan();v.innerHTML=`<h2>Jadwal Belajar</h2><div class="card"><label>Tanggal mulai</label><input type="date" id="ps" value="${p.start}"><label>Tanggal ujian</label><input type="date" id="pd" value="${p.date}"><button onclick="setPlan()">Buat jadwal harian</button></div>`+
pl.map(d=>`<div class="day ${d.dt===today()?'today':''} ${S.done[d.dt]?'done':''}"><label class="row"><input type="checkbox" style="width:auto;margin:0" ${S.done[d.dt]?'checked':''} onchange="S.done['${d.dt}']=this.checked;save();render()"><b>${new Date(d.dt+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}</b></label><ul>${d.it.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}}
