<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f7fd;color:#12243d}
header{background:#e8f0fd;color:#12243d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #d3e1f6}
header img{width:32px;height:32px;background:#fff;border-radius:50%}header b{flex:1;font-size:18px}
main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
h2{margin:6px 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
button,.btn{background:#1565d8;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
button.sec{background:#e3edfc;color:#1565d8}button.sm{padding:6px 10px;font-size:13px}
input,select{width:100%;padding:10px;border:1px solid #c5d3e8;border-radius:10px;font-size:15px;margin:4px 0 8px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:480px;background:#fff;display:flex;gap:4px;padding:6px;border-radius:18px;box-shadow:0 4px 18px #12243d2e;z-index:6}
nav button{flex:1;background:none;color:#6b7c93;border-radius:12px;padding:7px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#1565d8;background:#e8f0fd}
#auth{max-width:380px;margin:8vh auto;padding:20px;text-align:center}#auth img{width:90px}
.bar{height:8px;background:#e3edfc;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#1565d8}
.opt{display:block;padding:9px 10px;border:1px solid #c5d3e8;border-radius:10px;margin:6px 0;cursor:pointer}
.ok{background:#e4f6e9;border-color:#2e9e53}.bad{background:#fdeaea;border-color:#d64545}
.exp{font-size:13px;background:#fff8e1;padding:8px;border-radius:8px;margin-top:6px}
li{margin:4px 0}.muted{color:#6b7c93;font-size:13px}.row{display:flex;gap:8px;align-items:center}
.day{border-left:4px solid #1565d8;padding-left:10px;margin:10px 0}.day.today{background:#eaf2ff}.day.done{opacity:.55}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#12243d;color:#fff;padding:8px 14px;border-radius:20px;display:none}
.ib{background:none;color:#1565d8;padding:0;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}.ib:hover{background:#1565d822}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.dark{background:#0f1a2b;color:#e6edf7}.dark header{background:#17263d;color:#e6edf7;border-color:#2c3f5c}.dark .ib{color:#8ec0ff}
.dark .card,.dark nav{background:#17263d}.dark input,.dark select{background:#0f1a2b;color:#e6edf7;border-color:#2c3f5c}
.dark button.sec,.dark nav button.on{background:#22375a;color:#8ec0ff}.dark nav button{color:#93a4bd}.dark nav button.on{color:#8ec0ff}
.dark .bar{background:#22375a}.dark .opt{border-color:#2c3f5c}.dark .ok{background:#16382a;border-color:#2e9e53}.dark .bad{background:#3d1f22;border-color:#d64545}
.dark .exp{background:#3a3217;color:#f2e6b0}.dark .day.today{background:#1a2e4d}.dark .muted{color:#93a4bd}.dark a{color:#8ec0ff}
.cov{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px 10px;box-shadow:0 3px 10px #0003;border:3px solid #fff}
.cov i{position:absolute;left:-20%;right:-20%;bottom:-15%;height:45%;background:#ffffff22;transform:skewY(-14deg)}
.cov b{position:relative;font-size:15px;line-height:1.25;text-transform:uppercase}.cov small{position:absolute;bottom:8px;left:0;right:0;font-size:10px;opacity:.85}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.mc{cursor:pointer}.mc p{margin:6px 2px 0;font-size:13px;color:#6b7c93;text-align:center}

function tocHtml(m){if(!m.toc)return'';return '<div class="card"><h3>Daftar Isi</h3>'+m.toc.map((b,k)=>`<div class="bab" onclick="showBab(${k})"><span><b>${b[0]}</b> ${b[1]}</span><i>&#9656;</i></div>`).join('')+'</div>'}
function grp(b){const g=[];b[2].forEach(x=>{const d=x.split(' ')[0].split('.').length;if(d>2&&g.length)g[g.length-1].c.push(x);else g.push({t:x,c:[]})});return g}
function pop(id,html){let o=document.getElementById(id);if(!o){o=document.createElement('div');o.id=id;o.className='modal';o.onclick=e=>{if(e.target===o)o.style.display='none'};document.body.appendChild(o)}o.innerHTML=html;o.style.display='flex'}
function closePop(id){const o=document.getElementById(id);if(o)o.style.display='none'}
function showBab(k){const b=M[openM].toc[k];pop('modal',`<div class="mbox"><div class="row" style="align-items:flex-start"><div style="flex:1"><b>${b[0]}</b><h3 style="margin:2px 0 0">${b[1]}</h3></div><button class="ib" style="color:inherit" onclick="closePop('modal')" aria-label="Tutup">&#10005;</button></div><div style="margin-top:8px">${grp(b).map((g,j)=>g.c.length?`<div class="si link" onclick="showSub(${k},${j})"><span>${g.t}</span><i>&#9656;</i></div>`:hasMat(num(g.t))?lk(num(g.t),g.t):`<div class="si">${g.t}</div>`).join('')}</div></div>`)}
function showSub(k,j){const g=grp(M[openM].toc[k])[j];pop('modal2',`<div class="mbox"><div class="row" style="align-items:flex-start"><h3 style="flex:1;margin:0">${g.t}</h3><button class="ib" style="color:inherit" onclick="closePop('modal2')" aria-label="Tutup">&#10005;</button></div><div style="margin-top:8px">${hasMat(num(g.t))?lk(num(g.t),'Penjelasan '+num(g.t)):''}${g.c.map(x=>hasMat(num(x))?lk(num(x),x):`<div class="si">${x}</div>`).join('')}</div></div>`)}

M[0].mat={
"1.1":["Akuntansi manajemen sering dianggap <b>'anak tiri'</b> dibandingkan akuntansi keuangan. Akibatnya, banyak perusahaan hanya mengambil informasi akuntansi manajemen dari sistem akuntansi keuangan.","Padahal karakteristik keduanya berbeda. Informasi dari sistem akuntansi keuangan tidak selalu sesuai dengan kebutuhan manajemen, sehingga keputusan yang diambil bisa kurang akurat.","Karena itu perusahaan perlu mengembangkan sistem yang menghasilkan informasi sesuai kebutuhan manajemen. Pembahasan ini mencakup <b>cost accounting system</b> (sistem akuntansi biaya)."],
"1.2":["Sistem akuntansi perusahaan pada dasarnya terbagi dua: <b>sistem akuntansi keuangan</b> dan <b>sistem akuntansi manajemen</b>.","Sistem akuntansi keuangan menghasilkan laporan keuangan untuk <b>pihak eksternal</b> seperti investor, kreditur, dan otoritas pajak. Laporan ini harus disusun sesuai <b>Pernyataan Standar Akuntansi Keuangan (PSAK)</b>.","Laporan keuangan yang dihasilkan:","- Laporan Posisi Keuangan","- Laporan Laba Rugi dan Penghasilan Komprehensif Lain","- Laporan Arus Kas","- Laporan Perubahan Ekuitas","- Catatan atas Laporan Keuangan","Perusahaan yang sahamnya atau obligasinya dijual ke publik wajib menyampaikan laporan keuangan secara berkala (per kuartal dan tahunan)."],
"1.3":["Sistem akuntansi manajemen dirancang untuk memberi informasi kepada <b>pihak internal</b> (manajer) agar dapat menjalankan kegiatan dan mengambil keputusan.","Informasi dari sistem akuntansi keuangan saja tidak cukup karena:","- Informasinya terlalu ringkas (agregat), tidak rinci per produk atau per kegiatan.","- Waktu pelaporannya terlalu lama (periodik).","- Isinya melaporkan kejadian yang sudah terjadi (historis).","Manajemen membutuhkan informasi yang rinci, tepat waktu, dan bisa dipakai sebagai umpan balik (<i>feedback</i>), bahkan idealnya <i>real-time</i>.","<b>Kategori biaya:</b> biaya produksi (bahan baku langsung, buruh langsung, <i>overhead</i> pabrik) diserap ke produk lalu menjadi harga pokok penjualan saat produk terjual (<i>full/absorption costing</i>), sedangkan <b>biaya periode</b> (<i>period cost</i>) langsung menjadi beban pada periode terjadinya.","Biaya <i>overhead</i> dialokasikan ke produk memakai dasar alokasi (<i>cost driver</i>), contohnya:","- Unit produksi atau unit terjual","- Jam buruh langsung atau biaya buruh langsung","- Biaya bahan baku langsung","- Jam mesin"],
"1.4":["Menurut <b>Kaplan dan Cooper (1999)</b>, sistem akuntansi perusahaan berkembang dalam empat tahap:","- <b>Tahap 1 - Belum sempurna:</b> sistem yang pertama dikembangkan biasanya sistem akuntansi keuangan.","- <b>Tahap 2:</b> sistem akuntansi keuangan sudah baik, tetapi informasi manajemen masih diambil dari sistem tersebut sehingga belum sesuai dengan karakteristik kebutuhan manajemen.","- <b>Tahap 3:</b> perusahaan memiliki sistem akuntansi keuangan dan sistem akuntansi manajemen yang terpisah.","- <b>Tahap 4 - Integrasi:</b> kedua sistem disatukan dalam satu sistem terintegrasi, seperti konsep <b>Enterprise Resource Planning (ERP)</b>, dengan modul yang berbeda untuk tiap kebutuhan."],
"1.5":["Tiga istilah ini sering tumpang tindih, tetapi dalam modul ini dibedakan:","- <b>Akuntansi biaya (cost accounting):</b> menghitung biaya produksi per unit untuk menilai persediaan dan menentukan harga pokok produksi periode tersebut.","- <b>Akuntansi manajemen (management accounting):</b> menyediakan informasi akuntansi dan teknik-teknik yang membantu manajemen merencanakan, mengendalikan, dan mengambil keputusan.","- <b>Manajemen biaya (cost management):</b> bagian dari akuntansi manajemen yang berfokus pada pengelolaan biaya.","Dalam <i>Relevance Lost</i> (Kaplan dan Johnson, 1987) dijelaskan bahwa akuntansi biaya berkembang terutama untuk kebutuhan laporan keuangan, sehingga informasinya sering kurang relevan bagi manajemen.","Pada perusahaan manufaktur, biaya bahan baku langsung dan buruh langsung dapat ditelusuri langsung ke produk, sedangkan <i>overhead</i> harus dialokasikan."],
"1.6":["Menurut <b>Kaplan dan Johnson (1987)</b>, sistem akuntansi biaya awalnya dirancang terutama untuk <b>inventory costing</b> (penilaian persediaan) dan penentuan laba, sehingga ketepatan biaya per produk belum menjadi prioritas.","Topik yang dibahas dalam akuntansi biaya:","- Sistem biaya pesanan (<i>Job Order Costing</i>)","- Sistem biaya proses (<i>Process Costing</i>)","- <i>Joint Cost</i>","- Alokasi biaya departemen penunjang","- Perlakuan akuntansi untuk barang cacat (<i>scrap, rework, and spoilage</i>)"],
"1.6.1":["<b>Job order costing</b> (sistem biaya pesanan) dipakai ketika produk dibuat berdasarkan <b>pesanan</b>, sehingga setiap pesanan bisa berbeda.","Biaya dikumpulkan per pesanan, biasanya dalam <i>job cost sheet</i> (lembar biaya pesanan).","Bahan baku langsung dan buruh langsung ditelusuri langsung ke pesanan, sedangkan <i>overhead</i> dibebankan memakai tarif yang ditentukan di muka (<i>predetermined overhead rate</i>)."],
"1.6.2":["<b>Process costing</b> (sistem biaya proses) dipakai untuk produksi massal produk sejenis yang melewati beberapa proses atau departemen.","Biaya dikumpulkan per departemen untuk satu periode, lalu dibagi jumlah produksi (dihitung dalam <i>unit ekuivalen</i>) untuk mendapatkan biaya per unit.","Dua metode yang dikenal: <b>rata-rata tertimbang</b> (<i>weighted average</i>) dan <b>FIFO</b>."],
"1.6.3":["<b>Joint cost</b> (biaya bersama) adalah biaya yang dikeluarkan untuk menghasilkan beberapa produk sekaligus dari satu proses (<i>joint products</i>).","Biaya sebelum <b>titik pisah</b> (<i>split-off point</i>) tidak bisa ditelusuri ke satu produk, sehingga harus dialokasikan ke masing-masing produk untuk penilaian persediaan (<i>inventory costing</i>).","Hasil alokasi ini sebaiknya tidak dipakai sebagai dasar memutuskan apakah produk dijual langsung atau diproses lebih lanjut."],
"1.6.4":["<b>Departemen produksi</b> mengolah produk secara langsung, sedangkan <b>departemen penunjang</b> (<i>support department</i>) hanya memberi jasa kepada departemen lain. Biaya departemen penunjang dialokasikan agar biaya produk lengkap.","Tiga metode alokasi:","- <b>Direct method:</b> biaya dialokasikan langsung ke departemen produksi, tanpa memperhitungkan jasa antar departemen penunjang.","- <b>Step down method:</b> alokasi dilakukan berurutan, sehingga sebagian jasa antar departemen penunjang diakui.","- <b>Reciprocal method:</b> mengakui sepenuhnya jasa timbal balik antar departemen penunjang, umumnya paling akurat.","Ketiga metode dapat menghasilkan angka biaya yang berbeda."],
"1.6.5":["Barang cacat terdiri dari:","- <b>Rework:</b> barang cacat yang bisa diperbaiki dengan biaya tambahan sehingga sesuai spesifikasi.","- <b>Spoilage:</b> barang cacat yang tidak bisa diperbaiki, sehingga dijual dengan harga di bawah normal.","- <b>Scrap:</b> sisa-sisa produksi, misalnya potongan bahan.","Perlakuan akuntansinya bergantung pada jenis kerugian:","- <b>Normal loss</b> (wajar): meningkatkan biaya per unit produk yang baik.","- <b>Abnormal loss</b> (tidak wajar): dibebankan sebagai kerugian pada periode berjalan.","Seluruh topik ini terkait dengan tujuan awal akuntansi biaya, yaitu <i>inventory costing</i>."]};
const num=x=>x.split(' ')[0];
const hasMat=n=>!!(M[openM].mat&&M[openM].mat[n]);
const lk=(n,t)=>`<div class="si link" onclick="showMat('${n}')"><span>${t}</span><i>&#9656;</i></div>`;
function showMat(n){const m=M[openM],t=m.toc.flatMap(b=>b[2]).find(x=>num(x)===n);pop('modal3',`<div class="mbox mt"><div class="row" style="align-items:flex-start"><h3 style="flex:1;margin:0">${t}</h3><button class="ib" style="color:inherit" onclick="closePop('modal3')" aria-label="Tutup">&#10005;</button></div>${mt(m.mat[n])}</div>`)}
const COV=[["#14295f","#2f7be0"],["#10263b","#e8833a"],["#4a1238","#b0407f"],["#6e1b1b","#e0662a"],["#0f2236","#e8472b"],["#1b1b2f","#9b6a34"],["#5e2410","#d0703a"]];
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cover=i=>{const m=M[i],c=COV[i];return `<div class="cov" style="background:linear-gradient(160deg,${c[0]},${c[1]})"><i></i><b>${m.n}</b><small>Modul CA &middot; ${m.lv}</small><img src="covers/${slug(m.n)}.jpg" alt="" onerror="this.remove()"></div>`};
const gh=i=>i===0||M[i-1].lv!==M[i].lv?'<h3 style="margin:14px 0 6px;color:#1565d8">Tingkat '+M[i].lv+'</h3>':'';
const T=[];M.forEach((m,i)=>m.topics.forEach(t=>T.push({m:i,t:t.t})));
const $=s=>document.querySelector(s),iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
let S={},tab='home',exam=null,openM=null;
const key=()=>'essenca_'+(user?user.uid:'guest');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
async function save(){localStorage.setItem(key(),JSON.stringify(S));if(db&&user)try{await db.collection('users').doc(user.uid).set(S)}catch(e){toast('Gagal sinkron ke cloud')}}
async function load(){S={done:{},results:[],plan:{date:'',start:today()}};try{Object.assign(S,JSON.parse(localStorage.getItem(key())||'{}'))}catch(e){}
if(db&&user)try{const d=await db.collection('users').doc(user.uid).get();if(d.exists)Object.assign(S,d.data())}catch(e){}}
if(useFb){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(async u=>{if(u){user=u;await start()}else if(!window._g){$('#auth').hidden=false;$('#app').hidden=true}})}
async function start(){await load();$('#auth').hidden=true;$('#app').hidden=false;render()}
function guest(){window._g=1;user=null;start()}
function aerr(e){$('#aerr').textContent=useFb?e.message:'Isi FIREBASE_CONFIG di index.html terlebih dahulu.'}
function login(){if(!useFb)return aerr();auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(aerr)}
function reg(){if(!useFb)return aerr();auth.createUserWithEmailAndPassword($('#em').value,$('#pw').value).catch(aerr)}
function logout(){window._g=0;user=null;if(useFb)auth.signOut();$('#auth').hidden=false;$('#app').hidden=true}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;exam=null;openM=null;render()});
function avg(i){const r=S.results.filter(x=>x.m===i);return r.length?Math.round(r.reduce((a,x)=>a+x.s,0)/r.length):null}
function plan(){const p=S.plan;if(!p.date)return[];const s=new Date(p.start+'T00:00'),e=new Date(p.date+'T00:00');const n=Math.max(1,Math.round((e-s)/864e5));
const st=Math.max(1,n-Math.min(2,Math.floor(n/4))),per=Math.ceil(T.length/st),o=[];
for(let d=0;d<n;d++){const dt=iso(new Date(s.getTime()+d*864e5));let it;
if(d<st){const x=T.slice(d*per,(d+1)*per);it=x.map(a=>'Pelajari: '+M[a.m].name+' - '+a.t);if(x.length)it.push('Latihan soal: '+[...new Set(x.map(a=>M[a.m].name))].join(', '))}
else it=['Simulasi ujian campuran','Ulas soal yang salah'];o.push({dt,it})}return o}
function render(){$('#ttl').textContent={home:'Beranda',mod:'Modul',ujian:'Ujian',jadwal:'Jadwal',setting:'Setting'}[tab];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const v=$('#view');
if(tab==='home'){const pl=plan(),td=pl.find(d=>d.dt===today());
const dn=pl.filter(d=>S.done[d.dt]).length;
v.innerHTML=`<h2>Beranda</h2>${useFb?'':'<div class="card muted">Mode lokal: data tersimpan di perangkat. Isi FIREBASE_CONFIG untuk sinkron cloud.</div>'}
<div class="card"><h3>Jadwal hari ini</h3>${td?td.it.map(x=>`<li>${x}</li>`).join(''):'<p class="muted">Belum ada jadwal untuk hari ini. Atur tanggal ujian di tab Jadwal.</p>'}
${pl.length?`<div class="bar" style="margin-top:8px"><i style="width:${Math.round(dn/pl.length*100)}%"></i></div><p class="muted">${dn}/${pl.length} hari selesai</p>`:''}</div>

`}
else if(tab==='mod'){if(openM===null)v.innerHTML=`<h2>Rangkuman Modul</h2>`+[...new Set(M.map(m=>m.lv))].map(l=>`<h3 style="margin:14px 0 8px;color:#1565d8">Tingkat ${l}</h3><div class="grid">`+M.map((m,i)=>m.lv===l?`<div class="mc" onclick="openM=${i};render()">${cover(i)}<p>${m.topics.length} topik, ${m.q.length} soal</p></div>`:'').join('')+`</div>`).join('');
else{const m=M[openM];v.innerHTML=`<button class="sm sec" onclick="openM=null;render()">&larr; Kembali</button><div class="row" style="align-items:flex-start;gap:14px;margin:8px 0"><div class="cs" style="width:110px;flex:none">${cover(openM)}</div><div><h2 style="margin-top:0">${m.n}</h2><span class="muted">Tingkat ${m.lv}</span></div></div>`+tocHtml(m)+m.topics.map(t=>`<div class="card"><h3>${t.t}</h3><ul>${t.p.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')+`<button onclick="startExam(${openM})">Latihan soal modul ini</button>`}}
else if(tab==='ujian'){if(!exam)v.innerHTML=`<h2>Ujian</h2>`+M.map((m,i)=>`${gh(i)}<div class="card row"><span style="flex:1">${m.n}</span><button class="sm" onclick="startExam(${i})">Mulai</button></div>`).join('')+`<div class="card row"><span style="flex:1">Campuran (semua modul)</span><button class="sm" onclick="startExam(-1)">Mulai</button></div>`+`<div class="card"><h3>Riwayat ujian</h3>${S.results.length?S.results.slice(-8).reverse().map(r=>`<div class="row"><span style="flex:1">${r.d} - ${r.name}</span><b>${r.s}</b></div>`).join(''):'<p class="muted">Belum ada ujian.</p>'}</div>`;
else renderExam()}
else if(tab==='setting'){const dk=theme()==='dark';v.innerHTML=`<h2>Setting</h2>
<div class="card"><h3>Akun</h3><p>${user?user.email:'Mode lokal (tanpa akun)'}</p><button class="sec" onclick="logout()">Keluar</button></div>
<div class="card"><h3>Tampilan</h3><label>Tema</label><select onchange="setTheme(this.value)"><option value="light" ${dk?'':'selected'}>Terang</option><option value="dark" ${dk?'selected':''}>Gelap</option></select></div>
<div class="card"><h3>Target nilai</h3><p class="muted">Batas nilai untuk dianggap mencapai target pada latihan soal.</p><input type="number" min="1" max="100" value="${S.target||70}" onchange="setTarget(this.value)"></div>
<div class="card"><h3>Data</h3><div class="row" style="flex-wrap:wrap"><button class="sec sm" onclick="resetData('results')">Hapus riwayat ujian</button><button class="sec sm" onclick="resetData('plan')">Reset jadwal</button></div></div>
<div class="card muted">Essenca v1.0</div>`}
else{const p=S.plan,pl=plan();v.innerHTML=`<h2>Jadwal Belajar</h2><div class="card"><label>Tanggal mulai</label><input type="date" id="ps" value="${p.start}"><label>Tanggal ujian</label><input type="date" id="pd" value="${p.date}"><button onclick="setPlan()">Buat jadwal harian</button></div>`+
pl.map(d=>`<div class="day ${d.dt===today()?'today':''} ${S.done[d.dt]?'done':''}"><label class="row"><input type="checkbox" style="width:auto;margin:0" ${S.done[d.dt]?'checked':''} onchange="S.done['${d.dt}']=this.checked;save();render()"><b>${new Date(d.dt+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}</b></label><ul>${d.it.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}}
function setPlan(){const s=$('#ps').value,d=$('#pd').value;if(!s||!d||d<=s)return toast('Tanggal ujian harus setelah tanggal mulai');S.plan={start:s,date:d};S.done={};save();render()}
function startExam(i){let q=[];if(i<0)M.forEach((m,k)=>m.q.forEach(x=>q.push({m:k,x})));else M[i].q.forEach(x=>q.push({m:i,x}));
q.sort(()=>Math.random()-.5);exam={i,q,ans:{},done:false};tab='ujian';render()}
function renderExam(){const e=exam,name=e.i<0?'Campuran':M[e.i].name;let sc=0;
const h=e.q.map((o,k)=>{const x=o.x;if(e.done&&e.ans[k]===x[2])sc++;
return`<div class="card"><b>${k+1}. ${x[0]}</b>`+x[1].map((t,j)=>{let c='';if(e.done)c=j===x[2]?'ok':(e.ans[k]===j?'bad':'');
return`<label class="opt ${c}"><input type="radio" name="q${k}" ${e.ans[k]===j?'checked':''} ${e.done?'disabled':''} onchange="exam.ans[${k}]=${j}"> ${t}</label>`}).join('')+(e.done?`<div class="exp">${e.ans[k]===x[2]?'Benar. ':'Salah. '}${x[3]}</div>`:'')+`</div>`}).join('');
const s=Math.round(sc/e.q.length*100);
$('#view').innerHTML=`<h2>${name}</h2>${e.done?`<div class="card"><h3>Skor: ${s} (${sc}/${e.q.length} benar)</h3><p>${s>=(S.target||70)?'Mencapai':'Di bawah'} target ${S.target||70}</p><button onclick="exam=null;render()">Selesai</button></div>`:''}${h}${e.done?'':'<button onclick="submitExam()">Kumpulkan & koreksi</button>'}`}
function submitExam(){const e=exam;if(Object.keys(e.ans).length<e.q.length&&!confirm('Masih ada soal belum dijawab. Kumpulkan?'))return;
let sc=0;e.q.forEach((o,k)=>{if(e.ans[k]===o.x[2])sc++});e.done=true;
S.results.push({m:e.i,name:e.i<0?'Campuran':M[e.i].name,s:Math.round(sc/e.q.length*100),d:today()});save();renderExam();scrollTo(0,0)}
function setTheme(v){localStorage.setItem('essenca_theme',v);applyTheme()}
function setTarget(v){S.target=Math.min(100,Math.max(1,+v||70));save();toast('Target disimpan')}
function resetData(k){if(!confirm('Yakin ingin menghapus data ini?'))return;if(k==='results')S.results=[];else{S.plan={date:'',start:today()};S.done={}}save();toast('Selesai');render()}
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const theme=()=>localStorage.getItem('essenca_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){const d=theme()==='dark';document.body.classList.toggle('dark',d);document.querySelector('meta[name=theme-color]').content=d?'#17263d':'#e8f0fd';$('#thm').innerHTML=d?SUN:MOON}
function toggleTheme(){localStorage.setItem('essenca_theme',theme()==='dark'?'light':'dark');applyTheme();if(tab==='setting')render()}
applyTheme();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
if(!useFb){$('#auth').querySelector('p.muted').insertAdjacentHTML('afterend','<p class="muted">Firebase belum dikonfigurasi.</p>')}
</script></body></html>
