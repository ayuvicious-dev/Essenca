"3.1":["Pada modul sebelumnya sudah dijelaskan cara perusahaan mengembangkan sistem <b>activity based costing (ABC)</b>. Sistem ABC memberi gambaran yang lebih akurat dan rinci tentang keadaan perusahaan, seperti <b>profitabilitas produk atau pelanggan</b>. Pertanyaan berikutnya: apa yang akan dilakukan manajemen terhadap informasi tersebut?","Menurut <b>Cooper dan Kaplan (1999)</b>, informasi ABC dapat dipakai untuk dua hal:","- <b>Operating activity based management:</b> informasi ABC dipakai untuk menunjukkan aktivitas apa saja yang dilakukan perusahaan secara <b>tidak efisien</b>, sehingga menimbulkan biaya tinggi dan akhirnya mengurangi profitabilitas produk atau pelanggan. Dengan informasi ini perusahaan dapat bertindak terhadap aktivitas tersebut, sehingga kegiatan operasional lebih efisien dan profitabilitas meningkat.","- <b>Strategic activity based management:</b> sistem informasi ABC dipakai untuk <b>pengambilan keputusan stratejik</b> yang lebih baik. Sistem ABC menghasilkan informasi akurat sehingga perusahaan mengetahui produk atau pelanggan mana yang merugikan atau menguntungkan, lalu dapat mengambil keputusan yang lebih akurat tentang tindakan terhadap produk atau pelanggan tersebut.","Contoh tindakan terhadap suatu produk sudah dibahas pada modul <i>activity based costing</i>, sedangkan analisis ABC untuk pelanggan akan dibahas pada modul <i>strategic activity based management</i> untuk pelanggan."],
"3.2":["Penekanan modul ini adalah <b>operating activity based management</b>. Perbandingan antara konsep <i>activity based costing</i> dan <i>activity based management</i> terlihat pada <b>Gambar 3.1</b> (di teks modul disebut 'gambar 1'):","##F|Gambar 3.1|Konsep Activity Based Costing|abm","- <b>Dimensi biaya (cost dimension), arah vertikal:</b> <i>Resources</i> \u2192 <i>Activities</i> \u2192 <i>Cost Objects</i>.","- <b>Dimensi proses (process dimension), arah horizontal:</b> <i>Driver Analysis</i> (Why?) \u2013 <i>Activities</i> (What?) \u2013 <i>Performance Measures</i> (How Well?).","Model <i>activity based costing</i> diwakili model <b>vertikal (vertical view)</b>: biaya dibebankan ke aktivitas, yang pada akhirnya dibebankan ke objek biaya. Model <i>activity based management</i> diwakili model <b>horizontal (horizontal view)</b>, dengan tujuan <b>memperbaiki aktivitas</b> agar dilakukan dengan lebih efisien.","Dalam penerapan <i>activity based management</i>, model ABC yang dipakai harus <b>memisahkan biaya fleksibel dan biaya committed</b>. Tanpa pemisahan itu, perusahaan sulit memonitor dampak efisiensi pengurangan biaya, karena tidak semua biaya otomatis berkurang meskipun perusahaan menghilangkan semua aktivitasnya. Hanya biaya <b>fleksibel</b> yang hilang, sedangkan biaya <b>committed</b> tidak otomatis hilang.","Pada ABC, aktivitas dibagi menjadi empat tingkatan (<i>unit level, batch level, product level, facility level</i>). Pada <i>activity based management</i>, aktivitas biasanya dibagi menjadi <b>dua bagian besar</b>:","- <b>Aktivitas bernilai tambah (value added activities):</b> aktivitas yang bernilai tambah di mata konsumen, sehingga konsumen mau membayar lebih. Sebagian besar aktivitas produksi, seperti memotong kayu dan merakit kursi, termasuk jenis ini, karena konsumen merasa tidak dapat melakukannya sendiri.","- <b>Aktivitas tidak bernilai tambah (non value added activities):</b> konsumen tidak mau membayar untuk aktivitas ini. Karena itu perusahaan harus berusaha menekan bahkan <b>menghilangkan</b> biaya aktivitas tersebut.","Contoh aktivitas yang tidak menambah nilai:","- <b>Pengerjaan ulang (rework):</b> membuat perusahaan melakukan aktivitas dua kali untuk produk yang sama, karena yang pertama menghasilkan produk tidak sesuai spesifikasi. Pembeli tidak peduli ada pengerjaan ulang atau tidak; yang penting produk dalam keadaan baik dan berfungsi sebagaimana mestinya. Karena itu muncul gugus kendali mutu (<i>Total Quality Management</i>) yang dipelopori perusahaan Jepang untuk memproduksi barang tanpa cacat sama sekali (<i>zero defect</i>).","- <b>Pemeriksaan atau inspeksi:</b> jika perusahaan dapat menyeleksi pemasok dengan baik sehingga bahan baku selalu sesuai spesifikasi, inspeksi bahan mentah tidak diperlukan lagi. Jika perusahaan dapat menciptakan sistem produksi <i>zero defect</i>, inspeksi barang jadi juga tidak diperlukan lagi.","- <b>Penyimpanan:</b> biaya sewa atau penyusutan gudang, gaji orang gudang, dan sebagainya tidak memiliki nilai tambah. Salah satu tujuan <i>just in time (JIT)</i> adalah menghilangkan persediaan; bila JIT diterapkan dengan sempurna, persediaan dapat diminimalkan bahkan dihilangkan.","Masih banyak aktivitas tidak bernilai tambah di luar ketiga contoh tersebut. Sasaran utama perusahaan bagi aktivitas-aktivitas ini adalah <b>dihilangkan</b>.","Namun jika aktivitas hanya dibagi dua (<i>value added</i> dan <i>non value added</i>), bagaimana dengan aktivitas <b>menyusun laporan keuangan</b>? Dari kacamata pelanggan, aktivitas ini tidak menambah nilai sehingga harus dihilangkan. Padahal aktivitas ini sebenarnya <b>harus dilakukan</b> perusahaan karena berguna bagi perusahaan. Selain penyusunan laporan keuangan, masih banyak aktivitas serupa, misalnya pemeliharaan mesin dan perhitungan pajak penghasilan.","Karena itu, aktivitas yang menambah nilai sebaiknya dipisahkan lagi menjadi dua bagian: aktivitas yang menambah nilai bagi <b>pembeli/pelanggan</b>, dan aktivitas yang menambah nilai bagi <b>perusahaan</b>."],
"3.3":["Dalam konsep <i>activity based management</i>, efisiensi aktivitas dapat dilakukan dengan <b>empat cara</b>: penghilangan aktivitas (<i>activity elimination</i>), pengurangan aktivitas (<i>activity reduction</i>), pemilihan aktivitas (<i>activity selection</i>), dan <i>activity sharing</i>. Penjelasan di teks modul memakai urutan elimination, reduction, sharing, lalu selection:","- <b>Activity elimination:</b> tujuan utamanya menghilangkan aktivitas, dengan harapan biaya yang dikeluarkan untuk aktivitas itu ikut hilang. Sasaran utamanya adalah aktivitas yang <b>tidak menambah nilai</b>, baik bagi pembeli/pelanggan maupun bagi perusahaan.","- <b>Activity reduction:</b> untuk aktivitas yang tidak dapat dihilangkan sepenuhnya, perusahaan menghasilkan tingkat output yang sama dengan <b>aktivitas yang lebih sedikit</b>. Salah satu caranya memperbanyak unit produksi yang dibuat dalam satu <i>batch</i>. Contoh pembelian bahan mentah: bila sekali pesan 2.000 kg, maka untuk 10.000 kg dibutuhkan <b>lima batch</b> pembelian. Bila jumlah per pesanan diperbesar menjadi 2.500 kg, pembelian 10.000 kg hanya dilakukan dalam <b>empat batch</b>.","- <b>Activity sharing:</b> tujuannya mengurangi besarnya <b>kapasitas menganggur</b>; sumber daya yang dimiliki perusahaan dipakai untuk lebih dari satu aktivitas. Contoh: perusahaan mempekerjakan dua orang, satu untuk menerima bahan mentah dan satu lagi untuk memeriksa bahan mentah, dan keduanya hanya bekerja 50% dari kapasitas. Dalam konsep <i>activity sharing</i>, perusahaan cukup mempekerjakan satu orang untuk kedua aktivitas, sehingga kapasitas menganggur berkurang.","- <b>Activity selection:</b> perusahaan memilih alternatif aktivitas yang <b>lebih murah</b>, misalnya memilih antara memproduksi sendiri atau melakukan <i>outsourcing</i>.","Semua cara efisiensi ini sebaiknya <b>tidak dilakukan terisolasi</b>, karena perubahan satu aktivitas dapat memengaruhi biaya aktivitas lain. Contoh: jika batch pembelian diperbesar, aktivitas pembelian bahan mentah berkurang, tetapi karena jumlah bahan mentah per batch pesanan meningkat, aktivitas <b>penyimpanan</b> bahan mentah kemungkinan besar ikut meningkat. Jadi dalam proses efisiensi, perusahaan harus melihat efek biaya untuk <b>keseluruhan aktivitas</b> yang dilakukan.","Bagian berikutnya dalam <i>operating activity based management</i> adalah mencari <b>tolok ukur</b> untuk memonitor kemajuan proses efisiensi. Tolok ukur sebaiknya dilihat dari <b>tiga sisi: biaya, waktu, dan kualitas</b>.","Contoh: perusahaan mengefisienkan aktivitas penyusunan laporan keuangan, dan orang yang mengerjakannya dikurangi dari <b>tujuh orang menjadi tiga orang</b>. Biaya aktivitas itu pasti berkurang. Namun pengurangan orang dapat berdampak negatif terhadap <b>waktu</b> penyelesaian laporan keuangan dan <b>kualitas</b> laporan yang dihasilkan, seperti banyaknya kesalahan jurnal. Karena itu, selain memonitor pengurangan biaya, faktor kualitas dan waktu juga harus senantiasa diperhitungkan.","Perhitungan, analisis, dan cara menghitung biaya aktivitas yang menambah nilai dan yang tidak menambah nilai dapat dilihat pada buku <i>Cost Management</i> karangan Guan, Hansen, dan Mowen, halaman 434 sampai 442."],
"3.4":["Salah satu penerapan konkret <i>operating activity based management</i> adalah konsep <b>biaya kualitas (cost of quality)</b>. Konsep ini disarankan bagi perusahaan yang menerapkan program <b>gugus kendali mutu (GKM)</b>.","Tujuan GKM adalah menghasilkan barang yang <b>berkualitas</b>, yaitu barang yang sesuai dengan spesifikasi yang telah ditentukan perusahaan. Proses pembuatannya memakai konsep <b>zero defect</b>: proses produksi harus menghasilkan barang yang sesuai spesifikasi.","Salah satu tujuan GKM adalah meningkatkan laba. Jika perusahaan dapat memproduksi dengan konsep <i>zero defect</i>, banyak biaya yang tidak bernilai tambah dapat dihilangkan, sehingga biaya turun dan laba naik. Selain itu, barang berkualitas membuat konsumen puas, yang pada akhirnya meningkatkan pendapatan dan laba perusahaan.","Biaya kualitas dipakai untuk memonitor program GKM secara <b>finansial</b>, yaitu apakah program sudah berjalan dengan baik. Tanpa biaya kualitas, keberhasilan GKM hanya dapat dilihat dari dua sisi: perbaikan <b>waktu</b> dan perbaikan <b>kualitas</b>. Dengan adanya biaya kualitas, perbaikan proses dapat dilihat lengkap dari tiga sisi: <b>biaya, waktu, dan kualitas</b>.","Biaya kualitas yang dikeluarkan perusahaan dibagi menjadi <b>empat bagian besar</b>:","- <b>Biaya pencegahan (prevention costs)</b>","- <b>Biaya pemeriksaan (appraisal costs)</b>","- <b>Biaya kegagalan internal (internal failure costs)</b>","- <b>Biaya kegagalan eksternal (external failure costs)</b>","Dari keempatnya, biaya pencegahan dan biaya pemeriksaan digolongkan sebagai <b>biaya pengendalian (control costs)</b>, sedangkan biaya kegagalan internal dan eksternal digolongkan sebagai <b>biaya kegagalan (failure costs)</b>.","<b>Biaya pencegahan (prevention costs)</b> adalah biaya yang dikeluarkan agar perusahaan <b>tidak memproduksi</b> barang yang tidak sesuai spesifikasi. Contoh: pelatihan karyawan, membeli mesin yang lebih handal, dan perawatan berkala yang konsisten.","<b>Biaya pemeriksaan (appraisal costs)</b> adalah biaya untuk mencegah barang yang <b>sudah terlanjur diproduksi</b> tidak sesuai spesifikasi agar jangan sampai diproses lebih lanjut. Contoh: aktivitas pemeriksaan bahan mentah, agar bahan yang tidak sesuai spesifikasi tidak dipakai produksi, karena jika dipakai pasti menghasilkan output yang buruk juga. Hampir segala bentuk pemeriksaan atau inspeksi masuk kategori ini.","<b>Biaya kegagalan internal (internal failure costs)</b> adalah biaya yang terpaksa dikeluarkan karena perusahaan memproduksi barang tidak sesuai spesifikasi, tetapi kondisi buruk itu <b>ditemukan sebelum</b> barang sampai ke tangan konsumen akhir. Contoh: biaya pengerjaan ulang (<i>rework</i>), agar barang menjadi sempurna dan dapat dijual dengan harga normal. Contoh lain: <b>biaya inspeksi ulang</b>, yang <b>tidak</b> dimasukkan sebagai <i>appraisal costs</i> karena terjadi akibat perusahaan pada awalnya tidak memproduksi barang sesuai spesifikasi.","<b>Biaya kegagalan eksternal (external failure costs)</b> pada dasarnya sama dengan kegagalan internal. Bedanya, barang yang tidak sesuai spesifikasi itu baru ditemukan <b>setelah</b> sampai ke tangan konsumen akhir. Contoh: biaya menangani keluhan pelanggan dan biaya garansi.","Monitoring pergerakan biaya kualitas dilakukan dengan membandingkan <b>rasio</b> dari satu periode ke periode lainnya. Rasio-rasio yang dibuat:","- Total biaya kualitas / penjualan","- Biaya pencegahan / penjualan","- Biaya pemeriksaan / penjualan","- Biaya kegagalan internal / penjualan","- Biaya kegagalan eksternal / penjualan","<b>Prioritas jangka pendek</b> program GKM adalah <b>menurunkan rasio biaya kegagalan eksternal/penjualan</b>. Rasio ini tidak boleh meningkat, dan dari periode ke periode harus selalu turun. Alasannya: bila barang tidak sesuai spesifikasi sampai ke tangan konsumen akhir, konsumen menjadi tidak puas, dan itu berdampak buruk pada penjualan masa depan, karena bukan hanya konsumen itu yang tidak akan membeli lagi, tetapi juga pihak lain yang mendengar cerita ketidakpuasannya.","<b>Di awal program GKM:</b>","- Rasio <b>biaya pencegahan</b>/penjualan biasanya <b>meningkat</b>, karena perusahaan harus melakukan investasi awal yang cukup besar untuk membangun sistem GKM. Setelah beberapa periode, rasio ini menurun dan mencapai tingkat yang stabil.","- Rasio <b>biaya pemeriksaan</b>/penjualan juga biasanya <b>meningkat</b>, karena GKM membutuhkan waktu untuk berjalan dengan baik, sehingga persentase barang yang diinspeksi ditingkatkan agar barang yang tidak sesuai spesifikasi tidak sampai ke tangan konsumen.","- Akibatnya rasio <b>biaya kegagalan internal</b>/penjualan juga <b>meningkat</b> di awal. Jika sistem GKM belum berjalan, peningkatan inspeksi menyebabkan <b>pergeseran biaya dari kegagalan eksternal menjadi kegagalan internal</b>; secara keseluruhan total biaya kegagalan belum banyak berubah.","<b>Jika sistem GKM sudah berjalan dengan baik</b>, jumlah barang yang tidak sesuai spesifikasi makin lama makin berkurang, terlihat dari biaya kegagalan internal dan eksternal yang terus menurun. Dengan demikian biaya pemeriksaan juga dapat diturunkan. Dalam kondisi <b>zero defect yang sempurna</b>, perusahaan sama sekali tidak mengeluarkan biaya pemeriksaan, biaya kegagalan internal, maupun biaya kegagalan eksternal, karena ketiga kategori biaya tersebut berasal dari aktivitas yang tidak memiliki nilai tambah. Pada akhirnya, biaya kualitas yang dikeluarkan perusahaan <b>hanya biaya pencegahan</b>."],
"3.5":["Dalam kategori biaya kegagalan <b>eksternal maupun internal</b> terdapat biaya yang disebut <b>hidden quality costs</b> (biaya kualitas tersembunyi). Disebut tersembunyi karena biaya ini <b>tidak dapat dilihat langsung</b> pada catatan akuntansi perusahaan dan harus <b>diukur secara khusus</b>.","Contoh: <b>penjualan yang hilang</b> akibat ketidakpuasan konsumen yang menerima barang tidak sesuai spesifikasi. Besarnya <i>hidden quality costs</i> untuk biaya kegagalan eksternal sering <b>lebih tinggi</b> daripada yang dicatat perusahaan, sehingga diperlukan cara untuk menghitungnya. Salah satunya adalah <b>Taguchi quality loss function</b>.","Dalam konsep Taguchi, setiap <b>penyimpangan</b> terhadap spesifikasi yang sudah ditentukan perusahaan menimbulkan kerugian. Semakin jauh penyimpangannya, semakin tinggi kerugian yang dialami, dan kerugian itu meningkat dalam <b>fungsi kuadratik</b>.","Contoh dalam modul: perusahaan memproduksi cincin dengan diameter 1 cm.","- Penyimpangan 0,1 cm: kerugian Rp5","- Penyimpangan 0,2 cm: kerugian Rp25 (angka sesuai teks modul)","- Penyimpangan 0,3 cm: kerugian Rp625 (angka sesuai teks modul), dan seterusnya","<b>Catatan:</b> angka Rp25 dan Rp625 pada contoh modul tampak tidak konsisten dengan fungsi kuadratik. Jika kerugian Rp5 terjadi pada penyimpangan 0,1 cm (k = 5 / 0,1\u00b2 = 500), maka penyimpangan 0,2 cm seharusnya Rp20 (500 \u00d7 0,2\u00b2) dan penyimpangan 0,3 cm seharusnya Rp45 (500 \u00d7 0,3\u00b2). Untuk soal hitungan, pakai rumusnya.","Rumus yang dipakai untuk menghitung <i>hidden quality loss</i>: <b>L(y) = k (y \u2212 T)\u00b2</b>, dengan:","- <b>k</b> = besaran konstanta yang tergantung dari struktur biaya kegagalan eksternal perusahaan","- <b>y</b> = nilai aktual dari karakteristik yang diobservasi","- <b>T</b> = target nilai dari karakteristik yang diobservasi","- <b>L</b> = kerugian karena kualitas","Konstanta k diperoleh dengan rumus: <b>k = c / d\u00b2</b>, dengan:","- <b>c</b> = kerugian yang dialami perusahaan pada <i>lower</i> atau <i>upper specification limit</i>","- <b>d</b> = jarak dari batasan (<i>limit</i>) terhadap target nilai","Penerapan konsep biaya kualitas akan semakin mudah bila perusahaan sudah memiliki sistem <b>activity based costing</b>. Alasannya, penggolongan berdasarkan <i>charts of account</i> menyulitkan pengelompokan biaya ke dalam keempat biaya kualitas. Contoh: di <i>charts of account</i> yang ada adalah biaya gaji, tetapi untuk analisis biaya kualitas, biaya gaji itu harus dibebankan ke <b>aktivitas-aktivitas</b> yang dilakukan perusahaan. Setelah biaya masing-masing aktivitas diketahui, baru dapat digolongkan mana yang masuk biaya pencegahan, pemeriksaan, kegagalan internal, atau kegagalan eksternal.","Dengan demikian, salah satu penerapan konkret <i>operating activity based management</i> adalah <b>model biaya kualitas</b> ini."],
"3.6":["Konsep efisiensi biaya lainnya yang belakangan ini muncul adalah <b>lean production</b>. Konsep ini sering disebut <b>Toyota Production System (TPS)</b>, karena perusahaan tersebut yang mempelopori penggunaan sistemnya. Berdasarkan model <i>lean production</i> kemudian berkembang konsep baru yang disebut <b>lean accounting</b>.","Konsep <i>lean production</i> bertujuan membuat perusahaan menjadi 'kurus' (<i>lean</i>) dengan membuang segala aktivitas dan biaya yang <b>tidak memiliki nilai tambah</b>. Dalam konsep <i>lean</i> terdapat <b>tujuh pemborosan</b> yang harus dihilangkan:","- Kelebihan produksi (<i>over production</i>)","- Persediaan (<i>inventory</i>)","- <i>Motion</i>","- <i>Material movement</i>","- <i>Correction</i>, termasuk di dalamnya pengerjaan ulang (<i>rework</i>)","- <i>Over processing</i>","- <i>Waiting</i>","Perusahaan yang menerapkan <i>lean</i> biasanya mengorganisasi perusahaan berdasarkan <b>value stream</b>. Satu <i>value stream</i> terdiri dari keseluruhan aktivitas, baik yang menambah nilai maupun tidak, yang terkait dengan suatu produk atau kelompok produk, mulai dari proses pengadaan bahan mentah, proses produksi, sampai produk tersebut sampai ke tangan konsumen akhir. Biasanya rangkaian aktivitas dalam satu <i>value stream</i> hanya diperuntukkan bagi <b>satu produk saja</b>.","Dari sisi akuntansi manajemen, konsep <i>value stream</i> membuat perhitungan biaya per produk menjadi <b>lebih mudah</b>, karena semua biaya yang dikeluarkan pada <i>value stream</i> tersebut merupakan <b>biaya langsung</b> bagi produk tersebut. Jika tidak mungkin membuat satu <i>value stream</i> untuk satu produk, maka dibuat satu <i>value stream</i> yang terdiri dari beberapa jenis produk yang memiliki kesamaan aktivitas. Jika dalam satu <i>value stream</i> terdapat beberapa jenis produk, alokasi biaya berdasarkan <i>activity based costing</i> <b>masih diperlukan</b>.","Penggunaan <i>value stream</i> juga diharapkan <b>mempercepat proses pelaporan</b>. Seperti dibahas pada modul pertama, salah satu persyaratan sistem informasi akuntansi manajemen yang baik adalah pelaporan yang cepat. Untuk itu, dalam konsep <i>lean accounting</i> pelaporan disarankan dibagi menjadi <b>tiga bagian</b>:","- <b>Sel-sel produksi:</b> laporan hasil kegiatan dilaporkan <b>setiap hari</b>. Pelaporan ini terutama menyangkut informasi yang bersifat non keuangan.","- <b>Laporan keuangan masing-masing value stream:</b> dilakukan <b>per minggu</b>. Hal ini dimungkinkan karena hanya terfokus pada produk atau kegiatan yang terdapat pada <i>value stream</i> tersebut.","- <b>Laporan keuangan pabrik secara keseluruhan:</b> dilakukan <b>setiap bulan</b>."]
});

"2.1":[
"Kayak yang udah dibahas di modul sebelumnya, info akuntansi keuangan dan akuntansi manajemen itu <b>karakteristiknya beda</b>, jadi nggak bisa dipaksa lahir dari satu sistem yang sama.||ibarat rapor buat orang tua murid (keuangan) dan catatan harian buat wali kelas (manajemen): sama-sama soal murid, tapi isi dan gunanya lain.",
"Salah satu model buat ngebangun sistem akuntansi manajemen itu adalah <b>Activity Based Costing (ABC)</b>, dan inilah yang dibahas di bab ini."],
"2.2":[
"Tujuan <b>ABC</b> itu satu: membebankan <b>biaya tidak langsung</b> dengan lebih akurat. ABC <b>nggak</b> memperbaiki cara membebankan biaya langsung, soalnya yang itu memang sudah akurat. Obyek biaya itu tempat biaya dibebankan (produk atau pelanggan); di modul ini obyek biayanya <b>produk</b>.",
"Beda alurnya (Gambar 2.1):@@<b>Tradisional:</b> biaya langsung dibebankan ke obyek biaya@@<b>ABC:</b> biaya dibebankan ke <b>aktivitas</b> dulu, baru dari aktivitas ke obyek biaya||tradisional kayak nagih tagihan listrik rame-rame langsung dibagi ke tiap kamar; ABC ngitung dulu siapa pakai AC, siapa pakai mesin cuci, baru ditagih sesuai pemakaian.",
"##F|Gambar 2.1|Perbandingan Antara Sistem Biaya Tradisional dengan Activity Based Costing|trad",
"Di model tradisional, biaya yang bisa dibebankan akurat ke produk disebut <b>biaya langsung</b>, misalnya bahan mentah langsung dan buruh langsung. Klasifikasi ini <b>nggak cuma biaya produksi</b>: biaya umum, administrasi, dan penjualan yang bisa ditelusuri akurat ke produk juga masuk biaya langsung.",
"Biaya yang nggak bisa dibebankan akurat (biaya tidak langsung) justru makin banyak. Di ABC, pembebanannya <b>dua tahap</b>:@@<b>Tahap 1:</b> biaya per akun dikonversi jadi <b>biaya aktivitas</b>@@<b>Tahap 2:</b> biaya aktivitas dibebankan ke produk||gaji dan listrik dikumpulin dulu jadi 'biaya aktivitas packing', baru dibagi ke tiap produk sesuai berapa kali produknya di-packing."],

"Selama ini overhead dibebankan pakai <b>jam mesin</b>, tapi direksi merasa banyak angka yang nggak masuk akal, jadi mereka mau coba ABC yang disederhanakan.",
"Langkah awal: <b>inventarisasi aktivitas</b>. Ada lima aktivitas utama:@@Perencanaan produksi@@Pengambilan bahan mentah dari gudang@@Set-up mesin@@Produksi es krim@@Administrasi produk||kayak bikin daftar 'kerjaan dapur': belanja, siapin alat, masak, packing, bikin nota.",

"##T|Tabel 2.3: Rasio Pembebanan Biaya ke Aktivitas|~Perencanaan Produksi~Pengambilan Bahan Mentah~Set-Up Mesin~Produksi Es Krim~Administrasi Produksi|Buruh tidak langsung~10%~30%~30%~10%~20%|Bahan mentah tidak langsung~-~-~20%~80%~-|Listrik~5%~-~40%~50%~5%|Penyusutan gedung pabrik~10%~10%~30%~30%~20%|Penyusutan mesin~-~-~50%~50%~0",

"<b>Tahap 2:</b> biaya aktivitas dibebankan ke produk pakai <b>pemicu aktivitas (activity driver)</b>: jumlah batch produksi, jumlah pengambilan, waktu set-up, menit mesin, dan jumlah jenis produk (Tabel 2.5).||tarif set-up Rp452.000 per jam dikali jam set-up tiap rasa: rasa yang sering ganti resep otomatis kena lebih besar.",
"##T|Tabel 2.5: Dasar Pembebanan Biaya Aktivitas ke Produk|Aktivitas~Pemicu Aktivitas~Vanilla~Strawberry~Durian|Volume produksi~-~10.000 liter~6.000 liter~2.000 liter|Perencanaan produksi~Jumlah batch produksi~200 batch~150 batch~100 batch|Pengambilan bahan mentah~Jumlah pengambilan~300 kali~300 kali~200 kali|Set-up mesin~Waktu set-up~0,5 jam per batch~1 jam per batch~2 jam per batch|Produksi es krim~Menit mesin~2 menit per liter~2 menit per liter~2 menit per liter|Administrasi produk~Jumlah jenis produk~1 jenis~1 jenis~1 jenis",
"<b>Hasil ABC (Tabel 2.6):</b> penjualan total Rp1.110 juta, biaya produksi Rp920 juta, laba kotor Rp190 juta.@@Vanilla: laba kotor Rp169,2 juta, marjin <b>30,76%</b>@@Strawberry: laba kotor Rp71,2 juta, marjin <b>19,78%</b>@@Durian: <b>rugi</b> Rp50,4 juta, marjin <b>-25,20%</b>@@Total marjin 17,12%",

"##T|Tabel 2.7: Hasil Pembebanan Biaya Secara Tradisional (Jam Mesin)|~Vanilla~Strawberry~Durian~Total|*Penjualan~550.000.000~360.000.000~200.000.000~1.110.000.000|Bahan baku langsung~100.000.000~72.000.000~30.000.000~202.000.000|Buruh langsung~30.000.000~18.000.000~60.000.000~108.000.000|Overhead pabrik~338.888.889~203.333.333~67.777.778~610.000.000|*Total biaya produksi~468.888.889~293.333.333~157.777.778~920.000.000|*Laba kotor~81.111.111~66.666.667~42.222.222~190.000.000|*Marjin laba kotor~14,75%~18,52%~21,11%~17,12%",
"Hasilnya <b>kebalik total</b>: vanilla yang paling untung menurut ABC malah kelihatan paling kurang untung, dan durian yang rugi menurut ABC malah kelihatan paling untung.||kayak toko yang kira-kira ngira menu mahal itu paling laku padahal tiap hari nombok; baru ketahuan setelah dihitung per menu. Pertanyaannya: kenapa bisa beda? Dijawab di 2.3."],
"2.3":[
"Di ABC, aktivitas dibagi <b>empat tingkatan</b>:@@<b>Unit level:</b> makin banyak unit dibuat, makin sering dilakukan (contoh: memproduksi es krim)@@<b>Batch level:</b> tergantung <b>jumlah batch</b>, bukan jumlah unit (contoh: perencanaan produksi)@@<b>Product level:</b> makin banyak <b>jenis produk</b>, makin sering dilakukan (contoh: riset dan pengembangan)@@<b>Facility level:</b> untuk perusahaan secara keseluruhan, nggak terkait produk (contoh: pemeliharaan keamanan)||unit: makin banyak kue, makin banyak telur; batch: setiap ganti adonan harus cuci loyang, mau 10 atau 1.000 kue; product: tambah varian rasa, tambah riset resep; facility: satpam toko, sama aja mau jual 1 atau 1.000 kue.",
"Soal <b>batch level</b>: produk A 10.000 unit dengan 2.500 unit per batch = perencanaan dilakukan 4 kali. Produk B 5.000 unit dengan 500 unit per batch = 10 kali. Walau volume A lebih besar, biaya perencanaan produksi B <b>seharusnya lebih tinggi</b>.||toko yang bikin 1 adonan besar vs toko yang bikin 10 adonan kecil: yang kedua lebih sering nyiapin alat.",
"Biaya <b>facility level</b> nggak bisa dibebankan ke produk, kecuali secara <b>arbitrer</b> (sekenanya).",
"Dasar pembebanan <b>tradisional</b>:@@Unit produksi@@Jam buruh langsung@@Biaya buruh langsung@@Jam mesin@@Biaya bahan mentah langsung",
"Semua dasar itu cuma <b>tingkat unit</b>, jadi produk bervolume besar kebagian overhead besar dan yang bervolume kecil kebagian kecil.",
"Di contoh: <b>vanilla</b> volumenya paling besar, jam mesinnya paling banyak, jadi overhead-nya paling besar dan marjinnya kelihatan rendah. <b>Durian</b> volumenya paling kecil, overhead-nya paling kecil, marjinnya kelihatan tinggi. Padahal durian lebih banyak makan aktivitas batch dan set-up.||seperti patungan makan: yang makan paling banyak otomatis disuruh bayar paling banyak, walau yang pesan menu mahal dan ribet itu orang lain."],
"2.4":[
"Setelah tahu kondisi sebenarnya, langkah berikutnya memperbaiki profitabilitas. Menurut <b>Cooper dan Kaplan (1999)</b> ada tujuh hal yang bisa dilakukan:",
"<b>1. Reprice products (sesuaikan harga):</b> untuk produk yang merugi, harga dinaikkan. Biasanya hanya bisa kalau produknya unik dan persaingannya rendah. Kadang harga justru diturunkan biar volume naik, kalau kurva permintaannya elastis.||produk langka bisa naik harga tanpa kehilangan pembeli; produk yang banyak saingannya malah sepi kalau naik.",
"<b>2. Substitute products (produk substitusi):</b> pelanggan yang minta produk non-standar bikin aktivitas dan biaya tambahan. Pelanggan dibujuk beli produk standar, atau pesanan khusus dikenai <b>tambahan biaya</b>.||minta kue custom dengan desain rumit dikenai biaya tambahan.",
"<b>3. Redesign products (rancang ulang):</b> rancangan yang buruk bikin produksi nggak efisien, jadi dirancang ulang supaya lebih mudah dan efisien.",
"<b>4. Improve production processes (perbaiki proses produksi):</b> terutama kalau persaingan ketat dan kekuatan pembeli (buyer power) lebih besar dari penjual, sehingga sulit menaikkan harga.",
"<b>5. Change operating and strategic policies (ubah kebijakan):</b> ABC menunjukkan konsep <b>JIT</b> bisa jadi bumerang. JIT mau persediaan seminimal mungkin dan produksi berdasarkan permintaan (pull system), jadi batch makin kecil, aktivitas batch makin sering, dan biaya justru naik.||bikin roti sedikit-sedikit tiap ada pesanan memang hemat stok, tapi tiap kali harus siapin dan bersihin alat dari awal.",
"<b>6. Invest in flexible technology (teknologi fleksibel):</b> investasi di teknologi yang bikin aktivitas tingkat batch lebih efisien, misalnya mesin yang mempercepat set-up, supaya batch kecil nggak bikin biaya set-up besar.",
"<b>7. Eliminate products (hentikan produk):</b> langkah terakhir kalau semua cara gagal. Sering ditentang bagian pemasaran karena sebagian pelanggan bisa berhenti beli produk lain juga, jadi pemasaran perlu mengelola produk yang untung maupun tidak demi laba keseluruhan."],
"2.5":[
"<b>Kelemahan ABC:</b> model ini cuma menggambarkan kondisi yang akurat <b>saat ini</b>, tapi nggak bisa melihat dampak efisiensi. Menghilangkan sebagian aktivitas belum tentu menghilangkan biayanya: <b>biaya tetap nggak serta merta hilang</b>, yang bisa hilang cuma biaya tidak tetap. Makanya dikembangkan ABC yang memisahkan biaya tetap dan tidak tetap.",
"Biaya menurut perilakunya:@@<b>Biaya fleksibel (flexible costs):</b> naik-turun sesuai jumlah aktivitas; kalau aktivitas ditiadakan, biayanya otomatis hilang@@<b>Biaya tetap (committed costs):</b> muncul karena komitmen terhadap sumber daya untuk jangka waktu tertentu dan sulit dibatalkan (gaji pegawai tetap, penyusutan, sewa, PBB); kalau aktivitas dihentikan, jadi beban <b>kapasitas menganggur</b>||bahan baku itu fleksibel (nggak produksi, nggak beli); sewa ruko itu committed (tetap bayar walau tutup).",
"Biaya committed dibebankan berdasarkan <b>kapasitas</b>:@@<b>Kapasitas teoritis:</b> kapasitas maksimal, misalnya pegawai dibayar 8 jam per hari@@<b>Kapasitas praktikal:</b> teoritis dikurangi waktu tidak produktif (istirahat, minum, ngobrol); kalau 2 jam, praktikalnya 6 jam per hari. ABC biasanya memakai kapasitas praktikal||mesin kopi di kafe: teoritis 24 jam, praktikalnya cuma jam buka dikurangi waktu perawatan.",
"<b>Contoh hitungan:</b> 5 orang melakukan aktivitas pengambilan bahan mentah. Kapasitas praktikal sebulan = 5 orang x 6 jam x 5 hari x 4 minggu x 60 menit = <b>36.000 menit</b>. Driver diubah jadi waktu: 30 menit per pengambilan, jadi vanilla 9.000 menit, strawberry 9.000 menit, durian 6.000 menit (total 24.000 menit).",
"<b>Tabel 2.8:</b> tarif per driver pakai kapasitas praktikal. Biaya Rp72.000.000 dibagi 36.000 menit = <b>Rp2.000 per menit</b>. Dibebankan: vanilla Rp18 juta, strawberry Rp18 juta, durian Rp12 juta.",
"##T|Tabel 2.8: Perhitungan Tarif per Driver dengan Kapasitas Praktikal|~Perencanaan Produksi~Pengambilan Bahan Mentah~Set-Up Mesin~Produksi Es Krim~Administrasi Produksi|Buruh tidak langsung~24.000.000~72.000.000~72.000.000~24.000.000~48.000.000|Bahan mentah tidak langsung~-~-~10.000.000~40.000.000~-|Listrik~4.000.000~-~32.000.000~40.000.000~4.000.000|Penyusutan gedung pabrik~8.000.000~-~12.000.000~12.000.000~8.000.000|Penyusutan mesin~-~-~100.000.000~100.000.000~-|*Total~36.000.000~72.000.000~226.000.000~216.000.000~60.000.000|Jumlah driver~450~36.000~500~600~3|*Tarif per driver (IDR)~80.000~2.000~452.000~360.000~20.000.000",
"Ada <b>12.000 menit nganggur</b>, biayanya <b>Rp24 juta</b> dicatat sebagai <b>biaya kapasitas menganggur</b>. Biaya ini <b>nggak dibebankan ke produk</b>, tapi jadi tanggungan perusahaan secara keseluruhan.||jam kosong kasir nggak dibebankan ke harga kopi tertentu; itu 'ongkos nganggur' toko.",
"<b>Hasil (Tabel 2.9):</b> marjin vanilla <b>32,40%</b>, strawberry <b>22,28%</b>, durian <b>-22,20%</b>. Total laba kotor Rp190 juta, marjin 17,12%.",
"##T|Tabel 2.9: Profitabilitas Produk Model Time Driven ABC|~Vanilla~Strawberry~Durian~Total|*Penjualan~550.000.000~360.000.000~200.000.000~1.110.000.000|Bahan baku langsung~100.000.000~72.000.000~30.000.000~202.000.000|Buruh langsung~30.000.000~18.000.000~60.000.000~108.000.000|Perencanaan produksi~16.000.000~12.000.000~8.000.000~36.000.000|Pengambilan bahan mentah~18.000.000~18.000.000~12.000.000~48.000.000|Set-up mesin~67.800.000~67.800.000~90.400.000~226.000.000|Produksi es krim~120.000.000~72.000.000~24.000.000~216.000.000|Administrasi produk~20.000.000~20.000.000~20.000.000~60.000.000|Kapasitas menganggur (orang)~-~-~-~24.000.000|*Total biaya produksi~371.800.000~279.800.000~244.400.000~920.000.000|*Laba kotor~178.200.000~80.200.000~(44.400.000)~190.000.000|*Marjin laba kotor~32,40%~22,28%~-22,20%~17,12%",
"<b>Efisiensi belum tentu nambah laba.</b> Kalau pengambilan bahan mentah vanilla dikurangi dari 9.000 jadi 7.500 menit, biaya vanilla turun Rp18 juta jadi Rp15 juta. Tapi laba total <b>nggak naik</b>, karena biayanya cuma pindah jadi kapasitas menganggur (naik Rp3 juta jadi Rp27 juta). Laba baru naik kalau perusahaan melakukan salah satu atau kedua hal ini:@@<b>Mengurangi sumber daya:</b> misal memberhentikan satu orang (kapasitas praktikal satu orang 7.200 menit, kapasitas menganggur sudah 13.500 menit); biaya turun Rp14.400.000 (Rp72.000.000 dibagi 5 orang)@@<b>Menaikkan volume penjualan</b> dengan sumber daya yang sama, jadi pendapatan naik dan kapasitas menganggur terpakai||kasir jadi lebih cepat melayani nggak bikin gaji turun; untung baru naik kalau kasirnya dikurangi atau antrean pelanggannya ditambah.",
"<b>Tabel 2.10 (setelah efisiensi):</b> biaya pengambilan bahan mentah turun jadi Rp45 juta, kapasitas menganggur naik jadi Rp27 juta, total laba kotor tetap Rp190 juta.",
"##T|Tabel 2.10: Profitabilitas Produk Setelah Efisiensi|~Vanilla~Strawberry~Durian~Total|*Penjualan~550.000.000~360.000.000~200.000.000~1.110.000.000|Bahan baku langsung~100.000.000~72.000.000~30.000.000~202.000.000|Buruh langsung~30.000.000~18.000.000~60.000.000~108.000.000|Perencanaan produksi~16.000.000~12.000.000~8.000.000~36.000.000|Pengambilan bahan mentah~15.000.000~18.000.000~12.000.000~45.000.000|Set-up mesin~67.800.000~67.800.000~90.400.000~226.000.000|Produksi es krim~120.000.000~72.000.000~24.000.000~216.000.000|Administrasi produk~20.000.000~20.000.000~20.000.000~60.000.000|Kapasitas menganggur (orang)~-~-~-~27.000.000|*Total biaya produksi~368.800.000~279.800.000~244.400.000~920.000.000|*Laba kotor~181.200.000~80.200.000~(44.400.000)~190.000.000|*Marjin laba kotor~32,95%~22,28%~-22,20%~17,12%"],
"2.6":[
"Model ABC ketiga adalah <b>persamaan waktu (time equation)</b>. Dipakai buat perusahaan yang aktivitasnya <b>amat beragam</b> dan sulit disederhanakan. Semua aktivitas diringkas dalam bentuk <b>persamaan</b> biar lebih gampang dikelola.",
"Contoh: aktivitas <b>menerima pesanan pelanggan</b> punya sub aktivitas yang bervariasi:@@Diterima lewat telpon, fax, atau email@@Untuk satu jenis atau beberapa jenis produk@@Untuk dalam kota, luar kota, atau luar negeri",
"Persamaan waktunya: penerimaan pesanan = 4 + 5 (kalau telpon) + 3 (kalau fax) + 3 (per setiap jenis produk) + 5 (dalam kota) + 8 (luar kota) + 15 (luar negeri). Angka-angkanya adalah <b>waktu yang dibutuhkan (menit)</b>.||kayak rumus ongkir: tarif dasar ditambah biaya per kg, ditambah biaya zona kota.",
"Contoh hitung: pesanan lewat telpon, dua jenis produk, dikirim ke luar kota = 4 + 5 + (3 x 2) + 8 = <b>23 menit</b>. Angka ini dikali <b>tarif sumber daya berdasarkan kapasitas praktikal</b> untuk dapat biaya penerimaan pesanan tersebut."],
"2.7":[
"Konsep ABC sebenarnya sangat cocok buat <b>perusahaan jasa</b>, terbukti dari banyaknya artikel penerapannya, terutama di <b>rumah sakit dan bank</b>.",
"Alasannya: di industri jasa, sebagian besar biaya adalah <b>biaya tidak langsung</b>.||rumah sakit: gaji dokter, listrik ruang operasi, dan alat medis sulit ditelusuri ke satu pasien.",
"<b>Time driven ABC</b> juga pas di industri jasa seperti bank. Bank biasanya sudah punya hitungan waktu melayani nasabah, misalnya lama <i>customer service</i> membuka rekening baru, atau lama kasir melayani setor dan tarik uang. Waktu itu dijadikan dasar <b>persamaan waktu</b> untuk membebankan biaya.||buka rekening baru 15 menit, setor tunai 5 menit: biaya layanan dihitung dari menitnya dikali tarif per menit."]
});

"3.1":["Setelah punya sistem <b>ABC</b> yang ngasih gambaran akurat soal profitabilitas produk atau pelanggan, pertanyaannya: <b>info itu mau diapain?</b> Menurut <b>Cooper dan Kaplan (1999)</b>, info ABC bisa dipakai buat dua hal:@@<b>Operating activity based management:</b> nunjukin aktivitas mana yang dikerjakan <b>nggak efisien</b>, bikin biaya tinggi, dan akhirnya menggerus profitabilitas produk atau pelanggan. Dari situ perusahaan bisa bertindak, jadi operasionalnya lebih efisien dan laba naik@@<b>Strategic activity based management:</b> info ABC dipakai buat <b>keputusan stratejik</b>. Karena tahu produk atau pelanggan mana yang untung dan mana yang rugi, perusahaan bisa ambil tindakan yang lebih tepat||ABC itu kayak hasil rontgen: operating ABM = 'obatin bagian yang sakit', strategic ABM = 'putusin pasien ini mau terus dirawat atau nggak'.","Contoh tindakan terhadap produk sudah dibahas di modul ABC, sedangkan analisis ABC untuk pelanggan nanti dibahas di modul <i>strategic activity based management</i> untuk pelanggan."],
"3.2":["Fokus bab ini adalah <b>operating activity based management</b>. Beda ABC dan ABM terlihat di <b>Gambar 3.1</b> (di teks modul ditulis 'gambar 1'):@@<b>Vertical view (ABC):</b> dimensi biaya, <i>Resources</i> \u2192 <i>Activities</i> \u2192 <i>Cost Objects</i>; biaya dibebankan ke aktivitas dulu, baru ke objek biaya@@<b>Horizontal view (ABM):</b> dimensi proses, <i>Driver Analysis</i> (Why?) \u2013 <i>Activities</i> (What?) \u2013 <i>Performance Measures</i> (How Well?); tujuannya <b>memperbaiki aktivitas</b> biar lebih efisien||ABC nanya 'duit habis ke mana?' (vertikal), ABM nanya 'kenapa kerjanya begini dan seberapa bagus hasilnya?' (horizontal).","##F|Gambar 3.1|Konsep Activity Based Costing|abm","Buat ABM, model ABC yang dipakai harus <b>memisahkan biaya fleksibel dan biaya committed</b>. Kalau nggak dipisah, dampak efisiensi susah dipantau, karena nggak semua biaya otomatis hilang meski aktivitasnya dihapus. Yang hilang cuma biaya <b>fleksibel</b>; biaya <b>committed</b> nggak otomatis hilang.||aktivitas 'cuci piring' dihapus: sabunnya nggak kepakai lagi (fleksibel), tapi gaji pegawai tetap dan sewa dapur tetap harus dibayar (committed).","Di ABC aktivitas dibagi empat tingkatan (unit, batch, product, facility). Di ABM, aktivitas biasanya dibagi jadi <b>dua kelompok besar</b>:@@<b>Value added activities:</b> bernilai tambah di mata konsumen, jadi konsumen mau bayar lebih. Sebagian besar aktivitas produksi (memotong kayu, merakit kursi) masuk sini, karena konsumen merasa nggak bisa mengerjakannya sendiri@@<b>Non value added activities:</b> konsumen nggak mau bayar untuk ini, jadi biayanya harus <b>ditekan bahkan dihilangkan</b>||pembeli kursi mau bayar buat potong kayu dan merakit kursi, tapi nggak mau bayar 'rakit ulang karena salah pasang'.","Tiga contoh aktivitas <b>non value added</b>:@@<b>Pengerjaan ulang (rework):</b> bikin aktivitas dikerjakan dua kali untuk produk yang sama, karena yang pertama nggak sesuai spesifikasi. Pembeli nggak peduli ada rework atau nggak, yang penting produknya baik dan berfungsi. Dari sinilah muncul gugus kendali mutu (<i>Total Quality Management</i>) ala perusahaan Jepang buat bikin barang tanpa cacat (<i>zero defect</i>)@@<b>Pemeriksaan atau inspeksi:</b> kalau seleksi pemasok bagus, bahan baku selalu sesuai spesifikasi, jadi inspeksi bahan mentah nggak perlu. Kalau sistem produksinya zero defect, inspeksi barang jadi juga nggak perlu@@<b>Penyimpanan:</b> sewa atau penyusutan gudang, gaji orang gudang, dan sejenisnya. Salah satu tujuan <b>JIT</b> adalah menghapus persediaan; kalau JIT sempurna, persediaan bisa diminimalkan bahkan hilang||penjahit salah jahit lengan lalu menjahit ulang: pelanggan nggak mau bayar ekstra untuk jahitan kedua. Begitu juga ongkos periksa berkali-kali dan ongkos sewa gudang.","Masih banyak aktivitas non value added selain tiga contoh itu, dan sasaran utamanya satu: <b>dihilangkan</b>.","Tapi kalau aktivitas cuma dibagi dua (value added vs non value added), gimana nasib aktivitas <b>menyusun laporan keuangan</b>? Di mata pelanggan nggak menambah nilai sehingga 'harus dihapus', padahal perusahaan <b>wajib</b> melakukannya karena berguna bagi perusahaan. Contoh lain: pemeliharaan mesin dan perhitungan pajak penghasilan. Makanya aktivitas yang menambah nilai sebaiknya dipisah lagi jadi dua:@@Menambah nilai bagi <b>pembeli/pelanggan</b>@@Menambah nilai bagi <b>perusahaan</b>||pelanggan kafe nggak peduli kafe bikin laporan pajak, tapi kafe tetap harus bikin supaya nggak kena denda."],
"3.3":["Di ABM, efisiensi aktivitas bisa dilakukan lewat <b>empat cara</b>: penghilangan aktivitas (<i>activity elimination</i>), pengurangan aktivitas (<i>activity reduction</i>), pemilihan aktivitas (<i>activity selection</i>), dan <i>activity sharing</i>. Di daftar modul urutannya elimination, reduction, selection, sharing, tapi penjelasannya pakai urutan elimination, reduction, sharing, selection (cuma beda urutan, isinya sama).","<b>1. Activity elimination:</b> tujuan utamanya menghilangkan aktivitas, dengan harapan biaya aktivitas itu ikut hilang. Sasaran utamanya aktivitas yang <b>nggak menambah nilai</b>, baik bagi pelanggan maupun bagi perusahaan.||berhenti mencetak laporan fisik yang nggak pernah dibaca siapa pun.","<b>2. Activity reduction:</b> untuk aktivitas yang nggak bisa dihapus total, hasilkan output yang sama dengan <b>aktivitas yang lebih sedikit</b>. Salah satu caranya: perbanyak unit dalam satu <b>batch</b>. Contoh pembelian bahan mentah 10.000 kg:@@Sekali pesan 2.000 kg: butuh <b>5 batch</b> pembelian@@Sekali pesan 2.500 kg: cuma <b>4 batch</b>||belanja bulanan sekali jalan lebih hemat tenaga daripada bolak-balik tiap hari beli sedikit.","<b>3. Activity sharing:</b> tujuannya mengurangi <b>kapasitas menganggur</b>; sumber daya dipakai untuk lebih dari satu aktivitas. Contoh: dua orang, satu menerima bahan mentah dan satu memeriksa bahan mentah, masing-masing cuma terpakai <b>50%</b>. Kalau digabung, <b>satu orang</b> bisa mengerjakan keduanya, jadi kapasitas menganggur berkurang.||kasir yang lagi sepi pembeli sekalian merangkap jaga etalase.","<b>4. Activity selection:</b> perusahaan memilih alternatif aktivitas yang <b>lebih murah</b>, misalnya memilih antara produksi sendiri atau <i>outsourcing</i>.||bikin kemasan sendiri atau pesan ke vendor: pilih yang total biayanya lebih rendah.","Semua cara ini <b>jangan dilakukan terisolasi</b>, karena perubahan satu aktivitas bisa memengaruhi biaya aktivitas lain. Contoh: batch pembelian diperbesar, aktivitas pembelian berkurang, tapi bahan mentah per batch makin banyak, jadi aktivitas <b>penyimpanan</b> kemungkinan besar naik. Intinya, lihat dampak biaya untuk <b>seluruh aktivitas</b>.||borong beras sekarung bikin ongkos belanja turun, tapi butuh tempat simpan yang lebih besar.","Setelah efisiensi dijalankan, perlu <b>tolok ukur</b> buat memantau kemajuannya, dan sebaiknya dilihat dari <b>tiga sisi: biaya, waktu, dan kualitas</b>. Contoh: aktivitas penyusunan laporan keuangan dikurangi dari <b>7 orang jadi 3 orang</b>. Biaya pasti turun, tapi bisa berdampak negatif pada:@@<b>Waktu</b> penyelesaian laporan@@<b>Kualitas</b> laporan (misalnya makin banyak salah jurnal)||tim dapur dipangkas dari 7 jadi 3 orang: gaji turun, tapi pesanan makin lama keluar dan salah masak makin sering. Jadi biaya, waktu, dan kualitas dipantau bareng.","Perhitungan, analisis, dan cara menghitung biaya aktivitas yang menambah nilai dan yang tidak ada di buku <i>Cost Management</i> karangan Guan, Hansen, dan Mowen, halaman <b>434 sampai 442</b>."],
"3.4":["Salah satu penerapan konkret operating ABM adalah <b>biaya kualitas (cost of quality)</b>, yang disarankan untuk perusahaan yang menjalankan program <b>gugus kendali mutu (GKM)</b>. Tujuan GKM: menghasilkan barang <b>berkualitas</b>, artinya sesuai spesifikasi, lewat konsep <b>zero defect</b>.","Kenapa GKM bisa menaikkan laba?@@Kalau produksi <i>zero defect</i>, banyak biaya yang nggak bernilai tambah bisa dihilangkan, jadi biaya turun dan laba naik@@Barang berkualitas bikin konsumen puas, ujungnya pendapatan dan laba naik||toko yang barangnya nyaris nggak pernah cacat nggak repot tukar-tambah atau ganti rugi, dan pelanggannya balik lagi.","<b>Biaya kualitas</b> dipakai buat memonitor program GKM secara <b>finansial</b>. Tanpa biaya kualitas, keberhasilan GKM cuma bisa dilihat dari dua sisi (<b>waktu</b> dan <b>kualitas</b>). Dengan biaya kualitas jadi lengkap tiga sisi: <b>biaya, waktu, dan kualitas</b>.","Biaya kualitas dibagi <b>empat</b>:@@<b>Biaya pencegahan (prevention costs)</b>@@<b>Biaya pemeriksaan (appraisal costs)</b>@@<b>Biaya kegagalan internal (internal failure costs)</b>@@<b>Biaya kegagalan eksternal (external failure costs)</b>","Pengelompokannya: pencegahan + pemeriksaan = <b>biaya pengendalian (control costs)</b>; kegagalan internal + eksternal = <b>biaya kegagalan (failure costs)</b>.||control costs = 'ongkos biar nggak rusak', failure costs = 'ongkos kalau sudah rusak'.","<b>Prevention costs:</b> biaya biar perusahaan <b>nggak memproduksi</b> barang yang nggak sesuai spesifikasi. Contoh: pelatihan karyawan, beli mesin yang lebih handal, perawatan berkala yang konsisten.||melatih barista dan servis rutin mesin kopi supaya kopi nggak pernah salah takaran.","<b>Appraisal costs:</b> biaya biar barang yang <b>sudah terlanjur</b> nggak sesuai spesifikasi nggak diproses lebih lanjut. Contoh: pemeriksaan bahan mentah, supaya bahan yang nggak sesuai nggak dipakai produksi (kalau dipakai, outputnya pasti buruk). Hampir semua bentuk inspeksi masuk sini.||ngecek biji kopi yang datang dari pemasok sebelum digiling.","<b>Internal failure costs:</b> biaya yang terpaksa keluar karena barang nggak sesuai spesifikasi, tapi ketahuan <b>sebelum</b> sampai ke konsumen. Contoh: <b>rework</b> biar bisa dijual dengan harga normal, dan <b>inspeksi ulang</b>. Inspeksi ulang <b>nggak</b> dimasukkan ke appraisal costs karena terjadi gara-gara produksi awalnya nggak sesuai spesifikasi.||kue gosong ketahuan di dapur, lalu dipanggang ulang sebelum diantar ke pelanggan.","<b>External failure costs:</b> konsepnya sama dengan kegagalan internal, bedanya barang baru ketahuan nggak sesuai <b>setelah</b> sampai di tangan konsumen akhir. Contoh: biaya menangani keluhan pelanggan dan biaya garansi.||kue basi baru ketahuan setelah dimakan pelanggan, jadi toko harus ganti rugi dan minta maaf.","Cara memonitor biaya kualitas: bandingkan <b>rasio</b> dari periode ke periode. Lima rasionya:@@Total biaya kualitas / penjualan@@Biaya pencegahan / penjualan@@Biaya pemeriksaan / penjualan@@Biaya kegagalan internal / penjualan@@Biaya kegagalan eksternal / penjualan","<b>Prioritas jangka pendek</b> GKM: menurunkan rasio <b>biaya kegagalan eksternal / penjualan</b>. Rasio ini nggak boleh naik dan harus terus turun. Alasannya: barang cacat yang sampai ke konsumen bikin konsumen kecewa, lalu menurunkan penjualan masa depan, karena bukan cuma dia yang nggak beli lagi, tapi juga orang lain yang dengar ceritanya.||ulasan jelek satu pelanggan bisa bikin banyak calon pembeli batal mampir.","<b>Perjalanan rasio di awal GKM:</b>@@Rasio <b>pencegahan</b> biasanya <b>naik</b>, karena perlu investasi awal besar buat membangun sistem GKM; setelah beberapa periode turun dan stabil@@Rasio <b>pemeriksaan</b> juga biasanya <b>naik</b>, karena GKM butuh waktu buat berjalan baik, jadi persentase barang yang diinspeksi dinaikkan biar barang cacat nggak sampai ke konsumen@@Rasio <b>kegagalan internal</b> ikut <b>naik</b> di awal. Kalau GKM belum jalan, inspeksi yang naik cuma menggeser biaya dari kegagalan eksternal ke internal, jadi total biaya kegagalan belum banyak berubah||baru pasang CCTV dan nambah petugas cek: pengeluaran naik dulu, dan temuan barang cacat di dalam toko juga ikut naik.","<b>Kalau GKM sudah berjalan baik:</b> barang yang nggak sesuai spesifikasi makin sedikit, terlihat dari biaya kegagalan internal dan eksternal yang terus turun, jadi biaya pemeriksaan juga bisa diturunkan. Di kondisi <b>zero defect yang sempurna</b>, perusahaan sama sekali nggak mengeluarkan biaya pemeriksaan, kegagalan internal, maupun kegagalan eksternal, karena ketiganya berasal dari aktivitas yang nggak bernilai tambah. Pada akhirnya biaya kualitas <b>cuma biaya pencegahan</b>."],
"3.5":["Di dalam biaya kegagalan <b>eksternal maupun internal</b> ada biaya yang disebut <b>hidden quality costs</b> (biaya kualitas tersembunyi). Disebut tersembunyi karena <b>nggak kelihatan langsung</b> di catatan akuntansi dan harus <b>diukur khusus</b>. Contohnya: <b>penjualan yang hilang</b> gara-gara pelanggan kecewa menerima barang yang nggak sesuai spesifikasi. Besarnya untuk kegagalan eksternal sering <b>lebih tinggi</b> daripada yang dicatat perusahaan, jadi perlu cara menghitungnya, salah satunya <b>Taguchi quality loss function</b>.||di pembukuan tercatat biaya garansi Rp10 juta, tapi pelanggan yang kapok dan pindah ke toko lain nggak tercatat di mana pun, padahal kerugiannya bisa jauh lebih besar.","Konsep Taguchi: tiap <b>penyimpangan</b> dari spesifikasi bikin rugi, dan makin jauh penyimpangannya, kerugian naik secara <b>kuadratik</b> (bukan lurus).||ukuran sepatu meleset 1 nomor masih bisa dipakai, tapi meleset 3 nomor bukan cuma 3 kali lebih nggak nyaman, melainkan jauh lebih parah.","Contoh di modul: cincin berdiameter 1 cm:@@Penyimpangan 0,1 cm: rugi Rp5@@Penyimpangan 0,2 cm: rugi Rp25 (versi modul)@@Penyimpangan 0,3 cm: rugi Rp625 (versi modul)","<b>Catatan penting:</b> angka Rp25 dan Rp625 di modul <b>nggak konsisten</b> dengan fungsi kuadratik. Kalau rugi Rp5 pada penyimpangan 0,1 cm, maka k = 5 / 0,1\u00b2 = 500, sehingga penyimpangan 0,2 cm seharusnya Rp20 (500 \u00d7 0,2\u00b2) dan 0,3 cm seharusnya Rp45 (500 \u00d7 0,3\u00b2). Penyimpangan dua kali lipat = kerugian <b>empat kali</b> lipat, tiga kali lipat = <b>sembilan kali</b> lipat. Buat soal hitungan, pakai rumusnya.","Rumus Taguchi: <b>L(y) = k (y \u2212 T)\u00b2</b>, dengan:@@<b>k</b> = konstanta yang tergantung struktur biaya kegagalan eksternal perusahaan@@<b>y</b> = nilai aktual karakteristik yang diobservasi@@<b>T</b> = target nilai@@<b>L</b> = kerugian karena kualitas","Konstanta k: <b>k = c / d\u00b2</b>, dengan:@@<b>c</b> = kerugian yang dialami perusahaan pada <i>lower</i> atau <i>upper specification limit</i>@@<b>d</b> = jarak dari batasan (limit) ke target||target diameter 1 cm, batas atas 1,1 cm, rugi di batas Rp5: c = 5, d = 0,1, k = 5 / 0,01 = 500. Kalau diameter aktual 1,05 cm: L = 500 \u00d7 (0,05)\u00b2 = Rp1,25.","Penerapan biaya kualitas jadi lebih mudah kalau perusahaan sudah punya sistem <b>ABC</b>. Soalnya penggolongan berdasar <i>charts of account</i> menyulitkan pengelompokan ke empat biaya kualitas. Contoh: di chart of accounts ada <b>biaya gaji</b>, tapi untuk analisis biaya kualitas gaji itu harus dibebankan ke <b>aktivitas</b>. Setelah biaya tiap aktivitas diketahui, baru bisa digolongkan ke pencegahan, pemeriksaan, kegagalan internal, atau kegagalan eksternal.||gaji di buku besar cuma satu angka; ABC memecahnya: sekian untuk pelatihan (pencegahan), sekian untuk inspeksi (pemeriksaan), sekian untuk rework (kegagalan internal).","Kesimpulannya: salah satu penerapan konkret <b>operating ABM</b> adalah model biaya kualitas ini."],
"3.6":["Konsep efisiensi lain yang belakangan muncul adalah <b>lean production</b>, sering disebut <b>Toyota Production System (TPS)</b> karena Toyota yang mempeloporinya. Dari model ini berkembang konsep baru: <b>lean accounting</b>.","Tujuan lean: bikin perusahaan jadi <b>'kurus'</b> dengan membuang semua aktivitas dan biaya yang <b>nggak bernilai tambah</b>. Ada <b>tujuh pemborosan</b> yang harus dihilangkan:@@Kelebihan produksi (<i>over production</i>)@@Persediaan (<i>inventory</i>)@@<i>Motion</i>@@<i>Material movement</i>@@<i>Correction</i>, termasuk pengerjaan ulang (<i>rework</i>)@@<i>Over processing</i>@@<i>Waiting</i>||restoran: masak 100 porsi padahal yang pesan 60 (over production), bahan numpuk di gudang (inventory), koki bolak-balik ambil bahan (motion), bahan dipindah-pindah (material movement), masakan salah dimasak ulang (correction), bumbu diulek dua kali padahal sekali cukup (over processing), pelanggan nunggu lama (waiting).","Perusahaan lean biasanya diorganisasi berdasarkan <b>value stream</b>: seluruh aktivitas (yang menambah nilai maupun tidak) yang terkait satu produk atau kelompok produk, dari pengadaan bahan mentah, produksi, sampai ke tangan konsumen akhir. Biasanya satu value stream <b>cuma untuk satu produk</b>.||jalur lengkap 'dari kebun kopi sampai cangkir pelanggan' untuk satu menu.","Dari sisi akuntansi manajemen, value stream bikin perhitungan biaya per produk <b>lebih mudah</b>, karena semua biaya di value stream itu adalah <b>biaya langsung</b> produknya. Kalau nggak mungkin satu value stream per produk, dibuat satu value stream untuk beberapa produk yang aktivitasnya mirip. Kalau dalam satu value stream ada beberapa produk, alokasi biaya berdasar <b>ABC masih diperlukan</b>.","Value stream juga diharapkan <b>mempercepat pelaporan</b> (salah satu syarat sistem informasi akuntansi manajemen yang baik, kata modul pertama). Lean accounting menyarankan pelaporan dibagi <b>tiga</b>:@@<b>Sel produksi:</b> laporan kegiatan <b>tiap hari</b>, terutama informasi non keuangan@@<b>Laporan keuangan tiap value stream:</b> <b>per minggu</b>, bisa dilakukan karena cuma fokus ke produk atau kegiatan di value stream itu@@<b>Laporan keuangan pabrik keseluruhan:</b> <b>tiap bulan</b>||kayak kafe: tiap hari cek jumlah cangkir terjual (sel produksi), tiap minggu hitung untung-rugi menu kopi (value stream), tiap bulan laporan keuangan seluruh kafe (pabrik)."]
});

"2.1":{c:"Latar Belakang ABC",r:[{t:"Dasar",k:[{t:"Informasi akuntansi keuangan dan akuntansi manajemen memiliki karakteristik berbeda."},{t:"Karena itu informasinya harus dihasilkan dari dua sistem yang berbeda."},{t:"Contoh: rapor untuk orang tua murid (keuangan) dan catatan harian wali kelas (manajemen): sama-sama soal murid, tapi isi dan gunanya lain.",x:1}]}],l:[{t:"Solusi",k:[{t:"Salah satu model untuk mengembangkan sistem akuntansi manajemen adalah Activity Based Costing (ABC)."}]}]},
"2.2":{c:"Tradisional vs Activity Based Costing",r:[{t:"Tujuan ABC",k:[{t:"Membebankan biaya tidak langsung dengan lebih akurat."},{t:"Tidak memperbaiki pembebanan biaya langsung, karena sudah akurat."},{t:"Obyek biaya adalah tempat biaya dibebankan (produk atau pelanggan); di modul ini adalah produk."}]},{t:"Perbedaan alur (Gambar 2.1)",k:[{t:"Tradisional: biaya langsung dibebankan ke obyek biaya."},{t:"ABC: biaya dibebankan ke aktivitas dulu, baru ke obyek biaya."},{t:"Contoh: tradisional seperti membagi tagihan listrik langsung ke tiap kamar; ABC menghitung dulu siapa memakai AC dan mesin cuci, baru menagih sesuai pemakaian.",x:1}]}],l:[{t:"Biaya langsung pada model tradisional",k:[{t:"Biaya yang bisa dibebankan akurat ke produk, seperti bahan mentah langsung dan buruh langsung."},{t:"Tidak terbatas pada biaya produksi.",k:[{t:"Biaya umum, administrasi, dan penjualan yang bisa ditelusuri akurat ke produk juga termasuk biaya langsung."}]}]},{t:"Pembebanan biaya tidak langsung dengan ABC",k:[{t:"Tahap 1: biaya per akun dikonversi menjadi biaya aktivitas."},{t:"Tahap 2: biaya aktivitas dibebankan ke produk."},{t:"Contoh: gaji dan listrik dikumpulkan dulu menjadi biaya aktivitas packing, baru dibagi ke tiap produk sesuai seberapa sering produknya di-packing.",x:1}]}]},
"2.2.1":{c:"Ilustrasi Pembebanan Biaya dengan ABC (PT XYZ)",r:[{t:"Data PT XYZ",k:[{t:"Memproduksi tiga es krim: vanilla, strawberry, durian."},{t:"Harga jual per liter: Rp55.000, Rp60.000, Rp100.000 (Tabel 2.1)."},{t:"Bahan mentah langsung per liter: Rp10.000, Rp12.000, Rp15.000; buruh langsung Rp3.000 untuk ketiganya."},{t:"Overhead pabrik Rp610 juta (Tabel 2.2).",k:[{t:"Buruh tidak langsung Rp240 juta"},{t:"Bahan mentah tidak langsung Rp50 juta"},{t:"Listrik Rp80 juta"},{t:"Penyusutan gedung Rp40 juta"},{t:"Penyusutan mesin Rp200 juta"}]},{t:"Selama ini overhead dibebankan dengan jam mesin, tetapi direksi merasa banyak angka tidak masuk akal."}]},{t:"Lima aktivitas utama",k:[{t:"Perencanaan produksi"},{t:"Pengambilan bahan mentah dari gudang"},{t:"Set-up mesin"},{t:"Produksi es krim"},{t:"Administrasi produk"},{t:"Contoh: seperti daftar kerjaan dapur: belanja, siapkan alat, masak, packing, bikin nota.",x:1}]}],l:[{t:"Tahap 1: biaya ke aktivitas",k:[{t:"Semua biaya di buku besar dikonversi menjadi biaya aktivitas memakai driver yang paling tepat (Tabel 2.3)."},{t:"Listrik dibebankan berdasarkan luas ruangan yang dipakai aktivitas.",k:[{t:"Contoh: ruang set-up mesin lebih luas dan lebih banyak mesin, jadi kebagian listrik lebih banyak daripada ruang administrasi.",x:1}]},{t:"Tabel 2.4: biaya aktivitas, driver, tarif per driver.",k:[{t:"Perencanaan produksi: Rp36 juta, 450 driver, Rp80.000"},{t:"Pengambilan bahan mentah: Rp72 juta, 800 driver, Rp90.000"},{t:"Set-up mesin: Rp226 juta, 500 driver, Rp452.000"},{t:"Produksi es krim: Rp216 juta, 600 driver, Rp360.000"},{t:"Administrasi produk: Rp60 juta, 3 driver, Rp20.000.000"}]}]},{t:"Tahap 2: aktivitas ke produk",k:[{t:"Memakai pemicu aktivitas (activity driver): jumlah batch, jumlah pengambilan, waktu set-up, menit mesin, jumlah jenis produk (Tabel 2.5)."},{t:"Hasil (Tabel 2.6): penjualan Rp1.110 juta, biaya produksi Rp920 juta, laba kotor Rp190 juta.",k:[{t:"Vanilla: laba kotor Rp169,2 juta, marjin 30,76%"},{t:"Strawberry: laba kotor Rp71,2 juta, marjin 19,78%"},{t:"Durian: rugi Rp50,4 juta, marjin -25,20%"}]},{t:"Vanilla paling menguntungkan, durian merugi."}]}]},
"2.2.2":{c:"Ilustrasi Pembebanan Biaya Secara Tradisional",r:[{t:"Dasar pembebanan",k:[{t:"Overhead Rp610 juta dibebankan dengan dasar jam mesin."},{t:"Overhead pabrik (Tabel 2.7): vanilla Rp338.888.889, strawberry Rp203.333.333, durian Rp67.777.778."}]}],l:[{t:"Hasil tradisional",k:[{t:"Laba kotor: vanilla Rp81.111.111, strawberry Rp66.666.667, durian Rp42.222.222."},{t:"Marjin: vanilla 14,75%, strawberry 18,52%, durian 21,11%; total tetap 17,12%."}]},{t:"Perbandingan dengan ABC",k:[{t:"Hasilnya berbalik total.",k:[{t:"Vanilla yang paling untung menurut ABC terlihat paling rendah secara tradisional."},{t:"Durian yang rugi menurut ABC terlihat paling untung secara tradisional."}]},{t:"Contoh: seperti toko yang mengira menu mahal paling laku padahal tiap hari nombok, baru ketahuan setelah dihitung per menu.",x:1}]}]},
"2.3":{c:"Alasan Perbedaan Hasil Alokasi Tradisional dengan ABC",r:[{t:"Empat tingkat aktivitas dalam ABC",k:[{t:"Unit level: makin banyak unit, makin sering dilakukan.",k:[{t:"Contoh aktivitas: memproduksi es krim.",x:1}]},{t:"Batch level: tergantung jumlah batch, bukan jumlah unit.",k:[{t:"Contoh aktivitas: perencanaan produksi.",x:1}]},{t:"Product level: makin banyak jenis produk, makin sering dilakukan.",k:[{t:"Contoh aktivitas: riset dan pengembangan (Toyota dengan sedan dan MPV).",x:1}]},{t:"Facility level: untuk perusahaan secara keseluruhan, tidak terkait produk.",k:[{t:"Contoh aktivitas: pemeliharaan keamanan.",x:1},{t:"Biaya ini tidak bisa dibebankan ke produk kecuali secara arbitrer."}]}]},{t:"Contoh batch level",k:[{t:"Produk A: 10.000 unit, 2.500 unit per batch, perencanaan 4 kali."},{t:"Produk B: 5.000 unit, 500 unit per batch, perencanaan 10 kali."},{t:"Walau volume A lebih besar, biaya perencanaan produksi B seharusnya lebih tinggi."}],x:1}],l:[{t:"Dasar pembebanan tradisional",k:[{t:"Unit produksi"},{t:"Jam buruh langsung"},{t:"Biaya buruh langsung"},{t:"Jam mesin"},{t:"Biaya bahan mentah langsung"},{t:"Semuanya hanya tingkat unit."}]},{t:"Akibatnya",k:[{t:"Produk bervolume besar dibebani overhead besar, volume kecil dibebani kecil."},{t:"Vanilla: volume terbesar, jam mesin terbanyak, overhead terbesar, marjin terlihat rendah."},{t:"Durian: volume terkecil, overhead terkecil, marjin terlihat tinggi."},{t:"Contoh: seperti patungan makan: yang makan paling banyak disuruh bayar paling banyak, walau yang pesan menu mahal dan ribet orang lain.",x:1}]}]},
"2.4":{c:"Langkah-Langkah Perbaikan Profitabilitas Produk",r:[{t:"1. Reprice products",k:[{t:"Menyesuaikan harga untuk produk yang merugi."},{t:"Biasanya hanya bisa jika produk unik dan persaingan rendah."},{t:"Kadang harga diturunkan agar volume naik, bila permintaan elastis."},{t:"Contoh: produk langka bisa naik harga tanpa kehilangan pembeli; produk banyak saingan malah sepi kalau naik.",x:1}]},{t:"2. Substitute products",k:[{t:"Pelanggan yang meminta produk non-standar menimbulkan aktivitas dan biaya tambahan."},{t:"Pelanggan dibujuk membeli produk standar, atau pesanan khusus dikenai tambahan biaya."},{t:"Contoh: kue custom dengan desain rumit dikenai biaya tambahan.",x:1}]},{t:"3. Redesign products",k:[{t:"Rancangan produk yang buruk membuat produksi tidak efisien."},{t:"Produk dirancang ulang agar lebih mudah dan efisien."}]},{t:"4. Improve production processes",k:[{t:"Perlu terutama saat persaingan ketat dan kekuatan pembeli (buyer power) lebih besar."},{t:"Perusahaan sulit menaikkan harga, jadi memperbaiki proses produksi."}]}],l:[{t:"5. Change operating and strategic policies",k:[{t:"ABC menunjukkan konsep JIT bisa menjadi bumerang."},{t:"JIT: persediaan seminimal mungkin, produksi berdasarkan permintaan (pull system), batch kecil.",k:[{t:"Aktivitas tingkat batch makin sering, biaya justru naik."}]},{t:"Contoh: membuat roti sedikit-sedikit tiap ada pesanan hemat stok, tapi tiap kali harus menyiapkan dan membersihkan alat dari awal.",x:1}]},{t:"6. Invest in flexible technology",k:[{t:"Investasi pada teknologi yang membuat aktivitas tingkat batch lebih efisien."},{t:"Contoh: mesin yang mempercepat set-up, agar batch kecil tidak membuat biaya set-up besar.",x:1}]},{t:"7. Eliminate products",k:[{t:"Langkah terakhir bila semua cara gagal."},{t:"Sering ditentang bagian pemasaran karena pelanggan bisa berhenti membeli produk lain juga."},{t:"Pemasaran perlu mengelola produk menguntungkan maupun tidak demi laba keseluruhan."}]}]},
"2.5":{c:"ABC dengan Idle Capacity (Time Driven ABC)",r:[{t:"Kelemahan ABC",k:[{t:"Hanya menggambarkan kondisi yang akurat saat ini."},{t:"Tidak bisa melihat dampak efisiensi."},{t:"Menghilangkan aktivitas tidak otomatis menghilangkan biaya tetap, hanya biaya tidak tetap."}]},{t:"Perilaku biaya",k:[{t:"Biaya fleksibel (flexible costs): naik-turun sesuai aktivitas; hilang otomatis bila aktivitas ditiadakan."},{t:"Biaya tetap (committed costs): muncul karena komitmen sumber daya dan sulit dibatalkan.",k:[{t:"Contoh: gaji pegawai tetap, penyusutan, sewa, PBB.",x:1},{t:"Bila aktivitas dihentikan, menjadi kapasitas menganggur."}]},{t:"Contoh: bahan baku fleksibel (tidak produksi, tidak beli); sewa ruko committed (tetap bayar walau tutup).",x:1}]},{t:"Kapasitas pembebanan",k:[{t:"Kapasitas teoritis: maksimal, mis. 8 jam per hari."},{t:"Kapasitas praktikal: teoritis dikurangi waktu tidak produktif (mis. 2 jam, jadi 6 jam).",k:[{t:"ABC biasanya memakai kapasitas praktikal."}]},{t:"Contoh: mesin kopi di kafe, teoritis 24 jam, praktikal hanya jam buka dikurangi perawatan.",x:1}]}],l:[{t:"Contoh hitungan",k:[{t:"5 orang x 6 jam x 5 hari x 4 minggu x 60 menit = 36.000 menit kapasitas praktikal."},{t:"Driver diubah jadi waktu: 30 menit per pengambilan.",k:[{t:"Vanilla 9.000 menit, strawberry 9.000 menit, durian 6.000 menit (total 24.000)."}]},{t:"Tarif (Tabel 2.8): Rp72.000.000 / 36.000 menit = Rp2.000 per menit.",k:[{t:"Dibebankan: vanilla Rp18 juta, strawberry Rp18 juta, durian Rp12 juta."}]},{t:"12.000 menit tidak terpakai = kapasitas menganggur Rp24 juta.",k:[{t:"Tidak dibebankan ke produk, jadi tanggungan perusahaan."}]},{t:"Hasil (Tabel 2.9): marjin vanilla 32,40%, strawberry 22,28%, durian -22,20%; total 17,12%."}],x:1},{t:"Efisiensi belum tentu menaikkan laba",k:[{t:"Pengambilan vanilla 9.000 jadi 7.500 menit: biaya vanilla turun Rp18 juta jadi Rp15 juta."},{t:"Laba total tidak naik; kapasitas menganggur naik Rp3 juta jadi Rp27 juta."},{t:"Laba naik bila:",k:[{t:"Mengurangi sumber daya, mis. memberhentikan 1 orang (hemat Rp14.400.000 = Rp72 juta / 5 orang)."},{t:"Menaikkan volume penjualan dengan sumber daya yang sama."}]},{t:"Tabel 2.10: biaya pengambilan Rp45 juta, menganggur Rp27 juta, marjin vanilla 32,95%, laba kotor tetap Rp190 juta."},{t:"Contoh: kasir yang makin cepat tidak membuat gaji turun; untung naik bila kasir dikurangi atau pelanggan ditambah.",x:1}]}]},
"2.6":{c:"ABC dengan Persamaan Waktu (Time Equation)",r:[{t:"Dipakai untuk",k:[{t:"Perusahaan dengan aktivitas amat beragam yang sulit disederhanakan."},{t:"Semua aktivitas diringkas dalam bentuk persamaan agar mudah dikelola."}]},{t:"Contoh aktivitas menerima pesanan",k:[{t:"Diterima lewat telpon, fax, atau email."},{t:"Untuk satu jenis atau beberapa jenis produk."},{t:"Untuk dalam kota, luar kota, atau luar negeri."}],x:1}],l:[{t:"Persamaan waktu",k:[{t:"Penerimaan pesanan = 4 + 5 (telpon) + 3 (fax) + 3 (per jenis produk) + 5 (dalam kota) + 8 (luar kota) + 15 (luar negeri)."},{t:"Angka-angkanya adalah waktu yang dibutuhkan (menit)."},{t:"Contoh: seperti rumus ongkir: tarif dasar ditambah biaya per kg dan biaya zona kota.",x:1}]},{t:"Hitungan biaya",k:[{t:"Telpon, dua jenis produk, luar kota: 4 + 5 + (3 x 2) + 8 = 23 menit."},{t:"Dikalikan tarif sumber daya berdasarkan kapasitas praktikal untuk mendapat biaya penerimaan pesanan."}]}]},
"2.7":{c:"ABC untuk Perusahaan Jasa",r:[{t:"Kecocokan",k:[{t:"Konsep ABC sangat cocok untuk perusahaan jasa."},{t:"Banyak artikel penerapannya, terutama di rumah sakit dan bank."},{t:"Sebagian besar biaya industri jasa adalah biaya tidak langsung."},{t:"Contoh: rumah sakit: gaji dokter, listrik ruang operasi, dan alat medis sulit ditelusuri ke satu pasien.",x:1}]}],l:[{t:"Time driven ABC pada bank",k:[{t:"Bank umumnya punya hitungan waktu melayani nasabah.",k:[{t:"Contoh: lama customer service membuka rekening baru, lama kasir melayani setor dan tarik uang.",x:1}]},{t:"Waktu itu dijadikan dasar persamaan waktu untuk membebankan biaya."},{t:"Contoh: buka rekening 15 menit, setor tunai 5 menit: biaya layanan = menit x tarif per menit.",x:1}]}]}

"3.1":{"c":"Latar Belakang","r":[{"t":"Dasar","k":[{"t":"Modul sebelumnya: cara mengembangkan sistem activity based costing (ABC)."},{"t":"ABC memberi gambaran akurat dan rinci, misalnya profitabilitas produk atau pelanggan."},{"t":"Pertanyaannya: apa yang dilakukan manajemen terhadap informasi tersebut?"}]},{"t":"Operating activity based management","k":[{"t":"Informasi ABC menunjukkan aktivitas apa saja yang dilakukan secara tidak efisien."},{"t":"Aktivitas tidak efisien menimbulkan biaya tinggi dan mengurangi profitabilitas produk atau pelanggan."},{"t":"Perusahaan bertindak terhadap aktivitas itu, sehingga operasional lebih efisien dan profitabilitas naik."}]}],"l":[{"t":"Strategic activity based management","k":[{"t":"Informasi ABC dipakai untuk pengambilan keputusan stratejik yang lebih baik."},{"t":"Perusahaan tahu produk atau pelanggan mana yang merugikan atau menguntungkan, lalu mengambil tindakan yang lebih akurat."},{"t":"Tindakan terhadap produk: dibahas di modul activity based costing."},{"t":"Analisis ABC untuk pelanggan: dibahas di modul strategic activity based management untuk pelanggan."}]},{"t":"Sumber","k":[{"t":"Cooper dan Kaplan (1999): informasi ABC dipakai untuk dua hal."},{"t":"Contoh: ABC seperti hasil rontgen; operating ABM = mengobati bagian yang sakit, strategic ABM = memutuskan pasien ini terus dirawat atau tidak.","x":1}]}]},
"3.2":{"c":"Operating Activity Based Management","r":[{"t":"Fokus bab","k":[{"t":"Penekanan pada operating activity based management."},{"t":"Gambar 3.1: perbandingan activity based costing dengan activity based management.","k":[{"t":"Vertical view (ABC): dimensi biaya, Resources \u2192 Activities \u2192 Cost Objects."},{"t":"Horizontal view (ABM): dimensi proses, Driver Analysis (Why?) \u2013 Activities (What?) \u2013 Performance Measures (How Well?)."},{"t":"Tujuan ABM: memperbaiki aktivitas agar dilakukan lebih efisien."}]},{"t":"Contoh: ABC bertanya 'uang habis ke mana?' (vertikal), ABM bertanya 'kenapa kerjanya begini dan seberapa bagus hasilnya?' (horizontal).","x":1}]},{"t":"Syarat penerapan ABM","k":[{"t":"Model ABC harus memisahkan biaya fleksibel dan biaya committed."},{"t":"Tanpa pemisahan, dampak efisiensi pengurangan biaya sulit dimonitor."},{"t":"Tidak semua biaya otomatis berkurang walau semua aktivitas dihilangkan.","k":[{"t":"Hanya biaya fleksibel yang hilang."},{"t":"Biaya committed tidak otomatis hilang."}]},{"t":"Contoh: aktivitas cuci piring dihapus; sabun tidak terpakai lagi (fleksibel), tetapi gaji pegawai tetap dan sewa dapur tetap harus dibayar (committed).","x":1}]}],"l":[{"t":"Dua kelompok aktivitas","k":[{"t":"Pada ABC: empat tingkatan (unit, batch, product, facility level)."},{"t":"Pada ABM: dua kelompok besar.","k":[{"t":"Value added activities: bernilai tambah di mata konsumen, konsumen mau membayar lebih.","k":[{"t":"Sebagian besar aktivitas produksi, seperti memotong kayu dan merakit kursi."},{"t":"Konsumen merasa tidak dapat melakukannya sendiri."}]},{"t":"Non value added activities: konsumen tidak mau membayar.","k":[{"t":"Perusahaan harus menekan bahkan menghilangkan biayanya."}]}]}]},{"t":"Contoh aktivitas non value added","k":[{"t":"Pengerjaan ulang (rework)","k":[{"t":"Aktivitas dilakukan dua kali untuk produk yang sama."},{"t":"Pembeli tidak peduli ada rework atau tidak; yang penting produk baik dan berfungsi."},{"t":"Dari sini muncul gugus kendali mutu (Total Quality Management) dari Jepang untuk produksi zero defect."}]},{"t":"Pemeriksaan atau inspeksi","k":[{"t":"Seleksi pemasok baik: inspeksi bahan mentah tidak perlu."},{"t":"Sistem zero defect: inspeksi barang jadi tidak perlu."}]},{"t":"Penyimpanan","k":[{"t":"Sewa atau penyusutan gudang, gaji orang gudang."},{"t":"Salah satu tujuan JIT: menghilangkan persediaan."}]},{"t":"Masih banyak aktivitas lain; sasaran utamanya dihilangkan."},{"t":"Contoh: pembeli kursi mau membayar potong kayu dan rakit kursi, tetapi tidak mau membayar 'rakit ulang karena salah pasang'.","x":1}]},{"t":"Aktivitas menyusun laporan keuangan","k":[{"t":"Bagi pelanggan tidak menambah nilai, tetapi tetap harus dilakukan perusahaan."},{"t":"Contoh lain: pemeliharaan mesin, perhitungan pajak penghasilan."},{"t":"Aktivitas bernilai tambah dipisah lagi menjadi dua:","k":[{"t":"Menambah nilai bagi pembeli/pelanggan."},{"t":"Menambah nilai bagi perusahaan."}]}]}]},
"3.3":{"c":"Efisiensi Biaya dalam Operating Activity Based Management","r":[{"t":"Empat cara efisiensi aktivitas","k":[{"t":"Activity elimination, activity reduction, activity selection, activity sharing."},{"t":"Penjelasan di teks modul berurutan: elimination, reduction, sharing, selection."}]},{"t":"1. Activity elimination","k":[{"t":"Menghilangkan aktivitas, harapannya biayanya ikut hilang."},{"t":"Sasaran utama: aktivitas yang tidak menambah nilai, bagi pelanggan maupun perusahaan."},{"t":"Contoh: berhenti mencetak laporan fisik yang tidak pernah dibaca.","x":1}]},{"t":"2. Activity reduction","k":[{"t":"Untuk aktivitas yang tidak dapat dihilangkan sepenuhnya."},{"t":"Output sama dengan aktivitas yang lebih sedikit."},{"t":"Caranya: perbanyak unit produksi dalam satu batch."},{"t":"Contoh beli bahan mentah 10.000 kg:","k":[{"t":"Sekali pesan 2.000 kg: 5 batch."},{"t":"Sekali pesan 2.500 kg: 4 batch."}],"x":1}]}],"l":[{"t":"3. Activity sharing","k":[{"t":"Tujuan: mengurangi kapasitas menganggur."},{"t":"Sumber daya dipakai untuk lebih dari satu aktivitas."},{"t":"Contoh: dua orang (terima dan periksa bahan mentah) hanya bekerja 50%; cukup satu orang untuk kedua aktivitas.","x":1}]},{"t":"4. Activity selection","k":[{"t":"Memilih alternatif aktivitas yang lebih murah."},{"t":"Contoh: memproduksi sendiri atau outsourcing.","x":1}]},{"t":"Jangan dilakukan terisolasi","k":[{"t":"Perubahan satu aktivitas memengaruhi biaya aktivitas lain."},{"t":"Contoh: batch pembelian diperbesar, pembelian berkurang, tetapi penyimpanan bahan mentah kemungkinan besar naik.","x":1},{"t":"Perusahaan harus melihat efek biaya untuk keseluruhan aktivitas."}]},{"t":"Tolok ukur monitoring efisiensi","k":[{"t":"Dilihat dari tiga sisi: biaya, waktu, dan kualitas."},{"t":"Contoh: penyusunan laporan keuangan dikurangi dari 7 menjadi 3 orang.","k":[{"t":"Biaya aktivitas pasti turun."},{"t":"Dapat berdampak negatif pada waktu penyelesaian laporan."},{"t":"Dapat berdampak negatif pada kualitas (banyak kesalahan jurnal)."}],"x":1},{"t":"Perhitungan biaya aktivitas bernilai tambah dan tidak: buku Cost Management (Guan, Hansen, Mowen), halaman 434 sampai 442."}]}]},
"3.4":{"c":"Biaya Kualitas (Cost of Quality)","r":[{"t":"Dasar","k":[{"t":"Penerapan konkret operating activity based management."},{"t":"Disarankan bagi perusahaan yang menjalankan gugus kendali mutu (GKM)."},{"t":"Tujuan GKM: barang berkualitas, yaitu sesuai spesifikasi.","k":[{"t":"Lewat konsep zero defect."}]},{"t":"GKM menaikkan laba:","k":[{"t":"Biaya yang tidak bernilai tambah dihilangkan, biaya turun."},{"t":"Konsumen puas, pendapatan naik."}]}]},{"t":"Fungsi biaya kualitas","k":[{"t":"Memonitor program GKM secara finansial."},{"t":"Tanpa biaya kualitas: hanya dua sisi (waktu dan kualitas)."},{"t":"Dengan biaya kualitas: tiga sisi (biaya, waktu, kualitas)."}]},{"t":"Empat biaya kualitas","k":[{"t":"Prevention, appraisal, internal failure, external failure costs."},{"t":"Control costs = pencegahan + pemeriksaan."},{"t":"Failure costs = kegagalan internal + eksternal."}]},{"t":"Biaya pencegahan (prevention costs)","k":[{"t":"Agar perusahaan tidak memproduksi barang yang tidak sesuai spesifikasi."},{"t":"Contoh: pelatihan karyawan, mesin lebih handal, perawatan berkala yang konsisten.","x":1}]},{"t":"Biaya pemeriksaan (appraisal costs)","k":[{"t":"Mencegah barang yang sudah terlanjur tidak sesuai spesifikasi diproses lebih lanjut."},{"t":"Contoh: pemeriksaan bahan mentah.","x":1},{"t":"Hampir segala bentuk pemeriksaan atau inspeksi masuk kategori ini."}]}],"l":[{"t":"Biaya kegagalan internal","k":[{"t":"Barang tidak sesuai spesifikasi, tetapi ditemukan sebelum sampai ke konsumen akhir."},{"t":"Contoh: biaya pengerjaan ulang (rework) dan inspeksi ulang.","k":[{"t":"Inspeksi ulang tidak dimasukkan ke appraisal costs, karena muncul akibat produksi awal tidak sesuai spesifikasi."}],"x":1}]},{"t":"Biaya kegagalan eksternal","k":[{"t":"Konsep sama dengan kegagalan internal."},{"t":"Bedanya: barang baru ditemukan setelah sampai ke tangan konsumen akhir."},{"t":"Contoh: biaya menangani keluhan pelanggan, biaya garansi.","x":1}]},{"t":"Lima rasio monitoring","k":[{"t":"Total biaya kualitas / penjualan"},{"t":"Biaya pencegahan / penjualan"},{"t":"Biaya pemeriksaan / penjualan"},{"t":"Biaya kegagalan internal / penjualan"},{"t":"Biaya kegagalan eksternal / penjualan"}]},{"t":"Prioritas jangka pendek GKM","k":[{"t":"Menurunkan rasio biaya kegagalan eksternal/penjualan."},{"t":"Tidak boleh naik; dari periode ke periode harus selalu turun."},{"t":"Barang tidak sesuai spesifikasi di tangan konsumen membuat konsumen tidak puas.","k":[{"t":"Berdampak buruk pada penjualan masa depan."},{"t":"Pihak lain yang mendengar cerita ketidakpuasan juga tidak akan membeli."}]}]},{"t":"Perjalanan rasio di awal GKM","k":[{"t":"Rasio pencegahan/penjualan naik (investasi awal besar), lalu turun dan stabil."},{"t":"Rasio pemeriksaan/penjualan naik (persentase inspeksi ditingkatkan)."},{"t":"Rasio kegagalan internal/penjualan naik di awal.","k":[{"t":"Biaya bergeser dari kegagalan eksternal ke internal."},{"t":"Total biaya kegagalan belum banyak berubah."}]}]},{"t":"Setelah GKM berjalan baik","k":[{"t":"Biaya kegagalan internal dan eksternal terus menurun, biaya pemeriksaan ikut turun."},{"t":"Zero defect sempurna: tidak ada biaya pemeriksaan dan kegagalan, karena berasal dari aktivitas tidak bernilai tambah."},{"t":"Biaya kualitas hanya biaya pencegahan."}]}]},
"3.5":{"c":"Biaya Kualitas Tersembunyi (Hidden Quality Costs)","r":[{"t":"Pengertian","k":[{"t":"Ada dalam biaya kegagalan eksternal maupun internal."},{"t":"Disebut tersembunyi: tidak terlihat langsung di catatan akuntansi, harus diukur khusus."},{"t":"Contoh: penjualan yang hilang karena konsumen tidak puas.","x":1},{"t":"Besarnya untuk kegagalan eksternal sering lebih tinggi daripada yang dicatat perusahaan."},{"t":"Salah satu cara menghitung: Taguchi quality loss function."}]},{"t":"Konsep Taguchi","k":[{"t":"Setiap penyimpangan terhadap spesifikasi menimbulkan kerugian."},{"t":"Makin jauh penyimpangan, kerugian makin tinggi dalam fungsi kuadratik."},{"t":"Contoh cincin diameter 1 cm (angka modul):","k":[{"t":"Penyimpangan 0,1 cm: rugi Rp5."},{"t":"Penyimpangan 0,2 cm: rugi Rp25."},{"t":"Penyimpangan 0,3 cm: rugi Rp625."}],"x":1},{"t":"Catatan: bila memakai rumus kuadratik dengan k = 500, seharusnya Rp5, Rp20, dan Rp45."}]}],"l":[{"t":"Rumus","k":[{"t":"L(y) = k (y \u2212 T)\u00b2","k":[{"t":"k = konstanta yang tergantung struktur biaya kegagalan eksternal."},{"t":"y = nilai aktual karakteristik yang diobservasi."},{"t":"T = target nilai karakteristik yang diobservasi."},{"t":"L = kerugian karena kualitas."}]},{"t":"k = c / d\u00b2","k":[{"t":"c = kerugian pada lower atau upper specification limit."},{"t":"d = jarak dari batasan (limit) terhadap target nilai."}]},{"t":"Contoh: target 1 cm, batas 1,1 cm, rugi di batas Rp5: k = 5 / 0,01 = 500; diameter 1,05 cm: L = 500 \u00d7 0,05\u00b2 = Rp1,25.","x":1}]},{"t":"Kaitan dengan ABC","k":[{"t":"Penerapan biaya kualitas lebih mudah bila perusahaan sudah memiliki ABC."},{"t":"Penggolongan berdasarkan charts of account menyulitkan pengelompokan ke empat biaya kualitas."},{"t":"Contoh: biaya gaji harus dibebankan ke aktivitas dulu.","k":[{"t":"Setelah biaya tiap aktivitas diketahui, baru digolongkan ke pencegahan, pemeriksaan, kegagalan internal, atau kegagalan eksternal."}],"x":1},{"t":"Model biaya kualitas = penerapan konkret operating activity based management."}]}]},
"3.6":{"c":"Lean Production","r":[{"t":"Pengertian","k":[{"t":"Konsep efisiensi biaya yang belakangan muncul."},{"t":"Sering disebut Toyota Production System (TPS), karena Toyota pelopornya."},{"t":"Dari lean production berkembang lean accounting."},{"t":"Tujuan: membuat perusahaan 'kurus' dengan membuang aktivitas dan biaya yang tidak bernilai tambah."}]},{"t":"Tujuh pemborosan","k":[{"t":"Kelebihan produksi (over production)"},{"t":"Persediaan (inventory)"},{"t":"Motion"},{"t":"Material movement"},{"t":"Correction, termasuk rework"},{"t":"Over processing"},{"t":"Waiting"},{"t":"Contoh restoran: masak 100 porsi padahal pesanan 60, bahan numpuk, koki bolak-balik ambil bahan, masakan salah dimasak ulang, pelanggan menunggu lama.","x":1}]}],"l":[{"t":"Value stream","k":[{"t":"Perusahaan lean diorganisasi berdasarkan value stream."},{"t":"Seluruh aktivitas (menambah nilai maupun tidak) terkait suatu produk atau kelompok produk.","k":[{"t":"Dari pengadaan bahan mentah, produksi, sampai ke tangan konsumen akhir."}]},{"t":"Biasanya satu value stream hanya untuk satu produk."}]},{"t":"Sisi akuntansi manajemen","k":[{"t":"Perhitungan biaya per produk lebih mudah."},{"t":"Semua biaya pada value stream adalah biaya langsung bagi produk tersebut."},{"t":"Bila tidak mungkin satu value stream per produk: satu value stream untuk beberapa produk yang aktivitasnya mirip."},{"t":"Bila ada beberapa produk dalam satu value stream, alokasi dengan ABC masih diperlukan."}]},{"t":"Lean accounting: percepat pelaporan","k":[{"t":"Salah satu syarat sistem informasi akuntansi manajemen yang baik: pelaporan cepat (modul pertama)."},{"t":"Pelaporan dibagi tiga:","k":[{"t":"Sel produksi: setiap hari, terutama informasi non keuangan."},{"t":"Laporan keuangan tiap value stream: per minggu."},{"t":"Laporan keuangan pabrik keseluruhan: setiap bulan."}]},{"t":"Contoh kafe: harian cek cangkir terjual, mingguan untung-rugi menu kopi, bulanan laporan keuangan seluruh kafe.","x":1}]}]}
