"7.1":{c:"Latar Belakang",r:[{t:"Sifat analisis CVP",k:[{t:"Analisis yang sederhana."},{t:"Seharusnya dapat diterapkan dalam perencanaan perusahaan."},{t:"Sudah sering dijelaskan di kelas akuntansi manajemen."}]}],l:[{t:"Masalah",k:[{t:"Masih jarang dipakai dalam proses perencanaan perusahaan."},{t:"Contoh: kalkulator canggih di laci yang tidak pernah dikeluarkan.",x:1}]},{t:"Tujuan modul",k:[{t:"Menjelaskan cara menerapkan konsep CVP dalam kegiatan operasional."}]}]},
"7.2":{c:"Pengertian dan Tujuan Analisis CVP",r:[{t:"Pengertian",k:[{t:"Cost Volume Profit atau analisis biaya volume laba."},{t:"Dilakukan pada tahap perencanaan."},{t:"Tujuan: menentukan volume barang yang harus dijual untuk mencapai laba tertentu."}]},{t:"Pengelompokan biaya",k:[{t:"Semua biaya dibedakan menjadi biaya tetap dan biaya variabel."},{t:"Biaya periode dan biaya produk tidak relevan."}]}],l:[{t:"Biaya variabel",k:[{t:"Total biaya meningkat atau menurun proporsional dengan unit terjual."},{t:"Contoh: tepung dan telur naik tiap nambah kue.",x:1}]},{t:"Biaya tetap",k:[{t:"Total biaya tidak berubah berapa pun barang dijual."},{t:"Berlaku selama masih berada dalam kapasitas tertentu."},{t:"Contoh: sewa toko tetap sama mau laku 10 atau 100 kue.",x:1}]},{t:"Format laporan laba rugi",k:[{t:"Direct costing atau variable costing (Gambar 7.1)."},{t:"Pendapatan - biaya variabel = marjin kontribusi."},{t:"Marjin kontribusi - biaya tetap = laba operasi."}]}]},
"7.3":{c:"Rumus Perhitungan Cost Volume Profit",r:[{t:"Unsur variabel",k:[{t:"Penjualan, biaya variabel, dan marjin kontribusi bersifat variabel."},{t:"Maksimalkan marjin kontribusi untuk memaksimalkan laba (biaya tetap tidak berubah)."}]},{t:"Titik impas (BEP)",k:[{t:"Total marjin kontribusi sama dengan total biaya tetap."},{t:"BEP (unit) = biaya tetap / (harga jual - biaya variabel per unit).",k:[{t:"Contoh: sewa Rp3 juta, sisa untung Rp3.000 per kue, perlu 1.000 kue.",x:1}]}]},{t:"Target keuntungan",k:[{t:"Target bersifat absolut dan berperilaku seperti biaya tetap."},{t:"Unit = (biaya tetap + target keuntungan) / (harga jual - biaya variabel per unit)."}]}],l:[{t:"Dengan pajak",k:[{t:"Pakai target keuntungan sebelum pajak."},{t:"Keuntungan sebelum pajak = keuntungan setelah pajak / (1 - tarif pajak).",k:[{t:"Contoh: Rp15 juta bersih, pajak 25%, sebelum pajak Rp20 juta.",x:1}]}]},{t:"Target dalam rupiah",k:[{t:"Target rupiah = (biaya tetap + target keuntungan) / rasio marjin kontribusi."},{t:"Rasio marjin kontribusi = (harga jual - biaya variabel per unit) / harga jual."}]}]},
"7.4":{c:"Contoh Soal Perhitungan CVP",r:[{t:"Data PT X",k:[{t:"Harga jual Rp500, biaya variabel Rp250 per unit."},{t:"Total biaya tetap Rp10.000.000."},{t:"Target keuntungan setelah pajak Rp15.000.000, pajak 25%."}]},{t:"Titik impas",k:[{t:"10.000.000 / (500 - 250) = 40.000 unit."}]},{t:"Target keuntungan",k:[{t:"Sebelum pajak: 15.000.000 / (1 - 25%) = Rp20.000.000."},{t:"Modul: 20.000.000 / 250 = 80.000 unit (di atas titik impas)."},{t:"Rumus 7.3 lengkap: (10.000.000 + 20.000.000) / 250 = 120.000 unit."}]}],l:[{t:"Target unit belum jadi target penjualan",k:[{t:"Cek kapasitas produksi.",k:[{t:"Kurang: naikkan harga jual, tambah kapasitas, outsourcing."}]},{t:"Cek permintaan pasar.",k:[{t:"Contoh: pasar hanya 75.000 unit, ubah asumsi: kurangi biaya tetap, tambah iklan."}]}]},{t:"Target tahun depan",k:[{t:"Sesuai kapasitas produksi."},{t:"Diperkirakan dapat diserap pasar."}]}]},
"7.5":{c:"Analisis CVP untuk Lebih dari Satu Jenis Produk",r:[{t:"Tiga hal yang diperhatikan",k:[{t:"1. Fasilitas berbeda: CVP terpisah per produk."},{t:"2. Fasilitas sama, marjin kontribusi per unit sama: dianggap satu produk."},{t:"3. Fasilitas sama, marjin kontribusi berbeda.",k:[{t:"Alokasi biaya tetap tidak disarankan (sulit akurat)."},{t:"Pakai Weighted Average Contribution Margin berdasarkan target bauran penjualan."}]}]}],l:[{t:"Contoh Tabel 7.1",k:[{t:"Produk A: marjin 700, proporsi 0,6, tertimbang 420."},{t:"Produk B: marjin 1.200, proporsi 0,3, tertimbang 360."},{t:"Produk C: marjin 1.300, proporsi 0,1, tertimbang 130."},{t:"Weighted Average Contribution Margin = 910."}]},{t:"Hasil",k:[{t:"Biaya tetap Rp18.200.000 / 910 = 20.000 unit."},{t:"A 12.000 (60%), B 6.000 (30%), C 2.000 (10%; modul menulis 20%)."}]},{t:"Puluhan atau ratusan produk",k:[{t:"Kelompokkan berdasarkan kesamaan marjin kontribusi per unit."},{t:"Biasanya satu lini produk."},{t:"Produk bermarjin sama digabung dan dianggap satu jenis."}]}]},
"7.6":{c:"Identifikasi Biaya Variabel dan Biaya Tetap",r:[{t:"Masalah tersulit",k:[{t:"Membagi semua biaya menjadi tetap dan variabel."},{t:"CVP tidak mengenal biaya semi variabel dan step costs."}]},{t:"Mixed costs",k:[{t:"Contoh: listrik, air, telepon."},{t:"Punya unsur tetap dan variabel, harus dipisahkan."},{t:"High-low point method kurang akurat; disarankan metode statistik."}]}],l:[{t:"Biaya yang tidak dapat dikelompokkan",k:[{t:"Biaya variabel harus berubah proporsional dengan unit terjual."},{t:"Contoh toko roti: lembur Sabtu-Minggu 2 jam.",k:[{t:"Tidak ada jaminan tiap jam lembur menghasilkan penjualan sama."},{t:"Dimasukkan ke biaya tetap."}]},{t:"Biaya tetap di CVP = semua biaya yang tidak dapat dikategorikan sebagai variabel."}]},{t:"Biaya variabel harus per unit",k:[{t:"Contoh air untuk roti: sebenarnya variabel."},{t:"Jenis roti banyak atau info total tidak ada: terpaksa masuk biaya tetap."},{t:"Banyak biaya tetap versi CVP sebenarnya bukan biaya tetap murni."}]}]},
"7.7":{c:"Ilustrasi Analisis CVP: PT Jaja Marja",r:[{t:"Jalan tol",k:[{t:"80 Km dalam kota, tarif tidak tergantung jarak."},{t:"Sedan Rp8.000, truk Rp10.000 sekali masuk."},{t:"Komposisi 90% sedan, 10% truk (tahun 20X2)."}]},{t:"Biaya personel",k:[{t:"12 petugas tol, gaji Rp2.000.000 per bulan."},{t:"Lembur Senin-Jumat 10 jam per hari, Rp20.000 per jam."},{t:"30 direksi dan karyawan, gaji Rp120.000.000 (modul: per bulan)."}]}],l:[{t:"Biaya operasi",k:[{t:"Pemeliharaan Rp4.000.000 per km per tahun."},{t:"Penyusutan jalan Rp300.000.000 per tahun."},{t:"Listrik 20.000 Kwh per bulan, Rp1.000 per Kwh."},{t:"Karcis Rp100 per lembar, satu per kendaraan."},{t:"Administrasi dan umum Rp100.000.000 per tahun."}]},{t:"Iklan",k:[{t:"12 spot, sewa Rp20.000.000 per spot per tahun, 10 spot laku."},{t:"Bangun papan Rp3.000.000 per spot."},{t:"Pajak daerah Rp1.000.000 per spot, walau tidak laku."}]},{t:"Pertanyaan",k:[{t:"1. Kendaraan untuk titik impas."},{t:"2. Kendaraan untuk untung setelah pajak (pajak 20%)."}]}]},
"7.8":{c:"Jawaban Ilustrasi Soal",r:[{t:"Langkah 1: pilah biaya",k:[{t:"Biaya variabel hanya pencetakan karcis (Rp100 per kendaraan)."},{t:"Semua biaya lain tetap: total netto Rp1.261.980.000."},{t:"Penerimaan iklan Rp200.000.000 mengurangi biaya tetap."},{t:"Catatan: gaji 120 juta ditulis per bulan tapi tidak dikali 12; administrasi 99,98 juta di tabel vs 100 juta di soal."}]},{t:"Langkah 2: rata-rata tertimbang",k:[{t:"Sedan: 8.000 - 100 = 7.900; truk: 10.000 - 100 = 9.900."},{t:"7.900 x 90% = 7.110; 9.900 x 10% = 990."},{t:"Rata-rata tertimbang = Rp8.100."}]}],l:[{t:"Langkah 3: titik impas",k:[{t:"1.261.980.000 / 8.100 = 155.800 kendaraan."},{t:"Truk 10% = 15.580."},{t:"Mobil 90% = 140.220."}]},{t:"Langkah 4: target untung",k:[{t:"Sebelum pajak: 504.000.000 / (1 - 20%) = Rp630.000.000."},{t:"Soal tertulis Rp50.400.000, jawaban memakai Rp504.000.000."},{t:"(1.261.980.000 + 630.000.000) / 8.100 = 233.578 kendaraan."},{t:"Truk 10% = 23.358; mobil 90% = 210.220."}]}]},
"7.9":{c:"Analisis CVP dalam Ketidakpastian",r:[{t:"Safety margin",k:[{t:"Selisih unit yang diperkirakan terjual dengan unit titik impas."},{t:"Besar: posisi aman."},{t:"Kecil: posisi rawan, laba bisa terbawa ke titik impas atau rugi."}]},{t:"Operating leverage",k:[{t:"Mengukur proporsi biaya tetap dibanding total biaya."},{t:"Rumus: total marjin kontribusi / total laba operasi."},{t:"OL tinggi: risiko naik, laba lebih berfluktuasi."},{t:"Contoh: OL 5, penjualan meleset 1%, laba meleset 5%.",x:1}]}],l:[{t:"Analisis sensitivitas (what-if)",k:[{t:"Mencari unsur paling sensitif terhadap laba."},{t:"Contoh: harga dinaikkan atau diturunkan 1%, lihat dampak ke laba."},{t:"Faktor paling sensitif harus dijaga agar tidak meleset."}]},{t:"Latar",k:[{t:"CVP dibuat saat perencanaan; asumsi belum tentu sama dengan kenyataan."}]}]},
"7.10":{c:"CVP dengan Model Activity Based Costing",r:[{t:"Empat tingkatan aktivitas ABC",k:[{t:"Unit level."},{t:"Batch level."},{t:"Product level."},{t:"Facility level."}]}],l:[{t:"Biaya variabel dalam CVP-ABC",k:[{t:"Hanya biaya variabel dari aktivitas tingkat unit."}]},{t:"Biaya tetap dalam CVP-ABC",k:[{t:"Biaya tetap aktivitas tingkat unit."},{t:"Biaya dari aktivitas batch, product, dan facility."},{t:"Contoh: set-up mesin (tingkat batch) dikelompokkan sebagai biaya tetap.",x:1}]},{t:"Dasar",k:[{t:"Definisi biaya dikaitkan dengan aktivitas, bukan hanya produk."}]}]}

["Tujuan analisis CVP pada tahap perencanaan adalah menentukan...",["Harga pokok persediaan akhir","Volume barang yang harus dijual untuk mencapai tingkat laba tertentu","Biaya periode yang boleh dikapitalisasi","Arus kas investasi"],1,"CVP (cost volume profit) dilakukan pada tahap perencanaan untuk menentukan berapa volume barang yang harus dijual agar mencapai laba tertentu."],
["Dalam analisis CVP, semua biaya perusahaan dikelompokkan menjadi...",["Biaya produk dan biaya periode","Biaya langsung dan tidak langsung","Biaya historis dan biaya masa depan","Biaya tetap dan biaya variabel"],3,"Penggolongan biaya periode dan biaya produk tidak relevan. CVP hanya mengenal biaya tetap dan biaya variabel."],

["Biaya variabel dalam konteks CVP adalah biaya yang total biayanya...",["Tidak berubah berapa pun unit terjual","Berubah proporsional sesuai jumlah unit yang terjual","Berubah tetapi tidak proporsional dengan unit","Sudah dikeluarkan perusahaan"],1,"Total biaya variabel meningkat atau menurun secara proporsional sesuai jumlah unit yang dijual."],

["PT X: harga jual Rp500, biaya variabel Rp250, biaya tetap Rp10.000.000. Titik impas adalah...",["20.000 unit","80.000 unit","40.000 unit","120.000 unit"],2,"10.000.000 / (500 - 250) = 40.000 unit."],

/* ===== BAB VIII: Akuntansi Manajemen Lingkungan ===== */
(()=>{
const T81="##T|Tabel 8.1: Laporan Biaya Lingkungan PT Kacau Balau, Tahun yang Berakhir 31 Desember 20x3 (IDR)|Keterangan~Rincian~Subtotal~Persentase|Biaya Pencegahan Lingkungan~-~-~-|Biaya untuk Melakukan Sertifikasi ISO 14001~300.000.000~-~-|Biaya untuk Melakukan Pemilihan Pemasok~100.000.000~400.000.000~5,95%|Biaya Pemeriksaan Lingkungan~-~-~-|Biaya untuk Mengukur Tingkat Kontaminasi~125.000.000~-~-|Biaya untuk Melakukan Pemeriksaan terhadap Proses Produksi~200.000.000~325.000.000~4,83%|Biaya Lingkungan karena Kegagalan Internal~-~-~-|Biaya untuk Membuang “Waste” dari Produksi~800.000.000~-~-|Biaya untuk Mengoperasikan Peralatan untuk Mengendalikan Polusi~200.000.000~1.000.000.000~14,87%|Biaya Lingkungan karena Kegagalan Eksternal~-~-~-|Biaya untuk Membersihkan Sungai yang Terkena Polusi~1.800.000.000~-~-|Biaya untuk Membayar Ganti-Rugi pada Penduduk yang Terkena Dampak Polusi~3.200.000.000~6.000.000.000~74,35%|*Total Biaya Lingkungan~-~6.725.000.000~100,00%";
Object.assign(TNOTE,{'8.1':"Subtotal tiap kelompok = jumlah dua baris biaya di kelompok itu (pencegahan: 300.000.000 + 100.000.000 = 400.000.000). Persentase = subtotal ÷ total biaya lingkungan (400.000.000 ÷ 6.725.000.000 = 5,95%). Total = 400.000.000 + 325.000.000 + 1.000.000.000 + 5.000.000.000 = 6.725.000.000. <b>Catatan angka di modul:</b> subtotal kegagalan eksternal tertulis Rp6.000.000.000, padahal 1.800.000.000 + 3.200.000.000 = 5.000.000.000. Angka 5.000.000.000 yang cocok dengan total Rp6.725.000.000 dan persentase 74,35% (5.000.000.000 ÷ 6.725.000.000). Nama baris “kontaminsai” di modul ditulis “kontaminasi” di sini."});
Object.assign(RL,{'8.1':(r,c)=>{const t='8.1',G=[["Biaya untuk Melakukan Sertifikasi ISO 14001", "Biaya untuk Melakukan Pemilihan Pemasok"], ["Biaya untuk Mengukur Tingkat Kontaminasi", "Biaya untuk Melakukan Pemeriksaan terhadap Proses Produksi"], ["Biaya untuk Membuang “Waste” dari Produksi", "Biaya untuk Mengoperasikan Peralatan untuk Mengendalikan Polusi"], ["Biaya untuk Membersihkan Sungai yang Terkena Polusi", "Biaya untuk Membayar Ganti-Rugi pada Penduduk yang Terkena Dampak Polusi"]],TOT="Total Biaya Lingkungan",ALL=[].concat(...G),S=g=>op('+',...g.map(x=>L(t,x,1))),g=G.find(x=>x[1]===r);
if(c===2){
if(g===G[3])return{w:'Jumlah dua baris biaya di kelompok ini. Modul menulis Rp6.000.000.000, padahal hasil penjumlahannya Rp5.000.000.000',e:S(g)};
if(g)return{w:'Jumlah dua baris biaya di kelompok ini',e:S(g)};
if(r===TOT)return{w:'Jumlah seluruh baris biaya dari keempat kelompok',e:S(ALL)}}
if(c===3){
if(g)return{w:'Subtotal kelompok \u00f7 total biaya lingkungan',pct:1,e:op('\u00f7',S(g),L(t,TOT,2))};
if(r===TOT)return{w:'Seluruh biaya \u00f7 total biaya lingkungan (selalu 100%)',pct:1,e:op('\u00f7',S(ALL),L(t,TOT,2))}}
return null}});
Object.assign(M[0].mat,{
"8.1":["Belakangan ini, semakin banyak <b>tuntutan agar perusahaan memperhatikan faktor-faktor lingkungan</b> dalam menjalankan usahanya. Tuntutan ramah lingkungan bukan saja berasal dari <b>pemerintah</b>, yang semakin banyak mengeluarkan peraturan-peraturan untuk memaksa perusahaan menjadi ramah lingkungan, namun juga banyak <b>perusahaan</b> yang memasukkan unsur ramah lingkungan sebagai bagian dari <b>strategi usaha</b> mereka.",
"Perusahaan dituntut untuk menjadi <b><i>eco-efisien</i></b>, yang berarti kemampuan untuk memproduksi barang untuk memuaskan konsumen dengan <b>biaya yang kompetitif</b>, namun juga sekaligus <b>mengurangi dampak negatif terhadap lingkungan</b>. Dengan alasan-alasan tersebut, maka kebutuhan <b>informasi keuangan dan non keuangan</b> mengenai pengelolaan lingkungan menjadi semakin dibutuhkan perusahaan."],
"8.2":["Menurut IFAC (2005), <b>akuntansi manajemen lingkungan</b> (<i>environmental management accounting</i>) merupakan pengelolaan lingkungan sekaligus kinerja ekonomi organisasi melalui pengembangan dan implementasi sistem dan praktik akuntansi yang sesuai dengan kebutuhan organisasi tersebut. Pada dasarnya terdapat <b>tiga hal utama</b> dalam akuntansi manajemen lingkungan, yaitu:",
"- <b>1. Kepatuhan (<i>compliance</i>).</b> Dalam hal ini akuntansi manajemen lingkungan harus dapat memberikan informasi mengenai kepatuhan perusahaan terhadap peraturan-peraturan yang terkait dengan lingkungan, yang dibuat sendiri oleh perusahaan tersebut maupun yang dibuat oleh pemerintah.",
"- <b>2. <i>Eco-efisien</i>.</b> Dalam hal ini akuntansi manajemen lingkungan harus dapat melakukan <b>monitoring</b> terhadap efisiensi penggunaan sumber daya alam seperti penggunaan bahan baku, bahan bakar, air, dan lain-lainnya, dan dampaknya terhadap lingkungan dan juga biaya-biaya yang dikeluarkan oleh perusahaan.",
"- <b>3. Posisi stratejik.</b> Dalam hal ini organisasi harus membuat program-program yang terkait dengan lingkungan untuk mencapai tujuan jangka panjang perusahaan. Akuntansi manajemen lingkungan harus dapat memonitor apakah biaya-biaya yang dikeluarkan dapat mencapai tujuan tersebut."],
"8.3":["Pengelolaan dan pengendalian biaya lingkungan dapat dilakukan dengan membagi biaya yang terkait dengan biaya lingkungan menjadi <b>empat bagian</b>, yaitu:",
"- <b>1.</b> Biaya lingkungan yang bersifat <b>pencegahan</b> (<i>Environmental prevention costs</i>)",
"- <b>2.</b> Biaya lingkungan yang bersifat <b>pemeriksaan</b> (<i>Environmental appraisal costs</i>)",
"- <b>3.</b> Biaya lingkungan karena adanya <b>kegagalan internal</b> (<i>Environmental internal failure costs</i>)",
"- <b>4.</b> Biaya lingkungan karena adanya <b>kegagalan eksternal</b> (<i>Environmental external failure costs</i>)"],
"8.3.1":["Yang termasuk dalam kategori ini adalah biaya-biaya yang dikeluarkan untuk menjalankan kegiatan-kegiatan yang dapat dipergunakan untuk <b>menjaga agar perusahaan dalam melakukan aktivitasnya tidak menghasilkan sesuatu yang dapat berdampak negatif terhadap lingkungan</b>. Contoh dari kelompok biaya ini adalah:",
"- <b>1.</b> Memilih dan mengevaluasi pemasok, sehingga didapatkan pemasok yang ramah lingkungan",
"- <b>2.</b> Merancang proses produksi yang ramah lingkungan",
"- <b>3.</b> Memperoleh sertifikasi ISO 14001",
"- <b>4.</b> Merancang produk yang ramah lingkungan"],
"8.3.2":["Biaya-biaya ini dikeluarkan untuk <b>memastikan</b> apakah produk yang dihasilkan perusahaan, ataupun proses dan aktivitas yang dilakukan perusahaan memang sudah sesuai dengan standar lingkungan yang terdapat pada peraturan pemerintah ataupun peraturan perusahaan sendiri. Aktivitas-aktivitas ini dilakukan untuk dapat <b>mendeteksi sedini mungkin</b> jika terdapat produk atau proses yang tidak sesuai dengan peraturan atau standar tersebut, sehingga jangan sampai dampaknya meluas. Contoh dari kelompok biaya ini adalah:",
"- <b>1.</b> Melakukan pemeriksaan (audit) terhadap aktivitas yang berkaitan dengan lingkungan",
"- <b>2.</b> Melakukan inspeksi terhadap produk dan proses yang dilakukan",
"- <b>3.</b> Mengembangkan tolok ukur yang berkaitan dengan lingkungan",
"- <b>4.</b> Melakukan <i>testing</i> untuk melihat apakah terdapat kontaminasi"],
"8.3.3":["Biaya-biaya ini muncul karena dalam kegiatannya perusahaan menghasilkan elemen-elemen yang dapat merusak lingkungan, namun elemen-elemen tersebut <b>dapat dikendalikan oleh perusahaan</b>, sehingga <b>tidak mencemari lingkungan</b>. Contoh dari kelompok biaya ini adalah:",
"- <b>1.</b> Biaya untuk mengamankan dan membuang ekses produksi yang tidak ramah lingkungan.",
"- <b>2.</b> Biaya untuk mengoperasikan dan memelihara peralatan yang berkaitan dengan polusi."],
"8.3.4":["Biaya-biaya ini muncul, karena elemen-elemen yang dapat merusak lingkungan yang dihasilkan perusahaan, ternyata <b>mengkontaminasi lingkungan</b>. Contohnya, adalah kasus <b>kapal tanker pengangkut minyak yang karam</b>, yang mengakibatkan tumpahan minyak ke laut. <i>Environmental external failure costs</i> dapat dibagi menjadi <b>dua bagian</b>, yaitu:",
"- <b>1. <i>Realized external failure costs</i></b>, dalam hal ini adalah biaya-biaya yang <b>benar-benar dikeluarkan perusahaan</b>, karena adanya kontaminasi atau kerusakan lingkungan akibat kegiatan operasi perusahaan. Contoh dari biaya-biaya ini adalah:<br>&emsp;a. Biaya untuk membersihkan minyak yang tertumpah di laut karena bocor atau karamnya kapal tanker pengangkut minyak<br>&emsp;b. Biaya untuk membersihkan danau atau sungai yang tercemar<br>&emsp;c. Biaya yang dikeluarkan untuk membayar ganti-rugi pada penduduk atau pihak ketiga karena kerusakan lingkungan yang dibuat perusahaan",
"- <b>2. <i>Unrealized external failure (societal) costs</i></b>, dalam kasus ini kontaminasi dan kerusakan lingkungan memang berasal dari kegiatan operasi perusahaan, namun biaya yang timbul <b>tidak ditanggung oleh perusahaan, tetapi ditanggung oleh pihak lainnya di luar perusahaan</b>. Contoh dari biaya-biaya ini adalah:<br>&emsp;a. Kesehatan penduduk yang menurun karena sungai terkontaminasi<br>&emsp;b. Mata pencaharian nelayan yang hilang karena laut terkontaminasi"],
"8.4":["Pada dasarnya, prinsip pengelolaan biaya lingkungan <b>sama dengan prinsip pengelolaan biaya kualitas</b> yang telah dibahas dalam modul sebelumnya. Biaya lingkungan terbesar yang dihadapi perusahaan adalah biaya lingkungan karena adanya <b>kegagalan eksternal</b>. Biaya ini memang tidak sering muncul, namun jika biaya tersebut muncul, maka akan dapat membebani perusahaan dengan biaya yang amat besar, bahkan dalam kasus yang ekstrim dapat menimbulkan <b>kebangkrutan</b> perusahaan. Contohnya adalah kasus <b>lumpur Lapindo</b>.",

T81,

"8.5":["<b><i>Triple bottom accounting</i></b> merupakan kerangka akuntansi yang melihat dari <b>tiga sisi</b>, yaitu <i>people</i> (orang), <i>planet</i> (lingkungan), dan <i>profit</i>. Dalam pelaporan keuangan secara tradisional, biasanya perusahaan hanya melaporkan <i>profit</i> atau keuntungan yang dihasilkan perusahaan. Namun demikian, apa yang terjadi apabila profit tersebut diperoleh dengan kegiatan yang merusak lingkungan ataupun dengan melakukan <i>outsourcing</i> pada perusahaan-perusahaan yang mempekerjakan pekerja di bawah umur.",
"Collin dan Porras (2004) dalam penelitiannya menemukan bahwa perusahaan-perusahaan yang memiliki tujuan utama untuk <b>memaksimalkan kekayaan pemegang saham</b>, biasanya <b>tidak akan bertahan hidup dalam waktu yang lama</b>. Menurut penelitian tersebut, perusahaan yang dapat bertahan sukses dalam waktu yang lama adalah perusahaan-perusahaan yang berusaha untuk mencapai <b>beberapa tujuan</b> (<i>cluster of objectives</i>), dimana memaksimalkan kekayaan pemegang saham hanya merupakan salah satu tujuan yang ingin dicapai, dan biasanya bukan merupakan tujuan utama.",

"8.1":["Makin banyak <b>tuntutan supaya perusahaan memperhatikan lingkungan</b>. Bukan cuma dari <b>pemerintah</b> yang makin banyak bikin peraturan untuk memaksa, tapi juga dari <b>perusahaan sendiri</b> yang memasukkan unsur ramah lingkungan ke dalam strategi usaha.||dulu pabrik cuma dinilai dari untungnya; sekarang ditanya juga limbahnya dibuang ke mana.",
"Perusahaan dituntut jadi <b><i>eco-efisien</i></b>: mampu memproduksi barang yang memuaskan konsumen dengan <b>biaya kompetitif</b>, sekaligus <b>mengurangi dampak negatif ke lingkungan</b>.||bikin produk yang harganya bersaing, tapi nggak ngotorin sungai di belakang pabrik.",
"Karena itu, perusahaan makin butuh <b>informasi keuangan dan non keuangan</b> tentang pengelolaan lingkungan."],
"8.2":["<b>Akuntansi manajemen lingkungan</b> (<i>environmental management accounting</i>) menurut IFAC (2005) = pengelolaan lingkungan <b>sekaligus</b> kinerja ekonomi organisasi, lewat pengembangan dan penerapan sistem dan praktik akuntansi yang sesuai kebutuhan organisasi.||bukan cuma ngitung untung-rugi usaha, tapi juga ngitung dampak dan biayanya ke alam.",
"Ada <b>tiga hal utama</b>:@@<b>Kepatuhan (<i>compliance</i>):</b> memberi informasi apakah perusahaan patuh pada peraturan lingkungan, baik buatan perusahaan sendiri maupun buatan pemerintah@@<b><i>Eco-efisien</i>:</b> memonitor efisiensi pemakaian sumber daya alam (bahan baku, bahan bakar, air, dll.), dampaknya ke lingkungan, dan biaya yang dikeluarkan@@<b>Posisi stratejik:</b> organisasi membuat program lingkungan untuk tujuan jangka panjang; akuntansi memonitor apakah biaya yang dikeluarkan benar-benar mencapai tujuan itu||pabrik mengecek apakah izin limbahnya dipatuhi (kepatuhan), menghitung pemakaian air dan bahan bakar per produk (eco-efisien), lalu menilai apakah dana program hijau tahun ini mendekatkan ke target jangka panjang (posisi stratejik)."],
"8.3":["Biaya lingkungan dibagi jadi <b>empat bagian</b> supaya bisa dikelola dan dikendalikan:@@<b>Pencegahan</b> (<i>environmental prevention costs</i>)@@<b>Pemeriksaan</b> (<i>environmental appraisal costs</i>)@@<b>Kegagalan internal</b> (<i>environmental internal failure costs</i>)@@<b>Kegagalan eksternal</b> (<i>environmental external failure costs</i>)||pola yang sama dengan biaya kualitas: ada biaya supaya nggak rusak, biaya ngecek, dan biaya kalau sudah terlanjur rusak (di dalam atau sampai ke luar perusahaan)."],
"8.3.1":["<b>Biaya pencegahan</b> = biaya untuk menjalankan kegiatan yang <b>menjaga agar perusahaan nggak menghasilkan sesuatu yang berdampak negatif</b> ke lingkungan saat beroperasi.||servis berkala supaya mesin nggak bocor oli, bukan nunggu bocor dulu.",
"Contoh:@@Memilih dan mengevaluasi <b>pemasok</b> supaya didapat pemasok yang ramah lingkungan@@Merancang <b>proses produksi</b> yang ramah lingkungan@@Memperoleh <b>sertifikasi ISO 14001</b>@@Merancang <b>produk</b> yang ramah lingkungan"],
"8.3.2":["<b>Biaya pemeriksaan</b> = biaya untuk <b>memastikan</b> produk, proses, dan aktivitas perusahaan sudah sesuai standar lingkungan (peraturan pemerintah atau peraturan perusahaan sendiri). Tujuannya <b>mendeteksi sedini mungkin</b> kalau ada yang nggak sesuai, supaya dampaknya nggak meluas.||ngecek tiap pagi sebelum pabrik jalan, biar bocor kecil nggak keburu jadi limbah yang menyebar.",
"Contoh:@@Melakukan <b>pemeriksaan (audit)</b> terhadap aktivitas yang berkaitan dengan lingkungan@@Melakukan <b>inspeksi</b> terhadap produk dan proses@@Mengembangkan <b>tolok ukur</b> yang berkaitan dengan lingkungan@@Melakukan <i>testing</i> untuk melihat apakah ada <b>kontaminasi</b>"],
"8.3.3":["<b>Biaya kegagalan internal</b> muncul karena kegiatan perusahaan menghasilkan elemen yang <b>dapat merusak lingkungan</b>, tetapi elemen itu <b>masih bisa dikendalikan perusahaan</b>, sehingga <b>nggak sampai mencemari lingkungan</b>.||limbah pabrik ditampung dan diolah sendiri dulu, jadi nggak sempat mengalir ke sungai.",
"Contoh:@@Biaya <b>mengamankan dan membuang</b> ekses produksi yang tidak ramah lingkungan@@Biaya <b>mengoperasikan dan memelihara peralatan</b> yang berkaitan dengan polusi"],
"8.3.4":["<b>Biaya kegagalan eksternal</b> muncul karena elemen perusak lingkungan yang dihasilkan perusahaan ternyata <b>sudah mengkontaminasi lingkungan</b>.||contoh di modul: kapal tanker pengangkut minyak karam, minyaknya tumpah ke laut.",
"Dibagi <b>dua bagian</b>:@@<b><i>Realized external failure costs</i>:</b> biaya yang <b>benar-benar dikeluarkan perusahaan</b> karena kontaminasi atau kerusakan lingkungan akibat operasinya@@<b><i>Unrealized external failure (societal) costs</i>:</b> kerusakan memang berasal dari operasi perusahaan, tapi biayanya <b>ditanggung pihak lain</b> di luar perusahaan",
"Contoh <i>realized</i>:@@Membersihkan minyak yang tertumpah di laut karena bocor atau karamnya kapal tanker@@Membersihkan danau atau sungai yang tercemar@@Membayar ganti-rugi ke penduduk atau pihak ketiga karena kerusakan lingkungan yang dibuat perusahaan",
"Contoh <i>unrealized</i> (societal):@@<b>Kesehatan penduduk menurun</b> karena sungai terkontaminasi@@<b>Mata pencaharian nelayan hilang</b> karena laut terkontaminasi||yang rugi warga sekitar, bukan perusahaan. Biayanya nyata, tapi bukan perusahaan yang membayarnya."],
"8.4":["Prinsip pengelolaan biaya lingkungan <b>sama dengan prinsip pengelolaan biaya kualitas</b> yang sudah dibahas di modul sebelumnya.||sama-sama menekankan: perbanyak biaya di depan (cegah dan periksa) supaya biaya kegagalan di belakang berkurang.",
"Biaya lingkungan <b>terbesar</b> adalah biaya <b>kegagalan eksternal</b>. Biaya ini <b>nggak sering muncul</b>, tapi sekali muncul bisa membebani perusahaan dengan biaya amat besar, bahkan dalam kasus ekstrem bisa menimbulkan <b>kebangkrutan</b>. Contoh: kasus <b>lumpur Lapindo</b>.",
"Karena itu, untuk mengelola atau mengurangi biaya lingkungan, perusahaan harus <b>memperbanyak proporsi biaya pencegahan dan pemeriksaan</b>. Contoh laporannya ada di Tabel 8.1.",

"<b>Kesimpulan modul untuk PT Kacau Balau:</b>@@Perusahaan <b>belum menerapkan pengelolaan biaya lingkungan dengan baik</b>@@Penyebab: <b>biaya kegagalan tinggi</b> (internal maupun eksternal), sedangkan <b>biaya pencegahan dan pemeriksaan rendah</b>@@Bisa jadi perusahaan <b>baru mulai</b> memperhatikan lingkungan, terlihat dari adanya biaya <b>sertifikasi ISO 14001</b>||baru beli sepatu lari (sertifikasi), tapi tagihan berobat (kegagalan) masih mendominasi pengeluaran."],
"8.5":["<b><i>Triple bottom accounting</i></b> = kerangka akuntansi yang melihat dari <b>tiga sisi</b>: <i>people</i> (orang), <i>planet</i> (lingkungan), dan <i>profit</i>.||rapor dengan tiga mata pelajaran, bukan satu nilai: manusia, alam, dan untung.",

M[0].bq[7]=[["Menurut modul, tuntutan agar perusahaan ramah lingkungan berasal dari...", ["Hanya dari pemerintah", "Hanya dari pemegang saham", "Pemerintah yang membuat peraturan, dan perusahaan yang memasukkan unsur ramah lingkungan ke dalam strategi usahanya", "Hanya dari pesaing"], 2, "Tuntutan bukan hanya dari pemerintah (yang makin banyak membuat peraturan), tetapi juga dari perusahaan yang memasukkan unsur ramah lingkungan sebagai bagian strategi usaha."], ["Eco-efisien berarti kemampuan perusahaan untuk...", ["Memproduksi sebanyak mungkin tanpa memperhatikan lingkungan", "Memproduksi barang yang memuaskan konsumen dengan biaya kompetitif sekaligus mengurangi dampak negatif terhadap lingkungan", "Menghentikan semua produksi yang menghasilkan limbah", "Menjual produk dengan harga tertinggi"], 1, "Eco-efisien menggabungkan biaya yang kompetitif dengan berkurangnya dampak negatif terhadap lingkungan."], ["Menurut IFAC (2005), akuntansi manajemen lingkungan merupakan...", ["Laporan pajak lingkungan tahunan", "Audit eksternal atas laporan keuangan", "Pencatatan donasi untuk kegiatan lingkungan", "Pengelolaan lingkungan sekaligus kinerja ekonomi organisasi melalui pengembangan dan implementasi sistem dan praktik akuntansi yang sesuai kebutuhan organisasi"], 3, "Definisi IFAC (2005): environmental management accounting adalah pengelolaan lingkungan sekaligus kinerja ekonomi organisasi."], ["Tiga hal utama dalam akuntansi manajemen lingkungan adalah...", ["Kepatuhan, eco-efisien, dan posisi stratejik", "Pencegahan, pemeriksaan, dan kegagalan", "People, planet, dan profit", "Biaya, volume, dan laba"], 0, "Modul menyebut tiga hal utama: kepatuhan (compliance), eco-efisien, dan posisi stratejik."], ["Fungsi kepatuhan (compliance) menuntut akuntansi manajemen lingkungan untuk...", ["Menghitung pajak penghasilan perusahaan", "Memonitor harga bahan baku", "Memberi informasi kepatuhan perusahaan terhadap peraturan lingkungan, baik buatan perusahaan sendiri maupun buatan pemerintah", "Menyusun program jangka panjang"], 2, "Kepatuhan berkaitan dengan peraturan lingkungan yang dibuat perusahaan sendiri maupun pemerintah."], ["Memonitor efisiensi penggunaan bahan baku, bahan bakar, dan air beserta dampaknya terhadap lingkungan dan biaya merupakan fungsi...", ["Kepatuhan", "Eco-efisien", "Posisi stratejik", "Triple bottom accounting"], 1, "Fungsi eco-efisien memonitor efisiensi penggunaan sumber daya alam, dampaknya terhadap lingkungan, dan biaya yang dikeluarkan."], ["Fungsi posisi stratejik menuntut akuntansi manajemen lingkungan untuk...", ["Menghitung titik impas produk", "Menentukan harga jual produk", "Memeriksa ada tidaknya kontaminasi pada produk", "Memonitor apakah biaya program lingkungan yang dikeluarkan dapat mencapai tujuan jangka panjang perusahaan"], 3, "Organisasi membuat program lingkungan untuk tujuan jangka panjang, dan akuntansi memonitor apakah biaya yang dikeluarkan mencapai tujuan itu."], ["Pengelolaan dan pengendalian biaya lingkungan dilakukan dengan membagi biaya lingkungan menjadi...", ["Empat bagian: pencegahan, pemeriksaan, kegagalan internal, dan kegagalan eksternal", "Tiga bagian: pencegahan, pemeriksaan, dan kegagalan", "Dua bagian: internal dan eksternal", "Empat bagian: people, planet, profit, dan process"], 0, "Modul membagi biaya lingkungan menjadi empat bagian: prevention, appraisal, internal failure, dan external failure costs."], ["Memperoleh sertifikasi ISO 14001 termasuk biaya lingkungan yang bersifat...", ["Pemeriksaan", "Kegagalan internal", "Pencegahan", "Kegagalan eksternal"], 2, "Sertifikasi ISO 14001 termasuk contoh environmental prevention costs (juga pada Tabel 8.1 masuk biaya pencegahan lingkungan)."], ["Manakah yang termasuk biaya lingkungan yang bersifat pencegahan?", ["Melakukan audit terhadap aktivitas yang berkaitan dengan lingkungan", "Merancang proses produksi yang ramah lingkungan", "Membuang ekses produksi yang tidak ramah lingkungan", "Membersihkan sungai yang tercemar"], 1, "Conto ntoh biaya karena...", ["Kegagalan eksternal", "Pencegahan", "Pemeriksaan", "Kegagalan internal"], 0, "Elemen perusak lingkungan ternyata mengkontaminasi lingkungan, sehingga termasuk environmental external failure costs."], ["Realized external failure costs adalah biaya yang...", ["Ditanggung oleh pihak lain di luar perusahaan", "Dikeluarkan untuk memperoleh sertifikasi lingkungan", "Dikeluarkan untuk mencegah kontaminasi", "Benar-benar dikeluarkan perusahaan karena kontaminasi atau kerusakan lingkungan akibat kegiatan operasinya"], 3, "Realized: benar-benar dikeluarkan perusahaan. Unrealized (societal): ditanggung pihak lain di luar perusahaan."], ["Unrealized external failure (societal) costs adalah biaya kerusakan lingkungan yang berasal dari operasi perusahaan, tetapi...", ["Dibayar penuh oleh perusahaan", "Ditanggung oleh pihak lain di luar perusahaan", "Tidak pernah menimbulkan kerugian", "Sudah dicegah sebelumnya"], 1, "Kerusakan memang berasal dari kegiatan perusahaan, namun biayanya ditanggung pihak lain di luar perusahaan."], ["Manakah yang merupakan contoh unrealized external failure costs menurut modul?", ["Biaya membersihkan minyak yang tertumpah di laut", "Biaya ganti-rugi kepada penduduk atau pihak ketiga", "Kesehatan penduduk yang menurun karena sungai terkontaminasi", "Biaya audit aktivitas yang berkaitan dengan lingkungan"], 2, "Contoh unrealized: kesehatan penduduk menurun dan hilangnya mata pencaharian nelayan. Membersihkan tumpahan dan ganti-rugi adalah contoh realized."], ["Prinsip pengelolaan biaya lingkungan sama dengan prinsip pengelolaan...", ["Biaya kualitas", "Analisis cost volume profit", "Target costing", "Anggaran induk"], 0, "Modul menyebut prinsip pengelolaan biaya lingkungan sama dengan pengelolaan biaya kualitas yang dibahas di modul sebelumnya."], ["Biaya lingkungan terbesar yang dihadapi perusahaan menurut modul adalah biaya...", ["Pencegahan", "Pemeriksaan", "Kegagalan internal", "Kegagalan eksternal"], 3, "Biaya kegagalan eksternal memang tidak sering muncul, tetapi jika muncul dapat sangat besar, bahkan menimbulkan kebangkrutan."], ["Untuk mengelola atau mengurangi biaya yang terkait dengan lingkungan, perusahaan harus...", ["Memperbanyak proporsi biaya kegagalan eksternal", "Memperbanyak proporsi biaya yang bersifat pencegahan dan pemeriksaan", "Menghentikan semua biaya lingkungan", "Mengalihkan seluruh biaya lingkungan ke pihak lain"], 1, "Dengan pencegahan dan pemeriksaan yang lebih banyak, biaya kegagalan dapat ditekan."], ["Kasus lumpur Lapindo dipakai modul untuk menggambarkan bahwa biaya kegagalan eksternal...", ["Sering muncul tetapi nilainya kecil", "Selalu dapat dicegah dengan sertifikasi", "Tidak sering muncul, tetapi jika muncul dapat sangat besar bahkan menimbulkan kebangkrutan", "Hanya terjadi pada perusahaan kecil"], 2, "Biaya kegagalan eksternal jarang muncul, namun dampaknya dapat amat besar, dalam kasus ekstrem sampai kebangkrutan perusahaan."], ["Pada Tabel 8.1 PT Kacau Balau, total biaya lingkungan adalah...", ["Rp6.725.000.000", "Rp7.725.000.000", "Rp6.000.000.000", "Rp5.000.000.000"], 0, "400.000.000 + 325.000.000 + 1.000.000.000 + 5.000.000.000 = 6.725.000.000. Subtotal eksternal di modul tertulis 6.000.000.000, padahal 1.800.000.000 + 3.200.000.000 = 5.000.000.000."], ["Pada Tabel 8.1, persentase biaya kegagalan eksternal sebesar 74,35% diperoleh dari...", ["6.000.000.000 / 6.725.000.000", "3.200.000.000 / 6.725.000.000", "1.800.000.000 / 6.725.000.000", "5.000.000.000 / 6.725.000.000"], 3, "5.000.000.000 / 6.725.000.000 = 74,35%. Jika memakai 6.000.000.000 hasilnya 89,22%, tidak sesuai angka di tabel."], ["Pada Tabel 8.1, biaya pencegahan Rp400.000.000 dari total Rp6.725.000.000 adalah sekitar...", ["4,83%", "5,95%", "14,87%", "10,78%"], 1, "400.000.000 / 6.725.000.000 = 5,95%. Angka 4,83% adalah biaya pemeriksaan, dan 14,87% adalah kegagalan internal."], ["Kesimpulan modul dari Tabel 8.1 PT Kacau Balau adalah...", ["Perusahaan sudah menerapkan pengelolaan biaya lingkungan dengan baik", "Perusahaan tidak memiliki biaya lingkungan", "Perusahaan belum menerapkan pengelolaan biaya lingkungan dengan baik, tercermin dari tingginya biaya kegagalan serta rendahnya biaya pencegahan dan pemeriksaan", "Biaya pemeriksaan perusahaan terlalu tinggi"], 2, "Biaya kegagalan internal dan eksternal tinggi, sedangkan biaya pencegahan dan pemeriksaan rendah."], ["Adanya biaya sertifikasi ISO 14001 pada PT Kacau Balau menunjukkan bahwa...", ["Perusahaan bisa jadi baru mulai memberikan perhatian lebih pada lingkungan", "Perusahaan sudah memiliki pengelolaan lingkungan terbaik", "Perusahaan akan segera bangkrut", "Perusahaan tidak peduli terhadap lingkungan"], 0, "Modul menyebut kemungkinan perusahaan baru mau memulai memberi perhatian lebih pada lingkungan, tercermin dari biaya memperoleh sertifikasi ISO 14001."], ["Triple bottom accounting melihat perusahaan dari tiga sisi, yaitu...", ["Pencegahan, pemeriksaan, dan kegagalan", "Kepatuhan, eco-efisien, dan posisi stratejik", "Biaya, volume, dan laba", "People, planet, dan profit"], 3, "Triple bottom accounting: people (orang), planet (lingkungan), dan profit."], ["Menurut penelitian Collin dan Porras (2004), perusahaan yang dapat bertahan sukses dalam waktu lama adalah perusahaan yang...", ["Hanya berfokus memaksimalkan kekayaan pemegang saham", "Berusaha mencapai beberapa tujuan (cluster of objectives), dengan kekayaan pemegang saham hanya sebagai salah satunya", "Tidak memiliki tujuan jangka panjang", "Menghindari pelaporan kepada pihak luar"], 1, "Perusahaan yang tujuan utamanya memaksimalkan kekayaan pemegang saham biasanya tidak bertahan lama."], ["Pelaporan yang hanya memfokuskan pada kinerja keuangan dianggap tidak cukup karena...", ["Terlalu rumit untuk dibuat", "Tidak diwajibkan oleh pemerintah", "Hanya mencerminkan kinerja jangka pendek perusahaan", "Terlalu mahal untuk dipublikasikan"], 2, "Menurut modul, pelaporan yang hanya berfokus pada kinerja keuangan hanya mencerminkan kinerja jangka pendek."], ["Kesulitan utama dalam menerapkan triple bottom accounting adalah...", ["Menyiapkan laporan yang dapat menggabungkan ketiga elemen (people, planet, profit)", "Menghitung pajak penghasilan", "Menentukan harga jual produk", "Menyusun anggaran induk"], 0, "Kesulitan utamanya adalah menyiapkan laporan yang menggabungkan ketiga elemen."], ["Contoh laporan triple bottom accounting yang disebut dalam modul adalah laporan yang dibuat oleh...", ["IFAC", "Cascade Engineering", "PT Kacau Balau", "Collin dan Porras"], 1, "Contohnya laporan Cascade Engineering (www.cascadeng.com/triple-bottom-line)."]];

/* ===== BAB IX: Landasan Sistem Pengendalian Stratejik ===== */
(()=>{
Object.assign(M[0].mat,{
"9.1":["Mayoritas perusahaan besar memiliki <b>sistem perencanaan yang sudah terstruktur</b>. Salah satunya, perusahaan-perusahaan tersebut sudah memiliki tujuan yang akan dicapai dan rencana-rencana yang akan dilakukan di masa depan. Perencanaan yang bersifat jangka panjang, biasanya tiga atau lima tahunan, disebut dengan <b>rencana stratejik (<i>strategic plan</i>)</b>, sedangkan rencana tahunan salah satunya diwujudkan dalam bentuk <b>anggaran</b>.", "Namun demikian, banyak perusahaan mengalami <b>kesulitan untuk mengimplementasikan rencana mereka</b>, terutama yang berkaitan dengan rencana stratejik. Dalam <i>survey</i> yang dilakukan pada awal tahun 80an, sebuah <i>survey</i> menemukan bahwa hanya <b>10%</b> dari rencana stratejik yang dimiliki perusahaan yang betul-betul efektif dilaksanakan. Sedangkan pada <i>survey</i> tahun 1999 yang dilakukan oleh majalah Fortune mengatakan bahwa <b>70%</b> dari permasalahan yang berkaitan dengan strategi terletak bukan pada perencanaannya, melainkan pada <b>eksekusinya</b>. (Kaplan dan Norton 2001).", "Berdasarkan uraian tersebut, maka pembahasan mengenai sistem pengendalian manajemen (<i>management control</i>) menjadi suatu hal yang penting."],
"9.2":["Menurut Anthony dan Govindarajan (2007), <b>sistem pengendalian manajemen</b> merupakan suatu proses dimana manajer berusaha untuk <b>mempengaruhi anggota-anggota organisasi untuk menjalankan strateji perusahaan</b>.", "Karena fokusnya pada implementasi strateji, maka seringkali sistem pengendalian manajemen juga disebut sebagai <b>sistem pengendalian stratejik</b>."],
"9.3":["Ada beberapa konsep sistem pengendalian stratejik, dari mulai yang bersifat tradisional seperti konsep yang dikemukakan oleh <b>Robert N. Anthony</b>, sampai dengan konsep yang terbaru yang dikemukakan oleh <b>Robert Simons</b>, yaitu konsep <b>Four Levers of Control</b>.", "Kesulitan dalam membuat orang bekerja untuk menjalankan strategi perusahaan dapat dilihat dari dua pendekatan:", "- <b>Pendekatan pertama: <i>agency theory</i>.</b> Dalam pendekatan ini yang bertindak sebagai <i>principal</i> adalah manajemen, sedangkan yang bertindak sebagai agen adalah karyawan dalam perusahaan. Menurut teori ini karyawan memiliki tujuan yang berbeda dengan tujuan perusahaan (yang diwakili oleh manajemen), sehingga jika tidak diawasi atau dikendalikan, maka karyawan atau anggota organisasi akan melakukan tindakan-tindakan yang menguntungkan diri mereka sendiri dan tidak sesuai dengan kepentingan perusahaan.", "- <b>Pendekatan kedua: Simons (2000).</b> Simons mengatakan bahwa pada dasarnya orang-orang yang bekerja di dalam perusahaan memiliki <b>itikad yang baik</b>, yaitu:", "- <b>1.</b> Orang ingin memberikan <b>kontribusi</b> bagi perusahaan.", "- <b>2.</b> Orang ingin melakukan <b>hal-hal yang benar</b> bagi perusahaan.", "- <b>3.</b> Orang ingin menyelesaikan sesuatu yang ditugaskan pada mereka dengan <b>baik</b>.", "- <b>4.</b> Orang ingin melakukan <b>inovasi</b>.", "Pada dasarnya orang-orang tersebut ingin melakukan pekerjaan yang kompeten bagi perusahaan. Namun demikian, ada hal-hal yang <b>menghambat</b> orang-orang itu untuk melakukan hal-hal yang disebutkan itu. Hal-hal yang menghambat itu disebut dengan <b><i>organizational block</i></b>. Agar orang-orang tersebut dapat menjalankan fungsinya dengan baik, maka <i>organizational block</i> tersebut harus dihilangkan. Untuk menghilangkan <i>organizational block</i> tersebut dapat dilakukan dengan konsep sistem pengendalian stratejik yang disebut dengan <i>Four Levers of Control</i>.", "Konsep <i>Four Levers of Control</i> mengatakan bahwa ada <b>empat sistem</b> yang dapat dipergunakan untuk membuat orang-orang bekerja sesuai dengan keinginan perusahaan, yaitu:", "- <b>1.</b> <i>Belief System</i>", "- <b>2.</b> <i>Boundary System</i>", "- <b>3.</b> <i>Diagnostic Control System</i>", "- <b>4.</b> <i>Interactive Control System</i>"],
"9.3.1":["<i>Organizational block</i> yang pertama merupakan penghalang orang-orang yang ada di dalam organisasi untuk <b>memberikan kontribusi</b> bagi perusahaan. Dengan mempergunakan <i>belief system</i> diharapkan <i>organizational block</i> tersebut dapat diatasi. <b><i>Belief system</i></b> adalah suatu kumpulan dari definisi organisasi yang senantiasa dikomunikasikan secara formal oleh senior manajer pada perusahaan tersebut, dan diupayakan untuk dijalankan secara sistematis dalam rangka memberikan <b>nilai-nilai dasar, tujuan dan arah</b> bagi perusahaan.", "Definisi organisasi yang dipakai dalam <i>belief system</i> adalah pernyataan misi (<i>mission statement</i>), dan nilai (<i>values</i>) yang dimiliki perusahaan. Dengan mempergunakan pernyataan misi, manajer berusaha memberikan arahan bagi para karyawan dalam melakukan tindakan-tindakannya.", "Dalam konteks sistem pengendalian stratejik, maka <i>mission statement</i> merupakan pernyataan mengenai <b>mengapa organisasi atau perusahaan didirikan</b>. Segala sesuatu yang dilakukan oleh perusahaan dan orang-orang yang ada dalam organisasi adalah dalam rangka menjalankan misi perusahaan. Dengan memiliki misi yang jelas, maka orang-orang yang ada didalam organisasi dapat diarahkan untuk memberikan kontribusi yang positif dalam rangka menjalankan misi perusahaan.", "Menurut Niven (2010), pernyataan misi yang baik harus mengandung unsur-unsur berikut:", "- <b>1. Menginspirasikan perubahan (<i>inspire change</i>).</b> Meskipun misi pada dasarnya jarang berubah, namun misi tersebut harus dapat menginspirasikan perubahan dalam organisasi. Misalkan misi dari 3M, yaitu <i>to solved unsolved problem innovatively</i>. Misi ini yang mendorong orang-orang yang ada dalam organisasi untuk terus menerus melakukan inovasi-inovasi produk baru yang dapat mempermudah kehidupan orang.", "- <b>2. Bersifat jangka panjang (<i>long term in nature</i>).</b> Misi ditulis untuk jangka waktu yang lama, bahkan sampai <b>100 tahun</b>. Meskipun visi dan strateji perusahaan terus berubah, namun misi tetap akan dijadikan landasan bagi organisasi untuk beroperasi.", "- <b>3. Mudah dimengerti dan dikomunikasikan.</b> Misi akan dikomunikasikan ke semua tingkatan yang ada di organisasi, maka sebaiknya misi dibuat dengan kata-kata yang mudah dimengerti, dikomunikasikan, dan diingat.", "<i>Belief system</i> yang baik seharusnya dapat membuat agar orang-orang yang ada dalam perusahaan memiliki <b>misi yang sama</b> dengan misi perusahaan, sehingga apa yang dilakukan orang-orang tersebut memang akhirnya bertujuan untuk menjalankan misi perusahaan. Salah satu contoh misi yang paling terkenal adalah misi dari <b>Disneyland</b>. Penyederhanaan misi dari Disneyland adalah <i>to make people happy</i>. Salah satu upaya Disneyland untuk menjalankan misinya adalah dengan selalu mengingatkan pada karyawan mereka, bahwa apapun posisi mereka dalam perusahaan, mereka adalah <b>aktor dan aktris</b> yang bertugas untuk menyenangkan orang yang berkunjung ke Disneyland.", "Namun demikian, hampir semua misi dari perusahaan yang berorientasi pada profit adalah mencari keuntungan sebesar-besarnya, atau meminjam istilah akuntansi manajemen keuangan adalah <b>memaksimalkan kekayaan pemegang saham</b>. Bahkan dalam pernyataan misi dari Disneyland, disebutkan bahwa misi dari Disneyland adalah untuk memaksimalkan kekayaan pemegang saham, namun hal itu dilakukan dengan cara <i>making people happy</i>. Apakah diperbolehkan perusahaan hanya memiliki satu misi yaitu memaksimalkan kekayaan pemegang saham? Jawabannya tentu saja <b>tidak diperbolehkan</b>. Namun menurut penelitian yang dikemukakan oleh <b>Collin dan Porras (2002)</b> bahwa perusahaan-perusahaan yang berumur panjang adalah perusahaan-perusahaan yang memiliki <b>sekumpulan misi</b>, dimana memaksimalkan kekayaan pemegang saham hanya merupakan salah satu dari misi tersebut, dan bukan yang terutama.", "Untuk melengkapi <i>mission statement</i> perusahaan, maka dibutuhkan pernyataan <b><i>values</i></b> untuk lebih memperjelas perilaku-perilaku apa yang seharusnya dilakukan oleh orang-orang tersebut dalam menjalankan misi perusahaan."],
"9.3.2":["<i>Levers of control</i> yang kedua adalah <b><i>boundary system</i></b>. <i>Boundary system</i> dibutuhkan, karena misi dan nilai perusahaan masih bersifat terlalu umum. <i>Boundary system</i> bertugas untuk memberikan <b>pagar</b> pada pernyataan misi dan nilai, sehingga orang-orang yang ada dalam perusahaan dapat lebih memahami apa yang <b>diperbolehkan dan tidak diperbolehkan</b> dalam perusahaan. Ada dua jenis <i>boundary system</i>, yaitu:", "- <b>1.</b> <i>Strategic Boundary</i>", "- <b>2.</b> <i>Business Conduct Boundary</i>", "<b><i>Strategic boundary</i></b> memberikan batasan mengenai <b>keputusan-keputusan stratejik</b> yang dapat diambil perusahaan dalam rangka menjalankan misinya. Contohnya adalah perusahaan <b>General Electric (GE)</b>. Dalam rangka memaksimalkan kekayaan pemegang saham, perusahaan ini banyak melakukan akuisisi atau investasi pada perusahaan-perusahaan lainnya, bahkan memang karyawan-karyawan pada perusahaan ini didorong untuk mencari target-target akuisisi yang menguntungkan perusahaan. Namun demikian, pencarian target akuisisi tersebut dibatasi dengan kebijakan yang mengatakan bahwa investasi hanya dapat dilakukan pada perusahaan-perusahaan yang memiliki potensi <b>nomor satu atau nomor dua</b> yang dibidangnya. Jika persyaratan tersebut tidak dapat dipenuhi, maka investasi tidak dapat dilakukan. Ada empat macam <i>strategic boundaries</i> yang biasa dipakai, yaitu:", "- <b>1.</b> Minimal posisi persaingan", "- <b>2.</b> Minimal tingkat pengembalian yang diperoleh", "- <b>3.</b> Produk atau jasa yang bukan merupakan kompetensi perusahaan", "- <b>4.</b> Posisi dan pesaing yang harus dihindari.", "<b><i>Business conduct boundaries</i></b> memberikan batasan pada <i>values</i> yang dimiliki organisasi, karena <i>values</i> dianggap masih terlalu luas. Karena itu dibutuhkan <i>business conduct boundaries</i> untuk lebih memperjelas hal-hal apa yang <b>diperbolehkan dan tidak diperbolehkan</b> dalam kaitannya dengan perilaku orang-orang yang ada dalam perusahaan.", "Dengan demikian, landasan dari perusahaan agar karyawan bekerja sesuai dengan keinginan perusahaan adalah dengan <b>menjelaskan apa misi perusahaan</b>, dan kemudian berupaya untuk menyamakan misi karyawan dengan misi perusahaan melalui <i>belief system</i>. Mempengaruhi orang agar bekerja untuk menjalankan strategi untuk mencapai visi perusahaan merupakan bagian dari menjalankan misi perusahaan. Namun demikian, pelaksanaan <i>belief system</i> tersebut harus diperjelas dengan <b>batasan-batasan (<i>boundaries</i>)</b> untuk lebih memastikan agar semua orang yang ada dalam organisasi, dalam menjalankan misi organisasi, tidak melakukan hal-hal yang dilarang oleh perusahaan."],
"9.3.3":["<i>Levers of control</i> yang ketiga adalah <b><i>diagnostic control system</i></b>. Berbeda dengan kedua sistem sebelumnya, <i>diagnostic control system</i> berfungsi untuk <b>memeriksa atau mendiagnosa</b> apakah strateji perusahaan sudah dijalankan, serta apakah tujuan dan visi perusahaan sudah tercapai atau belum.", "<b>Visi</b> merupakan cita-cita perusahaan, apa yang akan diharapkan dicapai perusahaan dalam suatu waktu tertentu, biasanya bersifat jangka panjang, yaitu <b>lima tahunan</b>. Pernyataan visi yang baik, menurut Niven (2010) sebaiknya:", "- <b>1. Tidak bertele-tele (<i>concise</i>).</b> Visi yang sederhana dapat diingat selalu oleh orang-orang yang ada dalam organisasi. Contohnya adalah visi awal Starbucks yaitu <b>2000 by 2000</b>, yaitu 2000 gerai toko pada tahun 2000.", "- <b>2. Tidak memihak (<i>appeal to stakeholders</i>).</b> Visi yang baik seharusnya tidak memfokuskan pada pihak tertentu, seperti pemegang saham saja, namun dapat mewakili semua <i>stakeholders</i> penting perusahaan.", "- <b>3. Konsisten dengan misi dan nilai perusahaan.</b> Visi dibuat dalam rangka menjalankan misi perusahaan, karena itu visi tidak boleh bertentangan dengan misi perusahaan.", "- <b>4. Dapat dibuktikan (<i>verifiable</i>).</b> Visi yang baik harus dapat dibuktikan dan diukur, karena itu visi yang baik harus memiliki KPI untuk mengukur apakah visi tersebut sudah tercapai atau belum. Selain itu, visi juga harus memiliki <b>tenggat waktu pencapaian visi</b>.", "- <b>5. Dapat dicapai (<i>feasible</i>).</b> Visi yang baik haruslah membumi, dalam artian visi tersebut dapat dicapai oleh perusahaan dalam suatu waktu tertentu.", "- <b>6. Inspirasional.</b>", "Visi yang baik adalah visi yang <b>terukur</b>, sehingga memiliki tolok ukur untuk melihat apakah visi tersebut sudah tercapai atau belum. Visi juga sebaiknya memiliki rentang waktu yang mengindikasikan kapan visi tersebut akan tercapai. Contoh visi yang baik adalah misalnya menjadi perusahaan yang memiliki pangsa pasar terbesar di Pulau Jawa pada tahun 2019. Tindakan atau cara yang dipilih perusahaan untuk mencapai visi disebut <b>strateji</b>. Baik visi maupun strateji merupakan produk dari proses perencanaan, yang tertuang dalam rencana stratejik perusahaan.", "Agar pencapaian visi dan tujuan, serta pelaksanaan strateji dapat dimonitor, maka dalam <i>diagnostic control system</i> dibutuhkan <b>tolok ukur</b> (<i>Key Performance Indicator</i>) untuk memonitor hal-hal tersebut. Selain itu, tolok ukur juga dapat dipergunakan untuk <b>mengarahkan orang-orang yang terdapat dalam perusahaan</b> agar bekerja untuk mencapai target-target yang terdapat dalam tolok ukur tersebut. Konsep yang paling baik untuk memilih tolok ukur yang sesuai dengan strateji perusahaan adalah <b><i>balanced scorecard</i></b>."],
"9.3.4":["Dalam pembahasan sebelumnya, terlihat bahwa sifat daripada <i>diagnostic control system</i> hanyalah untuk memastikan apakah strateji sudah dijalankan, dan apakah tujuan perusahaan sudah tercapai. Namun jangan dilupakan bahwa strateji perusahaan disusun berdasarkan suatu <b>asumsi tertentu</b>. Kondisi lingkungan eksternal perusahaan yang terus berubah, bisa membuat strateji yang disusun perusahaan menjadi usang. Perubahan lingkungan tersebut akan menimbulkan ancaman dan kesempatan yang baru bagi perusahaan, yang dapat menimbulkan suatu kondisi yang disebut dengan <b><i>strategic uncertainties</i></b> atau ketidakpastian strateji. Tujuan dari <b><i>interactive control system</i></b> adalah untuk <b>mendeteksi <i>strategic uncertainties</i> tersebut sedini mungkin</b>.", "Menurut Simons (2000), terdapat empat elemen yang harus diperhatikan agar perusahaan dapat memiliki <i>interactive control system</i> yang baik. Elemen-elemen tersebut adalah:", "- <b>1.</b> Informasi yang terkandung dalam <i>interactive control system</i> harus <b>mudah dimengerti</b>.", "- <b>2.</b> <i>Interactive control system</i> harus memberikan informasi mengenai ketidakpastian strateji (<i>strategic uncertainties</i>).", "- <b>3.</b> <i>Interactive control system</i> harus dapat dipakai oleh <b>seluruh tingkatan</b> dalam organisasi.", "- <b>4.</b> <i>Interactive control system</i> harus menghasilkan <b>rencana baru</b>.", "<b>Elemen pertama:</b> informasi dalam <i>interactive control system</i> diperoleh melalui KPI. Dalam hal ini, KPI yang harus dipilih adalah KPI yang mudah dimengerti dan mencerminkan ketidakpastian stratejik perusahaan. Artinya KPI yang dipilih harus dapat menangkap potensi adanya kemungkinan ancaman atau peluang baru yang dihadapi perusahaan. Misalnya, jika <i>strategic uncertainties</i> yang dihadapi adalah masalah <b>teknologi</b>, maka KPI yang dipilih untuk <i>interactive control system</i> adalah KPI yang dapat memonitor perubahan teknologi tersebut. Jika perusahaan berada dalam industri yang sudah <i>mature</i>, maka <i>strategic uncertainties</i> yang dihadapi berkaitan dengan tindakan-tindakan yang akan diambil oleh pesaing seperti promosi, diskon dan sebagainya, dan juga perubahan kebiasaan membeli dari pelanggan. Karena itu KPI yang dipilih untuk <i>interactive control system</i> harus bisa menangkap perubahan-perubahan tersebut. Dalam hal ini KPI yang dapat dipilih adalah <b><i>market share</i>, pendapatan per produk, dan pengiriman barang per produk</b>.", "KPI yang dipilih untuk <i>interactive control system</i> akan dimonitor <b>sesering mungkin</b>, sehingga KPI tersebut harus dapat diperbaharui (<i>up-date</i>) sesering mungkin. Dengan mempergunakan KPI tersebut diharapkan perusahaan dapat menangkap ancaman dan kesempatan yang dihadapi perusahaan sedini mungkin.", "Meskipun perusahaan sudah dapat memonitor <i>strategic uncertainties</i> tersebut, hal yang penting lainnya adalah apa yang akan dilakukan perusahaan apabila memang terdapat ancaman atau kesempatan yang baru. Terkadang ancaman dan kesempatan tersebut dapat terdeteksi dengan cepat, namun karena masalah struktur organisasi yang terlalu berjenjang menyebabkan pengambilan keputusan tidak dapat dilakukan secepatnya. Hal ini menyebabkan deteksi dini dari ancaman dan kesempatan tersebut menjadi sia-sia. Untuk itu, dalam <i>interactive control system</i> juga dibutuhkan mekanisme yang dapat membuat rentang waktu antara deteksi ancaman-kesempatan dengan waktu pengambilan keputusan dapat dilakukan secepat mungkin.", "Karena itu, elemen kedua dalam <i>interactive control system</i> adalah adanya <b>pertemuan</b> yang dilakukan oleh perusahaan yang dihadiri setiap jenjang yang ada dalam perusahaan tersebut, termasuk manajemen puncak. Pertemuan tersebut dilakukan khusus membicarakan mengenai KPI yang dipergunakan untuk <i>interactive control system</i> tersebut. Jika terjadi perubahan yang <i>significant</i> pada angka KPI tersebut, misalkan ada penurunan penjualan pada minggu tersebut, maka semua orang dalam perusahaan berusaha mencari penyebab hal tersebut terjadi, dan kemudian didiskusikan dalam pertemuan tersebut. Pertemuan tersebut harus menghasilkan <b>tindakan-tindakan apa yang akan dilakukan</b> untuk mengatasi masalah tersebut. Dengan demikian melalui <i>interactive control system</i> ini, seluruh karyawan diharapkan dapat berpikir <b>innovatif</b> untuk mengantisipasi perubahan lingkungan tersebut.", "Sering apa yang dilakukan dalam <i>interactive control system</i> ini akan menghasilkan <b><i>emergent strategy</i></b>, yaitu strateji yang tidak terdapat dalam rencana stratejik perusahaan, namun muncul karena adanya perubahan lingkungan yang dihadapi perusahaan. Akhirnya, strateji yang benar-benar dijalankan perusahaan (<b><i>realized strategy</i></b>) adalah gabungan antara strateji awal perusahaan dengan <i>emergent strategy</i> tersebut.", "Kembali lagi pada pembahasan awal, bahwa orang-orang dalam perusahaan ingin bekerja dengan kompeten, namun terdapat <i>organizational block</i> yang menghalangi hal tersebut terjadi. Konsep <i>four levers of control</i> berusaha untuk menghilangkan <i>organizational block</i> tersebut dengan cara:", "- <b>1. <i>Belief system</i></b>, dalam <i>belief system</i> perusahaan harus memiliki misi dan <i>values</i> yang jelas, sehingga orang-orang yang bekerja dalam perusahaan dapat memberikan kontribusi (<i>contribute</i>) bagi perusahaan tersebut, karena mereka menganggap bahwa mereka adalah bagian dari perusahaan untuk menjalankan misinya.", "- <b>2. <i>Boundary system</i></b>, kontrol ini memperjelas lagi apa yang boleh dilakukan dan apa yang tidak boleh dilakukan. Dengan <i>boundary system</i> yang jelas dan <i>punishment system</i> yang berjalan dengan baik jika <i>boundary</i> tersebut dilanggar, maka diharapkan orang-orang akan melakukan apa yang diperbolehkan atau apa yang benar bagi perusahaan.", "- <b>3. <i>Diagnostic control system</i></b> yang baik akan membuat orang-orang dapat <i>focus</i> untuk mengerjakan hal-hal yang memang diinginkan perusahaan. Hal ini tercapai, karena orang-orang tersebut diarahkan untuk bekerja sesuai dengan KPI yang diturunkan dari rencana stratejik perusahaan. Dengan demikian, seluruh sumber daya yang dimiliki perusahaan, termasuk orang, tidak akan terbuang melakukan sesuatu yang bukan merupakan strateji perusahaan.", "- <b>4. <i>Interactive control system</i></b> memberikan kesempatan bagi pegawai perusahaan untuk lebih innovative untuk mencari cara mengatasi perubahan-perubahan yang terjadi pada lingkungan eksternal perusahaan."]

"9.1":["Hampir semua perusahaan besar punya <b>sistem perencanaan yang terstruktur</b>: ada tujuan dan rencana ke depan. Rencana <b>jangka panjang</b> (biasanya 3 atau 5 tahun) disebut <b>rencana stratejik (<i>strategic plan</i>)</b>, sedangkan rencana <b>tahunan</b> salah satunya diwujudkan dalam <b>anggaran</b>.||rencana stratejik itu peta perjalanan 5 tahun, anggaran itu bekal untuk perjalanan tahun ini.", "Masalahnya, banyak perusahaan <b>kesulitan mengimplementasikan</b> rencana itu:@@<i>Survey</i> awal 80an: hanya <b>10%</b> rencana stratejik yang betul-betul efektif dilaksanakan@@<i>Survey</i> majalah Fortune 1999: <b>70%</b> masalah terkait strategi ada di <b>eksekusi</b>, bukan di perencanaan (Kaplan dan Norton 2001)||rencana diet sudah rapi di kertas, tapi gagal karena nggak dijalankan.", "Karena itu, pembahasan <b>sistem pengendalian manajemen</b> (<i>management control</i>) jadi penting."],
"9.2":["Menurut Anthony dan Govindarajan (2007), <b>sistem pengendalian manajemen</b> = proses di mana manajer berusaha <b>mempengaruhi anggota organisasi untuk menjalankan strateji perusahaan</b>.", "Karena fokusnya ke <b>implementasi strateji</b>, sistem ini sering juga disebut <b>sistem pengendalian stratejik</b>."],
"9.3":["Ada beberapa konsep pengendalian stratejik: yang <b>tradisional</b> dari <b>Robert N. Anthony</b>, dan yang <b>terbaru</b> dari <b>Robert Simons</b>, yaitu <b><i>Four Levers of Control</i></b>.", "Kenapa susah bikin orang kerja sesuai strategi? Ada <b>dua pendekatan</b>:@@<b><i>Agency theory</i>:</b> manajemen = <i>principal</i>, karyawan = agen. Tujuan karyawan beda dengan tujuan perusahaan, jadi kalau nggak dikendalikan, mereka bisa bertindak demi kepentingan sendiri@@<b>Simons (2000):</b> orang sebenarnya beritikad baik. Mereka ingin <b>berkontribusi</b>, ingin melakukan <b>hal yang benar</b>, ingin menyelesaikan tugas dengan <b>baik</b>, dan ingin <b>berinovasi</b>||dua cara pandang: karyawan 'perlu diawasi' (agency theory) atau karyawan 'sebenarnya mau berprestasi, tinggal dihilangkan penghalangnya' (Simons).", "Orang-orang itu ingin kerja kompeten, tapi ada yang <b>menghambat</b>: <b><i>organizational block</i></b>. Supaya mereka bisa bekerja baik, <i>organizational block</i> harus <b>dihilangkan</b> lewat <i>Four Levers of Control</i>.", "Empat sistemnya:@@<b><i>Belief system</i></b>@@<b><i>Boundary system</i></b>@@<b><i>Diagnostic control system</i></b>@@<b><i>Interactive control system</i></b>||ingat urutannya: Percaya, Batasi, Periksa, Interaksi (B-B-D-I)."],
"9.3.1":["<i>Organizational block</i> pertama: penghalang orang untuk <b>berkontribusi</b>. Solusinya <b><i>belief system</i></b>, yaitu kumpulan definisi organisasi yang <b>terus dikomunikasikan secara formal</b> oleh senior manajer dan dijalankan secara sistematis untuk memberi <b>nilai dasar, tujuan, dan arah</b>.", "Isinya dua hal: <b>pernyataan misi (<i>mission statement</i>)</b> dan <b>nilai (<i>values</i>)</b>. Misi = pernyataan <b>mengapa perusahaan didirikan</b>. Dengan misi yang jelas, semua orang bisa diarahkan memberi kontribusi positif.||misi itu 'alasan lahirnya' perusahaan, seperti alasan seseorang membuka warung.", "Misi yang baik menurut <b>Niven (2010)</b>:@@<b>Menginspirasikan perubahan (<i>inspire change</i>):</b> misi jarang berubah, tapi harus bisa menginspirasi perubahan. Contoh <b>3M</b>: <i>to solved unsolved problem innovatively</i>, mendorong inovasi produk baru yang mempermudah hidup orang@@<b>Jangka panjang (<i>long term in nature</i>):</b> ditulis untuk waktu lama, bahkan sampai <b>100 tahun</b>. Visi dan strateji terus berubah, misi tetap@@<b>Mudah dimengerti dan dikomunikasikan:</b> kata-katanya sederhana, gampang diingat", "<b>Contoh Disneyland:</b> misinya <i>to make people happy</i>. Karyawan terus diingatkan bahwa apa pun posisinya, mereka adalah <b>aktor dan aktris</b> yang bertugas menyenangkan pengunjung.||tukang sapu Disneyland pun 'berperan' di panggung, bukan sekadar bersih-bersih.", "Tapi hampir semua misi perusahaan yang berorientasi profit tetap <b>mencari untung sebesar-besarnya</b> (<b>memaksimalkan kekayaan pemegang saham</b>), termasuk Disneyland, yang melakukannya lewat <i>making people happy</i>. Bolehkah hanya punya satu misi itu? <b>Tidak.</b> Penelitian <b>Collin dan Porras (2002)</b>: perusahaan berumur panjang punya <b>sekumpulan misi</b>, dan memaksimalkan kekayaan pemegang saham hanya <b>salah satunya</b>, bukan yang terutama.", "Untuk melengkapi misi, perlu pernyataan <b><i>values</i></b> supaya jelas <b>perilaku apa</b> yang seharusnya dilakukan orang dalam menjalankan misi."],
"9.3.2":["<b><i>Boundary system</i></b> dibutuhkan karena misi dan nilai masih <b>terlalu umum</b>. Tugasnya memberi <b>pagar</b> supaya orang paham apa yang <b>boleh dan tidak boleh</b> dilakukan.||misi = 'ayo ke tujuan', boundary = rambu lalu lintas supaya nggak nyasar atau melanggar.", "Dua jenis:@@<b><i>Strategic boundary</i></b>@@<b><i>Business conduct boundary</i></b>", "<b><i>Strategic boundary</i></b> = batasan <b>keputusan stratejik</b> yang boleh diambil. <b>Contoh GE:</b> untuk memaksimalkan kekayaan pemegang saham, GE banyak mengakuisisi dan karyawannya didorong mencari target akuisisi yang menguntungkan. Tapi ada batas: investasi hanya boleh pada perusahaan yang berpotensi <b>nomor satu atau nomor dua</b> di bidangnya. Kalau syarat itu nggak terpenuhi, investasi <b>tidak boleh</b> dilakukan.", "Empat macam <i>strategic boundaries</i>:@@<b>Minimal posisi persaingan</b>@@<b>Minimal tingkat pengembalian</b> yang diperoleh@@<b>Produk atau jasa</b> yang bukan kompetensi perusahaan@@<b>Posisi dan pesaing</b> yang harus dihindari", "<b><i>Business conduct boundary</i></b> = batasan atas <b><i>values</i></b>, karena <i>values</i> dianggap masih terlalu luas. Memperjelas apa yang <b>diperbolehkan dan tidak</b> terkait <b>perilaku</b> orang dalam perusahaan.", "<b>Intinya:</b> agar karyawan bekerja sesuai keinginan perusahaan, perusahaan <b>menjelaskan misi</b>, lalu menyamakan misi karyawan dengan misi perusahaan lewat <i>belief system</i>. Pelaksanaannya diperjelas dengan <b><i>boundaries</i></b> supaya orang <b>tidak melakukan hal yang dilarang</b>."],
"9.3.3":["<b><i>Diagnostic control system</i></b> berbeda dari dua sistem sebelumnya: fungsinya <b>memeriksa atau mendiagnosa</b> apakah strateji sudah dijalankan, dan apakah <b>tujuan dan visi</b> sudah tercapai.||seperti cek kesehatan berkala: bukan mengobati, tapi memastikan keadaan sesuai target.", "<b>Visi</b> = cita-cita perusahaan: apa yang diharapkan tercapai dalam waktu tertentu, biasanya jangka panjang, yaitu <b>lima tahunan</b>.", "Visi yang baik menurut <b>Niven (2010)</b>:@@<b>Tidak bertele-tele (<i>concise</i>):</b> sederhana, mudah diingat. Contoh visi awal Starbucks <b>2000 by 2000</b> (2000 gerai pada tahun 2000)@@<b>Tidak memihak (<i>appeal to stakeholders</i>):</b> tidak hanya fokus ke pemegang saham, tapi mewakili semua <i>stakeholders</i> penting@@<b>Konsisten dengan misi dan nilai:</b> visi dibuat untuk menjalankan misi, jadi tidak boleh bertentangan@@<b>Dapat dibuktikan (<i>verifiable</i>):</b> terukur, punya <b>KPI</b> dan <b>tenggat waktu</b>@@<b>Dapat dicapai (<i>feasible</i>):</b> membumi, bisa dicapai dalam waktu tertentu@@<b>Inspirasional</b>||ingat singkatan 'CAKDDI': Concise, Appeal, Konsisten, Dapat dibuktikan, Dapat dicapai, Inspirasional.", "Visi yang baik itu <b>terukur</b> dan punya <b>rentang waktu</b>. Contoh: menjadi perusahaan dengan <b>pangsa pasar terbesar di Pulau Jawa pada tahun 2019</b>. Cara yang dipilih untuk mencapai visi disebut <b>strateji</b>. Visi dan strateji sama-sama produk <b>perencanaan stratejik</b>.", "Supaya pencapaian visi, tujuan, dan pelaksanaan strateji bisa dimonitor, <i>diagnostic control system</i> butuh <b>tolok ukur (<i>Key Performance Indicator</i>)</b>. Tolok ukur juga <b>mengarahkan orang</b> agar bekerja untuk mencapai target. Konsep terbaik untuk memilih tolok ukur yang sesuai strateji adalah <b><i>balanced scorecard</i></b>."],
"9.3.4":["<i>Diagnostic control system</i> hanya memastikan strateji dijalankan dan tujuan tercapai. Padahal strateji disusun berdasarkan <b>asumsi tertentu</b>, dan lingkungan eksternal terus berubah sehingga strateji bisa <b>usang</b>. Perubahan itu memunculkan ancaman dan kesempatan baru: <b><i>strategic uncertainties</i></b>. Tujuan <b><i>interactive control system</i></b> = <b>mendeteksi <i>strategic uncertainties</i> sedini mungkin</b>.||radar di kapal: bukan menentukan tujuan pelayaran, tapi mendeteksi badai atau pulau baru sedini mungkin.", "Empat elemen menurut <b>Simons (2000)</b>:@@Informasi <b>mudah dimengerti</b>@@Memberi informasi tentang <b><i>strategic uncertainties</i></b>@@Dipakai oleh <b>seluruh tingkatan</b> organisasi@@Menghasilkan <b>rencana baru</b>", "<b>Elemen 1:</b> informasi diperoleh lewat <b>KPI</b> yang mudah dimengerti dan mencerminkan ketidakpastian stratejik. Contoh:@@Ketidakpastian <b>teknologi</b> &rarr; KPI yang memonitor perubahan teknologi@@Industri yang sudah <b><i>mature</i></b> &rarr; ketidakpastiannya tindakan pesaing (promosi, diskon, dll.) dan perubahan kebiasaan membeli pelanggan; KPI-nya: <b><i>market share</i>, pendapatan per produk, pengiriman barang per produk</b>||KPI interaktif dipantau sesering mungkin, jadi harus bisa di-<i>update</i> sesering mungkin.", "<b>Elemen 2: pertemuan.</b> Deteksi dini percuma kalau keputusan lambat (misalnya karena struktur organisasi terlalu berjenjang). Maka perusahaan mengadakan <b>pertemuan khusus</b> yang dihadiri <b>setiap jenjang, termasuk manajemen puncak</b>, untuk membahas KPI interaktif. Kalau angka KPI berubah <i>significant</i> (misal penjualan turun minggu ini), semua orang mencari penyebabnya, didiskusikan, dan pertemuan harus menghasilkan <b>tindakan</b>. Karyawan diharapkan berpikir <b>innovatif</b> mengantisipasi perubahan.", "Hasilnya sering berupa <b><i>emergent strategy</i></b> = strateji yang <b>tidak ada dalam rencana stratejik</b> tapi muncul karena perubahan lingkungan. Strateji yang benar-benar dijalankan (<b><i>realized strategy</i></b>) = <b>strateji awal + <i>emergent strategy</i></b>.||rencana awal liburan ke pantai, tiba-tiba hujan, lalu pindah ke museum. Liburan yang benar-benar terjadi = gabungan keduanya.", "<b>Kesimpulan: bagaimana empat levers menghilangkan <i>organizational block</i>:</b>@@<b><i>Belief system</i>:</b> misi dan <i>values</i> jelas, orang berkontribusi karena merasa menjadi bagian dari perusahaan@@<b><i>Boundary system</i>:</b> memperjelas yang boleh dan tidak; dengan batas yang jelas dan <i>punishment system</i> yang berjalan baik, orang melakukan yang diperbolehkan@@<b><i>Diagnostic control system</i>:</b> orang <i>focus</i> mengerjakan yang diinginkan perusahaan lewat KPI turunan rencana stratejik, sehingga sumber daya tidak terbuang untuk hal di luar strateji@@<b><i>Interactive control system</i>:</b> memberi kesempatan pegawai lebih innovative mencari cara mengatasi perubahan lingkungan eksternal"]
});
