<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f7fd;color:#12243d}
header{background:#e8f0fd;color:#12243d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #d3e1f6}
header img{width:32px;height:32px;background:#fff;border-radius:50%}header b{flex:1;font-size:18px}
main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
h2{margin:6px 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
button,.btn{background:#1565d8;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
button.sec{background:#e3edfc;color:#1565d8}button.sm{padding:6px 10px;font-size:13px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d3e8;border-radius:10px;font-size:16px;margin:4px 0 8px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:480px;background:#fff;display:flex;gap:4px;padding:6px;border-radius:18px;box-shadow:0 4px 18px #12243d2e;z-index:6}
nav button{flex:1;background:none;color:#6b7c93;border-radius:12px;padding:7px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#1565d8;background:#e8f0fd}
#auth{max-width:380px;margin:8vh auto;padding:20px;text-align:center}#auth img{width:90px}
.bar{height:8px;background:#e3edfc;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#1565d8}
.opt{display:block;padding:9px 10px;border:1px solid #c5d3e8;border-radius:10px;margin:6px 0;cursor:pointer}
.ok{background:#e4f6e9;border-color:#2e9e53}.bad{background:#fdeaea;border-color:#d64545}
.exp{font-size:13px;background:#fff8e1;padding:8px;border-radius:8px;margin-top:6px}
li{margin:4px 0}.muted{color:#6b7c93;font-size:13px}.row{display:flex;gap:8px;align-items:center}
.day{border-left:4px solid #1565d8;padding-left:10px;margin:10px 0}.day.today{background:#eaf2ff}.day.done{opacity:.55}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#12243d;color:#fff;padding:8px 14px;border-radius:20px;display:none}
.ib{background:none;color:#1565d8;padding:0;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}.ib:hover{background:#1565d822}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.dark{background:#0f1a2b;color:#e6edf7}.dark header{background:#17263d;color:#e6edf7;border-color:#2c3f5c}.dark .ib{color:#8ec0ff}
.dark .card,.dark nav{background:#17263d}.dark input,.dark select{background:#0f1a2b;color:#e6edf7;border-color:#2c3f5c}
.dark button.sec,.dark nav button.on{background:#22375a;color:#8ec0ff}.dark nav button{color:#93a4bd}.dark nav button.on{color:#8ec0ff}
.dark .bar{background:#22375a}.dark .opt{border-color:#2c3f5c}.dark .ok{background:#16382a;border-color:#2e9e53}.dark .bad{background:#3d1f22;border-color:#d64545}
.dark .exp{background:#3a3217;color:#f2e6b0}.dark .day.today{background:#1a2e4d}.dark .muted{color:#93a4bd}.dark a{color:#8ec0ff}
.cov{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px 10px;box-shadow:0 3px 10px #0003;border:3px solid #fff}
.cov i{position:absolute;left:-20%;right:-20%;bottom:-15%;height:45%;background:#ffffff22;transform:skewY(-14deg)}
.cov b{position:relative;font-size:15px;line-height:1.25;text-transform:uppercase}.cov small{position:absolute;bottom:8px;left:0;right:0;font-size:10px;opacity:.85}

function tocHtml(m){if(!m.toc)return'';return '<div class="card"><h3>Daftar Isi</h3>'+m.toc.map((b,k)=>`<div class="bab" onclick="showBab(${k})"><span><b>${b[0]}</b> ${b[1]}</span><i>&#9656;</i></div>`).join('')+'</div>'}
function grp(b){const g=[];b[2].forEach(x=>{const d=x.split(' ')[0].split('.').length;if(d>2&&g.length)g[g.length-1].c.push(x);else g.push({t:x,c:[]})});return g}
function pop(id,html){let o=document.getElementById(id);if(!o){o=document.createElement('div');o.id=id;o.className='modal';o.onclick=e=>{if(e.target===o)o.style.display='none'};document.body.appendChild(o)}o.innerHTML=html;o.style.display='flex'}
function closePop(id){const o=document.getElementById(id);if(o)o.style.display='none'}
function showBab(k){const b=M[openM].toc[k];pop('modal',`<div class="mbox"><div class="row" style="align-items:flex-start"><div style="flex:1"><b>${b[0]}</b><h3 style="margin:2px 0 0">${b[1]}</h3></div><button class="ib" style="color:inherit" onclick="closePop('modal')" aria-label="Tutup">&#10005;</button></div><div style="margin-top:8px">${grp(b).map((g,j)=>g.c.length?`<div class="si link" onclick="showSub(${k},${j})"><span>${g.t}</span><i>&#9656;</i></div>`:hasMat(num(g.t))?lk(num(g.t),g.t):`<div class="si">${g.t}</div>`).join('')}</div></div>`)}
function showSub(k,j){const g=grp(M[openM].toc[k])[j];pop('modal2',`<div class="mbox"><div class="row" style="align-items:flex-start"><h3 style="flex:1;margin:0">${g.t}</h3><button class="ib" style="color:inherit" onclick="closePop('modal2')" aria-label="Tutup">&#10005;</button></div><div style="margin-top:8px">${hasMat(num(g.t))?lk(num(g.t),'Penjelasan '+num(g.t)):''}${g.c.map(x=>hasMat(num(x))?lk(num(x),x):`<div class="si">${x}</div>`).join('')}</div></div>`)}

M[0].mat={
"1.1":["Akuntansi manajemen sering dianggap <b>'anak tiri'</b> dibandingkan akuntansi keuangan. Akibatnya, banyak perusahaan hanya mengambil informasi akuntansi manajemen dari sistem akuntansi keuangan.","Padahal karakteristik keduanya berbeda. Informasi dari sistem akuntansi keuangan tidak selalu sesuai dengan kebutuhan manajemen, sehingga keputusan yang diambil bisa kurang akurat.","Karena itu perusahaan perlu mengembangkan sistem yang menghasilkan informasi sesuai kebutuhan manajemen. Pembahasan ini mencakup <b>cost accounting system</b> (sistem akuntansi biaya)."],
"1.2":["Sistem akuntansi perusahaan pada dasarnya terbagi dua: <b>sistem akuntansi keuangan</b> dan <b>sistem akuntansi manajemen</b>.","Sistem akuntansi keuangan menghasilkan laporan keuangan untuk <b>pihak eksternal</b> seperti investor, kreditur, dan otoritas pajak. Laporan ini harus disusun sesuai <b>Pernyataan Standar Akuntansi Keuangan (PSAK)</b>.","Laporan keuangan yang dihasilkan:","- Laporan Posisi Keuangan","- Laporan Laba Rugi dan Penghasilan Komprehensif Lain","- Laporan Arus Kas","- Laporan Perubahan Ekuitas","- Catatan atas Laporan Keuangan","Perusahaan yang sahamnya atau obligasinya dijual ke publik wajib menyampaikan laporan keuangan secara berkala (per kuartal dan tahunan)."],
"1.3":["Sistem akuntansi manajemen dirancang untuk memberi informasi kepada <b>pihak internal</b> (manajer) agar dapat menjalankan kegiatan dan mengambil keputusan. Karena tujuannya hanya membantu manajer, informasinya <b>tidak harus mengikuti aturan main tertentu</b> (misalnya PSAK) selama berguna.","Pertanyaannya: bisakah informasi akuntansi keuangan dan akuntansi manajemen dihasilkan dari <b>satu sistem</b> saja? Jawabannya <b>tidak</b>. Informasi dari sistem akuntansi keuangan saja tidak cukup karena (modul menyebut tiga hal, tetapi daftarnya ada empat):","- Dirancang untuk laporan perusahaan secara keseluruhan, informasinya terlalu ringkas (agregat), tidak rinci per produk atau per kegiatan.","- Waktu pelaporannya terlalu lama (periodik).","- Hanya melaporkan kejadian yang sudah terjadi (historis).","- Penyusunan laporannya memakai asumsi yang berbeda dari kebutuhan manajemen.","<b>Alasan 1: dirancang untuk laporan secara keseluruhan.</b> Sistem keuangan melaporkan laba dan posisi keuangan perusahaan. Untuk mengelola perusahaan, manajer butuh informasi yang lebih <b>rinci</b>: pendapatan, beban, serta laba atau rugi <b>per produk atau per pelanggan</b>, misalnya untuk analisis profitabilitas, analisis efisiensi biaya, dan penentuan harga. Sisi <b>pendapatan</b> relatif aman karena biasanya sudah dicatat terpisah per produk atau pelanggan. Masalah ada pada <b>biaya</b>:","- <b>Biaya langsung:</b> dapat ditelusuri akurat ke obyek biaya (produk, pelanggan, departemen, aktivitas; di modul ini obyek biaya = produk), contohnya bahan baku langsung dan buruh langsung.","- <b>Biaya tidak langsung:</b> dipakai bersama oleh seluruh produk dan dicatat untuk perusahaan secara keseluruhan, sehingga untuk mengetahui biaya per produk harus dilakukan <b>alokasi biaya</b>.","Dasar alokasi biaya tidak langsung (<i>cost driver</i>) yang biasa dipakai:","- Unit produksi atau unit terjual","- Jam buruh langsung atau biaya buruh langsung","- Biaya bahan baku langsung","- Jam mesin","Tiap dasar alokasi menghasilkan angka yang berbeda, sehingga hasil alokasi <b>tidak akurat</b>. Sistem keuangan baik untuk pihak luar, tetapi tidak untuk pihak dalam perusahaan.","<b>Alasan 2: waktu pelaporan.</b> Laporan keuangan bulanan <b>belum cukup</b> bagi manajemen. Jika informasi baru diterima sebulan sekali, <b>peluang</b> (<i>opportunity</i>) bisa sudah lewat dan <b>ancaman</b> (<i>threat</i>) sudah menjadi masalah besar saat diketahui. Umpan balik (<i>feedback</i>) juga terlambat, seperti pada analisis varians di topik biaya standar. Karena itu akuntansi manajemen menginginkan informasi <b>secepat mungkin</b>, idealnya <b>real-time</b>.","<b>Alasan 3: hanya melaporkan masa lampau.</b> Manajemen membutuhkan angka yang berorientasi ke <b>masa depan</b>. Dalam konsep <b>relevant cost</b>, biaya yang sudah terjadi (<b>sunk cost</b>) sama sekali tidak dipakai dalam pengambilan keputusan. Terlalu menekankan informasi historis juga membuat keputusan masa depan didasarkan pada asumsi bahwa kejadian lalu akan berulang, misalnya saat anggaran terutama disusun dari informasi historis.","<b>Alasan 4: asumsi penyusunan laporan laba rugi.</b> Laporan laba rugi disusun dengan konsep <b>full costing</b> atau <b>absorption costing</b>, yang mengelompokkan biaya manufaktur menjadi:","- <b>Biaya produk:</b> bahan baku langsung, buruh langsung, dan <i>overhead</i> pabrik. Biaya ini diserap ke produk: ditahan dulu di persediaan barang dalam proses (belum selesai), lalu persediaan barang jadi (selesai belum terjual), dan baru menjadi <b>beban pokok penjualan</b> saat produk terjual.","- <b>Biaya periode (<i>period cost</i>):</b> biaya di luar produksi (beban umum, administrasi, dan penjualan) yang <b>langsung menjadi beban</b> pada periode terjadinya.","Pengelompokan ini adalah aturan main laporan keuangan eksternal, sehingga <b>tidak terlalu berguna</b> bagi manajemen: untuk analisis profitabilitas produk maupun efisiensi biaya, semua biaya harus dianalisis, apa pun jenisnya. Pengelompokan yang berguna bagi internal adalah <b>biaya tetap</b> (tidak dipengaruhi jumlah obyek biaya) dan <b>biaya variabel</b> (naik-turun proporsional dengan obyek biaya). Misalnya bila suatu aktivitas dihapus, yang otomatis hilang hanya biaya variabel, sedangkan biaya tetap biasanya tetap dikeluarkan.","<b>Kesimpulan:</b> sistem akuntansi keuangan dan akuntansi manajemen <b>tidak dapat digabungkan</b> karena ketentuannya berbeda. Sesuai konsep <b>different costs for different purposes</b>, laporan keuangan membutuhkan klasifikasi <b>biaya produk dan biaya periode</b>, sedangkan akuntansi manajemen membutuhkan <b>biaya tetap dan biaya variabel</b>."],
"1.4":["Menurut <b>Kaplan dan Cooper (1999)</b>, sistem akuntansi perusahaan berkembang dalam empat tahap:","- <b>Tahap 1 - Belum sempurna:</b> sistem yang pertama dikembangkan biasanya sistem akuntansi keuangan.","- <b>Tahap 2:</b> sistem akuntansi keuangan sudah baik, tetapi informasi manajemen masih diambil dari sistem tersebut sehingga belum sesuai dengan karakteristik kebutuhan manajemen.","- <b>Tahap 3:</b> perusahaan memiliki sistem akuntansi keuangan dan sistem akuntansi manajemen yang terpisah.","- <b>Tahap 4 - Integrasi:</b> kedua sistem disatukan dalam satu sistem terintegrasi, seperti konsep <b>Enterprise Resource Planning (ERP)</b>, dengan modul yang berbeda untuk tiap kebutuhan."],
"1.5":["Tiga istilah ini sering tumpang tindih, tetapi dalam modul ini dibedakan:","- <b>Akuntansi biaya (cost accounting):</b> menghitung biaya produksi per unit untuk menilai persediaan dan menentukan harga pokok produksi periode tersebut.","- <b>Akuntansi manajemen (management accounting):</b> menyediakan informasi akuntansi dan teknik-teknik yang membantu manajemen merencanakan, mengendalikan, dan mengambil keputusan.","- <b>Manajemen biaya (cost management):</b> bagian dari akuntansi manajemen yang berfokus pada pengelolaan biaya.","Dalam <i>Relevance Lost</i> (Kaplan dan Johnson, 1987) dijelaskan bahwa akuntansi biaya berkembang terutama untuk kebutuhan laporan keuangan, sehingga informasinya sering kurang relevan bagi manajemen.","Pada perusahaan manufaktur, biaya bahan baku langsung dan buruh langsung dapat ditelusuri langsung ke produk, sedangkan <i>overhead</i> harus dialokasikan."],
"1.6":["Menurut <b>Kaplan dan Johnson (1987)</b>, sistem akuntansi biaya awalnya dirancang terutama untuk <b>inventory costing</b> (penilaian persediaan) dan penentuan laba, sehingga ketepatan biaya per produk belum menjadi prioritas.","Topik yang dibahas dalam akuntansi biaya:","- Sistem biaya pesanan (<i>Job Order Costing</i>)","- Sistem biaya proses (<i>Process Costing</i>)","- <i>Joint Cost</i>","- Alokasi biaya departemen penunjang","- Perlakuan akuntansi untuk barang cacat (<i>scrap, rework, and spoilage</i>)"],
"1.6.1":["<b>Job order costing</b> (sistem biaya pesanan) dipakai ketika produk dibuat berdasarkan <b>pesanan</b>, sehingga setiap pesanan bisa berbeda.","Biaya dikumpulkan per pesanan, biasanya dalam <i>job cost sheet</i> (lembar biaya pesanan).","Bahan baku langsung dan buruh langsung ditelusuri langsung ke pesanan, sedangkan <i>overhead</i> dibebankan memakai tarif yang ditentukan di muka (<i>predetermined overhead rate</i>)."],
"1.6.2":["<b>Process costing</b> (sistem biaya proses) dipakai untuk produksi massal produk sejenis yang melewati beberapa proses atau departemen.","Biaya dikumpulkan per departemen untuk satu periode, lalu dibagi jumlah produksi (dihitung dalam <i>unit ekuivalen</i>) untuk mendapatkan biaya per unit.","Dua metode yang dikenal: <b>rata-rata tertimbang</b> (<i>weighted average</i>) dan <b>FIFO</b>."],
"1.6.3":["<b>Joint cost</b> (biaya bersama) adalah biaya yang dikeluarkan untuk menghasilkan beberapa produk sekaligus dari satu proses (<i>joint products</i>).","Biaya sebelum <b>titik pisah</b> (<i>split-off point</i>) tidak bisa ditelusuri ke satu produk, sehingga harus dialokasikan ke masing-masing produk untuk penilaian persediaan (<i>inventory costing</i>).","Hasil alokasi ini sebaiknya tidak dipakai sebagai dasar memutuskan apakah produk dijual langsung atau diproses lebih lanjut."],
"1.6.4":["<b>Departemen produksi</b> mengolah produk secara langsung, sedangkan <b>departemen penunjang</b> (<i>support department</i>) hanya memberi jasa kepada departemen lain. Biaya departemen penunjang dialokasikan agar biaya produk lengkap.","Tiga metode alokasi:","- <b>Direct method:</b> biaya dialokasikan langsung ke departemen produksi, tanpa memperhitungkan jasa antar departemen penunjang.","- <b>Step down method:</b> alokasi dilakukan berurutan, sehingga sebagian jasa antar departemen penunjang diakui.","- <b>Reciprocal method:</b> mengakui sepenuhnya jasa timbal balik antar departemen penunjang, umumnya paling akurat.","Ketiga metode dapat menghasilkan angka biaya yang berbeda."],
"1.6.5":["Barang cacat terdiri dari:","- <b>Rework:</b> barang cacat yang bisa diperbaiki dengan biaya tambahan sehingga sesuai spesifikasi.","- <b>Spoilage:</b> barang cacat yang tidak bisa diperbaiki, sehingga dijual dengan harga di bawah normal.","- <b>Scrap:</b> sisa-sisa produksi, misalnya potongan bahan.","Perlakuan akuntansinya bergantung pada jenis kerugian:","- <b>Normal loss</b> (wajar): meningkatkan biaya per unit produk yang baik.","- <b>Abnormal loss</b> (tidak wajar): dibebankan sebagai kerugian pada periode berjalan.","Seluruh topik ini terkait dengan tujuan awal akuntansi biaya, yaitu <i>inventory costing</i>."]};

"<b>Alasan pertama: dibikin buat laporan secara keseluruhan.</b> Sistem keuangan dirancang buat ngelaporin laba dan posisi keuangan perusahaan. Padahal buat ngelola perusahaan, manajer butuh info yang jauh lebih <b>detail</b>, kayak pendapatan, beban, serta laba atau rugi <b>per produk atau per pelanggan</b>, misalnya buat analisis profitabilitas produk atau pelanggan, analisis efisiensi biaya, dan nentuin harga.||laporan bilang laba kafe Rp50 juta, tapi manajer perlu tahu: yang paling cuan itu kopi, roti, atau teh?",

"<b>Alasan keempat (faktor terakhir): asumsi penyusunan laporan laba rugi.</b> Di sistem keuangan, laporan laba rugi disusun pakai konsep <b>full costing</b> atau <b>absorption costing</b>: biaya perusahaan manufaktur dikelompokkan jadi <b>biaya produk</b> dan <b>biaya periode</b>. Biaya produk itu biaya buat bikin produk, terdiri dari bahan baku langsung (direct material), buruh langsung (direct labor), dan overhead pabrik (manufacturing overhead). Biaya ini nggak langsung nyemplung ke laba rugi: dia 'nitip parkir' dulu di persediaan barang dalam proses (kalau belum selesai), lalu di persediaan barang jadi (selesai tapi belum laku), dan baru masuk beban pokok penjualan atau beban pendapatan pas barangnya terjual.||roti dibuat tanggal 1 tapi baru laku tanggal 10; biaya tepung dan upah pembuatnya baru masuk laba rugi pas rotinya laku, sebelumnya numpang di persediaan.",

"<b>Kesimpulan:</b> sistem akuntansi keuangan dan sistem akuntansi manajemen <b>nggak bisa digabung</b>, karena masing-masing punya ketentuan yang beda. Ini sesuai konsep <b>different costs for different purposes</b>: tujuan beda, klasifikasi biaya yang dibutuhkan juga beda. Buat nyusun laporan keuangan, yang dibutuhkan adalah <b>biaya produk dan biaya periode</b>; buat akuntansi manajemen, yang dibutuhkan adalah <b>biaya tetap dan biaya variabel</b>.||satu tumpukan bon belanja bisa dipilah dua cara: bagian akuntansi milah jadi 'biaya produk' dan 'biaya periode' buat laporan ke luar, sedangkan manajer milah jadi 'tetap' dan 'variabel' buat ngambil keputusan."],
"1.4":[
"Menurut <b>Kaplan dan Cooper (1999)</b>, pengembangan sistem akuntansi perusahaan dapat dilakukan dalam empat tahap:@@<b>Tahap pertama (belum sempurna):</b> biasanya terjadi pada perusahaan yang baru mengembangkan sistem akuntansinya. Sistem yang pertama kali dikembangkan biasanya sistem akuntansi keuangan, karena informasi yang paling awal dibutuhkan adalah laporan keuangan untuk pihak eksternal (pencarian dana, pelaporan ke pemegang saham, pelaporan pajak, dan sebagainya). Disebut belum sempurna karena masih banyak kesalahan menyusun laporan keuangan, sehingga muncul banyak penyesuaian di akhir tahun atau saat laporan diperiksa auditor eksternal@@<b>Tahap kedua (penekanan pada sistem informasi keuangan):</b> perusahaan sudah punya sistem informasi keuangan yang baik dan bisa menghasilkan laporan keuangan untuk pihak eksternal sesuai peraturan. Namun perusahaan belum punya sistem akuntansi manajemen, jadi informasi manajemen dihasilkan dari sistem keuangan. Hasilnya kurang memadai karena terpaksa memakai informasi dari sistem keuangan yang karakteristiknya berbeda@@<b>Tahap ketiga (pemisahan):</b> perusahaan memiliki sistem yang terpisah antara akuntansi keuangan dan akuntansi manajemen@@<b>Tahap keempat (integrasi):</b> sistem akuntansi keuangan dan manajemen disatukan dalam sistem informasi perusahaan yang terintegrasi, seperti konsep <b>Enterprise Resource Planning (ERP)</b>. Walaupun terintegrasi, akuntansi keuangan dan akuntansi manajemen tetap memiliki modul yang berbeda||toko yang tumbuh: awalnya cuma buku kas untuk lapor pajak (tahap 1-2), lalu punya aplikasi terpisah untuk analisis biaya (tahap 3), akhirnya satu aplikasi ERP dengan modul keuangan dan modul biaya di dalamnya (tahap 4)."],
"1.5":[
"Pemahaman tentang <b>akuntansi biaya</b> (cost accounting), <b>manajemen biaya</b> (cost management), dan <b>akuntansi manajemen</b> (management accounting) sering tumpang tindih, terlihat dari banyak buku berjudul berbeda tapi isinya kurang lebih sama. Di modul ini ketiganya dibedakan:@@<b>Akuntansi biaya</b> mempelajari perhitungan biaya produksi per unit untuk memberi nilai pada persediaan perusahaan, sekaligus menetapkan nilai beban pokok penjualan pada periode tersebut@@<b>Akuntansi manajemen</b> membahas cara menyediakan informasi akuntansi serta teknik yang bisa dilakukan manajemen dalam perencanaan, pengendalian (termasuk penilaian kinerja), dan pengambilan keputusan@@<b>Manajemen biaya</b> adalah bagian dari akuntansi manajemen yang memberi informasi agar manajemen bisa mengelola biaya perusahaan lebih baik; tujuan utamanya <b>efisiensi biaya</b>||di kafe, akuntansi biaya menghitung satu latte biayanya Rp12.000 (untuk menilai stok dan harga pokok); akuntansi manajemen memakai angka itu dan data lain untuk memutuskan menu dan harga; manajemen biaya mencari cara menekan biaya latte tanpa menurunkan kualitas.",
"Dalam bukunya <i>Relevance Lost</i>, <b>Kaplan dan Johnson (1987)</b> menceritakan bahwa akuntansi biaya berkembang setelah adanya <b>revolusi industri</b>, saat makin banyak perusahaan menjadi besar. Ekspansi itu membuat banyak perusahaan mencari dana dari luar (pinjaman atau menerbitkan saham ke publik). Karena itu perusahaan butuh <b>laporan keuangan</b> untuk disampaikan ke pihak yang berminat mendanai, baik lewat pinjaman maupun investasi langsung.||pabrik yang mau membangun pabrik baru harus menunjukkan laporan keuangan ke bank; dari kebutuhan seperti inilah akuntansi biaya berkembang.",
"Untuk perusahaan manufaktur, biaya produksi (bahan baku langsung, buruh langsung, overhead pabrik) perlu dibagi menjadi proporsi yang dibebankan pada <b>persediaan barang jadi</b> dan <b>persediaan barang dalam proses</b>, serta proporsi yang masuk sebagai <b>beban pokok penjualan</b>. Tidak semua biaya produksi langsung masuk laporan laba rugi: hanya biaya produksi dari unit yang <b>sudah terjual</b> yang masuk sebagai beban pokok penjualan.||total biaya produksi 2014 Rp800 juta: sebagian menjadi nilai barang dalam proses, sebagian menjadi nilai barang jadi di gudang, dan hanya bagian dari barang yang sudah laku yang masuk laba rugi.",
"Untuk membagi biaya itu, perlu menghitung <b>biaya per unit</b> tiap produk. Biaya langsung seperti bahan baku langsung dan buruh langsung bisa dihitung <b>akurat</b> per produk. Namun biaya <b>overhead</b> pabrik biasanya dicatat untuk perusahaan secara keseluruhan, bukan per produk, jadi pembebanannya memakai dasar alokasi seperti unit produksi, jam buruh langsung, dan sebagainya.||bahan baku kaus A jelas jumlahnya, tapi listrik pabrik cuma ada satu tagihan, jadi harus dibagi ke semua kaus.",
"Seperti sudah dibahas sebelumnya, hasil alokasi itu <b>tidak menghasilkan biaya per unit yang akurat</b>, karena metode alokasi yang berbeda menghasilkan angka alokasi yang berbeda pula. Jadi hasil alokasi overhead pabrik dianggap tidak akurat.||overhead Rp10 juta dibagi per unit produksi bisa membuat kaus A kena Rp2.000 per unit, tapi dibagi per jam mesin jadi Rp3.500 per unit; tidak ada yang pasti 'benar'.",
"Untuk <b>laporan keuangan eksternal</b>, biaya per unit yang tidak akurat <b>tidak jadi masalah</b>, karena kesalahannya hanya <b>perbedaan waktu</b> (<b>timing difference</b>) dan setelah beberapa tahun, total angkanya benar. Ini sama seperti penyusutan aset tetap: perusahaan boleh memilih <b>garis lurus</b> (beban sama tiap tahun) atau <b>dipercepat</b> (double declining: beban besar di awal, makin kecil di akhir). Angka tiap tahun berbeda, tapi setelah lima tahun pemakaian, total beban penyusutan yang masuk laba rugi sama.||mesin Rp100 juta berumur 5 tahun: garis lurus Rp20 juta per tahun, sedangkan metode dipercepat misalnya Rp35, 27, 20, 12, dan 6 juta; tiap tahun berbeda, tapi totalnya sama-sama Rp100 juta.",
"Logika yang sama berlaku untuk biaya produksi per unit perusahaan manufaktur: perhitungan yang tidak akurat memang membuat angka <b>persediaan barang dalam proses</b>, <b>persediaan barang jadi</b>, dan <b>beban pokok penjualan</b> tidak akurat. Tapi itu bukan masalah besar karena hanya <b>perbedaan waktu</b>: setelah beberapa periode, semua biaya produksi akan masuk laporan laba rugi sebagai beban pokok penjualan.||selisih Rp1 juta yang 'salah masuk' persediaan bulan ini akan masuk beban pokok penjualan bulan depan saat barangnya laku; total setahun tetap sama."],
"1.6":[
"Menurut <b>Kaplan dan Johnson (1987)</b>, di awal perancangan sistem akuntansi biaya, <b>keakuratan biaya produksi per unit tidak dipermasalahkan</b>, karena sistem ini memang hanya dirancang untuk <b>inventory costing</b>, yaitu menentukan nilai persediaan dan beban pokok penjualan agar perusahaan bisa menyusun laporan keuangan (terutama laporan laba rugi dan laporan posisi keuangan). Sistem ini tidak pernah dirancang untuk dipakai manajer mengambil keputusan, karena biaya produksinya tidak akurat. Contoh topik alokasi biaya yang tidak akurat dalam akuntansi biaya:@@Sistem biaya pesanan (<i>Job Order Costing</i>)@@Sistem biaya proses (<i>Process Costing</i>)@@<i>Joint Costs</i>@@Alokasi biaya departemen penunjang (<i>Support Department Cost Allocation</i>)@@Perlakuan akuntansi untuk barang cacat (<i>Scrap, Rework, dan Spoilage</i>)||timbangan dapur cukup untuk tahu total berat belanjaan (nilai stok), tapi tidak cukup akurat untuk memutuskan resep mana yang paling hemat."],
"1.6.1":[
"<b>Job order costing</b> adalah sistem perhitungan biaya produksi untuk perusahaan yang memproduksi barang <b>berdasarkan pesanan</b>; ciri khasnya, produk satu pesanan bisa dibedakan dari pesanan lain. Biaya dihitung per pesanan lewat <b>job cost sheet</b>, yang memuat rincian bahan baku langsung, buruh langsung, dan overhead pabrik tiap pesanan. Bahan baku dan buruh langsung bisa dibebankan akurat ke tiap pesanan, tapi overhead tidak dicatat rinci per pesanan, jadi dialokasikan dengan <b>dasar alokasi tradisional</b>. Akibatnya total biaya produksi per pesanan <b>tidak akurat</b> dan tidak berguna bagi manajemen. Hasil perhitungannya dipakai untuk laporan keuangan: biaya pesanan yang belum selesai muncul sebagai <b>persediaan barang dalam proses</b>, yang sudah selesai tapi belum terjual sebagai <b>persediaan barang jadi</b>, dan yang sudah terjual masuk <b>beban pokok penjualan</b> di laba rugi.||konveksi seragam: pesanan sekolah A masih dijahit (barang dalam proses), pesanan B sudah jadi menunggu diambil (barang jadi), pesanan C sudah diantar (beban pokok penjualan)."],
"1.6.2":[
"<b>Process costing</b> dipakai perusahaan yang memproduksi barang <b>secara massal</b>. Biaya produksi dihitung per <b>batch</b>, dan untuk produk yang sama, hasil antar batch tidak bisa dibedakan. Biaya dipisahkan per <b>departemen</b> yang memproduksi. Sama seperti job order costing, bahan baku dan buruh langsung bisa ditelusuri akurat per batch, sedangkan alokasi overhead per batch tidak akurat. Ditambah lagi biaya <b>ekuivalen per unit</b> dengan metode <b>FIFO</b> berbeda dari metode <b>rata-rata tertimbang</b> (weighted average). Tujuannya membagi total biaya tiap departemen menjadi biaya produk yang sudah selesai (ditransfer ke departemen berikutnya) dan biaya produk yang belum selesai. Total biaya barang dalam proses di akhir tiap departemen dijumlahkan sebagai persediaan barang dalam proses di laporan posisi keuangan; biaya produk yang selesai di semua departemen masuk persediaan barang jadi, dan kalau terjual menjadi beban pokok penjualan. Sistem ini juga hanya untuk <b>inventory costing</b> dan tidak berguna bagi manajemen, karena biaya per unit atau per unit ekuivalennya tidak akurat.||pabrik mi instan: biaya departemen adonan dipisah dari departemen pengemasan; mi yang selesai diadon pindah ke pengemasan membawa biayanya, sedangkan yang masih setengah jadi dihitung sebagai barang dalam proses."],
"1.6.3":[
"<b>Joint costs</b> adalah biaya untuk melakukan suatu proses yang menghasilkan beberapa jenis produk sekaligus (<b>joint product</b>). Contoh sederhana: peternakan ayam yang memelihara ayam sampai dewasa lalu dipotong; ayam tidak dijual utuh, tapi dalam potongan paha, dada, dan sebagainya. Alokasi joint costs berarti membagi biaya pemeliharaan dan pemotongan ke tiap potongan. Secara logika ini tidak bisa dilakukan, karena aktivitasnya dilakukan pada satu ayam, bukan pada potongannya. Alasan tetap dialokasikan adalah untuk <b>laporan keuangan</b>: misalnya akhir tahun masih ada 10.000 potong paha, 15.000 sayap, dan 3.000 dada; nilai persediaan di laporan posisi keuangan harus dalam rupiah, jadi jumlah potongan dikalikan biaya per unit hasil alokasi joint costs. Untuk manajemen, nilai alokasi ini <b>sama sekali tidak ada gunanya</b>. Contohnya saat memutuskan apakah produk dijual di <b>titik split-off</b> atau diproses lebih lanjut: yang dibandingkan adalah tambahan pendapatan versus tambahan biaya, dan hasil alokasi joint costs tidak dipakai. Jadi perhitungan biaya per unit dari alokasi joint cost memang hanya ditujukan untuk <b>inventory costing</b>.||satu sapi menghasilkan daging, tulang, dan kulit; biaya pemeliharaan Rp10 juta bisa dibagi berdasarkan berat atau harga jual dengan hasil berbeda. Tapi untuk memutuskan 'kulit dijual mentah atau disamak dulu', yang dihitung hanya tambahan pendapatan versus tambahan biaya penyamakan."],
"1.6.4":[
"<b>Alokasi biaya departemen penunjang</b> memisahkan biaya produksi perusahaan menjadi biaya untuk masing-masing departemen. Ada dua jenis departemen yang mengeluarkan biaya produksi:@@<b>Departemen produksi:</b> terlibat langsung dalam proses produksi, seperti departemen perakitan, pengecatan, penyelesaian, dan seterusnya@@<b>Departemen penunjang</b> (support department): tidak terlibat langsung dalam proses produksi, tapi dibentuk untuk menunjang kelancaran kegiatan departemen produksi, contohnya departemen pemeliharaan mesin||di pabrik furnitur, perakitan dan pengecatan adalah departemen produksi, sedangkan bengkel pemeliharaan mesin adalah departemen penunjang.",
"Semua biaya departemen produksi <b>dibebankan ke produk</b>, karena departemen itu memang terlibat langsung dalam produksi. Biaya departemen penunjang tidak bisa langsung dibebankan ke produk; harus dibebankan <b>terlebih dahulu ke departemen produksi</b>, baru kemudian ke masing-masing produk.||gaji teknisi bengkel dibagi dulu ke perakitan dan pengecatan, baru dari sana ikut terbebankan ke kursi dan meja.",
"Pembebanan biaya departemen penunjang ke departemen produksi bisa dilakukan dengan tiga cara:@@<b>Direct method:</b> sesama departemen penunjang dianggap <b>tidak saling melayani</b>, sehingga semua biaya departemen penunjang langsung dibebankan ke departemen produksi@@<b>Step down method:</b> departemen penunjang diasumsikan melayani departemen penunjang lainnya, tapi hubungannya <b>satu arah</b>. Misalnya administrasi pabrik dianggap melayani pemeliharaan mesin, tapi pemeliharaan mesin dianggap tidak melayani administrasi pabrik, meski pada kenyataannya kalau mesin fotokopi di administrasi pabrik rusak, yang memperbaiki adalah departemen pemeliharaan mesin@@<b>Reciprocal method:</b> mengasumsikan keadaan yang sebenarnya; kalau departemen penunjang memang saling melayani secara dua arah, perhitungan alokasi biaya mengasumsikan ada pembebanan dua arah||biaya bengkel Rp20 juta dan administrasi Rp10 juta. Direct: keduanya langsung dibagi ke perakitan dan pengecatan. Step down: administrasi dibagi dulu ke bengkel dan produksi, lalu bengkel (yang sudah bertambah) dibagi ke produksi. Reciprocal: bengkel dan administrasi saling membebani sampai ketemu angka akhir lewat persamaan.",
"Alokasi dengan tiga cara tersebut menghasilkan <b>angka yang berbeda</b>. Terlihat jelas bahwa metode <b>reciprocal</b> lebih akurat dibanding dua metode lainnya. Lalu mengapa direct dan step down tetap diperbolehkan walau hasilnya kurang akurat? Jawabannya: karena pada akhirnya perhitungan biaya produksi per unit yang dibebankan ke produk <b>juga tidak akan akurat</b>.||misalnya biaya bengkel yang dibebankan ke perakitan Rp12 juta (direct), Rp12,5 juta (step down), dan Rp13 juta (reciprocal); selisihnya kecil dibanding ketidakakuratan di tahap berikutnya.",
"Hasil alokasi biaya departemen penunjang dibebankan ke departemen produksi sebagai <b>tambahan overhead pabrik</b>. Jadi overhead pabrik departemen produksi adalah overhead yang benar-benar dikeluarkan departemen produksi itu ditambah biaya hasil alokasi dari departemen penunjang. Seperti sudah diketahui, overhead pabrik dialokasikan secara tradisional dengan dasar unit produksi, biaya buruh langsung, dan seterusnya, sehingga hasilnya <b>tidak menghasilkan pembebanan yang akurat</b> ke masing-masing produk.||overhead asli perakitan Rp50 juta ditambah kiriman dari bengkel Rp12 juta jadi Rp62 juta, lalu dibagi ke produk memakai dasar jam buruh.",
"Dengan demikian, meskipun pembebanan biaya departemen penunjang ke departemen produksi dilakukan akurat dengan metode <b>reciprocal</b>, kalau pembebanan ke masing-masing produk memakai dasar alokasi tradisional, hasilnya tetap <b>perhitungan biaya produksi yang tidak akurat</b>. Jika hasil akhirnya tidak akurat, maka pembebanan biaya departemen penunjang yang tidak akurat pun <b>diperbolehkan</b>.||seperti menimbang bahan dengan timbangan super presisi lalu membaginya ke piring pakai sendok kira-kira: presisi di awal tidak membuat hasil akhirnya presisi."],
"1.6.5":[
"Jenis barang cacat dapat dibagi menjadi dua bagian:@@<b>Rework:</b> pengerjaan ulang dari barang yang dibuat tidak sesuai spesifikasinya, dan setelah dikerjakan ulang dapat dijual dengan <b>harga normal</b>@@<b>Spoilage:</b> barang yang cacat atau rusak dan <b>tidak dapat diperbaiki</b> lagi, sehingga harus dijual dengan harga <b>di bawah normal</b>||kaus yang lengannya salah jahit lalu dijahit ulang dan dijual normal adalah rework; kaus yang kainnya sobek parah dijual obral adalah spoilage.",
"Selain kedua golongan itu, ada pula <b>scrap</b>, yaitu sisa-sisa produksi, misalnya potongan kain dari proses pembuatan baju. Scrap yang terlalu banyak merugikan perusahaan karena dihasilkan dari <b>proses produksi yang tidak efisien</b>.||potongan kain sisa pola; kalau setiap hari sisanya menumpuk banyak, berarti pola dan pemotongannya kurang efisien.",
"Dalam akuntansi biaya, rework dan spoilage yang terjadi dapat dikategorikan sebagai <b>normal loss</b> maupun <b>abnormal loss</b>. Kalau normal loss, hal tersebut <b>meningkatkan biaya per unit</b> produk tersebut. Kalau abnormal loss, hal tersebut <b>tidak memengaruhi biaya per unit</b> produk, dan langsung dimasukkan ke beban pokok penjualan sebagai abnormal loss.||wajar kalau 2 dari 100 kaus gagal: biayanya ditanggung kaus yang bagus sehingga biaya per kaus naik sedikit (normal loss). Kalau mesin salah setel lalu 20 kaus rusak, kerugiannya langsung dicatat sebagai abnormal loss di beban pokok penjualan, harga per kaus tidak ikut naik.",
"Seluruh pembahasan tentang <b>scrap, rework, dan spoilage</b> adalah tentang <b>perlakuan akuntansi</b> untuk kasus-kasus tersebut. Kalau yang dibahas adalah peraturannya, maka peraturan itu dibutuhkan dalam kaitannya untuk <b>menyusun laporan keuangan</b> perusahaan.||topik ini soal 'cara mencatat' kain sobek dan sisa potongan di pembukuan, bukan soal strategi produksi.",
"<b>Kesimpulannya:</b> sejak awal akuntansi biaya memang dirancang untuk tujuan <b>inventory costing</b>, yaitu memperkirakan nilai biaya produksi yang masuk ke persediaan barang dalam proses, persediaan barang jadi, serta beban pokok penjualan. Karena itu sejak awal sistem akuntansi biaya dikembangkan <b>tanpa membutuhkan perhitungan biaya per unit yang akurat</b>, dan sistem ini memang bukan ditujukan untuk memberi informasi bagi manajemen dalam pengambilan keputusan.||tujuannya 'menghitung nilai stok dan harga pokok untuk lapor ke luar', bukan 'memutuskan produk mana yang layak diteruskan'."]};

"1.1":{c:"Latar Belakang",r:[{t:"Masalah",k:[{t:"Akuntansi manajemen sering dianggap 'anak tiri' dibanding akuntansi keuangan."},{t:"Banyak perusahaan hanya mengambil informasi akuntansi manajemen dari sistem akuntansi keuangan."}]}],l:[{t:"Akibat",k:[{t:"Karakteristik informasi yang dibutuhkan manajemen amat berbeda dengan yang dihasilkan sistem keuangan."},{t:"Banyak keputusan salah karena memakai informasi yang tidak dibuat untuk kebutuhan itu."},{t:"Kesalahan paling sering: memakai informasi biaya produksi dari cost accounting system untuk mengambil keputusan.",k:[{t:"Contoh: ibarat pakai sepatu kantor untuk naik gunung: bisa dipakai, tapi bikin celaka. Misalnya manajer menentukan harga jual dari biaya per unit di laporan keuangan.",x:1}]}]}]},
"1.2":{c:"Sistem Informasi Akuntansi Keuangan",r:[{t:"Akuntansi Keuangan",k:[{t:"Akuntansi keuangan dirancang untuk menghasilkan laporan bagi pihak di luar pengelola perusahaan (pemegang saham, kreditur, pajak, dan lain-lain)."},{t:"Laporannya harus disusun sesuai aturan PSAK, dan kalau perusahaan sudah terdaftar sebagai perusahaan publik atau menerbitkan obligasi ke publik, laporan juga harus mengikuti peraturan Bapepam-LK.",k:[{t:"Contoh: bank mau memberi kredit lalu minta laporan keuangan yang disusun sesuai PSAK, supaya bisa dibandingkan dengan perusahaan lain.",x:1}]},{t:"Laporan keuangan yang dihasilkan ada lima:",k:[{t:"Laporan posisi keuangan",k:[{t:"Contoh: posisi keuangan itu 'foto' harta dan utang pada satu tanggal, laba rugi itu 'rapor' untung-rugi selama setahun, arus kas itu catatan keluar-masuk uang tunai.",x:1}]},{t:"Laporan laba rugi dan penghasilan komprehensif lain"},{t:"Laporan arus kas"},{t:"Laporan perubahan ekuitas"},{t:"Catatan atas laporan keuangan"}]},{t:"Perusahaan yang sudah mengeluarkan saham atau obligasi ke publik wajib melaporkan laporan keuangannya setiap kuartal dan setiap tahun.",k:[{t:"Contoh: perusahaan yang sahamnya diperdagangkan di bursa harus 'setor rapor' tiap 3 bulan dan tiap akhir tahun.",x:1}]}]}],l:[{t:"Akuntansi Manajemen",k:[{t:"Dirancang untuk memberi informasi kepada pihak internal (manajer) agar dapat menjalankan kegiatan dan mengambil keputusan."},{t:"Tidak harus mengikuti aturan main tertentu selama berguna bagi manajer."}]}]},
"1.4":{c:"Tahap Pengembangan Sistem Akuntansi",r:[{t:"Tahap 1: belum sempurna",k:[{t:"Sistem yang pertama dibangun biasanya sistem akuntansi keuangan (pencarian dana, pelaporan ke pemegang saham dan pajak)."},{t:"Masih banyak kesalahan, sehingga muncul banyak penyesuaian di akhir tahun atau saat diperiksa auditor eksternal."}]},{t:"Tahap 2: fokus sistem keuangan",k:[{t:"Sistem keuangan sudah baik dan sesuai peraturan."},{t:"Belum ada akuntansi manajemen, info manajemen diambil dari sistem keuangan sehingga kurang memadai."}]}],l:[{t:"Tahap 3: pemisahan",k:[{t:"Sistem akuntansi keuangan dan akuntansi manajemen terpisah."}]},{t:"Tahap 4: integrasi",k:[{t:"Disatukan dalam sistem terintegrasi seperti ERP (Enterprise Resource Planning)."},{t:"Modul keuangan dan manajemen tetap berbeda.",k:[{t:"Contoh: toko yang tumbuh: buku kas untuk lapor pajak (tahap 1-2), aplikasi terpisah untuk analisis biaya (tahap 3), lalu satu aplikasi ERP (tahap 4).",x:1}]}]}]}

Object.assign(M[0].map,{
"1.3":{c:"Karakteristik Sistem Akuntansi Manajemen",r:[{t:"Inti",k:[{t:"Dirancang untuk memberi info kepada manajer agar kerjanya lancar; tidak harus ikut aturan baku selama berguna."},{t:"Info akuntansi keuangan dan manajemen tidak bisa keluar dari satu sistem saja.",k:[{t:"Modul menyebut 'tiga hal', tetapi daftarnya ada empat alasan."},{t:"Contoh: peta dunia (laporan keuangan) itu lengkap banget, tapi tidak membantu saat kamu butuh tahu harus belok di gang yang mana.",x:1}]}]},{t:"Alasan 1: terlalu agregat",k:[{t:"Sistem keuangan dibuat untuk laporan perusahaan secara keseluruhan.",k:[{t:"Manajer butuh info rinci: pendapatan, beban, laba atau rugi per produk atau per pelanggan (profitabilitas, efisiensi biaya, penentuan harga)."},{t:"Contoh: laporan bilang laba kafe Rp50 juta, tapi manajer perlu tahu yang paling cuan itu kopi, roti, atau teh.",x:1}]},{t:"Pendapatan relatif aman: sudah dicatat terpisah per produk atau pelanggan.",k:[{t:"Contoh: kasir mencatat penjualan kopi, roti, dan teh sendiri-sendiri.",x:1}]},{t:"Biaya langsung: bisa dilacak akurat ke obyek biaya (produk, pelanggan, departemen, aktivitas).",k:[{t:"Contoh: bahan baku langsung dan buruh langsung."},{t:"Contoh: biji kopi untuk secangkir latte jelas masuk biaya latte, begitu juga gaji barista yang khusus membuat latte.",x:1}]},{t:"Biaya tidak langsung: dipakai bersama oleh semua produk, dicatat untuk perusahaan secara keseluruhan.",k:[{t:"Untuk tahu biaya per produk harus dilakukan alokasi biaya."},{t:"Dasar alokasi yang biasa dipakai:",k:[{t:"Unit produksi"},{t:"Unit terjual"},{t:"Jam buruh langsung"},{t:"Biaya buruh langsung"},{t:"Biaya bahan baku langsung"},{t:"Jam mesin"}]},{t:"Tiap dasar alokasi memberi angka berbeda, sehingga hasilnya tidak akurat. Sistem keuangan oke untuk pihak luar, tapi tidak cocok untuk pihak dalam.",k:[{t:"Contoh: sewa dan listrik kafe Rp10 juta dibagi per cangkir bisa membuat latte kena Rp3 juta, tapi dibagi per jam kerja barista bisa jadi Rp5 juta.",x:1}]}]}]},{t:"Kesimpulan",k:[{t:"Sistem akuntansi keuangan dan manajemen tidak bisa digabung karena ketentuannya berbeda."},{t:"Sesuai konsep different costs for different purposes.",k:[{t:"Laporan keuangan butuh biaya produk dan biaya periode."},{t:"Akuntansi manajemen butuh biaya tetap dan biaya variabel."},{t:"Contoh: satu tumpukan bon belanja bisa dipilah dua cara: 'biaya produk dan biaya periode' untuk laporan ke luar, 'tetap dan variabel' untuk keputusan manajer.",x:1}]}]}],l:[{t:"Alasan 2: waktu pelaporan",k:[{t:"Laporan keuangan bulanan belum cukup bagi manajemen.",k:[{t:"Peluang bisa keburu lewat dan ancaman keburu jadi masalah besar saat baru ketahuan."},{t:"Umpan balik (feedback) terlambat, terlihat jelas pada analisis varians di topik biaya standar."},{t:"Contoh: harga bahan baku naik di awal bulan, tapi manajer baru tahu saat laporan bulanan keluar, padahal harga jual sudah telanjur tidak menutup biaya sebulan penuh.",x:1}]},{t:"Akuntansi manajemen maunya info secepat mungkin, idealnya real time.",k:[{t:"Contoh: seperti speedometer mobil, kecepatan harus kelihatan sekarang juga, bukan laporan rata-rata setelah perjalanan selesai.",x:1}]}]},{t:"Alasan 3: hanya masa lalu",k:[{t:"Sistem keuangan hanya melaporkan yang sudah terjadi, padahal manajemen butuh angka berorientasi masa depan."},{t:"Relevant cost: biaya yang sudah terjadi (sunk cost) sama sekali tidak dipakai untuk mengambil keputusan.",k:[{t:"Contoh: mesin yang dibeli Rp100 juta tahun lalu itu sunk cost; saat memutuskan ganti atau tidak, yang dihitung biaya dan manfaat ke depan.",x:1}]},{t:"Terlalu menekankan info historis membuat keputusan didasarkan pada asumsi bahwa kejadian lalu akan berulang, misalnya saat menyusun anggaran."}]},{t:"Alasan 4: asumsi penyusunan laporan",k:[{t:"Laporan laba rugi memakai full costing atau absorption costing.",k:[{t:"Biaya produk: bahan baku langsung, buruh langsung, overhead pabrik.",k:[{t:"Diparkir dulu di persediaan barang dalam proses, lalu barang jadi, baru menjadi beban pokok penjualan saat produk terjual."},{t:"Contoh: roti dibuat tanggal 1 tapi baru laku tanggal 10; biaya tepung dan upah pembuatnya baru masuk laba rugi saat rotinya laku.",x:1}]},{t:"Biaya periode: biaya di luar produksi (beban umum, administrasi, penjualan).",k:[{t:"Langsung dibebankan di laba rugi pada periode terjadinya, tanpa diparkir."},{t:"Contoh: gaji staf pemasaran dan sewa kantor pusat bulan Maret langsung jadi beban bulan Maret.",x:1}]}]},{t:"Pengelompokan ini aturan main laporan keuangan eksternal, sehingga tidak terlalu berguna bagi manajemen.",k:[{t:"Untuk analisis profitabilitas produk maupun efisiensi biaya, semua biaya harus dianalisis, apa pun jenisnya."},{t:"Contoh: mau tahu menu kopi susu cuan atau tidak, biaya biji kopi (biaya produk) dan biaya iklan menu (biaya periode) sama-sama harus dihitung.",x:1}]},{t:"Pengelompokan yang berguna bagi internal: biaya tetap dan biaya variabel.",k:[{t:"Biaya tetap: tidak terpengaruh banyak-sedikitnya obyek biaya yang dihasilkan atau dijual."},{t:"Biaya variabel: naik-turun proporsional dengan jumlah obyek biaya."},{t:"Bila suatu aktivitas dihapus, yang otomatis hilang hanya biaya variabel; biaya tetap biasanya tetap keluar."},{t:"Contoh: kalau kafe berhenti jual teh, biaya daun teh dan gelas (variabel) hilang, tapi sewa tempat dan gaji tetap barista jalan terus.",x:1}]}]}]},
"1.5":{c:"Akuntansi Biaya, Manajemen Biaya, Akuntansi Manajemen",r:[{t:"Tiga istilah yang dibedakan",k:[{t:"Sering tumpang tindih; banyak buku berjudul berbeda tapi isinya kurang lebih sama. Di modul ini ketiganya dibedakan."},{t:"Akuntansi biaya: menghitung biaya produksi per unit untuk menilai persediaan sekaligus menetapkan beban pokok penjualan periode tersebut.",k:[{t:"Contoh: akuntansi biaya menghitung satu latte biayanya Rp12.000 (untuk menilai stok dan harga pokok).",x:1}]},{t:"Akuntansi manajemen: menyediakan info akuntansi dan teknik untuk perencanaan, pengendalian (termasuk penilaian kinerja), dan pengambilan keputusan.",k:[{t:"Contoh: memakai angka latte tadi dan data lain untuk memutuskan menu dan harga.",x:1}]},{t:"Manajemen biaya: bagian dari akuntansi manajemen agar perusahaan bisa mengelola biaya lebih baik.",k:[{t:"Tujuan utama: efisiensi biaya."},{t:"Contoh: mencari cara menekan biaya latte tanpa menurunkan kualitas.",x:1}]}]}],l:[{t:"Sejarah akuntansi biaya",k:[{t:"Dalam Relevance Lost, Kaplan dan Johnson (1987) menceritakan bahwa akuntansi biaya berkembang setelah revolusi industri."},{t:"Perusahaan makin besar dan mencari dana dari luar (pinjaman atau menerbitkan saham ke publik), sehingga butuh laporan keuangan.",k:[{t:"Contoh: pabrik yang mau membangun pabrik baru harus menunjukkan laporan keuangan ke bank.",x:1}]}]},{t:"Biaya produksi perusahaan manufaktur",k:[{t:"Biaya produksi (bahan baku langsung, buruh langsung, overhead pabrik) dibagi ke persediaan barang jadi, barang dalam proses, dan beban pokok penjualan.",k:[{t:"Hanya biaya produksi dari unit yang sudah terjual yang masuk beban pokok penjualan."},{t:"Contoh: total biaya produksi 2014 Rp800 juta: sebagian menjadi nilai barang dalam proses, sebagian barang jadi di gudang, dan hanya bagian dari barang yang laku masuk laba rugi.",x:1}]},{t:"Perlu biaya per unit tiap produk.",k:[{t:"Biaya langsung (bahan baku, buruh) bisa dihitung akurat per produk."},{t:"Overhead pabrik dicatat untuk perusahaan secara keseluruhan, jadi dibebankan dengan dasar alokasi (unit produksi, jam buruh langsung, dan sebagainya)."},{t:"Hasil alokasi tidak menghasilkan biaya per unit yang akurat.",k:[{t:"Contoh: overhead Rp10 juta dibagi per unit bisa membuat kaus A kena Rp2.000, tapi dibagi per jam mesin jadi Rp3.500; tidak ada yang pasti benar.",x:1}]}]},{t:"Untuk laporan keuangan eksternal, ketidakakuratan tidak jadi masalah: hanya perbedaan waktu (timing difference).",k:[{t:"Seperti penyusutan aset tetap: garis lurus atau dipercepat, tiap tahun berbeda tapi total bebannya sama."},{t:"Contoh: mesin Rp100 juta berumur 5 tahun: garis lurus Rp20 juta per tahun, metode dipercepat misalnya Rp35, 27, 20, 12, 6 juta; totalnya sama-sama Rp100 juta.",x:1},{t:"Logika sama untuk biaya produksi per unit: setelah beberapa periode, semua biaya produksi masuk laba rugi sebagai beban pokok penjualan."},{t:"Contoh: selisih Rp1 juta yang 'salah masuk' persediaan bulan ini akan masuk beban pokok penjualan bulan depan saat barangnya laku.",x:1}]}]}]},
"1.6":{c:"Pembahasan Topik dalam Akuntansi Biaya",r:[{t:"Tujuan awal: inventory costing",k:[{t:"Menurut Kaplan dan Johnson (1987), sistem akuntansi biaya dirancang untuk inventory costing: menentukan nilai persediaan dan beban pokok penjualan."},{t:"Untuk menyusun laporan keuangan (laba rugi dan posisi keuangan), bukan untuk keputusan manajer."}]},{t:"Akurasi biaya per unit",k:[{t:"Di awal perancangan, keakuratan biaya produksi per unit tidak dipermasalahkan."},{t:"Contoh: timbangan dapur cukup untuk tahu total berat belanjaan (nilai stok), tapi tidak cukup akurat untuk memutuskan resep mana yang paling hemat.",x:1}]}],l:[{t:"Topik yang dibahas (alokasi biaya tidak akurat)",k:[{t:"Sistem biaya pesanan (Job Order Costing)"},{t:"Sistem biaya proses (Process Costing)"},{t:"Joint costs"},{t:"Alokasi biaya departemen penunjang (Support Department Cost Allocation)"},{t:"Perlakuan akuntansi untuk barang cacat (Scrap, Rework, dan Spoilage)"}]}]},
"1.6.1":{c:"Job Order Costing",r:[{t:"Dipakai untuk",k:[{t:"Perusahaan yang memproduksi barang berdasarkan pesanan."},{t:"Ciri khas: produk satu pesanan bisa dibedakan dari pesanan lain."}]},{t:"Cara kerja",k:[{t:"Biaya dihitung per pesanan lewat job cost sheet (rincian bahan baku langsung, buruh langsung, overhead pabrik)."},{t:"Bahan baku dan buruh langsung bisa dibebankan akurat ke tiap pesanan."},{t:"Overhead tidak dicatat rinci per pesanan, jadi dialokasikan dengan dasar alokasi tradisional.",k:[{t:"Akibatnya total biaya produksi per pesanan tidak akurat dan tidak berguna bagi manajemen."}]}]}],l:[{t:"Hasil perhitungan (untuk laporan keuangan)",k:[{t:"Pesanan belum selesai: persediaan barang dalam proses."},{t:"Selesai tapi belum terjual: persediaan barang jadi."},{t:"Sudah terjual: beban pokok penjualan di laba rugi."},{t:"Contoh: konveksi seragam: pesanan sekolah A masih dijahit (barang dalam proses), pesanan B sudah jadi menunggu diambil (barang jadi), pesanan C sudah diantar (beban pokok penjualan).",x:1}]}]},
"1.6.2":{c:"Process Costing",r:[{t:"Dipakai untuk",k:[{t:"Perusahaan yang memproduksi barang secara massal."},{t:"Biaya dihitung per batch; untuk produk yang sama, hasil antar batch tidak bisa dibedakan."}]},{t:"Cara kerja",k:[{t:"Biaya dipisahkan per departemen yang memproduksi."},{t:"Bahan baku dan buruh langsung akurat per batch, alokasi overhead per batch tidak akurat."},{t:"Biaya ekuivalen per unit dengan metode FIFO berbeda dari rata-rata tertimbang (weighted average).",k:[{t:"Tujuan: membagi total biaya departemen menjadi biaya produk selesai (ditransfer ke departemen berikutnya) dan biaya produk belum selesai."}]}]}],l:[{t:"Hasil perhitungan",k:[{t:"Biaya barang dalam proses di akhir tiap departemen dijumlahkan sebagai persediaan barang dalam proses."},{t:"Biaya produk selesai di semua departemen masuk persediaan barang jadi; bila terjual menjadi beban pokok penjualan."},{t:"Hanya untuk inventory costing, tidak berguna bagi manajemen karena biaya per unit ekuivalen tidak akurat."},{t:"Contoh: pabrik mi instan: biaya departemen adonan dipisah dari departemen pengemasan; mi yang selesai diadon pindah ke pengemasan membawa biayanya, yang setengah jadi dihitung sebagai barang dalam proses.",x:1}]}]},
"1.6.3":{c:"Joint Costs",r:[{t:"Pengertian",k:[{t:"Biaya untuk melakukan suatu proses yang menghasilkan beberapa jenis produk sekaligus (joint product)."},{t:"Contoh: peternakan ayam: ayam dipelihara lalu dipotong, dijual dalam potongan paha, dada, dan sebagainya.",x:1}]},{t:"Alokasi joint costs",k:[{t:"Berarti membagi biaya pemeliharaan dan pemotongan ke tiap potongan."},{t:"Secara logika tidak bisa dilakukan, karena aktivitas dilakukan pada satu ayam, bukan pada potongannya."},{t:"Tetap dialokasikan untuk laporan keuangan: nilai persediaan di laporan posisi keuangan harus dalam rupiah.",k:[{t:"Contoh: akhir tahun ada 10.000 potong paha, 15.000 sayap, 3.000 dada; jumlah potongan dikalikan biaya per unit hasil alokasi.",x:1}]}]}],l:[{t:"Untuk keputusan manajemen",k:[{t:"Nilai hasil alokasi sama sekali tidak berguna."},{t:"Contoh keputusan: dijual di titik split-off atau diproses lebih lanjut?",k:[{t:"Yang dibandingkan: tambahan pendapatan versus tambahan biaya."},{t:"Hasil alokasi joint costs tidak dipakai."}]},{t:"Jadi perhitungan biaya per unit dari alokasi joint cost hanya untuk inventory costing."},{t:"Contoh: satu sapi menghasilkan daging, tulang, dan kulit; biaya pemeliharaan Rp10 juta bisa dibagi berdasarkan berat atau harga jual dengan hasil berbeda. Tapi untuk memutuskan 'kulit dijual mentah atau disamak dulu', yang dihitung hanya tambahan pendapatan versus tambahan biaya penyamakan.",x:1}]}]},
"1.6.4":{c:"Alokasi Biaya Departemen Penunjang",r:[{t:"Jenis departemen",k:[{t:"Departemen produksi: terlibat langsung dalam proses produksi (perakitan, pengecatan, penyelesaian).",k:[{t:"Semua biayanya dibebankan ke produk."}]},{t:"Departemen penunjang (support department): tidak terlibat langsung, dibentuk untuk menunjang kelancaran departemen produksi (mis. pemeliharaan mesin).",k:[{t:"Biayanya dibebankan terlebih dahulu ke departemen produksi, baru ke produk."}]},{t:"Contoh: di pabrik furnitur, perakitan dan pengecatan adalah departemen produksi, bengkel pemeliharaan mesin adalah departemen penunjang.",x:1}]},{t:"Tiga metode alokasi",k:[{t:"Direct method: sesama departemen penunjang dianggap tidak saling melayani; biaya langsung dibebankan ke departemen produksi."},{t:"Step down method: departemen penunjang melayani departemen penunjang lain, tapi hubungannya satu arah.",k:[{t:"Contoh: administrasi pabrik dianggap melayani pemeliharaan mesin, tapi tidak sebaliknya, padahal kalau mesin fotokopi di administrasi rusak, yang memperbaiki adalah pemeliharaan mesin."}]},{t:"Reciprocal method: mengasumsikan keadaan sebenarnya, saling melayani dua arah, sehingga pembebanan juga dua arah.",k:[{t:"Paling akurat dibanding dua metode lainnya."}]},{t:"Contoh: biaya bengkel Rp20 juta dan administrasi Rp10 juta. Direct: keduanya langsung dibagi ke perakitan dan pengecatan. Step down: administrasi dibagi dulu ke bengkel dan produksi, lalu bengkel dibagi ke produksi. Reciprocal: keduanya saling membebani sampai ketemu angka akhir lewat persamaan.",x:1}]}],l:[{t:"Hasil alokasi",k:[{t:"Tiga cara tersebut menghasilkan angka yang berbeda."},{t:"Dibebankan ke departemen produksi sebagai tambahan overhead pabrik.",k:[{t:"Contoh: overhead asli perakitan Rp50 juta ditambah kiriman dari bengkel Rp12 juta jadi Rp62 juta, lalu dibagi ke produk memakai dasar jam buruh.",x:1}]}]},{t:"Kenapa direct dan step down tetap boleh",k:[{t:"Pembebanan ke produk memakai dasar alokasi tradisional, sehingga biaya produksi per unit tetap tidak akurat walau memakai reciprocal."},{t:"Jika hasil akhirnya tidak akurat, pembebanan biaya departemen penunjang yang tidak akurat pun diperbolehkan."},{t:"Contoh: biaya bengkel yang dibebankan ke perakitan Rp12 juta (direct), Rp12,5 juta (step down), Rp13 juta (reciprocal); selisihnya kecil dibanding ketidakakuratan di tahap berikutnya.",x:1},{t:"Contoh: seperti menimbang bahan dengan timbangan super presisi lalu membaginya ke piring pakai sendok kira-kira.",x:1}]}]},
"1.6.5":{c:"Barang Cacat: Scrap, Rework, Spoilage",r:[{t:"Jenis barang cacat",k:[{t:"Rework: pengerjaan ulang barang yang tidak sesuai spesifikasi; setelah dikerjakan ulang dijual dengan harga normal."},{t:"Spoilage: barang cacat atau rusak yang tidak dapat diperbaiki lagi; dijual dengan harga di bawah normal.",k:[{t:"Contoh: kaus yang lengannya salah jahit lalu dijahit ulang dan dijual normal adalah rework; kaus yang kainnya sobek parah dijual obral adalah spoilage.",x:1}]},{t:"Scrap: sisa-sisa produksi, misalnya potongan kain dari pembuatan baju.",k:[{t:"Scrap yang terlalu banyak merugikan karena berasal dari proses produksi yang tidak efisien."},{t:"Contoh: potongan kain sisa pola; kalau tiap hari menumpuk banyak, berarti pola dan pemotongannya kurang efisien.",x:1}]}]}],l:[{t:"Perlakuan akuntansi",k:[{t:"Rework dan spoilage dikategorikan normal loss atau abnormal loss.",k:[{t:"Normal loss: meningkatkan biaya per unit produk."},{t:"Abnormal loss: tidak memengaruhi biaya per unit; langsung masuk beban pokok penjualan sebagai abnormal loss."},{t:"Contoh: wajar kalau 2 dari 100 kaus gagal: biayanya ditanggung kaus yang bagus sehingga biaya per kaus naik sedikit. Kalau mesin salah setel lalu 20 kaus rusak, kerugiannya langsung dicatat sebagai abnormal loss.",x:1}]},{t:"Pembahasan scrap, rework, dan spoilage adalah soal perlakuan akuntansi, dibutuhkan untuk menyusun laporan keuangan."}]},{t:"Kesimpulan",k:[{t:"Akuntansi biaya sejak awal dirancang untuk inventory costing: memperkirakan nilai biaya produksi di barang dalam proses, barang jadi, dan beban pokok penjualan."},{t:"Karena itu dikembangkan tanpa membutuhkan biaya per unit yang akurat, dan bukan untuk memberi info bagi keputusan manajemen."},{t:"Contoh: tujuannya 'menghitung nilai stok dan harga pokok untuk lapor ke luar', bukan 'memutuskan produk mana yang layak diteruskan'.",x:1}]}]}

const mmH=(n,L,d)=>{const ch=n.k&&n.k.length;return '<div class="hn'+(L?' L':'')+(ch?' shut':'')+'"><div class="hb'+(n.x?' ex':'')+(ch?' has':'')+'"'+(ch?' onclick="mmTg2(this)"':'')+'>'+n.t+(ch?'<i class="hch"></i>':'')+'</div>'+(ch?'<div class="hc">'+n.k.map(c=>'<div class="hk">'+mmH(c,L,d+1)+'</div>').join('')+'</div>':'')+'</div>'};
const mmHz=o=>'<div class="mm hz"><div class="mmh">Mind Map</div><div class="mmz"><button onclick="mmZ(this,-.1)" aria-label="Perkecil">&minus;</button><button class="mmzv" onclick="mmZ(this,0)" aria-label="Ukuran asli">100%</button><button onclick="mmZ(this,.1)" aria-label="Perbesar">+</button></div><div class="hscroll"><div class="hrow">'+(o.l?'<div class="hc L">'+o.l.map(n=>'<div class="hk">'+mmH(n,1,0)+'</div>').join('')+'</div>':'')+'<div class="mmc" role="button" onclick="mmCt(this)">'+o.c+'<i class="mmch">&#9662;</i></div>'+(o.r?'<div class="hc">'+o.r.map(n=>'<div class="hk">'+mmH(n,0,0)+'</div>').join('')+'</div>':'')+'</div></div></div>';
function mmSet(m,z){z=Math.min(2,Math.max(.5,+z.toFixed(2)));const sc=m.querySelector('.hscroll'),r=(sc.scrollLeft+sc.clientWidth/2)/sc.scrollWidth;m.dataset.z=z;m.querySelector('.hrow').style.zoom=z;m.querySelector('.mmzv').textContent=Math.round(z*100)+'%';sc.scrollLeft=r*sc.scrollWidth-sc.clientWidth/2}
function mmZ(b,d){const m=b.closest('.mm');mmSet(m,d?+(m.dataset.z||1)+d:1)}
(()=>{let d0=0,z0=1,mm=null,gz=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),hs=e=>e.target.closest&&e.target.closest('.hscroll');
addEventListener('touchstart',e=>{const sc=hs(e);if(sc&&e.touches.length===2){mm=sc.closest('.mm');d0=dist(e.touches);z0=+(mm.dataset.z||1)}else if(e.touches.length<2)mm=null},{passive:true});
addEventListener('touchmove',e=>{if(mm&&e.touches.length===2){e.preventDefault();mmSet(mm,z0*dist(e.touches)/d0)}},{passive:false});
addEventListener('touchend',e=>{if(e.touches.length<2)mm=null});
addEventListener('wheel',e=>{const sc=hs(e);if(sc&&e.ctrlKey){e.preventDefault();const m=sc.closest('.mm');mmSet(m,+(m.dataset.z||1)*Math.exp(-Math.max(-30,Math.min(30,e.deltaY))*.01))}},{passive:false});
addEventListener('gesturestart',e=>{const sc=hs(e);if(sc){e.preventDefault();gz=+(sc.closest('.mm').dataset.z||1)}});
addEventListener('gesturechange',e=>{const sc=hs(e);if(sc){e.preventDefault();mmSet(sc.closest('.mm'),gz*e.scale)}});
})();
function mmFit(){document.querySelectorAll('.mm.hz .mmc').forEach(e=>{const w=e.textContent.trim().split(/\s+/).filter(x=>!/^[\d.]+$/.test(x)).length,n=w<=2?1:w<=4?2:3,cs=getComputedStyle(e),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.25,pd=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);for(let x=200;x<=560;x+=10){e.style.maxWidth=x+'px';if(e.offsetHeight-pd<=lh*n+2)break}})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(typeof R!=='undefined'&&R)mmFit()});

class="lyh"><b>Choosing a Loyalty Strategy</b><span>When profitability and loyalty are considered at the same time, it becomes clear that different customers need to be treated in different ways</span></div><div class="lyg"><div><b>Butterflies</b><ul><li>good fit between company&#39;s offerings and customers&#39; needs</li><li>high profit potential</li></ul><span>Actions:</span><ul><li>aim to achieve transactional satisfaction, not attitudinal loyalty</li><li>milk the accounts only as long as they are active</li><li>key challenge is to cease investing soon enough</li></ul></div><div><b>True Friends</b><ul><li>good fit between company&#39;s offerings and customers&#39; needs</li><li>highest profit potential</li></ul><span>Actions:</span><ul><li>communicate consistently but not too often</li><li>build both attitudinal and behavioral loyalty</li><li>delight these customers to nurture, defend, and retain them</li></ul></div><div><b>Strangers</b><ul><li>little fit between company&#39;s offerings and customers&#39; needs</li><li>lowest profit potential</li></ul><span>Actions:</span><ul><li>make no investment in these relationships</li><li>make profit on every transaction</li></ul></div><div><b>Barnacles</b><ul><li>limited fit between company&#39;s offerings and customers&#39; needs</li><li>low profit potential</li></ul><span>Actions:</span><ul><li>measure both the size and share of wallet</li><li>if share of wallet is low, focus on up- and cross-selling</li><li>if size of wallet is small, impose strict cost controls</li></ul></div></div></div>',clv:'<svg viewBox="0 0 400 120" role="img" aria-label="Rumus CLV sama dengan jumlah dari t sama dengan 1 sampai T, margin dikali retention pangkat t, dibagi satu ditambah discount rate pangkat t"><text x="10" y="66" class="fb2">CLV =</text><text x="112" y="76" class="fsg" text-anchor="middle">&#931;</text><text x="112" y="26" class="fl9" text-anchor="middle">T</text><text x="112" y="100" class="fl9" text-anchor="middle">t=1</text>< Object.assign(FNOTE,{cust:'<b>Cara membaca:</b> sumbu vertikal = marjin yang diperoleh (net margin realised), sumbu horizontal = cost to serve. Garis diagonal memisahkan pelanggan yang menguntungkan (<i>profits</i>, di atas garis) dan merugikan (<i>losses</i>, di bawah garis). Nama keempat jenis dicocokkan dari uraian teks modul: <b>Cheap</b> = kiri bawah, <b>Passive</b> = kiri atas, <b>Savvy</b> = kanan atas, <b>Aggressive</b> = kanan bawah (gambar asli tidak menulis nama itu di kotaknya).',whale:'<b>Cara membaca:</b> pelanggan diurutkan dari yang paling menguntungkan ke yang paling merugikan, lalu labanya dijumlahkan secara kumulatif. Kurva naik tajam sampai puncak, mendatar, lalu jatuh di ujung kanan sampai menyisakan laba aktual (100%). Selisih puncak dan laba aktual adalah potensi laba yang tidak terealisasi. Catatan: angka di gambar 170% dan 70%, sedangkan teks modul menulis sekitar 180% dan 80%.',loyal:'<b>Cara membaca:</b> kolom kiri = loyalitas rendah, kolom kanan = loyalitas tinggi; baris atas = profitabilitas tinggi, baris bawah = profitabilitas rendah (dicocokkan dari uraian teks modul; gambar asli tidak menandai sumbunya).',clv:'<b>Catatan:</b> rumus di modul memakai istilah <i>margin</i>, <i>retention</i>, dan <i>discount rate</i>, sedangkan keterangannya memakai Mt, Ct, dan i (modul tidak menjelaskan hubungan keduanya).'});

Object.assign(M[0].mat,{
"2.1":["Seperti dijelaskan di modul sebelumnya, informasi akuntansi keuangan dan akuntansi manajemen memiliki <b>karakteristik berbeda</b>, sehingga harus dihasilkan dari dua sistem yang berbeda.","Salah satu model yang dapat dipakai untuk mengembangkan sistem akuntansi manajemen adalah <b>Activity Based Costing (ABC)</b>."],
"2.2":["Tujuan <b>Activity Based Costing</b> adalah membebankan <b>biaya tidak langsung</b> dengan lebih akurat. ABC <b>tidak memperbaiki</b> cara pembebanan biaya langsung, karena pembebanan tersebut sudah menghasilkan angka yang akurat. Obyek biaya adalah tempat biaya dibebankan, misalnya produk atau pelanggan (di modul ini: <b>produk</b>).","Perbandingan (Gambar 2.1):","##F|Gambar 2.1|Perbandingan Antara Sistem Biaya Tradisional dengan Activity Based Costing|trad","- <b>Tradisional:</b> biaya langsung dibebankan ke obyek biaya.","- <b>ABC:</b> biaya dibebankan ke <b>aktivitas</b> dulu, baru ke obyek biaya.","Pada pembebanan tradisional, biaya yang dapat dibebankan akurat ke masing-masing produk disebut <b>biaya langsung</b>, seperti bahan mentah langsung dan buruh langsung. Klasifikasi biaya langsung tidak dibatasi pada biaya produksi saja: biaya umum, administrasi, dan penjualan yang dapat ditelusuri akurat ke produk juga termasuk biaya langsung.","Biaya yang tidak dapat dibebankan akurat (biaya tidak langsung) lebih banyak lagi pada model tradisional. Dengan ABC, pembebanannya dilakukan <b>dua tahap</b>:","- Tahap 1: biaya menurut akun dikonversi menjadi <b>biaya aktivitas</b>.","- Tahap 2: biaya aktivitas dibebankan ke produk."],
"2.2.1":["<b>Contoh PT XYZ</b>, produsen tiga jenis es krim: vanilla, strawberry, dan durian.","<b>Tabel 2.1</b>, per liter:","- Harga jual: vanilla Rp55.000, strawberry Rp60.000, durian Rp100.000","- Bahan mentah langsung: Rp10.000, Rp12.000, Rp15.000","- Buruh langsung: Rp3.000 untuk ketiganya","<b>Tabel 2.2: overhead pabrik</b> (total Rp610.000.000):","- Buruh tidak langsung Rp240.000.000","- Bahan mentah tidak langsung Rp50.000.000","- Listrik Rp80.000.000","- Penyusutan gedung pabrik Rp40.000.000","- Penyusutan mesin Rp200.000.000","Perusahaan selama ini membebankan overhead dengan dasar <b>jam mesin</b>, tetapi hasilnya dirasa tidak masuk akal, sehingga direksi mempertimbangkan model ABC yang disederhanakan.","Langkah pertama: inventarisasi aktivitas. Ada <b>lima aktivitas utama</b>:","- Perencanaan produksi","- Pengambilan bahan mentah dari gudang","- Set-up mesin","- Produksi es krim","- Administrasi produk","<b>Tahap 1:</b> semua biaya di buku besar dikonversi menjadi biaya aktivitas memakai <b>driver</b> yang paling tepat (Tabel 2.3). Misalnya listrik dibebankan ke tiap aktivitas berdasarkan <b>luas ruangan</b> yang dipakai.","<b>Tabel 2.4: hasil pembebanan ke aktivitas</b>, driver, dan tarif per driver:","- Perencanaan produksi: Rp36 juta, 450 driver, tarif Rp80.000","- Pengambilan bahan mentah: Rp72 juta, 800 driver, tarif Rp90.000","- Set-up mesin: Rp226 juta, 500 driver, tarif Rp452.000","- Produksi es krim: Rp216 juta, 600 driver, tarif Rp360.000","- Administrasi produk: Rp60 juta, 3 driver, tarif Rp20.000.000","<b>Tahap 2:</b> biaya aktivitas dibebankan ke produk memakai <b>pemicu aktivitas</b> (activity driver), misalnya jumlah batch produksi, jumlah pengambilan, waktu set-up, menit mesin, dan jumlah jenis produk (Tabel 2.5).","<b>Hasil ABC (Tabel 2.6):</b> total penjualan Rp1.110 juta, total biaya produksi Rp920 juta, laba kotor Rp190 juta.","- Vanilla: laba kotor Rp169,2 juta, marjin <b>30,76%</b>","- Strawberry: laba kotor Rp71,2 juta, marjin <b>19,78%</b>","- Durian: <b>rugi</b> Rp50,4 juta, marjin <b>-25,20%</b>","- Total marjin laba kotor 17,12%","Kesimpulan: es krim <b>vanilla</b> menghasilkan marjin tertinggi, sedangkan <b>durian</b> mengalami kerugian."],
"2.2.2":["Jika overhead dibebankan <b>secara tradisional</b> dengan dasar jam mesin, hasilnya (Tabel 2.7):","- Overhead pabrik: vanilla Rp338.888.889, strawberry Rp203.333.333, durian Rp67.777.778 (total Rp610 juta)","- Laba kotor: vanilla Rp81.111.111, strawberry Rp66.666.667, durian Rp42.222.222","- Marjin laba kotor: vanilla <b>14,75%</b>, strawberry <b>18,52%</b>, durian <b>21,11%</b>","- Total tetap 17,12%","Hasilnya <b>berbalik</b>: vanilla yang paling menguntungkan menurut ABC justru terlihat kurang menguntungkan secara tradisional, sedangkan durian yang paling menguntungkan secara tradisional ternyata merugi menurut ABC. Pertanyaannya: mengapa hasil bisa berbeda?"],
"2.3":["Dalam model ABC, aktivitas dibagi menjadi <b>empat tingkatan</b>:","- <b>Unit level activities:</b> dilakukan makin banyak seiring jumlah unit yang diproduksi. Contoh: memproduksi es krim.","- <b>Batch level activities:</b> bergantung pada <b>jumlah batch</b>, bukan jumlah unit. Contoh: perencanaan produksi. Produk A 10.000 unit dalam batch 2.500 unit = 4 kali perencanaan; produk B 5.000 unit dalam batch 500 unit = 10 kali. Walau volume A lebih besar, biaya perencanaan produksi B seharusnya lebih tinggi.","- <b>Product level activities:</b> makin banyak seiring bertambahnya <b>jenis produk</b>. Contoh: riset dan pengembangan (Toyota dengan sedan dan MPV).","- <b>Facility level activities:</b> dilakukan untuk perusahaan secara keseluruhan, tidak terkait produk. Contoh: pemeliharaan keamanan. Biaya ini tidak bisa dibebankan ke produk kecuali secara <b>arbitrer</b>.","Dasar pembebanan tradisional yang dipakai:","- Unit produksi","- Jam buruh langsung","- Biaya buruh langsung","- Jam mesin","- Biaya bahan mentah langsung","Semuanya hanya berdasarkan <b>tingkat unit</b>, sehingga produk bervolume besar dibebani overhead besar dan produk bervolume kecil dibebani overhead kecil.","Pada contoh: <b>vanilla</b> bervolume paling tinggi, jam mesin paling besar, jadi dibebani overhead terbesar dan terlihat marjinnya rendah. <b>Durian</b> bervolume terkecil, dibebani overhead terkecil, sehingga terlihat marjinnya tinggi."],
"2.4":["Setelah mengetahui keadaan sebenarnya, langkah berikutnya adalah memperbaiki profitabilitas. Menurut <b>Cooper dan Kaplan (1999)</b>, ada tujuh hal yang dapat dilakukan:","- <b>Reprice products:</b> menyesuaikan harga produk. Untuk produk yang merugi, perusahaan mencoba menaikkan harga; biasanya hanya bisa bila produk unik dan persaingan rendah. Kadang justru menurunkan harga agar volume naik, bila kurva permintaan elastis.","- <b>Substitute products:</b> pelanggan yang meminta produk non-standar menimbulkan aktivitas dan biaya tambahan. Perusahaan membujuk pelanggan membeli produk standar, atau mengenakan tambahan biaya untuk pesanan khusus.","- <b>Redesign products:</b> rancangan produk yang buruk membuat produksi tidak efisien; produk dirancang ulang agar lebih mudah dan efisien.","- <b>Improve production processes:</b> memperbaiki proses produksi, terutama bila persaingan ketat dan kekuatan pembeli (buyer power) lebih besar sehingga sulit menaikkan harga.","- <b>Change operating and strategic policies:</b> mengubah kebijakan operasional. ABC menunjukkan konsep <b>JIT</b> (persediaan seminimal mungkin, produksi berdasarkan permintaan) bisa menjadi bumerang: batch makin kecil, aktivitas tingkat batch makin sering, biaya justru naik.","- <b>Invest in flexible technology:</b> berinvestasi pada teknologi yang membuat aktivitas tingkat batch lebih efisien, misalnya mesin yang mempercepat set-up, agar batch kecil tidak membuat biaya set-up besar.","- <b>Eliminate products:</b> langkah terakhir bila semua cara gagal. Keputusan ini sering ditentang bagian pemasaran karena sebagian pelanggan bisa berhenti membeli produk lain; pemasaran perlu mengelola produk menguntungkan maupun tidak untuk memaksimalkan profitabilitas keseluruhan."],
"2.5":["<b>Kelemahan ABC:</b> model ini hanya memberi gambaran kondisi perusahaan yang akurat <b>saat ini</b>, tetapi tidak dapat melihat dampak efisiensi. Menghilangkan sebagian aktivitas belum tentu menghilangkan biayanya: <b>biaya tetap tidak serta merta hilang</b>, yang bisa dihilangkan hanya biaya tidak tetap. Karena itu dikembangkan ABC yang memisahkan biaya tetap dan biaya tidak tetap.","Pembagian biaya menurut perilakunya:","- <b>Biaya fleksibel (flexible costs):</b> naik-turun sesuai jumlah aktivitas. Jika aktivitas ditiadakan, biaya ini otomatis hilang.","- <b>Biaya tetap (committed costs):</b> muncul karena komitmen terhadap sumber daya untuk waktu tertentu dan sulit dibatalkan. Contoh: gaji pegawai tetap, penyusutan, sewa, pajak bumi dan bangunan. Jika aktivitas dihentikan, biaya ini menjadi beban dalam bentuk <b>kapasitas menganggur</b>.","Biaya committed dibebankan berdasarkan <b>kapasitas</b>:","- <b>Kapasitas teoritis:</b> kapasitas maksimal. Contoh: pegawai dibayar 8 jam per hari.","- <b>Kapasitas praktikal:</b> kapasitas teoritis dikurangi waktu tidak produktif (istirahat, minum, bercakap-cakap). Bila waktu tidak produktif 2 jam, kapasitas praktikal 6 jam per hari. ABC biasanya memakai kapasitas praktikal.","<b>Contoh:</b> 5 orang melakukan aktivitas pengambilan bahan mentah. Kapasitas praktikal sebulan = 5 orang x 6 jam x 5 hari x 4 minggu x 60 menit = <b>36.000 menit</b>. Driver aktivitas dikonversi menjadi waktu: 30 menit per pengambilan, sehingga vanilla 9.000 menit, strawberry 9.000 menit, durian 6.000 menit (total 24.000 menit).","Tabel 2.8: tarif per driver memakai kapasitas praktikal. Biaya Rp72.000.000 dibagi 36.000 menit = <b>Rp2.000 per menit</b>. Pembebanan: vanilla Rp18 juta, strawberry Rp18 juta, durian Rp12 juta.","Ada 12.000 menit yang tidak terpakai, biayanya <b>Rp24 juta</b> dicatat sebagai <b>biaya kapasitas menganggur</b>, tidak dibebankan ke produk, melainkan menjadi tanggungan perusahaan secara keseluruhan.","<b>Hasil (Tabel 2.9):</b>","- Marjin laba kotor: vanilla <b>32,40%</b>, strawberry <b>22,28%</b>, durian <b>-22,20%</b>","- Total laba kotor Rp190 juta, marjin 17,12%","<b>Efisiensi:</b> bila pengambilan bahan mentah vanilla dikurangi dari 9.000 menjadi 7.500 menit, biaya vanilla turun dari Rp18 juta menjadi Rp15 juta. Namun laba total <b>tidak naik</b>, karena biaya yang tadinya dibebankan ke aktivitas pindah menjadi biaya kapasitas menganggur (naik Rp3 juta menjadi Rp27 juta). Laba hanya naik jika perusahaan melakukan salah satu atau kedua hal ini:","- <b>Mengurangi sumber daya:</b> misalnya memberhentikan satu orang (kapasitas praktikal satu orang 7.200 menit, kapasitas menganggur sudah 13.500 menit). Biaya turun Rp14.400.000, yaitu Rp72.000.000 dibagi 5 orang.","- <b>Meningkatkan volume penjualan</b> es krim vanilla, strawberry, maupun durian dengan sumber daya yang sama, sehingga pendapatan naik dan kapasitas menganggur berkurang.","Tabel 2.10 (setelah efisiensi): biaya pengambilan bahan mentah Rp45 juta, kapasitas menganggur Rp27 juta, marjin vanilla 32,95%, total laba kotor tetap Rp190 juta."],
"2.6":["Model ketiga ABC adalah model dengan <b>persamaan waktu (time equation)</b>. Model ini dipakai untuk perusahaan dengan tingkat aktivitas yang amat beragam, sehingga sulit disederhanakan. Semua aktivitas diringkas dalam bentuk <b>persamaan</b> agar lebih mudah dikelola.","Contoh: aktivitas <b>menerima pesanan pelanggan</b> memiliki sub aktivitas yang bervariasi:","- Pesanan diterima melalui telpon, fax, atau email","- Pesanan untuk satu jenis produk atau beberapa jenis produk","- Pesanan untuk dalam kota, luar kota, atau luar negeri","Persamaan waktunya: penerimaan pesanan = 4 + 5 (kalau telpon) + 3 (kalau fax) + 3 (per setiap jenis produk) + 5 (dalam kota) + 8 (luar kota) + 15 (luar negeri).","Angka-angkanya adalah <b>waktu yang dibutuhkan</b> (menit). Contoh: pesanan telpon, dua jenis produk, dikirim ke luar kota = 4 + 5 + (3 x 2) + 8 = <b>23 menit</b>. Angka ini dikalikan dengan <b>tarif sumber daya berdasarkan kapasitas praktikal</b> untuk menghitung biaya penerimaan pesanan tersebut."],
"2.7":["Konsep ABC sebenarnya sangat cocok untuk <b>perusahaan jasa</b>, terbukti dari banyaknya artikel tentang penerapan ABC, terutama pada <b>rumah sakit dan bank</b>.","Industri jasa membutuhkannya karena sebagian besar biaya yang dikeluarkan adalah <b>biaya tidak langsung</b>.","<b>Time driven ABC</b> juga tepat untuk industri jasa, misalnya bank. Bank umumnya memiliki perhitungan waktu melayani nasabah, misalnya waktu <i>customer service</i> membuka rekening baru, atau lama kasir melayani orang menyetor atau menarik uang. Waktu-waktu tersebut dijadikan dasar menyusun <b>persamaan waktu</b> yang kemudian menjadi dasar pembebanan biaya dalam model ABC."]
