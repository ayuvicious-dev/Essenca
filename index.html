" class=\"fb8\">Target Cost-</text><text x=\"376.0\" y=\"317.0\" class=\"fb8\">Reduction</text><text x=\"376.0\" y=\"330.0\" class=\"fb8\">Objective</text><line x1=\"376\" y1=\"262\" x2=\"376\" y2=\"284\" class=\"fax\" marker-end=\"url(#ar5)\"/><rect x=\"330\" y=\"364\" width=\"92\" height=\"44\" rx=\"3\" class=\"fr\"/><text x=\"376.0\" y=\"383.5\" class=\"fb8\">Current</text><text x=\"376.0\" y=\"396.5\" class=\"fb8\">Cost</text><line x1=\"376\" y1=\"364\" x2=\"376\" y2=\"342\" class=\"fax\" marker-end=\"url(#ar5)\"/></svg>"});
Object.assign(FNOTE,{target:"<b>Cara membaca:</b> baris atas = <i>market driven costing</i> (kondisi pasar &rarr; target harga jual &rarr; target marjin laba &rarr; <i>allowable cost</i>). <i>Allowable cost</i> dan <i>product level target cost</i> bertemu di <i>strategic cost-reduction challenge</i>. <i>Product level target cost</i> saling berhubungan dengan <i>function level</i> dan <i>component level target cost</i> serta <i>supplies</i> (<i>component level target costing</i>). Di bawahnya, <i>current cost</i> dibandingkan dengan target untuk menentukan <i>target cost-reduction objective</i> (arti istilah terakhir ini tidak diuraikan di teks modul; kemungkinan merujuk pada selisih <i>current cost</i> ke <i>target cost</i>)."});
Object.assign(M[0].mat,{"5.1": ["Dalam dunia di mana teknologi berkembang semakin cepat, umur hidup suatu produk akan semakin pendek. Misalnya, suatu model telepon genggam biasanya hanya memiliki umur satu tahun atau kurang dari satu tahun sebelum model yang lebih baru dikeluarkan.", "Karena itu, perusahaan harus <b>berhati-hati</b> dalam menentukan <b>target biaya</b> dari produk tersebut. Kesalahan penentuan target biaya bisa membuat perusahaan mengalami kerugian.", "Penentuan target biaya yang baik adalah dalam <b>tahapan pengembangan</b>, bahkan <b>sebelum</b> produk tersebut diproduksi. Konsep inilah yang disebut dengan <b><i>target costing</i></b>."], "5.2": ["<b>Sakurai (1996)</b> mengatakan bahwa <i>target costing</i> dapat didefinisikan sebagai alat manajemen biaya yang dapat dipergunakan untuk <b>mengurangi biaya suatu produk selama masa hidup produk</b> tersebut.", "Sedangkan <b>Kato (1995)</b> mengatakan bahwa pada kenyataannya <i>target costing</i> <b>bukan merupakan suatu teknik untuk mengkuantifikasikan biaya</b>, namun merupakan suatu <b>program pengurangan biaya yang menyeluruh</b>, yang bahkan sudah dimulai sebelum rancangan pertama dari produk tersebut disusun.", "Jadi, <i>target costing</i> merupakan suatu pendekatan untuk <b>mengurangi biaya suatu produk yang baru</b> sepanjang masa hidup dari produk tersebut."], "5.3": ["Dari kedua definisi tersebut terlihat bahwa peranan <i>target costing</i> adalah <b>mengurangi biaya produk selama masa hidup produk</b>. Karena itu konsep <i>target costing</i> tidak dapat dipisahkan dari konsep <b><i>life cycle costing</i></b>.", "Menurut <b>Hansen dan Mowen (2011)</b>, definisi <i>life cycle cost</i> dapat dilihat dari dua sisi, yaitu:", "- <b><i>Product life cycle</i></b>", "- <b><i>Consumable life cycle</i></b>", "Dalam <i>product life cycle</i>, siklus hidup suatu produk dapat dibagi menjadi <b>lima tahapan</b> (di teks modul tertulis lima, tetapi yang diuraikan hanya empat), yaitu:", "- <b>Tahap pengenalan (<i>introduction stage</i>):</b> perusahaan melakukan kegiatan seperti pra produksi dan <i>start-up</i>, dengan tujuan menempatkan produk di pasar.", "- <b>Tahap pertumbuhan (<i>growth stage</i>):</b> produk memiliki pertumbuhan penjualan yang tinggi.", "- <b>Tahap maturitas (<i>maturity stage</i>):</b> tingkat pertumbuhan penjualan mulai melambat dan mencapai titik stagnasi.", "- <b>Tahap penurunan (<i>decline stage</i>):</b> produk mulai mengalami penurunan penjualan, sampai akhirnya tidak dapat terjual lagi.", "<i>Life cycle cost management</i> memberikan penekanan pada <b>pengurangan biaya</b>, dan bukan pada pengendalian biaya. <i>Target costing</i> menjadi alat yang amat berguna untuk melakukan pengurangan biaya pada <b>tahap perancangan produk</b>.", "Penentuan target biaya dalam tahap perancangan menjadi amat penting, karena dalam tahap perancangan belum ada biaya yang bersifat <i>committed</i>; semua biaya masih bersifat <b><i>fleksibel</i></b>, artinya masih dapat diubah-ubah perusahaan.", "<b>Hansen dan Mowen (2009)</b> (di bagian sebelumnya tertulis 2011) juga mengatakan bahwa <b>90%</b> dari biaya yang akan dikeluarkan perusahaan ditentukan pada tahap pengembangan produk, dan hanya <b>10%</b> sisanya yang ditentukan pada tahap produksi. Karena itu, jika perusahaan mau menghemat biaya, maka perusahaan harus melakukan <b>perencanaan produk yang tepat</b> pada masa pengembangan produk, termasuk di dalamnya menentukan <i>target cost</i> selama masa hidup dari produk tersebut.", "Sedangkan <i>consumable life-cycle</i> melihat siklus hidup produk dari <b>sudut pandang pemakaian oleh pelanggan</b>. Model ini membagi siklus hidup produk menjadi empat tahap, yaitu:", "- Pembelian", "- Pengoperasian", "- Pemeliharaan", "- Pembuangan (<i>disposal</i>)", "Secara keseluruhan, yang ingin dilihat adalah berapa <b>total biaya yang dikeluarkan oleh seseorang</b> saat mengkonsumsi produk tersebut. Misalnya, jika seseorang membeli printer dengan harga murah, namun selama pemakaian printer harus membeli tinta dengan harga yang mahal, maka secara keseluruhan biaya pemakaian produk selama siklus hidup produk akan menjadi mahal.", "Sebaliknya, jika seseorang membeli mobil dengan harga mahal, namun dalam tahap <i>disposal</i> dapat menjual mobil tersebut dengan harga tinggi, maka keseluruhan biaya pemakaian produk akan menjadi relatif murah."], "5.4": ["Menurut <b>Kaplan dan Norton (1999)</b>, terdapat <b>empat tahapan</b> yang harus dilalui perusahaan dalam <i>target costing</i>. Keempat tahapan tersebut adalah:", "- <b><i>Market driven costing</i></b>", "- <b><i>Product level target costing</i></b>", "- <b><i>Component level target costing</i></b>", "- <b><i>Chained target costing</i></b>"], "5.4.1": ["Dalam <i>market driven costing</i>, perusahaan akan menentukan <b>target harga jual</b> dari produk baru tersebut. Salah satu caranya adalah dengan mengambil harga jual dari produk yang sudah ada, dan harga jual tersebut disesuaikan dengan fitur-fitur tambahan yang terdapat dalam produk baru tersebut. Penyesuaian harga jual dilakukan dengan <b>menanyakan kepada konsumen dalam riset pasar</b> yang dilakukan perusahaan.", "Penentuan harga jual juga disesuaikan dengan <b>volume penjualan</b> yang ingin dicapai: semakin tinggi volume penjualan, maka harga jual harus diturunkan, dan sebaliknya.", "Setelah harga jual ditentukan, perusahaan akan menentukan <b>target marjin laba</b> untuk produk baru tersebut. Penentuan target marjin laba didasarkan pada marjin laba yang biasanya didapatkan perusahaan pada produk-produk sebelumnya. Target laba juga dapat ditentukan bukan khusus untuk satu produk, tetapi untuk <b>satu lini produk</b>.", "Misalnya, target laba dapat ditentukan untuk lini produk televisi secara keseluruhan. Dalam hal ini, untuk televisi dengan ukuran kecil akan mendapatkan target laba yang rendah, namun dikompensasi dengan target laba yang tinggi pada televisi ukuran besar. Yang terpenting, target laba untuk lini produk secara keseluruhan dapat tercapai.", "Misalnya, berdasarkan riset pasar, perusahaan mentargetkan harga jual televisi terbaru adalah <b>Rp5.000.000</b>, sedangkan target laba adalah <b>20%</b> dari harga jual. Maka selisih antara target harga jual dengan target laba, yaitu sebesar <b>Rp4.000.000</b>, disebut dengan <b><i>allowable cost</i></b>.", "Penentuan <i>allowable cost</i> <b>belum melihat kemampuan</b> apakah perusahaan mampu memproduksi dengan biaya tersebut."], "5.4.2": ["Dalam tahap ini, perusahaan akan menghitung <b><i>current cost</i></b> untuk membuat produk tersebut. <i>Current cost</i> merupakan biaya-biaya yang akan dikeluarkan untuk membuat barang tersebut dalam <b>kondisi perusahaan saat ini</b>. Misalnya, <i>current cost</i> untuk membuat produk tersebut adalah <b>Rp4.500.000</b>.", "Tugas perusahaan adalah membuat <i>current cost</i> tersebut <b>mendekati</b> <i>allowable cost</i> yang telah dihitung sebelumnya. Namun karena perhitungan <i>allowable cost</i> tidak melihat kondisi perusahaan, ada kemungkinan <i>allowable cost</i> tersebut tidak akan tercapai.", "Pada dasarnya terdapat <b>tiga cara pengurangan biaya</b> yang dapat dilakukan perusahaan, yaitu:", "- <b><i>Reverse engineering</i>:</b> perusahaan akan membongkar produk sejenis yang dihasilkan oleh pesaing untuk menemukan rancangan produk yang lebih efisien.", "- <b><i>Value analysis</i>:</b> perusahaan berusaha membandingkan antara biaya komponen untuk menghasilkan fitur-fitur yang dikehendaki oleh konsumen. Jika biaya dari komponen tersebut melebihi kontribusi komponen tersebut dalam menciptakan nilai bagi konsumen, maka perusahaan harus mencoba mengurangi biaya komponen tersebut.", "- <b>Perbaikan proses (<i>process improvement</i>):</b> perusahaan berusaha mencari cara-cara atau metode produksi yang lebih efisien untuk membuat produk tersebut.", "Berdasarkan perhitungan dari <i>component level costing</i> (akan diterangkan berikutnya), maka perusahaan akan mendapatkan angka <i>target cost</i> sebesar <b>Rp4.100.000</b>. Penentuan angka <i>target cost</i> ini sudah disesuaikan dengan kemampuan perusahaan, sehingga angka <i>target cost</i> ini sangat memungkinkan untuk dicapai. Angka inilah yang kemudian akan dijadikan sebagai <i>target cost</i> perusahaan.", "Selisih sebesar <b>Rp100.000</b> antara <i>target cost</i> dengan <i>allowable cost</i> akan dicoba untuk dicapai setelah produk tersebut diproduksi. Tahapan ini yang disebut dengan <b><i>strategic cost reduction challenge</i></b>."], "5.4.3": ["Dalam <i>value analysis</i> untuk <i>component level target costing</i>, perusahaan akan memperbandingkan antara <b>biaya per unit dari masing-masing komponen</b> untuk memproduksi barang tersebut dengan <b>kontribusi komponen</b> tersebut terhadap <i>functionality</i> dari produk tersebut berdasarkan apa yang diinginkan oleh konsumen.", "Cara untuk memperbandingkan biaya dengan <i>functionality</i> dapat dilihat pada buku <i>Management Accounting</i> karangan Atkinson, Kaplan, Young, dan Matsumura pada halaman 332-338.", "Dalam perbandingan tersebut akan terlihat <b>mana komponen yang kontribusi biayanya lebih tinggi</b> dibandingkan dengan kontribusi <i>functionality</i>. Untuk komponen-komponen tersebut, maka harus ada <b>target penurunan biaya komponen</b>, dan sebaliknya.", "Salah satu unsur yang akan membentuk <i>target cost</i> dari produk tersebut adalah <b>penjumlahan dari target biaya masing-masing komponen</b>.", "Rangkuman dari ketiga tahapan dalam penentuan <i>target cost</i> perusahaan dapat dilihat pada Gambar 5.1 berikut ini:", "##F|Gambar 5.1|Hubungan antara Market Driven Costing, Product Level Target Costing, dan Component Level Target Costing (Sumber: Cooper dan Slagmulder, Develop Profitable New Product with Target Costing, 1999)|target"], "5.4.4": ["Setelah semua target biaya komponen ditentukan, maka perusahaan akan <b>meminta pemasok-pemasok</b> perusahaan untuk mencapai target biaya komponen tersebut. Para pemasok akan terdorong untuk mencapai target biaya komponen, karena bila pemasok tersebut dapat mencapai target biaya komponen, maka perusahaan akan memberikan <b>kontrak</b> untuk memasok komponen tersebut selama masa hidup dari produk.", "<i>Target cost</i> yang telah ditentukan perusahaan harus dapat dicapai. Jika saat mau diproduksi ternyata terdapat komponen yang mengalami kenaikan harga, maka perusahaan harus mencari jalan untuk <b>mengurangi biaya dari komponen lainnya</b>. Hal yang paling penting adalah biaya yang dikeluarkan perusahaan <b>tidak boleh melebihi <i>target cost</i></b>-nya.", "Jika ternyata biaya yang diperkirakan akan dikeluarkan perusahaan melebihi <i>target cost</i> yang telah ditentukan, maka perusahaan seharusnya <b>membatalkan produksi produk baru</b> tersebut, kecuali jika produk tersebut merupakan <b>produk stratejik</b> perusahaan.", "Produk stratejik merupakan produk yang penting yang harus dimiliki perusahaan sebagai bagian dari strateji perusahaan. Jika produk ini tidak jadi dibuat, akan bisa menghambat perusahaan dalam mencapai tujuannya; misalnya jika produk tersebut tidak dibuat maka pangsa pasar perusahaan dapat digerogoti oleh pesaingnya.", "Jika produk yang akan diperkenalkan adalah produk stratejik, maka meskipun <i>target cost</i> perusahaan tidak dapat dicapai, produk tersebut tetap harus diperkenalkan, meskipun dengan konsekuensi <b>pengurangan target marjin</b> perusahaan."]});
Object.assign(M[0].sum,{"5.1": ["Teknologi makin cepat, jadi <b>umur produk makin pendek</b>. Contohnya HP: biasanya cuma bertahan sekitar satu tahun atau kurang sebelum model barunya keluar.||ibarat musim fashion: baju model tahun ini cepat ketinggalan zaman, jadi toko nggak boleh salah hitung berapa biaya bikinnya.", "Karena itu perusahaan harus <b>hati-hati menentukan target biaya</b>, soalnya kalau salah bisa rugi.", "Waktu terbaik menentukan target biaya adalah di <b>tahap pengembangan</b>, bahkan <b>sebelum</b> produk diproduksi. Konsep ini namanya <b><i>target costing</i></b>."], "5.2": ["Ada dua definisi <i>target costing</i>:@@<b>Sakurai (1996):</b> alat manajemen biaya untuk <b>mengurangi biaya produk selama masa hidupnya</b>@@<b>Kato (1995):</b> <b>bukan</b> teknik menghitung biaya, tapi <b>program pengurangan biaya yang menyeluruh</b>, dan sudah dimulai bahkan sebelum rancangan pertama produk dibuat", "Intinya: <i>target costing</i> = pendekatan buat <b>menekan biaya produk baru</b> sepanjang masa hidup produknya.||seperti merencanakan anggaran renovasi rumah sebelum tukang mulai kerja, bukan menghitung tagihan setelah rumahnya jadi."], "5.3": ["<i>Target costing</i> tujuannya menurunkan biaya produk selama masa hidupnya, jadi nggak bisa dipisah dari <b><i>life cycle costing</i></b>. Menurut <b>Hansen dan Mowen (2011)</b>, <i>life cycle cost</i> dilihat dari dua sisi: <b><i>product life cycle</i></b> dan <b><i>consumable life cycle</i></b>.", "<b><i>Product life cycle</i></b> (siklus hidup produk), tahapannya:@@<b>Pengenalan (<i>introduction</i>):</b> pra produksi, <i>start-up</i>, tujuannya menempatkan produk di pasar@@<b>Pertumbuhan (<i>growth</i>):</b> penjualan tumbuh tinggi@@<b>Maturitas (<i>maturity</i>):</b> pertumbuhan penjualan melambat, mentok@@<b>Penurunan (<i>decline</i>):</b> penjualan turun sampai akhirnya produk nggak laku lagi||sama seperti HP baru: diluncurkan, laris, mulai biasa saja, lalu ditinggal orang karena ada model baru.", "Catatan: di teks modul tertulis <i>product life cycle</i> dibagi <b>lima</b> tahap, tapi yang diuraikan hanya empat.", "<i>Life cycle cost management</i> menekankan <b>pengurangan biaya</b>, bukan pengendalian biaya. <i>Target costing</i> berguna banget di <b>tahap perancangan</b>, karena di tahap itu belum ada biaya <i>committed</i>: semua biaya masih <b>fleksibel</b> alias masih bisa diubah.", "Menurut <b>Hansen dan Mowen (2009)</b> (di bagian sebelumnya tertulis 2011): <b>90%</b> biaya produk ditentukan di tahap pengembangan, hanya <b>10%</b> di tahap produksi. Jadi kalau mau hemat, <b>rencanakan produk dengan tepat sejak awal</b>, termasuk menentukan <i>target cost</i> selama masa hidup produk.||arsitek yang menentukan bahan dan desain rumah sudah mengunci sebagian besar biayanya, sebelum tukang bangunan mulai kerja.", "<b><i>Consumable life cycle</i></b> melihat siklus hidup dari <b>sudut pandang pemakai (pelanggan)</b>, ada empat tahap: <b>pembelian, pengoperasian, pemeliharaan, pembuangan (<i>disposal</i>)</b>. Yang dilihat adalah <b>total biaya</b> yang dikeluarkan pelanggan selama memakai produk.||printer murah tapi tinta mahal: total biaya pemakaian akhirnya mahal. Mobil mahal tapi saat dijual kembali (<i>disposal</i>) harganya tinggi: total biaya pemakaian jadi relatif murah."], "5.4": ["Menurut <b>Kaplan dan Norton (1999)</b>, ada <b>empat tahapan</b> penerapan <i>target costing</i>:@@<b><i>Market driven costing</i></b> (5.4.1)@@<b><i>Product level target costing</i></b> (5.4.2)@@<b><i>Component level target costing</i></b> (5.4.3)@@<b><i>Chained target costing</i></b> (5.4.4)||seperti membangun rumah: tentukan dulu budget dari kemampuan pembeli, lalu hitung biaya rumah keseluruhan, lalu per bagian (dinding, atap, dst), lalu minta tukang dan toko bahan mengikuti budget per bagian."], "5.4.1": ["Di <i>market driven costing</i>, perusahaan menentukan <b>target harga jual</b> produk baru. Caranya, ambil harga produk yang sudah ada, lalu sesuaikan dengan <b>fitur tambahan</b> produk baru. Penyesuaiannya dengan <b>bertanya ke konsumen lewat riset pasar</b>.", "Harga juga disesuaikan dengan <b>volume penjualan</b> yang diinginkan: makin tinggi volume, makin rendah harga, dan sebaliknya.", "Setelah harga jual ketemu, tentukan <b>target marjin laba</b>, berdasarkan marjin yang biasa didapat dari produk sebelumnya. Target laba bisa ditentukan <b>per lini produk</b>, nggak harus per produk.||lini televisi: TV kecil target labanya rendah, tapi ditutup oleh target laba tinggi di TV besar. Yang penting laba satu lini tercapai.", "Contoh hitungan: harga jual TV terbaru <b>Rp5.000.000</b>, target laba <b>20%</b> dari harga jual (Rp1.000.000). Selisihnya, <b>Rp4.000.000</b>, disebut <b><i>allowable cost</i></b> (biaya maksimal yang diizinkan).", "<i>Allowable cost</i> <b>belum melihat kemampuan perusahaan</b>: belum tentu perusahaan sanggup membuat produk dengan biaya segitu."], "5.4.2": ["Di tahap ini perusahaan menghitung <b><i>current cost</i></b>, yaitu biaya membuat produk dengan <b>kondisi perusahaan saat ini</b>. Misalnya <b>Rp4.500.000</b>. Tugasnya: membuat <i>current cost</i> <b>mendekati</b> <i>allowable cost</i> (Rp4.000.000). Karena <i>allowable cost</i> tidak melihat kondisi perusahaan, bisa jadi nggak tercapai.", "Tiga cara menurunkan biaya:@@<b><i>Reverse engineering</i>:</b> membongkar produk sejenis milik pesaing untuk menemukan rancangan yang lebih efisien@@<b><i>Value analysis</i>:</b> bandingkan biaya tiap komponen dengan fitur yang diinginkan konsumen; kalau biaya komponen lebih besar dari nilai yang diciptakannya buat konsumen, biayanya dikurangi@@<b>Perbaikan proses (<i>process improvement</i>):</b> cari cara atau metode produksi yang lebih efisien||bongkar HP pesaing untuk lihat desain dalamnya (<i>reverse engineering</i>); sadar kamera 200 MP mahal padahal konsumen cuma butuh foto biasa (<i>value analysis</i>); atau merombak urutan kerja di pabrik (perbaikan proses).", "Dari hitungan <i>component level target costing</i> (dibahas di 5.4.3), perusahaan mendapat <b><i>target cost</i> Rp4.100.000</b>. Angka ini <b>sudah disesuaikan dengan kemampuan perusahaan</b>, jadi sangat mungkin dicapai, dan inilah <i>target cost</i> perusahaan.", "Selisih <b>Rp100.000</b> antara <i>target cost</i> (Rp4.100.000) dan <i>allowable cost</i> (Rp4.000.000) dicoba dicapai <b>setelah produk diproduksi</b>. Tahap ini disebut <b><i>strategic cost reduction challenge</i></b>."], "5.4.3": ["Di <i>value analysis</i> tingkat komponen, perusahaan membandingkan <b>biaya per unit tiap komponen</b> dengan <b>kontribusi komponen itu terhadap <i>functionality</i></b> produk menurut keinginan konsumen. Cara membandingkannya ada di buku <i>Management Accounting</i> karangan Atkinson, Kaplan, Young, dan Matsumura (hlm. 332-338).", "Hasilnya terlihat <b>komponen mana yang biayanya lebih tinggi dari kontribusi fungsinya</b>. Komponen itu harus diberi <b>target penurunan biaya</b>, dan sebaliknya.||layar HP menyumbang 30% biaya tapi dinilai konsumen sangat penting: aman. Casing mewah menyumbang 30% biaya tapi konsumen nggak peduli: biayanya harus ditekan.", "<b><i>Target cost</i> produk</b> dibentuk dari <b>penjumlahan target biaya semua komponennya</b>.", "Ringkasan tiga tahapan (Gambar 5.1):", "##F|Gambar 5.1|Hubungan antara Market Driven Costing, Product Level Target Costing, dan Component Level Target Costing (Sumber: Cooper dan Slagmulder, Develop Profitable New Product with Target Costing, 1999)|target"], "5.4.4": ["Setelah target biaya tiap komponen ketemu, perusahaan <b>meminta pemasok</b> mencapai target tersebut. Pemasok termotivasi karena kalau berhasil, perusahaan memberi <b>kontrak memasok komponen selama masa hidup produk</b>.||bengkel yang dijanjikan kontrak tetap seumur produk akan berusaha keras menurunkan harga suku cadangnya.", "<i>Target cost</i> harus <b>dapat dicapai</b>. Kalau ada komponen yang harganya naik, perusahaan mencari jalan <b>menurunkan biaya komponen lain</b>. Yang paling penting: <b>biaya tidak boleh melebihi <i>target cost</i></b>.", "Kalau biaya yang diperkirakan <b>melebihi <i>target cost</i></b>, sebaiknya produksi produk baru <b>dibatalkan</b>, <b>kecuali</b> produk itu adalah <b>produk stratejik</b>.", "<b>Produk stratejik</b> adalah produk penting yang harus dimiliki perusahaan sebagai bagian dari strateginya. Kalau tidak dibuat, pencapaian tujuan perusahaan bisa terhambat, misalnya <b>pangsa pasar digerogoti pesaing</b>. Untuk produk stratejik, <b>meski <i>target cost</i> tidak tercapai, produk tetap diluncurkan</b>, dengan konsekuensi <b>target marjin laba dikurangi</b>.||produsen mobil tetap meluncurkan mobil listrik walau biayanya masih di atas target, supaya pelanggannya tidak lari ke pesaing."]});
Object.assign(M[0].map,{"5.1": {"c": "Latar Belakang", "r": [{"t": "Masalah", "k": [{"t": "Teknologi berkembang cepat, umur produk makin pendek."}, {"t": "Contoh: model telepon genggam hanya bertahan sekitar satu tahun atau kurang.", "x": 1}]}, {"t": "Akibat", "k": [{"t": "Perusahaan harus berhati-hati menentukan target biaya."}, {"t": "Kesalahan target biaya bisa membuat perusahaan rugi."}]}], "l": [{"t": "Solusi", "k": [{"t": "Tentukan target biaya pada tahap pengembangan."}, {"t": "Dilakukan sebelum produk diproduksi."}, {"t": "Konsep ini disebut target costing."}]}]}, "5.2": {"c": "Definisi Target Costing", "r": [{"t": "Sakurai (1996)", "k": [{"t": "Alat manajemen biaya."}, {"t": "Untuk mengurangi biaya produk selama masa hidup produk."}]}, {"t": "Kato (1995)", "k": [{"t": "Bukan teknik mengkuantifikasikan biaya."}, {"t": "Program pengurangan biaya yang menyeluruh."}, {"t": "Dimulai sebelum rancangan pertama produk disusun."}]}], "l": [{"t": "Kesimpulan", "k": [{"t": "Pendekatan untuk mengurangi biaya produk baru."}, {"t": "Berlaku sepanjang masa hidup produk."}]}]}, "5.3": {"c": "Life Cycle Costing", "r": [{"t": "Dasar", "k": [{"t": "Target costing mengurangi biaya produk selama masa hidupnya."}, {"t": "Tidak terpisah dari life cycle costing."}, {"t": "Hansen dan Mowen (2011): dilihat dari dua sisi."}]}, {"t": "Product life cycle", "k": [{"t": "Pengenalan (introduction): pra produksi, start-up, menempatkan produk di pasar."}, {"t": "Pertumbuhan (growth): penjualan tinggi."}, {"t": "Maturitas (maturity): pertumbuhan melambat, stagnan."}, {"t": "Penurunan (decline): penjualan turun sampai tidak terjual."}, {"t": "Catatan: modul menulis lima tahap, tetapi hanya empat yang diuraikan."}]}], "l": [{"t": "Life cycle cost management", "k": [{"t": "Menekankan pengurangan biaya, bukan pengendalian."}, {"t": "Tahap perancangan: belum ada biaya committed, semua masih fleksibel."}, {"t": "Hansen dan Mowen (2009): 90% biaya ditentukan di tahap pengembangan, 10% di tahap produksi."}, {"t": "Maka perencanaan produk harus tepat, termasuk target cost."}]}, {"t": "Consumable life cycle", "k": [{"t": "Dari sudut pandang pemakaian oleh pelanggan."}, {"t": "Empat tahap: pembelian, pengoperasian, pemeliharaan, pembuangan (disposal)."}, {"t": "Yang dilihat: total biaya yang dikeluarkan pelanggan."}, {"t": "Contoh: printer murah tetapi tinta mahal, total biaya mahal. Mobil mahal tetapi nilai jual kembali tinggi, total biaya relatif murah.", "x": 1}]}]}, "5.4": {"c": "Tahapan Penerapan Target Costing", "r": [{"t": "Menurut Kaplan dan Norton (1999)", "k": [{"t": "Empat tahapan yang harus dilalui perusahaan."}]}, {"t": "Empat tahapan", "k": [{"t": "1. Market driven costing (5.4.1)"}, {"t": "2. Product level target costing (5.4.2)"}, {"t": "3. Component level target costing (5.4.3)"}, {"t": "4. Chained target costing (5.4.4)"}]}]}, "5.4.1": {"c": "Market Driven Costing", "r": [{"t": "Target harga jual", "k": [{"t": "Ambil harga produk yang sudah ada."}, {"t": "Sesuaikan dengan fitur tambahan melalui riset pasar."}, {"t": "Sesuaikan dengan volume penjualan: volume tinggi, harga turun; sebaliknya."}]}, {"t": "Target marjin laba", "k": [{"t": "Berdasarkan marjin laba produk sebelumnya."}, {"t": "Dapat ditentukan per lini produk, tidak harus per produk."}, {"t": "Contoh: TV kecil target laba rendah, dikompensasi TV besar target laba tinggi.", "x": 1}]}], "l": [{"t": "Allowable cost", "k": [{"t": "Target harga jual dikurangi target laba."}, {"t": "Contoh: harga Rp5.000.000, target laba 20%, allowable cost Rp4.000.000.", "x": 1}, {"t": "Belum melihat kemampuan perusahaan."}]}]}, "5.4.2": {"c": "Product Level Target Costing", "r": [{"t": "Current cost", "k": [{"t": "Biaya membuat produk pada kondisi perusahaan saat ini."}, {"t": "Contoh: Rp4.500.000.", "x": 1}, {"t": "Tugas: mendekatkan current cost ke allowable cost."}, {"t": "Allowable cost bisa saja tidak tercapai."}]}, {"t": "Tiga cara mengurangi biaya", "k": [{"t": "Reverse engineering: membongkar produk pesaing untuk menemukan rancangan efisien."}, {"t": "Value analysis: bandingkan biaya komponen dengan nilai bagi konsumen."}, {"t": "Process improvement: cari metode produksi yang lebih efisien."}]}], "l": [{"t": "Target cost", "k": [{"t": "Hasil perhitungan component level target costing."}, {"t": "Contoh: Rp4.100.000, sesuai kemampuan sehingga mungkin dicapai.", "x": 1}]}, {"t": "Strategic cost reduction challenge", "k": [{"t": "Selisih target cost dan allowable cost."}, {"t": "Contoh: Rp100.000.", "x": 1}, {"t": "Dicoba dicapai setelah produk diproduksi."}]}]}, "5.4.3": {"c": "Component Level Target Costing", "r": [{"t": "Value analysis tingkat komponen", "k": [{"t": "Bandingkan biaya per unit tiap komponen dengan kontribusinya pada functionality."}, {"t": "Functionality dinilai berdasarkan keinginan konsumen."}, {"t": "Rujukan: Management Accounting, Atkinson, Kaplan, Young, Matsumura, hlm. 332-338."}]}, {"t": "Hasil perbandingan", "k": [{"t": "Komponen yang biayanya lebih tinggi dari kontribusi fungsinya wajib ada target penurunan biaya."}, {"t": "Sebaliknya juga berlaku."}]}], "l": [{"t": "Target cost produk", "k": [{"t": "Penjumlahan target biaya semua komponen."}]}, {"t": "Gambar 5.1", "k": [{"t": "Merangkum market driven, product level, dan component level target costing."}]}]}, "5.4.4": {"c": "Chained Target Costing", "r": [{"t": "Peran pemasok", "k": [{"t": "Perusahaan meminta pemasok mencapai target biaya komponen."}, {"t": "Insentif: kontrak memasok selama masa hidup produk."}]}, {"t": "Syarat", "k": [{"t": "Target cost harus dapat dicapai."}, {"t": "Jika satu komponen naik harga, kurangi biaya komponen lain."}, {"t": "Biaya tidak boleh melebihi target cost."}]}], "l": [{"t": "Jika biaya melebihi target cost", "k": [{"t": "Seharusnya produksi produk baru dibatalkan."}]}, {"t": "Pengecualian: produk stratejik", "k": [{"t": "Produk penting sebagai bagian dari strateji perusahaan."}, {"t": "Jika tidak dibuat, pangsa pasar bisa digerogoti pesaing."}, {"t": "Tetap diperkenalkan walau target cost tidak tercapai."}, {"t": "Konsekuensi: target marjin dikurangi."}]}]}});
M[0].bq[4]=[["Mengapa perusahaan harus berhati-hati dalam menentukan target biaya produk menurut modul?", ["Karena umur hidup produk makin pendek akibat teknologi yang cepat berkembang", "Karena pajak atas produk baru selalu tinggi", "Karena pesaing selalu menjual lebih murah", "Karena produk selalu dijual dengan harga tetap"], 0, "Teknologi yang cepat berkembang membuat umur produk makin pendek, dan kesalahan target biaya bisa membuat perusahaan rugi."], ["Menurut modul, waktu terbaik menentukan target biaya adalah...", ["Pada tahap pengembangan, sebelum produk diproduksi", "Pada akhir tahun buku", "Pada tahap penurunan produk", "Setelah produk terjual"], 0, "Penentuan target biaya yang baik dilakukan pada tahapan pengembangan, bahkan sebelum produk diproduksi."], ["Menurut Kato (1995), target costing pada kenyataannya adalah...", ["Metode penilaian persediaan", "Program pengurangan biaya yang menyeluruh dan dimulai sebelum rancangan pertama produk disusun", "Alat untuk menghitung pajak", "Teknik untuk mengkuantifikasikan biaya"], 1, "Menurut Kato, target costing bukan teknik mengkuantifikasikan biaya, tetapi program pengurangan biaya yang menyeluruh."], ["Sakurai (1996) mendefinisikan target costing sebagai alat manajemen biaya untuk...", ["Mengendalikan biaya setelah produksi", "Menghitung laba perusahaan", "Mengurangi biaya produk selama masa hidup produk", "Menaikkan harga jual"], 2, "Menurut Sakurai, target costing adalah alat manajemen biaya untuk mengurangi biaya produk selama masa hidup produk."], ["Life cycle cost menurut Hansen dan Mowen dapat dilihat dari dua sisi, yaitu...", ["Biaya langsung dan tidak langsung", "Biaya kualitas dan biaya lingkungan", "Product life cycle dan consumable life cycle", "Biaya tetap dan biaya variabel"], 2, "Dua sisi life cycle cost: product life cycle dan consumable life cycle."], ["Pada tahap manakah dalam product life cycle perusahaan melakukan kegiatan pra produksi dan start-up?", ["Tahap maturitas", "Tahap pengenalan", "Tahap penurunan", "Tahap pertumbuhan"], 1, "Pada tahap pengenalan (introduction), perusahaan melakukan pra produksi dan start-up untuk menempatkan produk di pasar."], ["Tahap ketika pertumbuhan penjualan mulai melambat dan mencapai titik stagnasi disebut...", ["Tahap pengenalan", "Tahap penurunan", "Tahap pertumbuhan", "Tahap maturitas"], 3, "Itulah ciri tahap maturitas (maturity stage)."], ["Life cycle cost management lebih menekankan pada...", ["Penaikan harga jual", "Pengurangan biaya", "Penambahan persediaan", "Pengendalian biaya"], 1, "Life cycle cost management menekankan pengurangan biaya, bukan pengendalian biaya."], ["Mengapa target costing amat berguna pada tahap perancangan produk?", ["Karena belum ada biaya committed, semua biaya masih fleksibel", "Karena tidak ada biaya sama sekali", "Karena biaya sudah pasti turun sendiri", "Karena pada tahap itu semua biaya sudah committed"], 0, "Pada tahap perancangan belum ada biaya committed; semua biaya masih fleksibel sehingga dapat diubah."], ["Menurut Hansen dan Mowen, berapa persen biaya yang ditentukan pada tahap pengembangan produk?", ["10%", "90%", "75%", "50%"], 1, "90% biaya ditentukan pada tahap pengembangan, dan hanya 10% pada tahap produksi."], ["Empat tahap consumable life cycle adalah...", ["Riset, pengembangan, produksi, purna jual", "Desain, produksi, distribusi, penjualan", "Pembelian, pengoperasian, pemeliharaan, pembuangan", "Pengenalan, pertumbuhan, maturitas, penurunan"], 2, "Consumable life cycle melihat sudut pandang pemakaian pelanggan: pembelian, pengoperasian, pemeliharaan, dan pembuangan (disposal)."], ["Seseorang membeli printer murah, tetapi harus membeli tinta yang mahal. Menurut konsep consumable life cycle, total biaya pemakaian produk tersebut...", ["Tidak dapat dihitung", "Murah, karena harga printer murah", "Mahal secara keseluruhan", "Sama dengan harga printer"], 2, "Yang dilihat adalah total biaya selama pemakaian; tinta yang mahal membuat biaya keseluruhan menjadi mahal."], ["Empat tahapan penerapan target costing menurut Kaplan dan Norton (1999) adalah...", ["Belief, boundary, diagnostic, dan interactive", "Unit, batch, product, dan facility level", "Prevention, appraisal, internal failure, dan external failure", "Market driven, product level, component level, dan chained target costing"], 3, "Keempatnya: market driven costing, product level target costing, component level target costing, dan chained target costing."], ["Dalam market driven costing, perusahaan pertama-tama menentukan...", ["Jumlah karyawan", "Kontrak dengan pemasok", "Target harga jual produk baru", "Biaya komponen"], 2, "Perusahaan menentukan target harga jual produk baru, lalu target marjin laba."], ["Target harga jual Rp5.000.000 dan target laba 20% dari harga jual. Berapa allowable cost?", ["Rp5.000.000", "Rp4.000.000", "Rp1.000.000", "Rp4.500.000"], 1, "Target laba 20% x Rp5.000.000 = Rp1.000.000. Allowable cost = Rp5.000.000 - Rp1.000.000 = Rp4.000.000."], ["Kelemahan penentuan allowable cost menurut modul adalah...", ["Terlalu rumit dihitung", "Selalu terlalu tinggi", "Tidak memakai harga jual", "Belum melihat kemampuan perusahaan memproduksi dengan biaya tersebut"], 3, "Allowable cost belum melihat kemampuan perusahaan, sehingga mungkin tidak tercapai."], ["Biaya yang dikeluarkan untuk membuat produk dalam kondisi perusahaan saat ini disebut...", ["Committed cost", "Current cost", "Target cost", "Allowable cost"], 1, "Itulah pengertian current cost."], ["Membongkar produk sejenis milik pesaing untuk menemukan rancangan produk yang lebih efisien disebut...", ["Value analysis", "Reverse engineering", "Chained target costing", "Process improvement"], 1, "Itulah reverse engineering."], ["Dalam value analysis, komponen yang biayanya melebihi kontribusinya dalam menciptakan nilai bagi konsumen harus...", ["Ditambah biayanya", "Dihilangkan fungsinya tanpa melihat konsumen", "Dibiarkan saja", "Dikurangi biayanya"], 3, "Jika biaya komponen melebihi kontribusinya bagi nilai konsumen, perusahaan harus mencoba mengurangi biaya komponen tersebut."], ["Allowable cost Rp4.000.000 dan target cost Rp4.100.000. Selisih Rp100.000 yang dicoba dicapai setelah produk diproduksi disebut...", ["Hidden quality cost", "Customer lifetime value", "Strategic cost reduction challenge", "Reverse engineering"], 2, "Selisih antara target cost dan allowable cost yang dicoba dicapai setelah produksi disebut strategic cost reduction challenge."], ["Pada component level target costing, perusahaan membandingkan biaya per unit tiap komponen dengan...", ["Kontribusi komponen terhadap functionality produk menurut konsumen", "Laba tahun lalu", "Harga pesaing", "Jumlah pemasok"], 0, "Biaya per unit komponen dibandingkan dengan kontribusinya terhadap functionality produk berdasarkan keinginan konsumen."], ["Salah satu unsur yang membentuk target cost produk adalah...", ["Penjumlahan target biaya masing-masing komponen", "Laba tahun sebelumnya", "Biaya promosi saja", "Rata-rata harga pesaing"], 0, "Target cost produk terbentuk dari penjumlahan target biaya masing-masing komponen."], ["Mengapa pemasok terdorong mencapai target biaya komponen pada chained target costing?", ["Karena jika berhasil, perusahaan memberi kontrak memasok selama masa hidup produk", "Karena tidak ada pemasok lain", "Karena mendapat diskon pajak", "Karena dipaksa oleh pemerintah"], 0, "Pemasok yang dapat mencapai target biaya komponen akan diberi kontrak memasok komponen selama masa hidup produk."], ["Jika saat produksi ada komponen yang harganya naik, perusahaan seharusnya...", ["Mengabaikan kenaikan itu", "Menaikkan target cost", "Mencari jalan mengurangi biaya komponen lainnya", "Menghentikan semua komponen"], 2, "Perusahaan harus mencari jalan mengurangi biaya komponen lain agar biaya total tidak melebihi target cost."], ["Jika biaya yang diperkirakan melebihi target cost, perusahaan seharusnya membatalkan produksi, kecuali jika produk tersebut merupakan...", ["Produk lama", "Produk murah", "Produk musiman", "Produk stratejik"], 3, "Produk stratejik tetap harus diperkenalkan meskipun target cost tidak tercapai."], ["Konsekuensi memproduksi produk stratejik yang target cost-nya tidak tercapai adalah...", ["Kenaikan target marjin", "Penambahan jumlah pemasok", "Pembatalan kontrak konsumen", "Pengurangan target marjin perusahaan"], 3, "Produk tetap diperkenalkan, dengan konsekuensi pengurangan target marjin perusahaan."]];

Object.assign(M[0].mat,{
"6.1":["Salah satu kegunaan utama sistem informasi akuntansi manajemen adalah memberikan informasi yang dapat dipergunakan manajemen untuk <b>mengambil keputusan</b>.","Namun demikian, <b>tidak semua informasi biaya</b> dapat dipergunakan untuk pengambilan keputusan. Misalnya, jika yang dipergunakan adalah informasi mengenai biaya yang <b>sudah terjadi (<i>sunk costs</i>)</b>, maka pengambilan keputusan yang diambil bisa saja salah.","Karena itu, penting sekali untuk membedakan <b>mana biaya yang dapat dipakai dan yang tidak dapat dipakai</b> untuk pengambilan keputusan, sehingga manajemen dapat melakukan pengambilan keputusan yang benar."],
"6.2":["Pada dasarnya terdapat <b>lima langkah</b> yang harus dilakukan dalam melakukan pengambilan keputusan, termasuk pengambilan keputusan jangka pendek. Langkah-langkah tersebut adalah:","- Menyadari adanya permasalahan dan mendefinisikan permasalahan tersebut.","- Mengidentifikasikan alternatif-alternatif yang dapat dipergunakan untuk memecahkan masalah tersebut.","- Mengidentifikasikan perkiraan biaya yang akan dikeluarkan dan pendapatan yang akan diterima untuk setiap alternatif yang telah dipilih dan memperbandingkan biaya dan pendapatan <b>relevan</b> untuk setiap alternatif.","- Menilai dampak <b>faktor kualitatif</b> dari setiap alternatif tersebut terhadap tujuan perusahaan secara keseluruhan.","- Memilih alternatif yang paling menguntungkan, namun <b>tidak bertentangan dengan tujuan perusahaan</b>.","Contoh penerapan kelima langkah tersebut dalam pengambilan keputusan jangka pendek perusahaan:","- <b>Langkah 1:</b> perusahaan sedang dalam keadaan yang lesu dan beroperasi tidak dalam kapasitas maksimal. Terdapat calon pembeli (yang belum pernah membeli dari perusahaan) yang ingin membeli produk perusahaan dengan harga yang lebih murah dari harga normal perusahaan, dan hanya melakukan satu kali transaksi.","- <b>Langkah 2:</b> alternatif yang dapat dipilih perusahaan adalah (1) menerima pesanan tersebut atau (2) menolak pesanan tersebut.","- <b>Langkah 3:</b> perusahaan akan melakukan perhitungan tambahan pendapatan dan tambahan biaya jika perusahaan menerima pesanan tersebut.","- <b>Langkah 4:</b> salah satu faktor kualitatif yang harus dipertimbangkan perusahaan adalah apakah harga khusus yang diberikan pada calon pembeli ini akan dapat merusak harga normal perusahaan.","- <b>Langkah 5:</b> pesanan akan diterima apabila tambahan pendapatan yang diperoleh lebih besar dari tambahan biaya yang dikeluarkan, serta tidak merusak harga normal perusahaan."],
"6.3":["Subbab ini membahas tiga konsep biaya yang harus dipahami sebelum mengambil keputusan jangka pendek:","- <i>Sunk costs</i> (6.3.1)","- <i>Opportunity costs</i> (6.3.2)","- <i>Relevant costs</i> (6.3.3)","Intinya: tidak semua biaya dipakai dalam keputusan. Biaya yang sudah terjadi tidak dipakai, sedangkan kesempatan yang hilang dan biaya yang berbeda antar alternatif harus diperhitungkan."],
"6.3.1":["<i>Sunk costs</i> adalah biaya-biaya yang <b>sudah terjadi atau sudah dikeluarkan</b> perusahaan. Uang yang dikeluarkan perusahaan untuk biaya-biaya tersebut tidak dapat ditarik kembali. Hampir semua biaya yang terdapat dalam laporan laba-rugi perusahaan, jika perusahaan sudah melakukan pembayaran, merupakan <i>sunk costs</i>.","Biaya ini <b>tidak relevan</b> dan seharusnya tidak dipakai sebagai pertimbangan dalam pengambilan keputusan. Namun demikian, seringkali manajemen melakukan tindakan sebaliknya, yakni memperhitungkan <i>sunk cost</i> dalam pengambilan keputusan. Hal ini disebut sebagai <b><i>sunk cost phenomenon</i></b>.","Contohnya adalah pesawat <b>concorde</b>. Dari awal pengembangan pesawat ini, sudah terlihat jelas bahwa pesawat jenis ini tidak akan menguntungkan. Namun demikian pemerintah Inggris dan Perancis tetap menanamkan uang untuk proyek ini. Hal ini disebabkan karena kedua pemerintahan tersebut telah mengeluarkan uang yang banyak pada investasi pesawat concorde. Menurut psikologi, situasi ini timbul karena perusahaan tidak ingin membuang-buang uang.","Contoh lain dari <i>sunk costs</i> adalah biaya yang terdapat pada <b>persediaan perusahaan</b>, baik itu persediaan bahan mentah, persediaan barang dalam proses, maupun persediaan barang jadi. Misalkan, nilai persediaan barang jadi berasal dari biaya produksi dari barang-barang yang sudah selesai diproduksi. Karena semua biaya-biaya produksi tersebut sudah dikeluarkan perusahaan, maka biaya-biaya tersebut sudah merupakan <i>sunk cost</i> bagi perusahaan.","Implikasinya, biaya produksi tersebut menjadi <b>tidak relevan</b> lagi dijadikan dasar pengambilan keputusan perusahaan, termasuk didalamnya penentuan harga. Jika barang sudah terlanjur diproduksi perusahaan, maka penentuan harga sepenuhnya ditentukan oleh konsumen. Perusahaan seharusnya menjual produk tersebut kepada konsumen yang mau membayar dengan harga lebih tinggi, meskipun harga tersebut masih dibawah biaya per unitnya."],
"6.3.2":["<i>Opportunity costs</i> adalah <b>kesempatan yang hilang</b> karena perusahaan memilih suatu alternatif tertentu dibandingkan dengan alternatif lainnya. Kesempatan yang hilang tersebut dapat berupa pendapatan yang hilang, marjin kontribusi yang hilang, maupun profit yang hilang.","Misalkan PT. XYZ beroperasi dalam kondisi kapasitas penuh, dan ada seorang pembeli baru yang ingin memesan barang dari perusahaan XYZ. Pesanan tersebut, sebut saja pesanan A, akan menghasilkan marjin kontribusi sebesar <b>Rp30.000.000</b>. Namun, untuk memenuhi pesanan tersebut, perusahaan harus mengorbankan salah satu pesanan yang selama ini dilayaninya, yaitu pesanan B. Pesanan yang dikorbankan tersebut memiliki marjin kontribusi sebesar <b>Rp20.000.000</b>.","Hal ini berarti <i>opportunity costs</i> perusahaan untuk memenuhi pesanan A adalah <b>Rp20.000.000</b>.","<i>Opportunity costs</i> ini harus diperhitungkan dalam aspek pengambilan keputusan perusahaan, terutama jika perusahaan memiliki <b>keterbatasan (<i>shortage</i>)</b> dari sumber daya yang dimilikinya, baik itu berupa kapasitas mesin, kapasitas orang, jumlah bahan mentah, dan sebagainya."],
"6.3.3":["Biaya yang dapat dipakai sebagai informasi untuk pengambilan keputusan adalah <b>biaya relevan (<i>relevant costs</i>)</b>. Agar suatu biaya dapat dianggap sebagai biaya relevan, maka biaya-biaya tersebut harus memenuhi <b>dua persyaratan</b>, yaitu:","- <b>Belum terjadi:</b> biaya tersebut harus belum terjadi, dan baru akan terjadi apabila keputusan yang dipilih perusahaan dilaksanakan. Hal ini menjelaskan lagi bahwa biaya yang sudah terjadi (<i>sunk costs</i>) tidak dapat dipakai untuk pengambilan keputusan.","- <b>Berbeda untuk setiap alternatif:</b> biaya tersebut harus berbeda untuk setiap alternatif yang berbeda. Meskipun biaya tersebut belum dikeluarkan (memenuhi persyaratan pertama), namun jika untuk setiap alternatif yang ada biayanya adalah sama, maka biaya tersebut juga tidak relevan dalam pengambilan keputusan.","Misalkan, perusahaan memiliki kapasitas produksi sebanyak <b>100.000 unit</b>, namun jumlah kapasitas yang terpakai hanya <b>80.000 unit</b>. Saat ini perusahaan menerima tambahan produksi sebanyak 10.000 unit.","- Biaya yang <b>relevan</b> untuk keputusan ini adalah <b>biaya variabel</b>, karena biaya variabel tidak akan muncul kalau perusahaan tidak memproduksi tambahan 10.000 unit tersebut. Jika perusahaan memutuskan untuk menambah produksi, maka biaya variabel akan muncul, dan nilainya berbeda untuk keputusan yang berbeda. Biaya variabel termasuk dalam kategori biaya relevan.","- Tidak demikian halnya dengan <b>biaya tetap</b>, karena keputusan memproduksi 80.000 unit ataupun 90.000 unit akan memiliki total biaya tetap yang sama, sehingga dalam hal ini biaya tetap <b>bukan</b> merupakan biaya relevan untuk pengambilan keputusan."],
"6.4":["Subbab ini membahas penerapan konsep biaya relevan dalam situasi tertentu. Pada bagian yang tersedia dibahas empat situasi:","- Pesanan khusus (<i>special order</i>) pada 6.4.1","- Membuat sendiri atau membeli dari luar (<i>make or buy</i>) pada 6.4.2","- Mempertahankan atau menghentikan (<i>keep or drop</i>) pada 6.4.3","- Langsung dijual atau diproses lebih lanjut (<i>sell or process further</i>) pada 6.4.4","Pada semua situasi tersebut, yang dibandingkan antar alternatif hanyalah <b>biaya dan pendapatan relevan</b>."],
"6.4.1":["Kasus pertama dalam pengambilan keputusan jangka pendek adalah mengenai <b>pesanan khusus</b>. Situasi ini muncul saat perusahaan memproduksi dalam kapasitas dibawah yang dimiliki perusahaan. Pada saat demikian terdapat calon pembeli yang ingin melakukan pesanan khusus pada perusahaan dengan harga jual dibawah harga reguler perusahaan.","<b>Contoh soal.</b> PT Serasi Selaras adalah perusahaan yang memproduksi berbagai macam <i>furniture</i>. Saat ini usaha perusahaan sedang mengalami kelesuan. Perusahaan saat ini memiliki kapasitas produksi sebanyak <b>100.000 jam mesin</b>, namun yang terpakai hanya <b>60.000 jam mesin</b>. Dalam kondisi seperti ini, terdapat seorang calon pembeli yang ingin membeli <b>5.000 buah kursi</b>. Untuk memproduksi kursi tersebut dibutuhkan total jam mesin sebanyak <b>10.000 jam</b>.","- Biaya bahan mentah langsung untuk membuat satu kursi pesanan adalah Rp20.000.","- Jam buruh langsung yang dibutuhkan untuk membuat kursi adalah 15 menit per kursi, dengan biaya buruh langsung Rp16.000 per jam buruh langsung.","- Perusahaan membebankan biaya <i>overhead</i> berdasarkan jam mesin. Biaya <i>overhead</i> variabel adalah Rp6.000 per jam mesin.","- Tarif biaya <i>overhead</i> tetap adalah Rp8.000 per jam mesin, dihitung berdasarkan kapasitas mesin sebesar 100.000 jam mesin.","- Tidak ada biaya-biaya lain yang akan dikeluarkan perusahaan terkait dengan pesanan ini.","- Selama ini perusahaan menjual kursi tersebut dengan harga <b>Rp60.000</b> per kursi.","Pertanyaan:","- Jika pemesan memberikan penawaran harga sebesar <b>Rp42.000</b> per kursi, apakah tawaran sebaiknya diterima?","- Dengan penawaran yang sama, apakah pesanan sebaiknya diterima apabila perusahaan sudah berproduksi dalam <b>kapasitas penuh</b>?","- Dengan penawaran yang sama, apakah pesanan sebaiknya diterima apabila saat ini perusahaan sudah memakai <b>95.000 jam mesin</b> untuk pesanan regulernya?","<b>Jawaban pertanyaan 1.</b> Perusahaan saat ini memproduksi dibawah kapasitas yang ada, maka total biaya tetap <b>bukan</b> merupakan biaya relevan, karena perusahaan memproduksi dengan kapasitas 60.000 jam mesin maupun 100.000 jam mesin, total biaya <i>overhead</i> tetap adalah sama. Yang merupakan biaya relevan adalah biaya yang berubah kalau perusahaan menerima pesanan tersebut. Dalam hal ini semua biaya variabel (bahan mentah langsung, buruh langsung dan <i>overhead</i> pabrik variabel) merupakan biaya relevan.","Pendapatan relevan adalah harga beli yang diajukan pelanggan, yaitu Rp42.000 per kursi, sedangkan besarnya biaya relevan adalah Rp20.000 + Rp4.000 + Rp12.000 = <b>Rp36.000</b> per kursi. Karena pendapatan relevan lebih besar dari biaya relevan, maka berdasarkan kuantitatif maka sebaiknya pesanan ini <b>diterima</b>.","##T|Tabel 6.1: Biaya Relevan Pesanan Khusus per Kursi|Komponen~Per kursi (IDR)~Dasar hitung|Bahan mentah langsung~20.000~Diketahui|Buruh langsung~4.000~Rp16.000 x 15/60 jam|Overhead variabel~12.000~Rp6.000 x 2 jam mesin|*Total biaya relevan~36.000~Jumlah ketiganya|Harga tawaran~42.000~Diketahui|*Marjin kontribusi per kursi~6.000~42.000 - 36.000","<b>Jawaban pertanyaan 2 (kapasitas penuh).</b> Jika perusahaan sudah berproduksi dalam kapasitas penuh, maka perusahaan memerlukan tambahan kapasitas untuk memproduksi. Tambahan kapasitas tersebut akan menimbulkan tambahan biaya tetap, sehingga tambahan biaya tetap tersebut merupakan biaya relevan. Jika perusahaan sudah beroperasi dalam kapasitas penuh, maka terdapat alternatif lain untuk menerima pesanan tersebut, yaitu dengan mengorbankan penjualan yang ada sekarang.","Untuk opsi ini, maka perusahaan harus memperbandingkan antara <b>marjin kontribusi</b> yang diperoleh dari pesanan tersebut dengan marjin kontribusi yang harus dikorbankan untuk memenuhi pesanan tersebut. Mengapa yang diperbandingkan adalah marjin kontribusi? Karena dalam opsi ini total biaya tetap tidak berubah, apakah perusahaan tetap melakukan penjualan reguler atau memenuhi pesanan tersebut. Karena marjin kontribusi penjualan reguler lebih besar dari marjin kontribusi pesanan, maka sebaiknya pesanan tersebut <b>ditolak</b>.","<b>Jawaban pertanyaan 3 (terpakai 95.000 jam mesin).</b> Perusahaan memiliki kapasitas menganggur sebanyak 5.000 jam, namun yang dibutuhkan untuk memproses semua pesanan tersebut adalah 10.000 jam (karena calon pembeli tidak mau membeli kurang dari 5.000 kursi).","- Total marjin kontribusi yang diperoleh dari pesanan: (Rp42.000 - Rp36.000) x 5.000 kursi = <b>Rp30.000.000</b>.","- Total marjin kontribusi yang harus dikorbankan: (Rp60.000 - Rp36.000) x 2.500 kursi = <b>Rp60.000.000</b>.","Karena marjin kontribusi yang harus dikorbankan lebih besar dari total marjin kontribusi yang akan diterima dari pesanan itu, maka sebaiknya pesanan tersebut <b>ditolak</b>.","<b>Faktor kualitatif.</b> Perhitungan secara kuantitatif bukan merupakan satu-satunya faktor yang harus dipertimbangkan, namun juga faktor kualitatif. Dalam hal ini apakah transaksi ini akan menghalangi perusahaan untuk mencapai tujuan stratejiknya. Salah satu faktor kualitatif dari skenario pesanan khusus adalah apakah pesanan khusus tersebut akan membuat harga reguler perusahaan menjadi rusak. Jika demikian halnya, walaupun secara kuantitatif pesanan khusus tersebut menguntungkan, namun pesanan tersebut tetap harus ditolak."],
"6.4.2":["Dalam kasus ini, perusahaan biasanya memproduksi komponen yang dipakai pada produknya didalam perusahaan itu sendiri, namun terdapat penawaran yang lebih murah dari pemasok diluar perusahaan untuk memasok komponen tersebut. Dalam hal ini, keputusan yang harus diambil perusahaan adalah tetap memproduksi komponen didalam perusahaan atau membelinya dari pemasok.","<b>Contoh soal.</b> PT Indah Abadi adalah perusahaan yang memproduksi kipas angin. Selama ini perusahaan memproduksi pisau kipas angin didalam perusahaan itu sendiri. Biaya untuk membuat pisau kipas angin adalah:","- Biaya bahan mentah langsung: Rp10.000 per pisau","- Biaya buruh langsung: Rp6.000 per jam buruh langsung","- Biaya <i>overhead</i> pabrik variabel: Rp4.000 per jam buruh langsung","Diperlukan waktu 10 menit buruh langsung untuk membuat satu unit pisau. Perusahaan menyewa satu buah mesin yang dikhususkan untuk membuat pisau, dan biaya sewa mesin adalah <b>Rp100.000.000 per tahun</b>. Jika produksi pisau dihentikan, maka kontrak sewa mesin tersebut dapat dibatalkan. Besar biaya penyusutan untuk ruangan pabrik yang dipergunakan untuk membuat pisau adalah <b>Rp40.000.000 per tahun</b>. Jika pisau tidak diproduksi, maka ruangan tersebut akan menganggur dan tidak dapat dipergunakan untuk apapun. Jumlah pisau yang diproduksi adalah <b>20.000 pisau</b> dalam satu tahun. Saat ini terdapat pemasok dari luar perusahaan yang menawarkan untuk memasok pisau dengan harga <b>Rp17.000 per pisau</b>.","<b>Jawaban.</b> Sekali lagi yang menjadi biaya relevan adalah <b>biaya variabel</b>, karena biaya ini akan berbeda antara keputusan memproduksi sendiri atau membeli dari luar. Jika perusahaan memproduksi sendiri, maka biaya variabel akan muncul, namun jika perusahaan membeli dari luar maka biaya variabel ini dapat dihilangkan.","Namun untuk biaya tetap, perusahaan harus melihat apakah biaya tetap tersebut dapat dihilangkan apabila perusahaan membeli dari luar. Jika ya, maka biaya tetap tersebut merupakan biaya relevan, namun bila tidak, maka biaya tetap tersebut bukan merupakan biaya relevan, karena baik keputusan untuk membeli dari luar atau untuk memproduksi sendiri biayanya akan tetap sama.","Dalam kasus ini, biaya <b>sewa mesin</b> merupakan biaya tetap yang relevan, sedangkan biaya <b>penyusutan gedung pabrik</b> bukan merupakan biaya relevan.","Dengan demikian biaya yang relevan dalam kasus ini adalah semua biaya variabel (Rp11.000 per pisau) dan biaya sewa mesin (Rp100.000.000 per tahun atau Rp5.000 per pisau). Dengan demikian biaya relevan per pisau adalah <b>Rp16.000</b> per pisau. Jika dibandingkan dengan penawaran dari pemasok luar, maka opsi memproduksi sendiri masih lebih murah.","##T|Tabel 6.2: Perbandingan Biaya Relevan Make or Buy per Pisau|Komponen~Per pisau (IDR)~Relevan?|Biaya variabel (menurut modul)~11.000~Ya|Sewa mesin (100.000.000 / 20.000 pisau)~5.000~Ya, kontrak dapat dibatalkan|Penyusutan ruang pabrik (40.000.000 / 20.000 pisau)~2.000~Tidak, ruangan menganggur|*Total biaya relevan membuat sendiri~16.000~11.000 + 5.000|Harga pemasok luar~17.000~Diketahui","Namun, jika penawaran dari pemasok luar lebih murah, maka terdapat faktor <b>kualitatif</b> yang juga harus dipertimbangkan sebelum mengambil keputusan. Faktor-faktor tersebut antara lain, kualitas dari bahan baku atau komponen yang akan dipasok, kontinuitas pasokan, ketepatan waktu kedatangan pasokan, dan sebagainya. Sekali lagi, meskipun harga pasokan dari luar lebih murah, namun jika faktor kualitatif tidak mendukung, maka sebaiknya perusahaan tetap memproduksi komponen tersebut sendiri."],
"6.4.3":["Salah satu contoh dari masalah ini adalah apabila perusahaan memiliki beberapa jenis produk, dan ada beberapa produk yang tidak menguntungkan perusahaan. Dalam hal ini, perusahaan harus memutuskan apakah akan tetap mempertahankan produk tersebut ataukah menghentikan penjualan dan produksi dari produk tersebut. Hal yang sama juga bisa diberlakukan untuk evaluasi cabang, pelanggan, dan sebagainya.","<b>Contoh soal.</b> PT Bagus Hijau memproduksi dan menjual tiga jenis produk, yaitu produk A, B, dan C. Hasil kinerja perusahaan pada tahun 20X4 adalah:","##T|Tabel 6.3: Hasil Kinerja PT Bagus Hijau Tahun 20X4 (IDR)|~A~B~C~Total|Penjualan~195.000.000~225.000.000~275.000.000~695.000.000|Biaya bahan mentah langsung~36.000.000~28.000.000~60.000.000~124.000.000|Biaya buruh langsung~15.000.000~18.000.000~20.000.000~53.000.000|Biaya overhead pabrik - variabel~22.000.000~24.000.000~26.000.000~72.000.000|Beban pemasaran - variabel~47.000.000~64.000.000~32.000.000~143.000.000|*Marjin kontribusi~75.000.000~91.000.000~137.000.000~303.000.000|Biaya tetap langsung~15.000.000~26.000.000~85.000.000~126.000.000|Biaya tetap bersama~20.000.000~30.000.000~58.000.000~108.000.000|*Laba neto~40.000.000~35.000.000~(6.000.000)~69.000.000","Dari laporan tersebut terlihat bahwa produk C mengalami kerugian, dan perusahaan harus memutuskan apakah produk C akan dipertahankan atau dihentikan. Dalam kasus ini, semua <b>biaya variabel</b> merupakan biaya relevan, karena untuk keputusan mempertahankan produk maka biaya variabel tetap ada, namun jika produk dihentikan maka biaya variabel menjadi nol.","Dalam tabel terlihat ada dua biaya tetap, yaitu biaya tetap langsung dan biaya tetap bersama.","- <b>Biaya tetap langsung</b> merupakan biaya tetap yang dikeluarkan khusus untuk produk tersebut, sehingga biayanya bisa ditelusuri langsung ke produk. Contoh biaya tetap langsung adalah biaya sewa atau penyusutan mesin yang dikhususkan untuk memproduksi satu jenis produk, lalu biaya gaji untuk orang yang bekerja khusus untuk memproduksi satu produk dan sebagainya. Biaya tetap jenis ini memang tidak otomatis hilang jika suatu produk dihentikan, namun biaya tetap ini lebih mudah dihilangkan dibandingkan dengan biaya tetap bersama. Jika biaya tetap ini dapat dihilangkan jika produk dihentikan, maka biaya tetap ini akan menjadi biaya relevan, namun jika semuanya tidak dapat dihilangkan, maka akan menjadi biaya tidak relevan.","- <b>Biaya tetap bersama</b> merupakan biaya tetap yang dikeluarkan dan dipergunakan untuk ketiga produk yang dihasilkan perusahaan. Contoh dari biaya tetap bersama adalah biaya penyusutan gedung pabrik, biaya gaji supervisor yang mengawasi ketiga produk tersebut, biaya gaji direksi, dan sebagainya. Karena biaya ini dipergunakan untuk semua produk maka jika satu produk dihentikan, maka biaya tetap bersama biasanya tidak akan hilang, karena masih dipergunakan untuk produk lainnya. Karena biaya ini akan tetap sama apakah produk dihentikan atau tidak, maka biaya ini merupakan biaya tidak relevan.","Dalam contoh soal, diasumsikan bahwa jika produk C dihentikan, maka semua biaya tetap langsung dapat dihilangkan, sedangkan biaya tetap bersama tidak dapat dihilangkan semua. Hasil keputusan tersebut adalah:","##T|Tabel 6.4: Hasil Jika Produk C Dihentikan (IDR)|~A~B~C~Total|Penjualan~195.000.000~225.000.000~-~420.000.000|Biaya bahan mentah langsung~36.000.000~28.000.000~-~64.000.000|Biaya buruh langsung~15.000.000~18.000.000~-~33.000.000|Biaya overhead pabrik - variabel~22.000.000~24.000.000~-~46.000.000|Beban pemasaran - variabel~47.000.000~64.000.000~-~111.000.000|*Marjin kontribusi~75.000.000~91.000.000~-~166.000.000|Biaya tetap langsung~15.000.000~26.000.000~-~41.000.000|Biaya tetap bersama~20.000.000~30.000.000~58.000.000~108.000.000|*Laba neto~40.000.000~35.000.000~(58.000.000)~17.000.000","Dari tabel diatas terlihat bahwa keputusan untuk menghentikan produk C merupakan keputusan yang <b>salah</b>, karena total profit perusahaan akan berkurang (dari Rp69.000.000 menjadi Rp17.000.000). Faktor kualitatif yang dapat mempengaruhi keputusan ini antara lain adalah masalah moral pegawai apabila ada pegawai yang diberhentikan karena produk dihentikan atau divisi dimana mereka bekerja ditutup."],
"6.4.4":["Situasi ini terkait dengan perusahaan yang memproduksi <i>joint product</i>. Seperti yang telah dibahas sebelumnya, <i>joint product</i> berasal dari satu proses produksi yang akan menghasilkan beberapa jenis produk.","Dalam kasus ini, alokasi <i>joint costs</i> <b>bukan merupakan biaya relevan</b>, karena <i>joint cost</i> merupakan <i>sunk cost</i>. Hal ini disebabkan karena keputusan untuk memilih apakah produk yang dihasilkan dari <i>joint process</i> tersebut akan dijual atau diproses lebih lanjut dilakukan dilakukan setelah <i>joint process</i> selesai dilakukan.","Dalam keputusan ini, yang relevan adalah <b>tambahan pendapatan</b> dibandingkan dengan <b>tambahan biaya</b> bila produk dari <i>joint process</i> diproses lebih lanjut. Bila tambahan pendapatan lebih besar daripada tambahan biaya, produk sebaiknya diproses lebih lanjut.","<b>Contoh PT Kimia Rumit:</b> perusahaan menghasilkan produk AAA dari <i>joint process</i>. AAA dapat langsung dijual, atau diproses lebih lanjut menjadi AAA1. Pemrosesan lebih lanjut menambah pendapatan <b>Rp3.000 per kg</b> dan menambah biaya <b>Rp2.000 per kg</b>.","##T|Tabel 6.5: Keputusan Sell or Process Further AAA per kg|Komponen~Per kg (IDR)~Keterangan|Tambahan pendapatan (AAA1 dibanding AAA)~3.000~Relevan|Tambahan biaya pemrosesan lebih lanjut~2.000~Relevan|*Keuntungan tambahan bila diproses~1.000~3.000 - 2.000|Joint cost~-~Tidak relevan (sunk cost)","Kesimpulan: AAA sebaiknya <b>diproses lebih lanjut menjadi AAA1</b>, karena tambahan pendapatan (Rp3.000) lebih besar daripada tambahan biaya (Rp2.000) sehingga laba naik Rp1.000 per kg."],"6.4.5":["Penentuan bauran produk dengan kendala terjadi apabila perusahaan memiliki <b>kapasitas produksi yang terbatas</b> sehingga tidak dapat memenuhi permintaan yang ada. Karena itu perusahaan harus memprioritaskan produk mana yang harus diproduksinya agar dapat menghasilkan keuntungan maksimal.", "Dalam kondisi ini, perusahaan harus memprioritaskan produk-produk yang memiliki <b>marjin kontribusi per menit <i>constraint</i> yang paling tinggi</b>. Dasar pemilihan prioritas yang dipakai adalah marjin kontribusi, karena <b>biaya tetap bukan merupakan biaya relevan</b>. Apapun bauran produk yang dipilih perusahaan, biaya tetap akan sama, sehingga dengan memaksimalkan marjin kontribusi, otomatis akan memaksimalkan keuntungan perusahaan.", "<b>Contoh soal.</b> PT Cahaya Gelap memproduksi tiga jenis produk, yaitu produk A1, A2, dan A3. Informasi yang berkaitan dengan masing-masing produk adalah:", "##T|Tabel 6.6: Informasi Produk PT Cahaya Gelap|~A1~A2~A3|Harga Jual per Unit (Rp)~10.000~8.000~7.000|Biaya Variabel per Unit (Rp)~5.000~4.000~3.500|Marjin Kontribusi per Unit (Rp)~5.000~4.000~3.500|Permintaan Pasar (Unit)~1.000~2.000~3.000|Waktu Produksi per Unit (Menit)~10~4~2|Marjin Kontribusi per Menit (Rp)~500~1.000~1.750", "Kapasitas produksi adalah <b>3.000 jam atau 18.000 menit</b> per tahun. Berdasarkan informasi yang diberikan, tentukan bauran produk yang dapat memaksimalkan keuntungan perusahaan.", "<b>Jawaban.</b> Pada tabel terlihat bahwa produk A1 walaupun memiliki marjin kontribusi per unit yang paling tinggi, namun memiliki marjin kontribusi per menit yang <b>paling rendah</b>. Hal ini dikarenakan untuk memproduksi A1 diperlukan waktu yang paling lama. Karena prioritas pemilihan produk harus didasarkan pada marjin kontribusi per menit yang paling tinggi, prioritas diberikan pada <b>A3</b>, lalu <b>A2</b>, baru kemudian <b>A1</b>.", "Untuk memproduksi A3 dibutuhkan total waktu 6.000 menit, A2 8.000 menit, sehingga total waktu yang dibutuhkan untuk kedua produk adalah 14.000 menit. Waktu yang tersisa untuk A1 adalah 4.000 menit, sehingga jumlah A1 yang dapat dibuat hanya <b>400 unit</b> (4.000 menit / 10 menit). Total marjin kontribusi maksimal yang dapat diperoleh perusahaan adalah Rp10.500.000 untuk A3, Rp8.000.000 untuk A2, dan Rp2.000.000 untuk A1, dengan total <b>Rp20.500.000</b>.", "##T|Tabel 6.7: Ringkasan Bauran Produk Optimal PT Cahaya Gelap|Produk~Unit~Menit mesin~Marjin kontribusi (IDR)|A3~3.000~6.000~10.500.000|A2~2.000~8.000~8.000.000|A1 (sisa kapasitas)~400~4.000~2.000.000|*Total~5.400~18.000~20.500.000"],"6.5":["Salah satu permasalahan yang timbul dari konsep biaya relevan adalah penggunaan <b>alokasi tradisional</b> dalam penentuan tarif biaya <i>overhead</i>, baik biaya <i>overhead</i> tetap maupun variabel. Seperti telah dibahas, tarif <i>overhead</i> tradisional menghasilkan perhitungan yang kurang akurat. Karena itu penggunaan <i>activity based costing</i> dalam menghitung biaya relevan diharapkan dapat memperbaiki keakuratan perhitungan yang dilakukan perusahaan.", "Dalam konsep <i>activity based costing</i>, biaya dikeluarkan untuk membayar <b>sumber daya</b> yang dipakai perusahaan untuk melakukan aktivitas. Karena itu semua biaya yang dikeluarkan harus dikaitkan dengan sumber daya yang dipakai. Pada dasarnya terdapat dua jenis sumber daya, yaitu <i>flexible resources</i> dan <i>committed resources</i>.", "<b><i>Flexible resources</i></b> adalah sumber daya yang diperoleh sesuai dengan yang dibutuhkan. Jika perusahaan mengurangi aktivitas, sumber daya fleksibel ikut dikurangi; jika aktivitas dihilangkan, sumber daya ini juga hilang.", "<b><i>Committed resources</i></b> adalah sumber daya yang diperoleh sebelum kegiatan dilakukan dan perusahaan sudah berkomitmen terhadapnya, sehingga ada kegiatan maupun tidak, sumber daya tersebut tetap dimiliki perusahaan dan sulit dihilangkan. Konsekuensinya adalah ketidakseimbangan antara sumber daya yang dibutuhkan dengan yang tersedia. Jika yang dibutuhkan lebih rendah dari yang tersedia, terjadi <b>kapasitas menganggur</b> yang tidak otomatis dapat dihilangkan.", "<b>Contoh soal.</b> Untuk memperjelas konsep tersebut, diberikan contoh penerapannya pada kasus pesanan khusus (<i>special order</i>). Darjiman adalah Presiden Direktur PT Jelas Cermat yang bergerak di usaha pembuatan kacamata. Selama ini perusahaan dipercaya banyak perusahaan asing, seperti Radenstock, Buacroc, dan lainnya untuk memproduksi kacamata merek mereka. Belakangan, karena persaingan yang ketat dari negara tetangga seperti Vietnam dan China, ditambah upah buruh yang makin tinggi, perusahaan mulai kehilangan cukup banyak order. Di tengah kelesuan itu, ada pesanan dari PT Opportunis sebanyak <b>10.000 kacamata</b> dengan harga <b>Rp325.000 per kacamata</b>. Pesanan ini akan dijual PT Opportunis ke negara-negara Afrika, bukan pesanan reguler, dan hanya satu kali pemesanan. PT Jelas Cermat sudah menerapkan <i>activity based costing</i> dan ingin memakainya untuk menganalisis kelayakan pesanan ini. Informasi untuk memproduksi 10.000 kacamata tersebut adalah:", "##T|Tabel 6.8: Informasi Biaya dan Sumber Daya Pesanan 10.000 Kacamata PT Jelas Cermat|Biaya~Pemicu Aktivitas (Activity Driver)~Kapasitas Mengganggur~Jumlah Dibutuhkan~Tarif per Aktivitas^2|^Committed~Fleksibel|Bahan Mentah Langsung~Rangka Kacamata~-~10.000~-~12.000|Buruh Langsung~Jam Buruh Langsung~-~5.000~-~20.000|Set-Up~Jam Set-Up~45~80~10.000.000~120.000|Inspeksi~Jam Inspeksi~400~800~20.000.000~80.000|Pembuatan Kacamata~Jam Mesin~8.000~6.000~15.000.000~3.000", "Peningkatan kapasitas <i>set-up</i>, inspeksi, dan pembuatan kacamata harus dilakukan dalam <b>kelipatan tertentu</b>:", "- Kapasitas <i>set-up</i> dapat ditingkatkan dalam kelipatan <b>25 jam</b>.", "- Kapasitas inspeksi ditingkatkan dalam kelipatan <b>2.000 jam</b>, dengan peningkatan biaya tetap <b>Rp20.000.000</b> untuk setiap kelipatan kapasitas.", "- Mesin untuk membuat kacamata dapat disewa dengan harga <b>Rp20.000 per jam mesin</b>. Setiap mesin menambah kapasitas produksi sebanyak <b>2.500 jam mesin</b>.", "Berdasarkan informasi yang diberikan, apakah pesanan tersebut lebih baik diterima atau tidak?", "<b>Jawaban.</b> Terdapat dua jenis sumber daya yang bersifat fleksibel, yaitu bahan mentah langsung dan buruh langsung. Untuk keduanya, jumlah sumber daya yang dipasok akan sesuai dengan jumlah yang dipakai, sehingga biaya yang dikeluarkan sesuai dengan jumlah pemakaian. Biaya bahan mentah langsung = Rp12.000 x 10.000 rangka kacamata = <b>Rp120.000.000</b>. Biaya buruh langsung = Rp20.000 x 5.000 jam buruh langsung = <b>Rp100.000.000</b>.", "Ketiga aktivitas lainnya, yaitu <i>set-up</i>, inspeksi, dan pembuatan kacamata, memiliki komponen sumber daya <b>fleksibel</b> dan sumber daya <b>committed</b>. Untuk sumber daya fleksibel, biaya aktivitas disesuaikan dengan jumlah pemakaian: <i>set-up</i> Rp120.000 x 80 = <b>Rp9.600.000</b>; inspeksi <b>Rp6.400.000</b> (angka menurut modul); pembuatan kacamata Rp3.000 x 6.000 jam mesin = <b>Rp18.000.000</b>. Total biaya fleksibel untuk pesanan tersebut adalah <b>Rp254.000.000</b>.", "Untuk sumber daya <i>committed</i>, perusahaan sudah memperoleh sumber daya tersebut di depan, sehingga jumlah yang dipasok bisa berbeda dengan yang dibutuhkan. Pada <i>set-up</i>, kapasitas menganggur 45 jam sedangkan yang dibutuhkan 80 jam, sehingga kurang 35 jam. Penambahan hanya dapat dilakukan dalam kelipatan 25 jam, maka dibutuhkan tambahan <b>50 jam <i>set-up</i></b> dengan kenaikan biaya <i>committed</i> sebesar <b>Rp20.000.000</b>. Pada inspeksi, jam yang harus ditambah adalah <b>2.000 jam</b> dengan tambahan biaya <i>committed</i> <b>Rp20.000.000</b>. Pada pembuatan kacamata tidak diperlukan tambahan sumber daya <i>committed</i>, karena kapasitas menganggur masih memadai. Total tambahan biaya <i>committed</i> untuk pesanan ini adalah <b>Rp40.000.000</b>.", "##T|Tabel 6.9: Ringkasan Biaya Relevan Pesanan 10.000 Kacamata (IDR)|Komponen~Hitungan~Jumlah|Bahan mentah langsung~12.000 x 10.000~120.000.000|Buruh langsung~20.000 x 5.000~100.000.000|Set-up (fleksibel)~120.000 x 80~9.600.000|Inspeksi (fleksibel)~Menurut modul~6.400.000|Pembuatan kacamata (fleksibel)~3.000 x 6.000~18.000.000|*Subtotal biaya fleksibel~Jumlah lima baris di atas~254.000.000|Set-up (committed)~2 kelipatan 25 jam~20.000.000|Inspeksi (committed)~1 kelipatan 2.000 jam~20.000.000|Pembuatan kacamata (committed)~Kapasitas menganggur cukup~0|*Subtotal tambahan biaya committed~20.000.000 + 20.000.000 + 0~40.000.000|*Total biaya relevan~254.000.000 + 40.000.000~294.000.000|Biaya relevan per kacamata~294.000.000 / 10.000~294.000|Harga tawaran per kacamata~Diketahui~325.000", "Total biaya untuk memenuhi pesanan khusus tersebut adalah Rp254.000.000 + Rp40.000.000 = <b>Rp294.000.000</b> atau <b>Rp294.000 per kacamata</b>. Karena harga pesanan (Rp325.000) masih lebih tinggi daripada biaya relevan, maka secara perhitungan kuantitatif pesanan tersebut <b>dapat diterima</b>.", "<b>Catatan hitungan:</b> pada baris inspeksi, Rp80.000 x 800 jam sebenarnya Rp64.000.000, tetapi modul menulis <b>Rp6.400.000</b> (setara tarif Rp8.000), dan total Rp254.000.000 serta Rp294.000.000 mengikuti angka Rp6.400.000 itu. Di ujian ikuti angka yang diberikan soal."],"6.6":["<b>Teori kendala (<i>Theory of Constraint</i>)</b> merupakan konsep yang mencoba memaksimalkan keuntungan perusahaan yang beroperasi dengan kendala-kendala yang dihadapi. Kendala dapat dibagi menjadi dua:", "- <b>Kendala internal:</b> berasal dari dalam perusahaan, seperti kapasitas perusahaan yang terbatas untuk memenuhi permintaan pasar.", "- <b>Kendala eksternal:</b> berasal dari luar perusahaan, seperti pasokan bahan baku yang tidak mencukupi, atau permintaan pasar yang rendah sehingga kapasitas perusahaan menganggur.", "Teori kendala mengatakan bahwa perusahaan harus dapat mengelola kendala-kendala tersebut sehingga dapat memaksimalkan keuntungannya.", "Keuntungan dalam konsep ini didefinisikan sebagai <b><i>throughput</i></b>, yaitu <b>penjualan dikurangi biaya bahan mentah langsung</b>. Konsep ini mirip dengan marjin kontribusi, hanya saja biaya yang dianggap sebagai biaya variabel adalah biaya bahan mentah langsung. Semua biaya lain, di luar bahan mentah langsung, dianggap sebagai biaya tetap. Karena bauran produk apapun tidak akan mempengaruhi besarnya biaya tetap, dengan memaksimalkan <i>throughput</i> otomatis keuntungan perusahaan akan maksimal.", "Ada <b>lima langkah</b> yang harus diterapkan dalam konsep ini:", "- 1. Tentukan kendala yang dihadapi perusahaan.", "- 2. Manfaatkan (<i>exploit</i>) kendala tersebut dengan semaksimal mungkin.", "- 3. Semua keputusan lain harus disesuaikan dengan keputusan yang terkait dengan kendala tersebut.", "- 4. Tingkatkan hal yang terkendala.", "- 5. Jika kendala sudah terpecahkan, kembali lagi ke langkah pertama.", "<b>Contoh soal.</b> PT Cemara Tinggi adalah perusahaan yang memproduksi tiga jenis produk, yaitu ABC, DEF, dan GHI. Proses produksi ketiga produk tersebut dilakukan melalui <b>lima buah mesin</b>. Informasi yang berkaitan dengan produk dan mesin tersebut adalah:", "##T|Tabel 6.10: Informasi Produk dan Mesin PT Cemara Tinggi|~ABC~DEF~GHI|Pemakaian Mesin 1 per Unit (menit)~10~5~8|Pemakaian Mesin 2 per Unit (menit)~12~6~4|Pemakaian Mesin 3 per Unit (menit)~4~5~2|Pemakaian Mesin 4 per Unit (menit)~8~10~5|Pemakaian Mesin 5 per Unit (menit)~4~8~10|Harga Jual per Unit (Rp)~10.000~12.000~15.000|Biaya Bahan Baku Langsung per Unit (Rp)~6.000~7.000~8.000|Throughput per Unit (Rp)~4.000~5.000~7.000|Permintaan Pasar (Unit)~8.000~5.000~3.000", "<b>Catatan hitungan:</b> angka Permintaan Pasar di tabel (8.000; 5.000; 3.000) tidak cocok dengan hitungan di jawaban. Jawaban memakai permintaan <b>800, 500, dan 300 unit</b> (misalnya Mesin 1 untuk ABC: 10 menit x 800 = 8.000 menit; GHI 300 unit x 4 menit = 1.200 menit), jadi kemungkinan tabel di modul kelebihan satu nol. Di ujian ikuti angka yang diberikan soal.", "Kapasitas produksi yang dimiliki perusahaan: mesin 1 = 15.000 menit, mesin 2 = 12.000 menit, mesin 3 = 8.000 menit, mesin 4 = 15.000 menit, dan mesin 5 = 12.000 menit. Aplikasikan soal ini dalam lima tahap penerapan <i>theory of constraint</i>.", "<b>Jawaban, tahap 1 (menentukan kendala).</b> Perusahaan harus menemukan kendala dengan membandingkan total waktu yang dibutuhkan untuk memenuhi semua permintaan pasar dengan total kapasitas yang dimiliki. Jika kapasitas tidak memadai, kendalanya adalah <b>kendala internal</b>; jika kapasitas mencukupi, kendalanya adalah <b>kendala eksternal</b>. Hasil perhitungannya:", "##T|Tabel 6.11: Waktu yang Dibutuhkan Dibandingkan dengan Kapasitas Mesin (menit)|~ABC~DEF~GHI~Total~Kapasitas|Mesin 1~8.000~2.500~2.400~12.900~15.000|Mesin 2~9.600~3.000~1.200~13.800~12.000|Mesin 3~3.200~2.500~600~6.300~8.000|Mesin 4~6.400~5.000~1.500~12.900~15.000|Mesin 5~3.200~4.000~3.000~10.200~12.000", "Untuk memenuhi semua permintaan diperlukan 12.900 menit pada mesin 1, sedangkan kapasitas mesin 1 adalah 15.000 menit, jadi mesin 1 masih cukup. Situasi yang sama berlaku untuk mesin 3, 4, dan 5. Namun, mesin 2 membutuhkan 13.800 menit sedangkan kapasitasnya hanya 12.000 menit, sehingga tidak dapat memenuhi permintaan pasar. Karena itu, kendala yang dihadapi perusahaan adalah <b>kendala internal pada mesin 2</b>.", "<b>Tahap 2 (memanfaatkan kendala).</b> Perusahaan harus memanfaatkan mesin 2 sebaik mungkin, salah satunya dengan memprioritaskan produk yang memiliki <i>throughput</i> tinggi untuk diproduksi terlebih dahulu di mesin 2. Untuk itu dibandingkan <i>throughput</i> per menit masing-masing produk: ABC = Rp4.000 / 12 menit = <b>Rp333,33</b>; DEF = Rp5.000 / 6 menit = <b>Rp833,33</b>; GHI = Rp7.000 / 4 menit = <b>Rp1.750</b>. Prioritas produksi: <b>GHI</b>, lalu <b>DEF</b>, dan terakhir <b>ABC</b>.", "##T|Tabel 6.12: Ringkasan Throughput per Menit Mesin 2 (Kendala)|~ABC~DEF~GHI|Throughput per unit (IDR)~4.000~5.000~7.000|Menit mesin 2 per unit~12~6~4|*Throughput per menit mesin 2 (IDR)~333,33~833,33~1.750", "Untuk memenuhi semua permintaan GHI diperlukan 300 x 4 menit = 1.200 menit dari mesin 2, dan untuk DEF diperlukan 500 x 6 menit = 3.000 menit. Total waktu mesin 2 untuk DEF dan GHI adalah 4.200 menit. Menit mesin 2 yang tersisa untuk ABC adalah 12.000 - 4.200 = 7.800 menit, yang hanya cukup untuk <b>650 unit ABC</b> (7.800 / 12 menit). Jadi bauran produk yang memaksimalkan <i>throughput</i> adalah 650 unit ABC, 500 unit DEF, dan 300 unit GHI, dengan total <i>throughput</i> maksimal (Rp4.000 x 650) + (Rp5.000 x 500) + (Rp7.000 x 300) = <b>Rp7.200.000</b>.", "##T|Tabel 6.13: Ringkasan Rencana Produksi PT Cemara Tinggi pada Mesin 2|Produk~Unit~Menit mesin 2~Throughput (IDR)|GHI~300~1.200~2.100.000|DEF~500~3.000~2.500.000|ABC~650~7.800~2.600.000|*Total~1.450~12.000~7.200.000", "<b>Tahap 3 (menyesuaikan keputusan lain).</b> Semua keputusan yang berkaitan dengan mesin 1, 3, 4, dan 5, misalnya soal penjadwalan (<i>scheduling</i>), dilakukan dengan mengacu pada keputusan yang diambil untuk mesin 2. Konsep ini dalam teori kendala disebut <b><i>drum-buffer-rope</i> (DBR)</b>: mesin 2 (mesin yang terkendala) menjadi <b><i>drum</i></b> (irama penentu kerja) bagi mesin 3, 4, dan 5, dan juga menjadi <b>tali (<i>rope</i>)</b> yang dipakai untuk membatasi produksi mesin 1.", "<b>Tahap 4 (meningkatkan kendala).</b> Kendala yang dihadapi adalah keterbatasan kapasitas mesin 2. Karena itu perusahaan dapat meningkatkan kapasitas mesin 2, apakah melalui lembur, <i>outsourcing</i>, atau bahkan penambahan mesin baru. Peningkatan kapasitas dapat dilakukan selama penambahan <i>throughput</i> masih lebih besar daripada penambahan biaya untuk peningkatan kapasitas tersebut.", "<b>Tahap 5 (mengulang dari awal).</b> Kendala yang dihadapi perusahaan tidak ada akhirnya. Jika kapasitas mesin 2 sudah ditambah, kendala akan bergeser ke mesin-mesin lainnya, atau bahkan berpindah ke luar (<i>external constraint</i>) karena kapasitas sekarang melebihi apa yang dapat diserap pasar. Untuk memecahkan masalah ini, perusahaan harus mulai melakukan langkah pertama lagi."]
});
