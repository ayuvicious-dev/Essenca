Object.assign(M[0].mat,{
"4.1":["Dalam memprioritaskan pelanggan yang akan dilayani, banyak perusahaan memakai tolok ukur yang berkaitan dengan <b>loyalitas pelanggan</b>, seperti <i>frequency of purchase</i>, <i>recency of purchase</i>, <i>value of purchase</i>, <i>share of wallet</i>, dan sebagainya.", "Perusahaan-perusahaan tersebut mengasumsikan bahwa <b>pelanggan yang loyal adalah pelanggan yang menguntungkan</b>. Bahkan konsep <i>Customer Relationship Management</i> (CRM) menganjurkan agar perusahaan lebih baik menjalin hubungan yang lebih erat dengan pelanggan yang sudah ada dan berusaha menyediakan produk atau jasa yang mereka inginkan, daripada mencari pelanggan baru. Ada pula piranti lunak CRM yang berisi semua informasi mengenai pelanggan dan dapat diakses semua pegawai perusahaan yang berhubungan dengan pelanggan tersebut.", "Masalahnya: apakah pelanggan yang loyal otomatis merupakan pelanggan yang menguntungkan? Jawabannya <b>tidak selalu</b>, karena bisa saja pelanggan yang loyal justru merugikan perusahaan. Sisi loyalitas hanya memandang pelanggan dari satu sisi. Untuk sisi lainnya, perusahaan harus melihat juga <b>profitabilitas pelanggan</b>."],
"4.2":["Masalah pertama dalam menghitung profitabilitas pelanggan adalah <b>pendapatan yang diterima perusahaan</b>. Perusahaan sering memperoleh pendapatan netto yang berbeda dengan harga jual yang diberikan kepada pelanggan. Dari harga jual yang tertera, perusahaan kemudian memberikan berbagai macam potongan:", "- diskon untuk volume pembelian,", "- diskon untuk pembayaran tepat waktu,", "- <i>allowance</i> yang diberikan kepada distributor,", "- ongkos angkut.", "Banyaknya kebocoran ini disebut <i>pricing waterfall</i>, yang membuat pendapatan bersih yang diterima perusahaan bisa berbeda secara signifikan dengan harga jual brutonya.", "Dalam sistem akuntansi perusahaan, pengurangan-pengurangan tersebut <b>tidak dikaitkan langsung dengan akun masing-masing pelanggan</b>, tetapi dicatat secara agregat pada catatan keuangan perusahaan. Akibatnya sulit melihat berapa sebenarnya pendapatan bersih perusahaan dari tiap pelanggan. Seperti yang telah disinggung di modul sebelumnya, jika perusahaan ingin menghitung profitabilitas pelanggan, dibutuhkan <b>suatu sistem akuntansi tersendiri</b> yang menelusuri <i>pricing waterfall</i> serta biaya-biaya lainnya pada masing-masing pelanggan.", "Perhitungan profitabilitas pelanggan yang dibahas dalam modul ini ada dua:", "- <i>Activity Based Costing</i>", "- <i>Customer Lifetime Value</i>"],
"4.3":["<i>Activity based costing</i> membantu perusahaan mengidentifikasi biaya yang dibutuhkan untuk melayani pelanggan. Prinsip perhitungannya pada dasarnya sama dengan pembahasan dalam modul <i>activity based costing</i>. Perbedaannya, <b>obyek biaya (cost object) adalah pelanggan</b>. Aktivitas yang dibebankan adalah <i>customer level activities</i> (aktivitas tingkatan pelanggan), yaitu aktivitas yang besar kecilnya bergantung dari jumlah pelanggan yang dimiliki perusahaan: semakin banyak pelanggan, semakin tinggi pula biaya dan aktivitas tingkatan ini.", "Dari hasil perhitungan ABC akan ditemukan pelanggan yang pelayanannya mahal (<i>high-cost to serve customer</i>) dan pelanggan yang pelayanannya murah (<i>low-cost to serve</i>). Menurut <b>Cooper dan Kaplan (1999)</b>, alokasi biaya pelanggan akan menemukan penggolongan pelanggan sebagai berikut (Gambar 4.1):", "##F|Gambar 4.1|Margin and High or Low Cost to Serve Customer|cust", "Dari sudut profitabilitas, pelanggan dibagi menjadi <b>empat jenis</b>: <i>Cheap</i>, <i>Passive</i>, <i>Savvy</i>, dan <i>Aggressive</i>.", "- <b>Cheap:</b> pelanggan dengan <i>cost to serve</i> rendah, tetapi tidak mau membayar mahal atas produk yang dihasilkan, sehingga marjin yang diperoleh perusahaan juga rendah. Mereka beranggapan bahwa karena tidak banyak mengonsumsi aktivitas perusahaan, mereka berhak meminta harga rendah. Untuk memastikan apakah pelanggan ini menguntungkan atau merugikan, perlu perhitungan profitabilitas pelanggan dengan <i>activity based costing</i>.", "- <b>Passive:</b> pelanggan dengan <i>cost to serve</i> rendah, namun perusahaan memiliki <b>marjin yang tinggi</b>. Ini pelanggan yang paling menguntungkan. Biasanya mereka kurang pandai, karena berani membayar lebih untuk aktivitas yang tidak mereka nikmati.", "- <b>Savvy:</b> perusahaan mendapat marjin yang tinggi, namun pelanggan ini juga mengharuskan perusahaan mengeluarkan <i>cost to serve</i> yang tinggi. Jika perusahaan tidak berhati-hati, jenis pelanggan ini dapat merugikan.", "- <b>Aggressive:</b> <i>cost to serve</i> tinggi, namun marjin rendah. Golongan ini kemungkinan besar akan merugikan perusahaan.", "Penggolongan ini membuat perusahaan memahami gambaran pelanggan yang saat ini dimiliki, dan kemudian dapat mengambil keputusan yang tepat dalam mengelola pelanggan-pelanggan tersebut.", "Dari hasil perhitungan profitabilitas pelanggan, sering ditemukan kurva berbentuk ikan paus yang dinamakan <b><i>whale curve</i></b>. Pada gambar tersebut terlihat bahwa <b>20% pelanggan terbaik</b> menghasilkan sekitar 180% dari total laba perusahaan, <b>sekitar 60% pelanggan berikutnya</b> kurang lebih impas, dan <b>20% pelanggan sisanya</b> menghasilkan kerugian sebesar 80% dari total keuntungan perusahaan (Gambar 4.2; angka di gambar tertulis 170% dan 70%).", "##F|Gambar 4.2|Whale Curve|whale"],
"4.4":["Ada beberapa cara yang dapat dilakukan perusahaan untuk meningkatkan profitabilitas pelanggan, di antaranya:", "- <b>Memperbaiki proses.</b> Perusahaan dapat mengefisienkan aktivitas-aktivitas yang dilakukan dalam melayani pelanggan, sehingga biaya turun. Salah satu penyebab tingginya biaya pelanggan adalah pelanggan melakukan <b>pemesanan dalam jumlah kecil</b>. Pemesanan kecil menyebabkan aktivitas yang bersifat <i>batch level</i> meningkat, sehingga pelanggan dapat dibujuk memesan dalam jumlah lebih besar, walaupun dengan konsekuensi pemberian diskon kepada pelanggan tersebut.", "- <b><i>Activity Based Pricing</i>:</b> menentukan harga berdasarkan aktivitas. Perusahaan dapat memberi pilihan kepada pelanggan sesuai aktivitas yang akan dilakukan untuk melayani pelanggan itu. Misalnya, jika pelanggan ingin memesan mendadak, maka ada tambahan aktivitas perencanaan produksi, aktivitas <i>set-up</i> mesin, dan aktivitas tambahan lainnya yang dapat dibebankan kepada pelanggan dalam bentuk kenaikan harga jual.", "- <b>Mengelola hubungan dengan pelanggan</b> dengan tujuan membujuk pelanggan membeli lebih banyak produk atau jasa. Salah satu biaya melayani pelanggan yang tinggi adalah <b>biaya perolehan dan biaya mempertahankan pelanggan</b>. Biaya ini dikeluarkan untuk aktivitas yang bersifat <i>customer level</i> (tingkatan pelanggan), biasanya bersifat tetap, sehingga untuk menutupinya perusahaan harus menjual dalam jumlah yang banyak.", "- <b>Lebih disiplin dalam memberikan diskon dan <i>allowances</i>.</b> Seperti dijelaskan sebelumnya, diskon dan <i>allowances</i> menimbulkan efek <i>pricing waterfall</i>. Karena itu perusahaan disarankan memberi diskon dan <i>allowances</i> hanya kepada pelanggan dengan benar-benar selektif."],
"4.5":["Menghubungkan profitabilitas pelanggan dengan loyalitas pelanggan menghasilkan <b>empat golongan pelanggan</b>, seperti pada Gambar 4.3:", "##F|Gambar 4.3|Loyalitas dan Profitabilitas|loyal", "Kategori pelanggan dibagi menjadi <i>Butterflies</i>, <i>True Friends</i>, <i>Barnacles</i>, dan <i>Strangers</i>.", "- <b>Butterflies:</b> loyalitasnya <b>rendah</b>, tetapi profitabilitasnya <b>tinggi</b> bagi perusahaan. Tipe ini agak sulit dijadikan pelanggan yang loyal. Karena itu perusahaan harus memastikan pelanggan mendapat kepuasan tinggi dari setiap transaksi, lalu perusahaan juga mendapat keuntungan dari setiap transaksi itu. Mencoba membangun hubungan dengan jenis ini biasanya tidak membuahkan hasil.", "- <b>True Friends:</b> pelanggan yang <b>loyal dan menguntungkan</b>. Fokusnya mempertahankan pelanggan ini. Perusahaan juga harus bisa membujuk mereka membeli secara intensif, serta menjaga komunikasi yang kontinu dalam jumlah yang tepat. Terlalu banyak komunikasi dapat menjengkelkan pelanggan sehingga mereka pergi.", "- <b>Barnacles:</b> pelanggan yang <b>loyal, tetapi profitabilitasnya rendah</b>. Tugas perusahaan adalah mencari jalan meningkatkan profitabilitasnya. Potensinya tergantung dari <i>size of wallet</i> pelanggan, yang secara harfiah berarti ketebalan dompet pelanggan. <i>Share of wallet</i> mengukur jumlah bisnis pelanggan yang sudah diberikan kepada perusahaan; <i>share of wallet</i> 90% berarti 90% bisnis pelanggan sudah dilakukan dengan perusahaan (di teks modul tertulis 'size of wallet 90%'). Jika <i>size of wallet</i> besar dan <i>share of wallet</i> terhadap perusahaan masih rendah, perusahaan dapat berinvestasi mengembangkan hubungan yang lebih erat untuk meningkatkan profitabilitas. Namun jika <i>size of wallet</i> kecil, perusahaan harus menerapkan kontrol biaya yang ketat agar pelanggan ini tidak merugi.", "- <b>Strangers:</b> kelompok pelanggan yang tidak perlu terlalu diperhatikan, karena loyalitas dan profitabilitasnya rendah. Perusahaan hanya perlu memastikan ada keuntungan dari setiap transaksi (meskipun kecil), dan tidak perlu mencoba membangun hubungan dengan jenis pelanggan ini."],
"4.6":["Cara kedua untuk mengukur profitabilitas pelanggan adalah dengan konsep <b>CLV (<i>customer lifetime value</i>)</b>. Konsep ini menghitung berapa profitabilitas pelanggan bukan hanya dalam satu periode, melainkan <b>dari beberapa periode</b>.", "Mengapa demikian? Salah satu biaya besar yang dikeluarkan perusahaan adalah biaya untuk memperoleh pelanggan (<i>customer acquisition cost</i>). Biaya perolehan ini dikeluarkan dengan harapan pelanggan tidak hanya bertransaksi satu kali, tetapi berkali-kali dalam beberapa periode.", "<b>Contoh.</b> Perusahaan memiliki dua pelanggan. Biaya perolehan pelanggan A adalah Rp50.000.000 dan diperkirakan A bertransaksi selama <b>tiga tahun</b> dengan keuntungan Rp30.000.000 per tahun. Biaya perolehan pelanggan B juga Rp50.000.000, dan diperkirakan B bertransaksi selama <b>dua tahun</b> dengan keuntungan Rp40.000.000 per tahun.", "Jika hanya dilihat dari profitabilitas per tahun, pelanggan B terlihat lebih menguntungkan dibandingkan A. Padahal, jika dihitung keuntungan selama periode pelanggan bertransaksi, pelanggan A lebih menguntungkan karena bertransaksi tiga periode, sedangkan B hanya dua periode. Karena itu dibutuhkan perhitungan profitabilitas pelanggan selama masa bertransaksi, yang disebut <i>customer lifetime value</i>.", "Rumusan untuk menghitung <i>customer lifetime value</i> adalah:", "##F|Rumus CLV|Customer Lifetime Value (CLV)|clv", "Dimana:", "- <b>Mt</b> = tingkat keuntungan (pendapatan dikurangi biaya) dari pelanggan pada tahun t", "- <b>Ct</b> = tambahan biaya untuk mempertahankan pelanggan pada tahun t", "- <b>i</b> = biaya permodalan (<i>cost of capital</i>)"],
});

"4.1":["Banyak perusahaan nentuin pelanggan mana yang diprioritasin pakai ukuran <b>loyalitas</b>: <i>frequency of purchase</i> (seberapa sering beli), <i>recency of purchase</i> (kapan terakhir beli), <i>value of purchase</i> (nilai belinya), dan <i>share of wallet</i>.@@Asumsinya: <b>pelanggan loyal = pelanggan yang menguntungkan</b>@@Konsep <b>CRM</b> bilang: mending pererat hubungan sama pelanggan yang udah ada daripada cari pelanggan baru, dan software CRM nyimpen info semua pelanggan yang bisa dibuka pegawai terkait||toko langganan yang tiap hari belanja pasti 'pelanggan setia'. Tapi kalau tiap hari dia minta diskon gede dan diantar gratis, jangan-jangan malah bikin rugi.", "Pertanyaannya: <b>apa pelanggan loyal otomatis untung?</b> Jawabannya <b>nggak selalu</b>. Bisa aja pelanggan loyal justru merugikan. Loyalitas cuma ngeliat pelanggan dari <b>satu sisi</b>; sisi lainnya adalah <b>profitabilitas pelanggan</b>."],
"4.2":["Masalah pertama dalam ngitung profitabilitas pelanggan ada di <b>pendapatannya</b>. Pendapatan bersih yang diterima sering beda dari harga jual, karena dipotong:@@Diskon volume pembelian@@Diskon bayar tepat waktu@@<i>Allowance</i> buat distributor@@Ongkos angkut||harga di label Rp100, tapi setelah dipotong diskon, allowance, dan ongkir, yang masuk kas cuma Rp80.", "Bocoran bertingkat ini namanya <b><i>pricing waterfall</i></b>. Masalahnya, potongan-potongan itu <b>nggak dicatat langsung di akun tiap pelanggan</b>, tapi dicatat <b>agregat</b>, jadi susah tahu pendapatan bersih per pelanggan. Solusinya: butuh <b>sistem akuntansi tersendiri</b> yang melacak <i>pricing waterfall</i> dan biaya lain per pelanggan.", "Dua cara hitung profitabilitas pelanggan di modul ini: <b><i>Activity Based Costing</i></b> dan <b><i>Customer Lifetime Value</i></b>. (Di modul disebut 'masalah pertama', tapi nggak ada 'masalah kedua'-nya, plot twist.)"],
"4.3":["<b>ABC</b> dipakai buat tahu biaya yang dibutuhkan buat <b>melayani pelanggan</b>. Prinsipnya sama kayak modul ABC, bedanya <b>obyek biayanya adalah pelanggan</b>. Aktivitasnya <b><i>customer level activities</i></b>: besar kecilnya tergantung jumlah pelanggan, makin banyak pelanggan makin tinggi biayanya.||kunjungan sales atau layanan purnajual: makin banyak pelanggan, makin banyak kunjungan yang harus dilakukan.", "Hasilnya ketemu pelanggan <b>mahal dilayani</b> (<i>high cost to serve</i>) dan <b>murah dilayani</b> (<i>low cost to serve</i>). Menurut <b>Cooper dan Kaplan (1999)</b>, pelanggan dibagi jadi empat (Gambar 4.1):", "##F|Gambar 4.1|Margin and High or Low Cost to Serve Customer|cust", "Empat jenis pelanggan:@@<b>Cheap:</b> cost to serve rendah, tapi <b>nggak mau bayar mahal</b>, jadi marjin rendah. Untung atau rugi harus dicek pakai ABC@@<b>Passive:</b> cost to serve rendah, marjin <b>tinggi</b>. Paling menguntungkan, soalnya mereka mau bayar lebih buat aktivitas yang nggak mereka nikmati@@<b>Savvy:</b> marjin tinggi, tapi cost to serve juga <b>tinggi</b>. Kalau perusahaan nggak hati-hati, bisa rugi@@<b>Aggressive:</b> cost to serve tinggi, marjin rendah. Kemungkinan besar <b>merugikan</b>||Passive = tamu kafe yang beli kopi mahal dan duduk tenang. Aggressive = tamu yang minta diskon, minta menu khusus, dan komplain terus.", "Dari hitungan profitabilitas pelanggan, sering muncul kurva mirip ikan paus: <b><i>whale curve</i></b>. Menurut teks modul, <b>20% pelanggan teratas</b> menghasilkan sekitar <b>180%</b> dari total laba, <b>60% berikutnya</b> kurang lebih impas, dan <b>20% terbawah</b> menimbulkan kerugian sekitar <b>80%</b> dari laba. (Angka di gambarnya 170% dan 70%, jadi teks dan gambar nggak sama persis.)", "##F|Gambar 4.2|Whale Curve|whale"],
"4.4":["Ada empat cara meningkatkan profitabilitas pelanggan:@@<b>Perbaiki proses:</b> bikin aktivitas melayani pelanggan lebih efisien. Salah satu biang biaya tinggi adalah <b>pesanan kecil-kecil</b> yang bikin aktivitas <i>batch level</i> naik. Pelanggan bisa dibujuk pesan lebih banyak sekalipun harus dikasih diskon@@<b><i>Activity based pricing</i>:</b> harga ditentukan dari aktivitas yang diminta. Misal pesan mendadak butuh perencanaan produksi dan <i>set-up</i> mesin ekstra, biayanya dibebankan lewat harga jual yang lebih tinggi@@<b>Kelola hubungan:</b> bujuk pelanggan beli lebih banyak. Biaya perolehan dan biaya mempertahankan pelanggan bersifat <i>customer level</i> dan tetap, jadi harus ditutup dengan volume penjualan besar@@<b>Disiplin diskon dan <i>allowances</i>:</b> karena memicu <i>pricing waterfall</i>, kasih hanya ke pelanggan yang benar-benar selektif||ongkir gratis cuma untuk pesanan di atas jumlah tertentu, bukan buat semua orang."],
"4.5":["Kalau <b>profitabilitas</b> dan <b>loyalitas</b> digabung, muncul <b>empat golongan</b> pelanggan (Gambar 4.3):", "##F|Gambar 4.3|Loyalitas dan Profitabilitas|loyal", "Empat golongan dan strateginya:@@<b>Butterflies:</b> loyalitas <b>rendah</b>, profit <b>tinggi</b>. Susah dijadiin loyal. Pastikan mereka puas di tiap transaksi dan perusahaan untung di tiap transaksi; bangun hubungan biasanya percuma@@<b>True Friends:</b> loyal dan menguntungkan. <b>Pertahankan</b>, bujuk beli lebih intensif, komunikasi rutin tapi jangan kebanyakan, nanti malah pergi@@<b>Barnacles:</b> loyal, tapi profit <b>rendah</b>. Cek <i>size of wallet</i> (ketebalan dompet pelanggan) dan <i>share of wallet</i> (bagian belanja yang jatuh ke perusahaan). Kalau size besar tapi share rendah, investasi hubungan lebih erat. Kalau size kecil, kontrol biaya ketat@@<b>Strangers:</b> loyalitas dan profit sama-sama rendah. Nggak perlu diperhatikan banget; yang penting <b>untung di tiap transaksi</b> meski kecil, dan nggak usah bangun hubungan||Butterflies = turis yang beli oleh-oleh mahal sekali lalu pergi. Barnacles = langganan setia yang tiap kali beli cuma permen.", "Catatan: di teks modul tertulis 'size of wallet 90%', padahal contoh itu mengukur <i>share of wallet</i> (90% bisnis pelanggan sudah dipegang perusahaan)."],
"4.6":["Cara kedua ngitung profitabilitas pelanggan: <b>CLV (<i>customer lifetime value</i>)</b>, yaitu profit pelanggan <b>selama beberapa periode</b>, bukan satu periode saja. Alasannya: perusahaan mengeluarkan <b>biaya perolehan pelanggan</b> (<i>customer acquisition cost</i>) dengan harapan pelanggan beli <b>berkali-kali</b>.||kayak beli printer murah: untungnya dari tinta yang dibeli terus-terusan, bukan dari printernya.", "Contoh di modul: biaya perolehan A dan B sama-sama Rp50.000.000. A transaksi <b>3 tahun</b>, untung Rp30.000.000 per tahun. B transaksi <b>2 tahun</b>, untung Rp40.000.000 per tahun.@@Per tahun saja: B kelihatan lebih untung (40 juta vs 30 juta)@@Selama masa transaksi: A lebih untung, karena A bertransaksi tiga periode, B cuma dua||hitung kasar tanpa diskonto: A = 3 x 30 juta = 90 juta, B = 2 x 40 juta = 80 juta (sebelum dikurangi biaya perolehan 50 juta).", "##F|Rumus CLV|Customer Lifetime Value (CLV)|clv", "Keterangan rumus di modul:@@<b>Mt</b> = laba dari pelanggan pada tahun t (pendapatan dikurangi biaya)@@<b>Ct</b> = tambahan biaya untuk mempertahankan pelanggan pada tahun t@@<b>i</b> = biaya permodalan (<i>cost of capital</i>)", "Catatan: rumus di gambar memakai istilah <i>margin</i>, <i>retention</i>, dan <i>discount rate</i>, sedangkan keterangannya memakai Mt, Ct, dan i. Modul tidak menjelaskan hubungan keduanya, jadi pakai dulu istilah seperti yang tertulis di modul."],
});

["Pengguna utama laporan yang dihasilkan sistem akuntansi keuangan adalah...",["Manajer divisi dan kepala departemen","Pihak eksternal seperti investor, kreditur, dan otoritas pajak","Hanya karyawan bagian produksi","Hanya direktur utama"],1,"Sistem akuntansi keuangan menghasilkan laporan untuk pihak eksternal dan wajib disusun sesuai PSAK. Pihak internal (manajer) dilayani oleh sistem akuntansi manajemen."],
["Yang BUKAN termasuk laporan keuangan dari sistem akuntansi keuangan adalah...",["Laporan posisi keuangan","Laporan arus kas","Laporan varians anggaran per departemen","Laporan perubahan ekuitas"],2,"Lima komponennya: laporan posisi keuangan, laba rugi dan penghasilan komprehensif lain, arus kas, perubahan ekuitas, dan catatan atas laporan keuangan. Laporan varians anggaran adalah kebutuhan internal manajemen."],
["Mengapa informasi sistem akuntansi keuangan saja tidak cukup bagi manajemen?",["Karena tidak mengikuti PSAK","Karena hanya mencatat pendapatan, bukan biaya","Karena terlalu rinci sampai level per produk","Karena terlalu agregat, periodik, historis, dan asumsi penyusunannya berbeda dari kebutuhan manajemen"],3,"Empat alasannya: dirancang untuk laporan keseluruhan (agregat), waktu pelaporan terlambat, hanya melaporkan masa lalu, dan memakai asumsi full costing yang berbeda dari kebutuhan manajemen."],
["Biaya yang dapat ditelusuri secara akurat ke obyek biayanya, misalnya bahan baku langsung dan buruh langsung, disebut...",["Biaya tidak langsung","Biaya langsung","Biaya periode","Biaya tetap"],1,"Biaya langsung dapat dilacak akurat ke obyek biaya (produk, pelanggan, departemen, aktivitas). Biaya tidak langsung dipakai bersama sehingga harus dialokasikan."],
["Hasil alokasi biaya tidak langsung dianggap kurang akurat karena...",["Tiap dasar alokasi menghasilkan angka alokasi yang berbeda","Overhead selalu bernilai nol","Biaya langsung tidak bisa ditelusuri","Alokasi dilarang oleh PSAK"],0,"Dasar alokasi (unit produksi, jam buruh langsung, biaya bahan baku langsung, jam mesin) menghasilkan angka berbeda-beda, sehingga biaya per produk tidak pasti akurat."],
["Dalam full costing (absorption costing), yang termasuk biaya periode (period cost) adalah...",["Bahan baku langsung","Overhead pabrik yang ditahan di persediaan","Beban umum, administrasi, dan penjualan yang langsung menjadi beban pada periode terjadinya","Buruh langsung"],2,"Biaya produk (bahan baku langsung, buruh langsung, overhead pabrik) diserap dulu ke persediaan, baru menjadi beban pokok penjualan saat terjual. Biaya periode, yaitu biaya di luar produksi, langsung menjadi beban."],
["Pengelompokan biaya yang paling berguna bagi manajemen internal adalah...",["Biaya produk dan biaya periode","Biaya wajar dan biaya tidak wajar","Biaya bahan dan biaya konversi","Biaya tetap dan biaya variabel"],3,"Sesuai konsep different costs for different purposes: laporan keuangan butuh biaya produk dan periode, sedangkan akuntansi manajemen butuh biaya tetap dan variabel (misalnya saat suatu aktivitas dihapus, hanya biaya variabel yang otomatis hilang)."],
["Menurut Kaplan dan Cooper (1999), ciri tahap 4 pengembangan sistem akuntansi perusahaan adalah...",["Sistem akuntansi keuangan dan manajemen diintegrasikan dalam satu sistem, seperti konsep ERP","Sistem akuntansi keuangan dan manajemen berdiri terpisah","Informasi manajemen masih diambil dari sistem akuntansi keuangan","Perusahaan baru memiliki sistem akuntansi keuangan"],0,"Tahap 1: baru ada sistem keuangan. Tahap 2: informasi manajemen masih diambil dari sistem keuangan. Tahap 3: dua sistem terpisah. Tahap 4: integrasi dalam satu sistem seperti ERP."],
["Sebuah perusahaan mebel membuat produk berdasarkan pesanan pelanggan yang berbeda-beda. Sistem biaya yang paling sesuai adalah...",["Joint costing","Job order costing","Process costing","Reciprocal costing"],1,"Job order costing dipakai untuk produk berdasarkan pesanan: biaya dikumpulkan per pesanan dalam job cost sheet. Process costing dipakai untuk produksi massal produk sejenis."],
["Barang cacat yang tidak bisa diperbaiki sehingga dijual dengan harga di bawah normal disebut...",["Rework","Scrap","Spoilage","Joint product"],2,"Rework dapat diperbaiki dengan biaya tambahan, spoilage tidak dapat diperbaiki, sedangkan scrap adalah sisa produksi seperti potongan bahan."],
["Metode alokasi biaya departemen penunjang yang mengakui sepenuhnya jasa timbal balik antar departemen penunjang, dan umumnya paling akurat, adalah...",["Direct method","Step down method","Metode FIFO","Reciprocal method"],3,"Direct method mengabaikan jasa antar departemen penunjang, step down mengakuinya sebagian secara berurutan, reciprocal mengakuinya sepenuhnya."],
["Alokasi joint cost sebelum titik pisah (split-off point) sebaiknya dipakai untuk...",["Memutuskan produk dijual langsung atau diproses lebih lanjut","Inventory costing (penilaian persediaan)","Menentukan jumlah pesanan pelanggan","Menilai kinerja manajer"],1,"Biaya sebelum titik pisah tidak dapat ditelusuri ke satu produk, jadi dialokasikan untuk inventory costing. Hasil alokasi ini sebaiknya tidak dijadikan dasar keputusan jual langsung atau proses lanjut."]

["Tujuan utama Activity Based Costing (ABC) adalah...",["Memperbaiki pembebanan biaya langsung","Menghilangkan seluruh biaya tetap","Membebankan biaya tidak langsung dengan lebih akurat","Mempercepat penyusunan laporan keuangan eksternal"],2,"ABC tidak memperbaiki pembebanan biaya langsung karena sudah akurat. Yang diperbaiki adalah pembebanan biaya tidak langsung."],
["Alur pembebanan biaya pada ABC adalah...",["Biaya ke aktivitas, lalu ke obyek biaya","Biaya langsung ke obyek biaya","Biaya ke departemen penunjang, lalu ke produk","Biaya ke persediaan, lalu ke beban pokok penjualan"],0,"Pada model tradisional biaya langsung dibebankan ke obyek biaya, sedangkan pada ABC biaya dibebankan ke aktivitas dulu, baru ke obyek biaya (Gambar 2.1)."],
["Pada ABC, pembebanan biaya tidak langsung dilakukan dalam dua tahap. Tahap pertama adalah...",["Membebankan biaya aktivitas ke produk","Menghitung laba kotor produk","Memisahkan biaya produk dan biaya periode","Mengonversi biaya menurut akun menjadi biaya aktivitas"],3,"Tahap 1: biaya per akun dikonversi menjadi biaya aktivitas. Tahap 2: biaya aktivitas dibebankan ke produk memakai pemicu aktivitas (activity driver)."],
["Pada contoh PT XYZ, biaya aktivitas set-up mesin Rp226 juta dengan 500 driver. Tarif per driver adalah...",["Rp226.000","Rp452.000","Rp360.000","Rp90.000"],1,"Rp226.000.000 / 500 = Rp452.000 per driver (Tabel 2.4)."],
["Hasil perhitungan ABC pada PT XYZ menunjukkan bahwa...",["Vanilla paling menguntungkan (marjin 30,76%), durian merugi (marjin -25,20%)","Durian paling menguntungkan, vanilla merugi","Ketiga produk menghasilkan marjin yang sama","Strawberry paling menguntungkan dengan marjin 40%"],0,"Pada ABC: vanilla 30,76%, strawberry 19,78%, durian -25,20%. Total marjin 17,12%."],
["Mengapa hasil perhitungan tradisional (jam mesin) berbeda jauh dengan ABC?",["Karena ABC memakai harga jual yang berbeda","Karena biaya bahan mentah langsung berbeda","Karena dasar pembebanan tradisional hanya berdasarkan tingkat unit","Karena ABC tidak memperhitungkan overhead"],2,"Dasar tradisional (unit, jam buruh, biaya buruh, jam mesin, biaya bahan mentah) hanya tingkat unit, sehingga produk bervolume besar dibebani overhead besar, padahal aktivitas batch dan set-up tidak bergantung pada volume."],
["Contoh aktivitas tingkat batch (batch level activity) adalah...",["Memproduksi es krim","Perencanaan produksi","Riset dan pengembangan","Pemeliharaan keamanan perusahaan"],1,"Aktivitas batch bergantung pada jumlah batch, bukan jumlah unit. Memproduksi adalah tingkat unit, riset dan pengembangan tingkat produk, pemeliharaan keamanan tingkat fasilitas."],
["Biaya aktivitas tingkat fasilitas (facility level), misalnya pemeliharaan keamanan, hanya dapat dibebankan ke produk secara...",["Akurat memakai jam mesin","Akurat memakai jumlah batch","Akurat memakai jenis produk","Arbitrer"],3,"Aktivitas ini dilakukan untuk perusahaan secara keseluruhan dan tidak terkait produk tertentu, sehingga pembebanannya ke produk bersifat arbitrer."],
["Menurut ABC, konsep JIT (Just in Time) bisa menjadi bumerang karena...",["Persediaan menjadi sangat besar","Batch yang kecil membuat aktivitas tingkat batch makin sering sehingga biaya naik","Produk menjadi seragam","Kapasitas teoritis berkurang"],1,"JIT memproduksi berdasarkan permintaan dalam batch kecil, sehingga aktivitas tingkat batch makin sering dan biayanya naik. Solusinya antara lain investasi pada teknologi yang fleksibel."],
["Biaya pengambilan bahan mentah Rp72.000.000 dengan kapasitas praktikal 36.000 menit. Tarif per menit adalah...",["Rp2.000","Rp1.500","Rp2.500","Rp3.000"],0,"Rp72.000.000 / 36.000 menit = Rp2.000 per menit (Tabel 2.8). Kapasitas praktikal: 5 orang x 6 jam x 5 hari x 4 minggu x 60 menit."],
["Pengambilan bahan mentah vanilla diefisienkan dari 9.000 menjadi 7.500 menit, tetapi laba total tidak naik karena...",["Biaya fleksibel bertambah","Harga jual turun","Biaya bahan baku naik","Biaya committed tidak hilang, hanya pindah menjadi biaya kapasitas menganggur"],3,"Biaya vanilla turun Rp3 juta, tetapi kapasitas menganggur naik Rp3 juta (menjadi Rp27 juta). Laba baru naik jika sumber daya dikurangi atau volume penjualan dinaikkan."],
["Persamaan waktu: penerimaan pesanan = 4 + 5 (telpon) + 3 (fax) + 3 (per jenis produk) + 5 (dalam kota) + 8 (luar kota) + 15 (luar negeri). Pesanan lewat telpon, dua jenis produk, ke luar kota membutuhkan waktu...",["20 menit","23 menit","26 menit","17 menit"],1,"4 + 5 + (3 x 2) + 8 = 23 menit. Angka ini dikalikan tarif sumber daya berdasarkan kapasitas praktikal."],
["ABC cocok diterapkan pada perusahaan jasa seperti rumah sakit dan bank terutama karena...",["Biayanya hanya biaya langsung","Tidak memiliki overhead","Pelanggannya sedikit","Sebagian besar biayanya adalah biaya tidak langsung"],3,"Industri jasa memiliki banyak biaya tidak langsung. Time driven ABC juga cocok, misalnya memakai waktu melayani nasabah di bank."]
];
M[0].bq[2]=[["Informasi ABC yang dipakai untuk menunjukkan aktivitas yang dilakukan secara tidak efisien, sehingga biaya tinggi dan profitabilitas turun, termasuk dalam konsep...",["Strategic activity based management","Target costing","Operating activity based management","Activity based costing"],2,"Menurut Cooper dan Kaplan (1999), informasi ABC dipakai untuk dua hal: operating ABM (menemukan dan memperbaiki aktivitas yang tidak efisien) dan strategic ABM (keputusan stratejik tentang produk atau pelanggan)."],["Pada Gambar 3.1, model activity based management diwakili pandangan horizontal (horizontal view) yang terdiri dari...",["Driver analysis (Why?), activities (What?), dan performance measures (How well?)","Resources, activities, dan cost objects","Unit level, batch level, dan product level","Prevention, appraisal, dan failure costs"],0,"Dimensi proses (horizontal) terdiri dari driver analysis, activities, dan performance measures, dengan tujuan memperbaiki aktivitas. Pandangan vertikal (resources, activities, cost objects) mewakili model ABC."],["Penerapan activity based management mensyaratkan model ABC yang memisahkan biaya fleksibel dan biaya committed karena...",["Biaya committed selalu lebih kecil daripada biaya fleksibel","Biaya fleksibel tidak pernah berubah","PSAK mewajibkan pemisahan itu","Hanya biaya fleksibel yang otomatis hilang saat aktivitas dihilangkan, sehingga dampak efisiensi sulit dimonitor tanpa pemisahan"],3,"Tidak semua biaya otomatis berkurang walaupun aktivitas dihilangkan. Biaya fleksibel hilang, sedangkan biaya committed tidak otomatis hilang."],["Yang BUKAN contoh aktivitas non value added menurut modul adalah...",["Pengerjaan ulang (rework)","Merakit kursi","Pemeriksaan atau inspeksi bahan mentah","Penyimpanan di gudang"],1,"Memotong kayu dan merakit kursi adalah aktivitas bernilai tambah, karena konsumen merasa tidak dapat melakukannya sendiri dan mau membayar lebih. Rework, inspeksi, dan penyimpanan tidak bernilai tambah."],["Aktivitas menyusun laporan keuangan tidak menambah nilai bagi pelanggan, tetapi tetap harus dilakukan perusahaan. Karena itu aktivitas yang menambah nilai sebaiknya dipisah menjadi...",["Aktivitas tetap dan aktivitas variabel","Aktivitas produksi dan aktivitas penjualan","Aktivitas yang menambah nilai bagi pelanggan dan yang menambah nilai bagi perusahaan","Aktivitas jangka pendek dan jangka panjang"],2,"Aktivitas seperti penyusunan laporan keuangan, pemeliharaan mesin, dan perhitungan pajak penghasilan berguna bagi perusahaan walau tidak menambah nilai di mata pelanggan."],["Perusahaan membeli bahan mentah 10.000 kg. Sekali pesan 2.000 kg membutuhkan 5 batch, tetapi sekali pesan 2.500 kg hanya 4 batch. Cara efisiensi ini disebut...",["Activity reduction","Activity elimination","Activity sharing","Activity selection"],0,"Activity reduction: output yang sama dihasilkan dengan aktivitas yang lebih sedikit, misalnya dengan memperbanyak unit per batch. 10.000 / 2.500 = 4 batch."],["Dua pegawai, satu menerima dan satu memeriksa bahan mentah, masing-masing hanya memakai 50% kapasitasnya. Bila cukup satu pegawai yang mengerjakan kedua aktivitas, cara efisiensi ini disebut...",["Activity elimination","Activity reduction","Activity selection","Activity sharing"],3,"Activity sharing bertujuan mengurangi kapasitas menganggur dengan memakai sumber daya untuk lebih dari satu aktivitas."],["Memilih antara memproduksi sendiri atau melakukan outsourcing karena alternatif tersebut lebih murah adalah contoh...",["Activity sharing","Activity selection","Activity elimination","Activity reduction"],1,"Pada activity selection, perusahaan memilih alternatif aktivitas yang lebih murah."],["Memperbesar batch pembelian mengurangi aktivitas pembelian, tetapi kemungkinan besar menaikkan aktivitas penyimpanan bahan mentah. Pelajaran dari contoh ini adalah...",["Batch pembelian sebaiknya selalu diperkecil","Penyimpanan adalah aktivitas bernilai tambah","Efisiensi satu aktivitas jangan dilakukan terisolasi; efek biaya pada seluruh aktivitas harus dilihat","Efisiensi pembelian tidak memengaruhi aktivitas lain"],2,"Perubahan satu aktivitas dapat memengaruhi biaya aktivitas lain, sehingga perusahaan harus melihat efek biaya untuk keseluruhan aktivitas."],["Aktivitas penyusunan laporan keuangan dikurangi dari tujuh orang menjadi tiga orang. Selain biaya, tolok ukur yang harus tetap dimonitor adalah...",["Waktu penyelesaian dan kualitas laporan","Volume penjualan dan harga","Laba bersih dan pajak","Jumlah persediaan dan kapasitas gudang"],0,"Tolok ukur efisiensi dilihat dari tiga sisi: biaya, waktu, dan kualitas. Pengurangan orang dapat memperlambat laporan dan menambah kesalahan jurnal."],["Biaya pelatihan karyawan, pembelian mesin yang lebih handal, dan perawatan berkala yang konsisten termasuk...",["Biaya pemeriksaan","Biaya kegagalan internal","Biaya kegagalan eksternal","Biaya pencegahan"],3,"Biaya pencegahan (prevention costs) dikeluarkan agar perusahaan tidak memproduksi barang yang tidak sesuai spesifikasi."],["Biaya inspeksi ulang atas barang yang pada awalnya diproduksi tidak sesuai spesifikasi digolongkan sebagai...",["Biaya pemeriksaan (appraisal costs)","Biaya kegagalan internal","Biaya kegagalan eksternal","Biaya pencegahan"],1,"Inspeksi ulang tidak dimasukkan ke appraisal costs karena terjadi akibat perusahaan pada awalnya tidak memproduksi barang sesuai spesifikasi. Bersama rework, ini termasuk biaya kegagalan internal."],["Biaya garansi dan biaya menangani keluhan pelanggan termasuk...",["Biaya pencegahan","Biaya kegagalan internal","Biaya kegagalan eksternal","Biaya pemeriksaan"],2,"Pada kegagalan eksternal, barang tidak sesuai spesifikasi baru ditemukan setelah sampai ke tangan konsumen akhir. Bila ditemukan sebelumnya, itu kegagalan internal."],["Prioritas jangka pendek program GKM terkait rasio biaya kualitas adalah...",["Menaikkan rasio biaya pemeriksaan/penjualan","Menaikkan rasio biaya pencegahan/penjualan terus-menerus","Menurunkan rasio biaya pencegahan/penjualan sejak awal","Menurunkan rasio biaya kegagalan eksternal/penjualan"],3,"Rasio biaya kegagalan eksternal/penjualan tidak boleh naik dan harus terus turun, karena barang cacat di tangan konsumen merusak penjualan masa depan, termasuk lewat cerita ketidakpuasan konsumen kepada pihak lain."],["Pada awal penerapan GKM, rasio biaya pencegahan/penjualan biasanya...",["Turun tajam","Naik karena perusahaan harus berinvestasi cukup besar untuk membangun sistem GKM","Sama dengan nol","Tidak berubah sama sekali"],1,"Setelah beberapa periode rasio ini turun dan mencapai tingkat stabil. Rasio pemeriksaan dan kegagalan internal juga biasanya naik di awal, karena inspeksi menggeser biaya dari kegagalan eksternal ke internal."],["Dalam kondisi zero defect yang sempurna, biaya kualitas yang tetap dikeluarkan perusahaan hanyalah...",["Biaya pencegahan","Biaya pemeriksaan","Biaya kegagalan internal","Biaya kegagalan eksternal"],0,"Biaya pemeriksaan, kegagalan internal, dan kegagalan eksternal berasal dari aktivitas yang tidak bernilai tambah, sehingga hilang pada kondisi zero defect. Yang tersisa hanya biaya pencegahan."],["Penjualan yang hilang karena pelanggan kecewa menerima barang yang tidak sesuai spesifikasi adalah contoh...",["Biaya pencegahan","Biaya pemeriksaan","Biaya kualitas tersembunyi (hidden quality costs)","Biaya inspeksi ulang"],2,"Hidden quality costs tidak terlihat langsung di catatan akuntansi dan harus diukur secara khusus. Untuk kegagalan eksternal, besarnya sering lebih tinggi daripada yang dicatat perusahaan."],["Kerugian pada batas spesifikasi (c) Rp8.000 dan jarak batas ke target (d) 2 cm. Menurut Taguchi, kerugian pada penyimpangan aktual 1 cm dari target adalah...",["Rp1.000","Rp2.000","Rp4.000","Rp8.000"],1,"k = c / d\u00b2 = 8.000 / 4 = 2.000. L = k (y \u2212 T)\u00b2 = 2.000 \u00d7 1\u00b2 = Rp2.000."],["Menurut Taguchi quality loss function, bila penyimpangan dari target menjadi dua kali lipat, kerugian menjadi...",["Setengahnya","Dua kali lipat","Tetap sama","Empat kali lipat"],3,"Kerugian naik dalam fungsi kuadratik: L = k (y \u2212 T)\u00b2. Penyimpangan dua kali lipat berarti kerugian 2\u00b2 = 4 kali lipat. (Angka contoh Rp5, Rp25, Rp625 di modul tidak mengikuti pola ini; menurut rumus seharusnya Rp5, Rp20, Rp45.)"],["Penerapan konsep biaya kualitas lebih mudah bila perusahaan sudah memiliki sistem ABC karena...",["Biaya di charts of account (misalnya gaji) harus dibebankan ke aktivitas dulu agar dapat digolongkan ke empat biaya kualitas","ABC menghilangkan seluruh biaya kegagalan","ABC menggantikan program GKM","ABC tidak memerlukan data aktivitas"],0,"Penggolongan berdasarkan charts of account menyulitkan pengelompokan ke pencegahan, pemeriksaan, kegagalan internal, dan kegagalan eksternal. Dengan ABC, biaya tiap aktivitas sudah diketahui sehingga mudah digolongkan."],["Yang BUKAN termasuk tujuh pemborosan (waste) dalam konsep lean production adalah...",["Kelebihan produksi (over production)","Menunggu (waiting)","Pelatihan karyawan","Persediaan (inventory)"],2,"Tujuh pemborosan: over production, inventory, motion, material movement, correction (termasuk rework), over processing, dan waiting."],["Dari sisi akuntansi manajemen, konsep value stream pada lean memudahkan perhitungan biaya per produk karena...",["Semua biaya diperlakukan sebagai biaya periode","Alokasi dengan ABC tidak pernah diperlukan lagi","Persediaan dihapus dari laporan keuangan","Semua biaya yang dikeluarkan pada value stream itu merupakan biaya langsung bagi produknya"],3,"Satu value stream biasanya hanya untuk satu produk, sehingga biayanya merupakan biaya langsung. Bila satu value stream berisi beberapa produk, alokasi dengan ABC masih diperlukan."],["Menurut lean accounting, laporan keuangan masing-masing value stream dilakukan...",["Setiap hari","Per minggu","Setiap bulan","Setiap tahun"],1,"Sel produksi dilaporkan setiap hari (terutama informasi non keuangan), laporan keuangan tiap value stream per minggu, dan laporan keuangan pabrik secara keseluruhan setiap bulan."]];
M[0].bq[3]=[["Pada banyak perusahaan, pelanggan yang akan dilayani diprioritaskan berdasarkan loyalitas. Menurut modul, mengapa loyalitas saja tidak cukup?", ["Karena pelanggan loyal selalu merugikan", "Karena loyalitas hanya memandang pelanggan dari satu sisi; profitabilitas juga harus dilihat", "Karena loyalitas tidak dapat diukur", "Karena CRM melarang penggunaan ukuran loyalitas"], 1, "Pelanggan loyal belum tentu menguntungkan. Loyalitas hanya satu sisi, sisi lainnya adalah profitabilitas pelanggan."], ["Yang BUKAN termasuk tolok ukur loyalitas pelanggan yang disebut dalam modul adalah...", ["Frequency of purchase", "Recency of purchase", "Share of wallet", "Cost of capital"], 3, "Tolok ukur loyalitas: frequency, recency, value of purchase, dan share of wallet. Cost of capital adalah biaya permodalan pada rumus CLV."], ["Berbagai potongan dari harga jual (diskon volume, diskon bayar tepat waktu, allowance distributor, ongkos angkut) yang membuat pendapatan bersih berbeda dari harga jual disebut...", ["Pricing waterfall", "Whale curve", "Customer level activity", "Cost to serve"], 0, "Kebocoran bertingkat dari harga jual ke pendapatan bersih disebut pricing waterfall."], ["Mengapa sulit menghitung pendapatan bersih per pelanggan menurut modul?", ["Karena harga jual selalu sama", "Karena potongan tidak dikaitkan langsung dengan akun pelanggan, melainkan dicatat secara agregat", "Karena pelanggan tidak mau membayar", "Karena biaya perolehan tidak ada"], 1, "Pengurangan pendapatan dicatat agregat pada catatan keuangan, sehingga perlu sistem akuntansi tersendiri untuk menelusurinya per pelanggan."], ["Dua perhitungan profitabilitas pelanggan yang dibahas dalam bab ini adalah...", ["Target costing dan lean production", "Activity based costing dan customer lifetime value", "Job order costing dan process costing", "Break-even dan CVP"], 1, "Modul membahas activity based costing (ABC) dan customer lifetime value (CLV)."], ["Dalam analisis profitabilitas pelanggan dengan ABC, obyek biaya (cost object) adalah...", ["Produk", "Departemen", "Pelanggan", "Pemasok"], 2, "Prinsipnya sama dengan ABC biasa; bedanya, obyek biayanya adalah pelanggan dan aktivitasnya bersifat customer level."], ["Aktivitas tingkatan pelanggan (customer level activities) adalah aktivitas yang...", ["Besar kecilnya bergantung pada jumlah pelanggan yang dimiliki perusahaan", "Tidak pernah menimbulkan biaya", "Hanya terjadi di bagian produksi", "Bergantung pada jumlah batch produksi"], 0, "Semakin banyak pelanggan, semakin tinggi aktivitas dan biaya tingkatan pelanggan."], ["Pelanggan dengan cost to serve rendah namun memberi marjin tinggi, sehingga paling menguntungkan, disebut...", ["Cheap", "Passive", "Savvy", "Aggressive"], 1, "Passive: cost to serve rendah, marjin tinggi. Biasanya berani membayar lebih untuk aktivitas yang tidak mereka nikmati."], ["Pelanggan yang memberi marjin tinggi tetapi menuntut cost to serve tinggi, dan dapat merugikan jika perusahaan tidak berhati-hati, disebut...", ["Passive", "Cheap", "Savvy", "Butterflies"], 2, "Savvy: marjin tinggi, tetapi cost to serve juga tinggi."], ["Pelanggan dengan cost to serve tinggi dan marjin rendah, yang kemungkinan besar merugikan perusahaan, adalah...", ["Aggressive", "Passive", "Cheap", "True Friends"], 0, "Aggressive: cost to serve tinggi dan marjin rendah."], ["Kurva berbentuk ikan paus (whale curve) menunjukkan bahwa...", ["Semua pelanggan menyumbang laba yang sama", "Sebagian kecil pelanggan menghasilkan laba sangat besar, sebagian besar kurang lebih impas, dan sebagian kecil merugikan", "Pelanggan terbaik selalu menimbulkan kerugian", "Laba selalu naik seiring jumlah pelanggan"], 1, "Menurut modul, 20% pelanggan terbaik menghasilkan laba melebihi total laba, 60% berikutnya kurang lebih impas, dan 20% terbawah menimbulkan kerugian."], ["Salah satu cara meningkatkan profitabilitas pelanggan dengan memperbaiki proses adalah...", ["Menambah pesanan kecil agar aktivitas batch level naik", "Membujuk pelanggan memesan dalam jumlah lebih besar agar aktivitas batch level turun", "Menghilangkan semua diskon tanpa seleksi", "Menurunkan harga jual"], 1, "Pesanan kecil menaikkan aktivitas batch level dan biaya; pelanggan dapat dibujuk memesan lebih besar, walaupun dengan diskon."], ["Activity based pricing adalah...", ["Menentukan harga berdasarkan aktivitas yang diminta pelanggan", "Menentukan harga sama untuk semua pelanggan", "Menentukan harga dari biaya bahan baku saja", "Menetapkan harga dari harga pesaing"], 0, "Contoh: pemesanan mendadak menambah aktivitas perencanaan produksi dan set-up mesin, yang dibebankan lewat kenaikan harga jual."], ["Menurut modul, mengapa diskon dan allowances harus diberikan secara selektif?", ["Karena menimbulkan efek pricing waterfall", "Karena dilarang oleh standar akuntansi", "Karena menurunkan jumlah pelanggan loyal", "Karena menaikkan biaya perolehan"], 0, "Diskon dan allowances menimbulkan pricing waterfall, sehingga disarankan hanya diberikan pada pelanggan secara benar-benar selektif."], ["Pelanggan yang loyalitasnya rendah tetapi profitabilitasnya tinggi disebut...", ["Butterflies", "True Friends", "Barnacles", "Strangers"], 0, "Butterflies: loyalitas rendah, profitabilitas tinggi. Perusahaan memastikan kepuasan dan keuntungan di setiap transaksi."], ["Strategi yang tepat untuk True Friends adalah...", ["Tidak melakukan komunikasi sama sekali", "Mempertahankan, membujuk membeli lebih intensif, dan berkomunikasi kontinu dalam jumlah yang tepat", "Mengurangi kontak hingga minimal", "Mengenakan kontrol biaya yang ketat"], 1, "True Friends loyal dan menguntungkan. Komunikasi yang terlalu banyak justru dapat menjengkelkan sehingga pelanggan pergi."], ["Barnacles memiliki size of wallet besar, tetapi share of wallet terhadap perusahaan masih rendah. Tindakan yang disarankan adalah...", ["Menerapkan kontrol biaya yang ketat", "Berinvestasi mengembangkan hubungan yang lebih erat untuk meningkatkan profitabilitas", "Tidak melakukan apa-apa", "Menghentikan pelayanan"], 1, "Jika size of wallet besar dan share of wallet rendah, ada potensi. Jika size of wallet kecil, kontrol biaya yang ketat."], ["Strategi untuk Strangers menurut modul adalah...", ["Membangun hubungan jangka panjang", "Memastikan ada keuntungan dari setiap transaksi, tanpa perlu membangun hubungan", "Memberikan diskon terbesar", "Menginvestasikan biaya besar untuk meningkatkan loyalitas"], 1, "Strangers memiliki loyalitas dan profitabilitas rendah, jadi tidak perlu terlalu diperhatikan."], ["Mengapa CLV menghitung profitabilitas pelanggan dari beberapa periode?", ["Karena biaya perolehan pelanggan dikeluarkan dengan harapan pelanggan bertransaksi berulang kali", "Karena pelanggan hanya bertransaksi satu kali", "Karena CLV tidak memperhitungkan biaya", "Karena pendapatan selalu sama setiap tahun"], 0, "Biaya perolehan pelanggan (customer acquisition cost) dikeluarkan dengan harapan transaksi berulang dalam beberapa periode."], ["Biaya perolehan A dan B sama-sama Rp50.000.000. A bertransaksi 3 tahun dengan laba Rp30.000.000 per tahun; B bertransaksi 2 tahun dengan laba Rp40.000.000 per tahun. Kesimpulan modul adalah...", ["B lebih menguntungkan jika dilihat selama masa transaksi", "A lebih menguntungkan jika dilihat selama masa transaksi, meski per tahun B tampak lebih untung", "Keduanya sama persis", "Tidak dapat disimpulkan"], 1, "Per tahun, B (40 juta) lebih tinggi dari A (30 juta). Selama masa transaksi, A bertransaksi tiga periode dan B hanya dua periode, sehingga A lebih menguntungkan."]];
Object.assign(FIGS,{target:"<svg viewBox=\"0 0 790 418\" style=\"min-width:660px;max-width:790px\" role=\"img\" aria-label=\"Gambar 5.1 Hubungan antara market driven costing, product level target costing, dan component level target costing: kondisi pasar, target harga jual, target marjin laba, allowable cost, strategic cost-reduction challenge, product level target cost, function level target cost, component level target cost, supplies, target cost-reduction objective, dan current cost\"><defs><marker id=\"ar5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"fa\"/></marker></defs><text x=\"160\" y=\"16\" class=\"fl\">Market-Driven Costing</text><text x=\"376\" y=\"16\" class=\"fl\">Product-Level Target Costing</text><rect x=\"6\" y=\"26\" width=\"92\" height=\"58\" rx=\"3\" class=\"fr\"/><text x=\"52.0\" y=\"52.5\" class=\"fb8\">Market</text><text x=\"52.0\" y=\"65.5\" class=\"fb8\">Conditions</text><rect x=\"114\" y=\"26\" width=\"92\" height=\"58\" rx=\"3\" class=\"fr\"/><text x=\"160.0\" y=\"46.0\" class=\"fb8\">Target</text><text x=\"160.0\" y=\"59.0\" class=\"fb8\">Setting</text><text x=\"160.0\" y=\"72.0\" class=\"fb8\">Price</text><rect x=\"222\" y=\"26\" width=\"92\" height=\"58\" rx=\"3\" class=\"fr\"/><text x=\"268.0\" y=\"46.0\" class=\"fb8\">Target</text><text x=\"268.0\" y=\"59.0\" class=\"fb8\">Profit</text><text x=\"268.0\" y=\"72.0\" class=\"fb8\">Margin</text><rect x=\"330\" y=\"26\" width=\"92\" height=\"58\" rx=\"3\" class=\"fr\"/><text x=\"376.0\" y=\"52.5\" class=\"fb8\">Allowable</text><text x=\"376.0\" y=\"65.5\" class=\"fb8\">Cost</text><line x1=\"98\" y1=\"55\" x2=\"114\" y2=\"55\" class=\"fax\" marker-end=\"url(#ar5)\"/><line x1=\"206\" y1=\"55\" x2=\"222\" y2=\"55\" class=\"fax\" marker-end=\"url(#ar5)\"/><line x1=\"314\" y1=\"55\" x2=\"330\" y2=\"55\" class=\"fax\" marker-end=\"url(#ar5)\"/><rect x=\"330\"
