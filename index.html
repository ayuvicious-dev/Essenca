"6.1":{"c":"Latar Belakang","r":[{"t":"Kegunaan sistem informasi akuntansi manajemen","k":[{"t":"Memberi informasi untuk pengambilan keputusan manajemen."},{"t":"Tidak semua informasi biaya dapat dipakai."}]}],"l":[{"t":"Masalah","k":[{"t":"Informasi biaya yang sudah terjadi (sunk costs) bisa membuat keputusan salah."},{"t":"Contoh: tiket film yang sudah dibeli itu sunk cost; yang dihitung hanya sisa waktu lebih baik dipakai apa.","x":1}]},{"t":"Kesimpulan","k":[{"t":"Penting membedakan biaya yang dapat dipakai dan yang tidak dapat dipakai."},{"t":"Tujuannya agar manajemen mengambil keputusan yang benar."}]}]},
"6.2":{"c":"Langkah-Langkah dalam Pengambilan Keputusan","r":[{"t":"Lima langkah","k":[{"t":"1. Menyadari dan mendefinisikan permasalahan."},{"t":"2. Mengidentifikasikan alternatif pemecahan masalah."},{"t":"3. Memperkirakan biaya dan pendapatan tiap alternatif, lalu membandingkan yang relevan."},{"t":"4. Menilai dampak faktor kualitatif terhadap tujuan perusahaan."},{"t":"5. Memilih alternatif paling menguntungkan yang tidak bertentangan dengan tujuan perusahaan."}]}],"l":[{"t":"Contoh: pesanan khusus","k":[{"t":"Masalah: perusahaan lesu, ada calon pembeli baru dengan harga di bawah normal, satu kali transaksi."},{"t":"Alternatif: terima atau tolak pesanan."},{"t":"Hitung tambahan pendapatan dan tambahan biaya."},{"t":"Faktor kualitatif: apakah harga khusus merusak harga normal."},{"t":"Terima jika tambahan pendapatan lebih besar dari tambahan biaya dan tidak merusak harga normal."}]}]},
"6.3":{"c":"Konsep-Konsep Biaya dalam Pengambilan Keputusan Jangka Pendek","r":[{"t":"Sunk costs (6.3.1)","k":[{"t":"Biaya yang sudah terjadi, tidak relevan."}]},{"t":"Opportunity costs (6.3.2)","k":[{"t":"Kesempatan yang hilang karena memilih alternatif tertentu."}]}],"l":[{"t":"Relevant costs (6.3.3)","k":[{"t":"Biaya yang dapat dipakai untuk keputusan."},{"t":"Belum terjadi dan berbeda untuk tiap alternatif."}]}]},
"6.3.1":{"c":"Sunk Costs","r":[{"t":"Pengertian","k":[{"t":"Biaya yang sudah terjadi atau sudah dikeluarkan."},{"t":"Uang yang dikeluarkan tidak dapat ditarik kembali."},{"t":"Hampir semua biaya di laporan laba-rugi yang sudah dibayar adalah sunk cost."},{"t":"Tidak relevan dan seharusnya tidak dipakai untuk keputusan."}]},{"t":"Sunk cost phenomenon","k":[{"t":"Manajemen justru memperhitungkan sunk cost dalam keputusan."},{"t":"Contoh: pesawat concorde; sudah jelas tidak menguntungkan tetapi pemerintah Inggris dan Perancis tetap menanamkan uang karena sudah banyak berinvestasi."},{"t":"Menurut psikologi: karena perusahaan tidak ingin membuang-buang uang.","x":1}]}],"l":[{"t":"Contoh: persediaan","k":[{"t":"Persediaan bahan mentah, barang dalam proses, dan barang jadi."},{"t":"Biaya produksi yang membentuk nilainya sudah dikeluarkan, jadi sunk cost."}]},{"t":"Implikasi","k":[{"t":"Biaya produksi tidak relevan untuk keputusan, termasuk penentuan harga."},{"t":"Barang yang sudah diproduksi: harga ditentukan oleh konsumen."},{"t":"Jual ke konsumen yang mau membayar lebih tinggi, meski masih di bawah biaya per unit."},{"t":"Contoh: baju biaya per unit Rp100.000 lebih baik dijual Rp80.000 daripada tidak laku.","x":1}]}]},
"6.3.2":{"c":"Opportunity Costs","r":[{"t":"Pengertian","k":[{"t":"Kesempatan yang hilang karena memilih satu alternatif dibanding alternatif lain."},{"t":"Wujudnya: pendapatan, marjin kontribusi, atau profit yang hilang."}]},{"t":"Contoh PT XYZ","k":[{"t":"Kapasitas penuh, ada pembeli baru (pesanan A) dengan marjin kontribusi Rp30.000.000."},{"t":"Harus mengorbankan pesanan B yang selama ini dilayani, marjin kontribusi Rp20.000.000."},{"t":"Opportunity cost memenuhi pesanan A = Rp20.000.000."}]}],"l":[{"t":"Kapan diperhitungkan","k":[{"t":"Terutama bila perusahaan memiliki keterbatasan (shortage) sumber daya."},{"t":"Contoh sumber daya: kapasitas mesin, kapasitas orang, jumlah bahan mentah."},{"t":"Contoh: dua tawaran kerja lepas di jam yang sama, A Rp30 juta dan B Rp20 juta; ambil A kehilangan Rp20 juta.","x":1}]}]},
"6.3.3":{"c":"Relevant Costs","r":[{"t":"Pengertian","k":[{"t":"Biaya yang dapat dipakai sebagai informasi pengambilan keputusan."},{"t":"Harus memenuhi dua persyaratan."}]},{"t":"Dua syarat","k":[{"t":"1. Belum terjadi dan baru terjadi bila keputusan dilaksanakan.","k":[{"t":"Sunk costs tidak dapat dipakai."}]},{"t":"2. Berbeda untuk setiap alternatif.","k":[{"t":"Walau belum dikeluarkan, bila biayanya sama di tiap alternatif, tidak relevan."}]}]}],"l":[{"t":"Contoh: kapasitas 100.000 unit, terpakai 80.000, tambahan 10.000 unit","k":[{"t":"Biaya variabel relevan.","k":[{"t":"Tidak muncul bila tidak memproduksi tambahan 10.000 unit."},{"t":"Nilainya berbeda untuk keputusan yang berbeda."}]},{"t":"Biaya tetap tidak relevan.","k":[{"t":"Produksi 80.000 atau 90.000 unit, total biaya tetap sama."}]},{"t":"Contoh: gaji pegawai tetap sama berapa pun unit yang diproduksi, tetapi bahan baku tambahan jelas menambah biaya.","x":1}]}]},
"6.4":{"c":"Penerapan Konsep Biaya Relevan dalam Situasi Tertentu","r":[{"t":"Pesanan khusus (6.4.1)","k":[{"t":"Terima pesanan dengan harga di bawah harga reguler?"}]},{"t":"Make or buy (6.4.2)","k":[{"t":"Produksi komponen sendiri atau beli dari pemasok?"}]}],"l":[{"t":"Keep or drop (6.4.3)","k":[{"t":"Pertahankan atau hentikan produk yang merugi?"}]},{"t":"Sell or process further (6.4.4)","k":[{"t":"Jual langsung atau proses lebih lanjut joint product?"}]},{"t":"Prinsip bersama","k":[{"t":"Bandingkan hanya biaya dan pendapatan relevan antar alternatif."}]}]},
"6.4.1":{"c":"Pesanan Khusus (Special Order)","r":[{"t":"Situasi","k":[{"t":"Perusahaan berproduksi di bawah kapasitas."},{"t":"Calon pembeli meminta harga di bawah harga reguler."}]},{"t":"Soal PT Serasi Selaras","k":[{"t":"Kapasitas 100.000 jam mesin, terpakai 60.000."},{"t":"Pesanan 5.000 kursi, butuh 10.000 jam mesin (2 jam per kursi)."},{"t":"Bahan Rp20.000, buruh 15 menit x Rp16.000 per jam, overhead variabel Rp6.000 per jam mesin."},{"t":"Overhead tetap Rp8.000 per jam mesin, harga normal Rp60.000."}]},{"t":"Jawaban 1: kapasitas longgar, tawaran Rp42.000","k":[{"t":"Biaya tetap tidak relevan."},{"t":"Biaya relevan = variabel: 20.000 + 4.000 + 12.000 = Rp36.000 per kursi."},{"t":"Pendapatan relevan Rp42.000 lebih besar, jadi pesanan diterima."},{"t":"Marjin kontribusi Rp6.000 per kursi, total Rp30.000.000."}]}],"l":[{"t":"Jawaban 2: kapasitas penuh","k":[{"t":"Perlu tambahan kapasitas, biaya tetap tambahan menjadi relevan."},{"t":"Alternatif: korbankan penjualan reguler."},{"t":"Bandingkan marjin kontribusi pesanan dengan yang dikorbankan, karena total biaya tetap tidak berubah."},{"t":"Marjin kontribusi reguler lebih besar, maka pesanan ditolak."}]},{"t":"Jawaban 3: terpakai 95.000 jam mesin","k":[{"t":"Kapasitas menganggur 5.000 jam, kebutuhan 10.000 jam."},{"t":"Yang diperoleh: (42.000 - 36.000) x 5.000 = Rp30.000.000."},{"t":"Yang dikorbankan: (60.000 - 36.000) x 2.500 = Rp60.000.000."},{"t":"Pesanan ditolak."}]},{"t":"Faktor kualitatif","k":[{"t":"Apakah transaksi menghalangi tujuan stratejik."},{"t":"Apakah pesanan khusus merusak harga reguler; bila ya, tetap ditolak walau menguntungkan."}]}]},
