"6.1":["Salah satu fungsi utama sistem informasi akuntansi manajemen adalah ngasih informasi buat <b>pengambilan keputusan</b>. Tapi <b>nggak semua informasi biaya</b> boleh dipakai. Kalau yang dipakai informasi biaya yang <b>sudah terjadi (<i>sunk costs</i>)</b>, keputusannya bisa salah. Makanya penting banget bisa membedakan <b>biaya mana yang boleh dipakai dan mana yang nggak</b>.||nonton film yang ternyata membosankan: harga tiket yang sudah dibeli itu sunk cost. Yang layak dipikirkan cuma: sisa 2 jam ini lebih baik dipakai nonton terus atau pulang?"],
"6.2":["Ada <b>lima langkah</b> dalam pengambilan keputusan, termasuk keputusan jangka pendek:@@Sadari masalah dan definisikan masalahnya@@Identifikasi alternatif yang bisa dipakai untuk memecahkan masalah@@Perkirakan biaya dan pendapatan tiap alternatif, lalu bandingkan biaya dan pendapatan <b>relevan</b>@@Nilai dampak <b>faktor kualitatif</b> tiap alternatif terhadap tujuan perusahaan secara keseluruhan@@Pilih alternatif yang <b>paling menguntungkan</b>, tapi <b>nggak bertentangan dengan tujuan perusahaan</b>||mau ganti HP: masalahnya HP lama lemot; alternatifnya servis atau beli baru; bandingkan biaya dan manfaatnya; pertimbangkan hal non-uang seperti kebiasaan pakai; baru pilih.","Contoh penerapannya di keputusan jangka pendek (pesanan khusus):@@<b>Masalah:</b> perusahaan lagi lesu dan nggak beroperasi di kapasitas maksimal. Ada calon pembeli baru yang mau beli dengan harga <b>lebih murah dari harga normal</b>, dan cuma sekali transaksi@@<b>Alternatif:</b> terima pesanan atau tolak pesanan@@<b>Hitung:</b> tambahan pendapatan dan tambahan biaya kalau pesanan diterima@@<b>Faktor kualitatif:</b> apakah harga khusus ini bisa merusak harga normal perusahaan@@<b>Putusan:</b> terima kalau tambahan pendapatan lebih besar dari tambahan biaya, dan nggak merusak harga normal||pabrik roti yang oven-nya nganggur menerima pesanan satu kali dengan harga di bawah normal; boleh asal tambahan pemasukan lebih besar dari tambahan biayanya dan toko nggak jadi dicap murahan."],
"6.3":["Sebelum ngambil keputusan jangka pendek, ada <b>tiga konsep biaya</b> yang harus dikuasai:@@<b><i>Sunk costs</i></b> (6.3.1): biaya yang sudah terjadi@@<b><i>Opportunity costs</i></b> (6.3.2): kesempatan yang hilang@@<b><i>Relevant costs</i></b> (6.3.3): biaya yang boleh dipakai buat keputusan||ketiganya kayak filter: sunk cost disaring keluar, opportunity cost dimasukkan, dan sisanya dicek apakah relevan."],
"6.3.1":["<b><i>Sunk costs</i></b> adalah biaya yang <b>sudah terjadi atau sudah dikeluarkan</b>. Uang yang keluar <b>nggak bisa ditarik lagi</b>. Hampir semua biaya di laporan laba-rugi, kalau sudah dibayar, adalah sunk cost.||uang muka sewa ruko yang sudah dibayar nggak balik, apa pun keputusanmu besok.","Biaya ini <b>nggak relevan</b> dan <b>seharusnya nggak dipakai</b> buat keputusan. Tapi manajemen sering melakukan sebaliknya: tetap memperhitungkan sunk cost. Ini disebut <b><i>sunk cost phenomenon</i></b>.||pesawat <b>concorde</b>: sejak awal sudah jelas nggak akan menguntungkan, tapi pemerintah Inggris dan Perancis tetap menyuntik dana karena sudah terlanjur mengeluarkan uang banyak. Secara psikologi, ini muncul karena orang nggak mau merasa uangnya terbuang.","Contoh lain: biaya di <b>persediaan</b> (bahan mentah, barang dalam proses, barang jadi). Nilai persediaan barang jadi berasal dari biaya produksi barang yang sudah selesai dibuat. Semua biaya itu sudah dikeluarkan, jadi sudah merupakan <b>sunk cost</b>.","Akibatnya, biaya produksi itu <b>nggak relevan lagi</b> buat dasar keputusan, termasuk <b>penentuan harga</b>. Kalau barang sudah terlanjur diproduksi, harga sepenuhnya ditentukan oleh konsumen. Perusahaan seharusnya menjual ke konsumen yang mau bayar lebih tinggi, meskipun harganya <b>masih di bawah biaya per unitnya</b>.||toko memproduksi baju yang biaya per unitnya Rp100.000, tapi cuma ada yang mau beli Rp80.000. Lebih baik dijual Rp80.000 daripada nggak laku, karena Rp100.000 itu sudah telanjur keluar."],
"6.3.2":["<b><i>Opportunity costs</i></b> adalah <b>kesempatan yang hilang</b> karena perusahaan memilih satu alternatif dibanding alternatif lain. Wujudnya bisa berupa pendapatan yang hilang, marjin kontribusi yang hilang, atau profit yang hilang.","Contoh: PT XYZ beroperasi dalam <b>kapasitas penuh</b>, lalu ada pembeli baru yang mau pesan. Pesanan itu (pesanan A) memberi marjin kontribusi <b>Rp30.000.000</b>. Tapi biar bisa memenuhinya, perusahaan harus <b>mengorbankan salah satu pesanan yang sedang dilayani</b>, yaitu pesanan B, yang marjin kontribusinya <b>Rp20.000.000</b>. Jadi <i>opportunity cost</i> memenuhi pesanan A adalah <b>Rp20.000.000</b>.||dapat dua tawaran kerja lepas di jam yang sama: A bayar Rp30 juta, B bayar Rp20 juta. Ambil A artinya kehilangan Rp20 juta dari B. Itulah opportunity cost-nya.","<i>Opportunity costs</i> harus diperhitungkan, terutama kalau perusahaan punya <b>keterbatasan (<i>shortage</i>)</b> sumber daya: kapasitas mesin, kapasitas orang, jumlah bahan mentah, dan sebagainya."],
"6.3.3":["Biaya yang bisa dipakai buat keputusan disebut <b>biaya relevan (<i>relevant costs</i>)</b>. Supaya relevan, biaya harus memenuhi <b>dua syarat</b>:@@<b>Belum terjadi:</b> baru akan terjadi kalau keputusan yang dipilih dijalankan. Makanya <i>sunk costs</i> nggak bisa dipakai@@<b>Berbeda untuk tiap alternatif:</b> walaupun belum dikeluarkan, kalau biayanya <b>sama</b> di semua alternatif, biaya itu tetap nggak relevan||milih makan di restoran A atau B: gaji bulananmu nggak relevan (sama saja), yang relevan harga menu dan ongkos jalan ke sana.","Contoh di modul: kapasitas produksi <b>100.000 unit</b>, terpakai <b>80.000 unit</b>, lalu ada tambahan produksi <b>10.000 unit</b>.@@<b>Biaya variabel relevan:</b> nggak akan muncul kalau perusahaan nggak memproduksi tambahan 10.000 unit. Kalau produksi tambah, biaya variabel muncul, dan nilainya beda antar keputusan@@<b>Biaya tetap nggak relevan:</b> memproduksi 80.000 unit ataupun 90.000 unit, total biaya tetapnya <b>sama</b>||gaji pegawai tetap pabrik tetap segitu mau produksi 80.000 atau 90.000 unit; tapi bahan baku tambahan jelas nambah."],
"6.4":["Di 6.4, konsep biaya relevan diterapkan ke <b>situasi tertentu</b>. Di materi yang tersedia ada empat:@@<b>Pesanan khusus</b> (6.4.1)@@<b>Make or buy</b> (6.4.2)@@<b>Keep or drop</b> (6.4.3)@@<b>Sell or process further</b> (6.4.4)||apa pun situasinya, jurusnya sama: bandingkan hanya <b>biaya dan pendapatan relevan</b> antar alternatif."],
"6.4.1":["Kasus pertama keputusan jangka pendek: <b>pesanan khusus</b>. Muncul ketika perusahaan produksinya <b>di bawah kapasitas</b>, lalu ada calon pembeli yang mau beli dengan <b>harga di bawah harga reguler</b>.","<b>Soal PT Serasi Selaras</b> (produsen <i>furniture</i>, lagi lesu):@@Kapasitas <b>100.000 jam mesin</b>, terpakai <b>60.000 jam mesin</b>@@Calon pembeli mau <b>5.000 kursi</b>, butuh total <b>10.000 jam mesin</b> (2 jam mesin per kursi)@@Bahan mentah langsung <b>Rp20.000</b> per kursi@@Buruh langsung <b>15 menit</b> per kursi, tarif <b>Rp16.000</b> per jam@@<i>Overhead</i> variabel <b>Rp6.000</b> per jam mesin@@<i>Overhead</i> tetap <b>Rp8.000</b> per jam mesin (kapasitas 100.000 jam)@@Harga normal <b>Rp60.000</b> per kursi||kayak studio foto sepi yang ditawari paket foto massal dengan harga lebih murah dari tarif biasa.","Pertanyaannya ada tiga: (1) tawaran <b>Rp42.000</b> per kursi, diterima nggak? (2) bagaimana kalau perusahaan sudah <b>kapasitas penuh</b>? (3) bagaimana kalau sudah terpakai <b>95.000 jam mesin</b>?","<b>Jawaban 1 (kapasitas masih longgar).</b> Total biaya tetap <b>bukan biaya relevan</b>, karena produksi di 60.000 atau 100.000 jam mesin, total <i>overhead</i> tetapnya sama. Yang relevan: biaya yang berubah kalau pesanan diterima, yaitu <b>semua biaya variabel</b> (bahan mentah, buruh langsung, <i>overhead</i> variabel). Biaya relevan = Rp20.000 + Rp4.000 + Rp12.000 = <b>Rp36.000</b> per kursi, sedangkan pendapatan relevan <b>Rp42.000</b>. Pendapatan relevan lebih besar, jadi pesanan <b>diterima</b>.||buruh: 15/60 jam x Rp16.000 = Rp4.000. Overhead variabel: 2 jam mesin x Rp6.000 = Rp12.000. Overhead tetap Rp8.000 per jam (Rp16.000 per kursi) sengaja nggak dihitung karena nggak berubah.","##T|Tabel 6.1: Biaya Relevan Pesanan Khusus per Kursi|Komponen~Per kursi (IDR)~Dasar hitung|Bahan mentah langsung~20.000~Diketahui|Buruh langsung~4.000~Rp16.000 x 15/60 jam|Overhead variabel~12.000~Rp6.000 x 2 jam mesin|*Total biaya relevan~36.000~Jumlah ketiganya|Harga tawaran~42.000~Diketahui|*Marjin kontribusi per kursi~6.000~42.000 - 36.000","<b>Jawaban 2 (kapasitas penuh).</b> Kalau sudah penuh, perusahaan butuh <b>tambahan kapasitas</b>, yang menimbulkan <b>tambahan biaya tetap</b>, sehingga biaya tetap itu jadi <b>relevan</b>. Alternatif lain: menerima pesanan dengan <b>mengorbankan penjualan reguler</b>. Untuk opsi ini, yang dibandingkan adalah <b>marjin kontribusi</b> pesanan vs marjin kontribusi yang dikorbankan. Kenapa marjin kontribusi? Karena total biaya tetap <b>nggak berubah</b>, entah perusahaan tetap menjual reguler atau memenuhi pesanan. Karena marjin kontribusi penjualan reguler lebih besar dari marjin kontribusi pesanan, pesanan <b>ditolak</b>.||restoran yang sudah penuh nggak mungkin menerima rombongan diskon kalau itu mengusir tamu yang bayar harga penuh.","<b>Jawaban 3 (terpakai 95.000 jam mesin).</b> Kapasitas menganggur tinggal <b>5.000 jam</b>, sementara pesanan butuh <b>10.000 jam</b> (pembeli nggak mau kurang dari 5.000 kursi). Jadi penjualan reguler yang dikorbankan setara <b>5.000 jam, yaitu 2.500 kursi</b>.@@Marjin kontribusi yang diperoleh: (Rp42.000 - Rp36.000) x 5.000 kursi = <b>Rp30.000.000</b>@@Marjin kontribusi yang dikorbankan: (Rp60.000 - Rp36.000) x 2.500 kursi = <b>Rp60.000.000</b>@@Yang dikorbankan lebih besar, jadi pesanan <b>ditolak</b>||dapat Rp30 juta tapi kehilangan Rp60 juta: jelas rugi Rp30 juta.","<b>Faktor kualitatif.</b> Hitungan kuantitatif bukan satu-satunya pertimbangan. Perlu dilihat apakah transaksi ini <b>menghalangi tujuan stratejik</b> perusahaan. Salah satu faktornya: apakah pesanan khusus bisa <b>merusak harga reguler</b>. Kalau iya, walaupun secara kuantitatif menguntungkan, pesanan tetap <b>harus ditolak</b>.||pelanggan lama bisa minta harga murah juga begitu tahu ada orang lain dapat harga khusus."],
"6.4.2":["<b>Make or buy:</b> perusahaan biasanya memproduksi komponen sendiri, tapi ada <b>pemasok luar yang menawarkan harga lebih murah</b>. Keputusannya: tetap produksi sendiri atau beli dari pemasok?","<b>Soal PT Indah Abadi</b> (produsen kipas angin yang membuat pisau kipas sendiri):@@Bahan mentah langsung <b>Rp10.000</b> per pisau@@Buruh langsung <b>Rp6.000</b> per jam buruh langsung@@<i>Overhead</i> variabel <b>Rp4.000</b> per jam buruh langsung@@Butuh <b>10 menit</b> buruh langsung per pisau@@Sewa mesin khusus <b>Rp100.000.000</b> per tahun (kontrak bisa dibatalkan kalau produksi pisau dihentikan)@@Penyusutan ruang pabrik <b>Rp40.000.000</b> per tahun (kalau pisau nggak diproduksi, ruangan menganggur dan nggak bisa dipakai apa pun)@@Produksi <b>20.000 pisau</b> per tahun@@Tawaran pemasok luar <b>Rp17.000</b> per pisau","<b>Jawaban.</b> Lagi-lagi yang relevan adalah <b>biaya variabel</b>, karena akan berbeda antara produksi sendiri (muncul) dan beli dari luar (hilang). Untuk <b>biaya tetap</b>, lihat apakah biaya itu <b>bisa dihilangkan</b> kalau beli dari luar. Kalau ya, relevan; kalau nggak, nggak relevan karena nilainya sama di kedua alternatif.@@<b>Sewa mesin:</b> bisa dibatalkan, jadi <b>relevan</b>@@<b>Penyusutan ruang pabrik:</b> tetap ada walau ruangan menganggur, jadi <b>nggak relevan</b>||kayak berhenti langganan gym: iurannya hilang kalau berhenti (relevan), tapi cicilan rumah tetap jalan (nggak relevan).","Biaya relevan = biaya variabel <b>Rp11.000</b> per pisau + sewa mesin Rp100.000.000 / 20.000 = <b>Rp5.000</b> per pisau = <b>Rp16.000</b> per pisau. Dibanding tawaran pemasok <b>Rp17.000</b>, memproduksi sendiri masih <b>lebih murah</b>.","##T|Tabel 6.2: Perbandingan Biaya Relevan Make or Buy per Pisau|Komponen~Per pisau (IDR)~Relevan?|Biaya variabel (menurut modul)~11.000~Ya|Sewa mesin (100.000.000 / 20.000 pisau)~5.000~Ya, kontrak dapat dibatalkan|Penyusutan ruang pabrik (40.000.000 / 20.000 pisau)~2.000~Tidak, ruangan menganggur|*Total biaya relevan membuat sendiri~16.000~11.000 + 5.000|Harga pemasok luar~17.000~Diketahui","<b>Catatan hitungan:</b> modul menyebut biaya variabel Rp11.000 per pisau. Kalau dihitung dari tarif di soal, bahan Rp10.000 + buruh (10/60 jam x Rp6.000) Rp1.000 + <i>overhead</i> variabel (10/60 jam x Rp4.000) sekitar Rp667 = sekitar Rp11.667, jadi total relevan sekitar Rp16.667. Kesimpulannya sama, tetap lebih murah dari Rp17.000. Di ujian ikuti angka yang diberikan soal.","Kalau tawaran pemasok luar lebih murah, tetap ada <b>faktor kualitatif</b> yang harus dipertimbangkan: <b>kualitas</b> bahan baku atau komponen, <b>kontinuitas</b> pasokan, <b>ketepatan waktu</b> kedatangan pasokan, dan sebagainya. Walau harga pasokan luar lebih murah, kalau faktor kualitatif nggak mendukung, sebaiknya tetap produksi sendiri.||pemasok murah tapi sering telat kirim bisa bikin lini perakitan berhenti, yang kerugiannya lebih besar dari selisih harga."],
"6.4.3":["<b>Keep or drop:</b> perusahaan punya beberapa produk dan ada yang <b>nggak menguntungkan</b>. Perusahaan harus memutuskan: tetap <b>mempertahankan</b> produknya atau <b>menghentikan</b> penjualan dan produksinya. Konsep yang sama bisa dipakai buat evaluasi <b>cabang, pelanggan</b>, dan sebagainya.","<b>Soal PT Bagus Hijau</b> menjual produk A, B, dan C. Kinerja tahun 20X4:","##T|Tabel 6.3: Hasil Kinerja PT Bagus Hijau Tahun 20X4 (IDR)|~A~B~C~Total|Penjualan~195.000.000~225.000.000~275.000.000~695.000.000|Biaya bahan mentah langsung~36.000.000~28.000.000~60.000.000~124.000.000|Biaya buruh langsung~15.000.000~18.000.000~20.000.000~53.000.000|Biaya overhead pabrik - variabel~22.000.000~24.000.000~26.000.000~72.000.000|Beban pemasaran - variabel~47.000.000~64.000.000~32.000.000~143.000.000|*Marjin kontribusi~75.000.000~91.000.000~137.000.000~303.000.000|Biaya tetap langsung~15.000.000~26.000.000~85.000.000~126.000.000|Biaya tetap bersama~20.000.000~30.000.000~58.000.000~108.000.000|*Laba neto~40.000.000~35.000.000~(6.000.000)~69.000.000","Produk C <b>merugi</b> Rp6.000.000. Dihentikan atau dipertahankan? Semua <b>biaya variabel relevan</b>, karena kalau C dipertahankan biaya variabel tetap ada, kalau dihentikan biaya variabel jadi nol.","Di tabel ada dua jenis biaya tetap:@@<b>Biaya tetap langsung:</b> dikeluarkan <b>khusus untuk satu produk</b> dan bisa ditelusuri langsung ke produk itu (sewa atau penyusutan mesin khusus, gaji orang yang khusus mengerjakan produk itu). Nggak otomatis hilang kalau produk dihentikan, tapi <b>lebih mudah dihilangkan</b>. Kalau bisa dihilangkan, jadi <b>relevan</b>; kalau nggak, <b>nggak relevan</b>@@<b>Biaya tetap bersama:</b> dipakai <b>untuk semua produk</b> (penyusutan gedung pabrik, gaji supervisor yang mengawasi ketiga produk, gaji direksi). Kalau satu produk dihentikan, biaya ini <b>biasanya nggak hilang</b> karena masih dipakai produk lain. Jadi <b>nggak relevan</b>||mesin khusus yang cuma bikin produk C bisa dijual atau disewakan (langsung); atap pabrik nggak bisa dipotong cuma karena C berhenti (bersama).","Asumsi soal: kalau C dihentikan, <b>semua biaya tetap langsung hilang</b>, tapi <b>biaya tetap bersama tidak hilang</b>. Hasilnya:","##T|Tabel 6.4: Hasil Jika Produk C Dihentikan (IDR)|~A~B~C~Total|Penjualan~195.000.000~225.000.000~-~420.000.000|Biaya bahan mentah langsung~36.000.000~28.000.000~-~64.000.000|Biaya buruh langsung~15.000.000~18.000.000~-~33.000.000|Biaya overhead pabrik - variabel~22.000.000~24.000.000~-~46.000.000|Beban pemasaran - variabel~47.000.000~64.000.000~-~111.000.000|*Marjin kontribusi~75.000.000~91.000.000~-~166.000.000|Biaya tetap langsung~15.000.000~26.000.000~-~41.000.000|Biaya tetap bersama~20.000.000~30.000.000~58.000.000~108.000.000|*Laba neto~40.000.000~35.000.000~(58.000.000)~17.000.000","Keputusan menghentikan C ternyata <b>salah</b>, karena total laba turun dari Rp69.000.000 menjadi <b>Rp17.000.000</b>.||C menyumbang marjin kontribusi Rp137 juta, sedangkan yang bisa dihemat dari menghentikannya hanya biaya tetap langsung Rp85 juta. Selisihnya Rp52 juta yang hilang dari laba (69 juta - 52 juta = 17 juta). Biaya tetap bersama Rp58 juta tetap ada, jadi seluruhnya numpuk di C yang sudah berhenti.","<b>Faktor kualitatif:</b> misalnya <b>moral pegawai</b> kalau ada pegawai yang diberhentikan karena produk dihentikan atau divisi tempat mereka bekerja ditutup."],
"6.4.4":["<b>Sell or process further:</b> situasi ini terkait perusahaan yang memproduksi <b><i>joint product</i></b>. Seperti dibahas sebelumnya, <i>joint product</i> berasal dari <b>satu proses produksi</b> yang menghasilkan beberapa jenis produk.","Dalam kasus ini, <b>alokasi <i>joint costs</i> bukan biaya relevan</b>, karena <i>joint cost</i> adalah <b><i>sunk cost</i></b>. Alasannya: keputusan untuk menjual atau memproses lebih lanjut dibuat <b>setelah <i>joint process</i> selesai</b>.||biaya memelihara dan memotong sapi (joint cost) sudah keluar sebelum kamu memutuskan kulitnya dijual mentah atau disamak dulu, jadi angka itu nggak ikut dipertimbangkan.","Yang dihitung hanya <b>tambahan pendapatan vs tambahan biaya</b> kalau diproses lebih lanjut. Kalau pendapatan tambahannya lebih besar, proses terus.||tambahan menyamak kulit bikin harga naik Rp3.000 tapi biaya tambahan Rp2.000, ya lanjut samak, untung Rp1.000.","<b>PT Kimia Rumit:</b> AAA bisa dijual langsung atau diproses jadi AAA1. Tambahan pendapatan <b>Rp3.000/kg</b> vs tambahan biaya <b>Rp2.000/kg</b>, maka <b>proses jadi AAA1</b> (untung tambahan Rp1.000/kg). Joint cost tidak ikut dihitung.","##T|Tabel 6.5: Keputusan Sell or Process Further AAA per kg|Komponen~Per kg (IDR)~Keterangan|Tambahan pendapatan~3.000~Relevan|Tambahan biaya~2.000~Relevan|*Keuntungan tambahan~1.000~3.000 - 2.000"],"6.4.5":["<b>Bauran produk dengan kendala:</b> terjadi kalau <b>kapasitas produksi terbatas</b> sehingga nggak semua permintaan bisa dipenuhi. Perusahaan harus memilih produk mana yang diproduksi duluan supaya untungnya maksimal.||kamu cuma punya 1 jam masak: lebih baik masak menu yang untungnya Rp1.750 per menit daripada menu yang untung per porsinya besar tapi makan waktu lama.", "Yang diprioritaskan adalah produk dengan <b>marjin kontribusi per menit kendala (<i>constraint</i>) paling tinggi</b>. Dasarnya marjin kontribusi, karena <b>biaya tetap bukan biaya relevan</b>: bauran apa pun yang dipilih, biaya tetapnya sama, jadi memaksimalkan marjin kontribusi otomatis memaksimalkan laba.", "<b>Soal PT Cahaya Gelap</b> memproduksi tiga produk (A1, A2, A3). Informasinya:", "##T|Tabel 6.6: Informasi Produk PT Cahaya Gelap|~A1~A2~A3|Harga Jual per Unit (Rp)~10.000~8.000~7.000|Biaya Variabel per Unit (Rp)~5.000~4.000~3.500|Marjin Kontribusi per Unit (Rp)~5.000~4.000~3.500|Permintaan Pasar (Unit)~1.000~2.000~3.000|Waktu Produksi per Unit (Menit)~10~4~2|Marjin Kontribusi per Menit (Rp)~500~1.000~1.750", "Kapasitas produksi <b>3.000 jam = 18.000 menit</b> per tahun. Tentukan bauran produk yang memaksimalkan keuntungan.", "<b>Jawaban.</b> Lihat A1: marjin kontribusi per unitnya <b>paling tinggi</b> (Rp5.000), tapi per menitnya <b>paling rendah</b> (Rp500) karena butuh waktu paling lama (10 menit). Maka prioritasnya <b>A3</b>, lalu <b>A2</b>, baru <b>A1</b>.||tukang jahit yang waktunya terbatas: baju mewah untungnya besar tapi dikerjakan seharian, kalah untung per jam dibanding kemeja yang selesai cepat.", "Hitungannya:@@A3: 3.000 unit x 2 menit = <b>6.000 menit</b>@@A2: 2.000 unit x 4 menit = <b>8.000 menit</b>@@A3 + A2 = 14.000 menit, sisa untuk A1 = 18.000 - 14.000 = <b>4.000 menit</b>@@A1: 4.000 / 10 menit = <b>400 unit</b> (permintaan 1.000 unit nggak terpenuhi semua)", "Total marjin kontribusi maksimal: Rp10.500.000 (A3) + Rp8.000.000 (A2) + Rp2.000.000 (A1) = <b>Rp20.500.000</b>.", "##T|Tabel 6.7: Ringkasan Bauran Produk Optimal PT Cahaya Gelap|Produk~Unit~Menit mesin~Marjin kontribusi (IDR)|A3~3.000~6.000~10.500.000|A2~2.000~8.000~8.000.000|A1 (sisa kapasitas)~400~4.000~2.000.000|*Total~5.400~18.000~20.500.000"],"6.5":["<b>ABC untuk keputusan jangka pendek:</b> masalahnya, tarif <i>overhead</i> <b>tradisional</b> (tetap maupun variabel) kurang akurat. Pakai <i>activity based costing</i> diharapkan biaya relevan yang dihitung jadi lebih akurat.", "Di ABC, biaya dikeluarkan untuk membayar <b>sumber daya</b> yang dipakai melakukan aktivitas. Ada dua jenis:@@<b>Sumber daya fleksibel (<i>flexible resources</i>):</b> diperoleh sesuai kebutuhan. Aktivitas dikurangi, sumber daya ikut dikurangi; aktivitas dihilangkan, sumber daya ikut hilang. Biayanya <b>relevan</b>@@<b>Sumber daya terikat (<i>committed resources</i>):</b> diperoleh <b>sebelum</b> aktivitas dilakukan karena sudah ada komitmen, jadi ada kegiatan atau nggak, sumber daya tetap ada dan sulit dihilangkan. Biayanya <b>tidak relevan</b> selama kapasitas menganggur masih cukup||fleksibel itu kayak tenaga harian: nggak ada pesanan, nggak dibayar. Terikat itu kayak karyawan tetap: ada pesanan atau nggak, gajinya jalan terus.", "Karena ada sumber daya terikat, terjadi <b>ketidakseimbangan</b> antara yang dibutuhkan dan yang tersedia. Kalau yang dibutuhkan lebih kecil, ada <b>kapasitas menganggur</b> (<i>idle capacity</i>) yang nggak otomatis bisa dihilangkan. Kalau pesanan butuh lebih dari yang tersedia, perusahaan harus menambah sumber daya terikat, dan <b>tambahan biayanya relevan</b>.||langganan internet kantor sudah dibayar tetap sebulan: pesanan baru nggak menambah biayanya, kecuali harus upgrade paket.", "<b>Soal PT Jelas Cermat</b> (pembuat kacamata yang lagi lesu karena persaingan Vietnam dan China serta upah buruh naik) dapat pesanan dari PT Opportunis: <b>10.000 kacamata</b> di harga <b>Rp325.000</b> per kacamata. Pesanan sekali saja (bukan reguler), akan dijual ke negara-negara Afrika. Perusahaan sudah pakai ABC dan mau menganalisis kelayakannya. Informasinya:", "##T|Tabel 6.8: Informasi Biaya dan Sumber Daya Pesanan 10.000 Kacamata PT Jelas Cermat|Biaya~Pemicu Aktivitas (Activity Driver)~Kapasitas Mengganggur~Jumlah Dibutuhkan~Tarif per Aktivitas^2|^Committed~Fleksibel|Bahan Mentah Langsung~Rangka Kacamata~-~10.000~-~12.000|Buruh Langsung~Jam Buruh Langsung~-~5.000~-~20.000|Set-Up~Jam Set-Up~45~80~10.000.000~120.000|Inspeksi~Jam Inspeksi~400~800~20.000.000~80.000|Pembuatan Kacamata~Jam Mesin~8.000~6.000~15.000.000~3.000", "Penambahan kapasitas harus dalam <b>kelipatan tertentu</b>:@@<i>Set-up</i>: kelipatan <b>25 jam</b>@@Inspeksi: kelipatan <b>2.000 jam</b>, biaya tetap naik <b>Rp20.000.000</b> per kelipatan@@Mesin pembuat kacamata: sewa <b>Rp20.000 per jam mesin</b>, tiap mesin menambah <b>2.500 jam mesin</b>||kayak paket data: nggak dijual per MB, tapi per paket. Butuh tambahan sedikit pun tetap bayar satu paket penuh.", "<b>Jawaban, langkah 1: biaya fleksibel</b> (jumlah pemakaian x tarif fleksibel):@@Bahan mentah langsung: Rp12.000 x 10.000 = <b>Rp120.000.000</b>@@Buruh langsung: Rp20.000 x 5.000 = <b>Rp100.000.000</b>@@<i>Set-up</i>: Rp120.000 x 80 = <b>Rp9.600.000</b>@@Inspeksi: <b>Rp6.400.000</b> (angka menurut modul)@@Pembuatan kacamata: Rp3.000 x 6.000 jam mesin = <b>Rp18.000.000</b>@@Total biaya fleksibel = <b>Rp254.000.000</b>", "<b>Langkah 2: tambahan biaya committed</b> (bandingkan kapasitas menganggur dengan jumlah yang dibutuhkan):@@<i>Set-up</i>: menganggur 45 jam, butuh 80 jam, kurang 35 jam. Tambahan hanya kelipatan 25 jam, jadi tambah <b>50 jam</b> = 2 x Rp10.000.000 = <b>Rp20.000.000</b>@@Inspeksi: tambah satu kelipatan <b>2.000 jam</b> = <b>Rp20.000.000</b>@@Pembuatan kacamata: menganggur 8.000 jam mesin, butuh 6.000, masih cukup, tambahan <b>Rp0</b>@@Total tambahan biaya committed = <b>Rp40.000.000</b>||butuh 35 jam tambahan tapi hanya dijual per paket 25 jam, ya beli dua paket (50 jam).", "##T|Tabel 6.9: Ringkasan Biaya Relevan Pesanan 10.000 Kacamata (IDR)|Komponen~Hitungan~Jumlah|Bahan mentah langsung~12.000 x 10.000~120.000.000|Buruh langsung~20.000 x 5.000~100.000.000|Set-up (fleksibel)~120.000 x 80~9.600.000|Inspeksi (fleksibel)~Menurut modul~6.400.000|Pembuatan kacamata (fleksibel)~3.000 x 6.000~18.000.000|*Subtotal biaya fleksibel~Jumlah lima baris di atas~254.000.000|Set-up (committed)~2 kelipatan 25 jam~20.000.000|Inspeksi (committed)~1 kelipatan 2.000 jam~20.000.000|Pembuatan kacamata (committed)~Kapasitas menganggur cukup~0|*Subtotal tambahan biaya committed~20.000.000 + 20.000.000 + 0~40.000.000|*Total biaya relevan~254.000.000 + 40.000.000~294.000.000|Biaya relevan per kacamata~294.000.000 / 10.000~294.000|Harga tawaran per kacamata~Diketahui~325.000", "<b>Keputusan:</b> total biaya relevan = Rp254.000.000 + Rp40.000.000 = <b>Rp294.000.000</b> atau <b>Rp294.000 per kacamata</b>, lebih rendah dari harga tawaran Rp325.000. Maka secara kuantitatif pesanan <b>diterima</b> (tambahan laba Rp31.000 per kacamata, atau Rp310.000.000 untuk seluruh pesanan).", "<b>Catatan hitungan:</b> pada baris inspeksi, Rp80.000 x 800 jam sebenarnya Rp64.000.000, tetapi modul menulis <b>Rp6.400.000</b> (setara tarif Rp8.000), dan total Rp254.000.000 serta Rp294.000.000 mengikuti angka Rp6.400.000 itu. Di ujian ikuti angka yang diberikan soal."],"6.6":["<b>Theory of Constraint (TOC):</b> konsep yang berusaha <b>memaksimalkan keuntungan</b> perusahaan yang beroperasi dengan <b>kendala</b>. Kendala ada dua:@@<b>Kendala internal:</b> berasal dari dalam perusahaan, misalnya kapasitas yang terbatas untuk memenuhi permintaan pasar@@<b>Kendala eksternal:</b> berasal dari luar perusahaan, misalnya pasokan bahan baku yang nggak mencukupi atau permintaan pasar rendah yang bikin kapasitas menganggur||jalan tol macet di satu gerbang: sebanyak apa pun jalur lain, kendaraan yang lewat tetap ditentukan gerbang yang sempit itu.", "Perusahaan harus bisa <b>mengelola kendala</b> itu supaya untungnya maksimal. Dalam TOC, keuntungan diukur dengan <b>throughput = penjualan - biaya bahan mentah langsung</b>. Mirip marjin kontribusi, bedanya hanya bahan mentah langsung yang dianggap biaya variabel; <b>semua biaya lain dianggap biaya tetap</b>. Karena bauran produk apa pun nggak mengubah biaya tetap, memaksimalkan <i>throughput</i> otomatis memaksimalkan laba.||jual kue Rp50.000 dengan tepung dan telur Rp20.000: throughput-nya Rp30.000. Gaji dan listrik dihitung biaya tetap, nggak ikut.", "<b>Lima langkah TOC:</b>@@Tentukan kendala yang dihadapi perusahaan@@Manfaatkan (<i>exploit</i>) kendala itu semaksimal mungkin@@Semua keputusan lain disesuaikan dengan keputusan yang terkait kendala@@Tingkatkan hal yang terkendala@@Kalau kendala sudah terpecahkan, kembali ke langkah pertama", "<b>Soal PT Cemara Tinggi</b> memproduksi tiga produk (ABC, DEF, GHI) melalui <b>lima mesin</b>. Informasinya:", "##T|Tabel 6.10: Informasi Produk dan Mesin PT Cemara Tinggi|~ABC~DEF~GHI|Pemakaian Mesin 1 per Unit (menit)~10~5~8|Pemakaian Mesin 2 per Unit (menit)~12~6~4|Pemakaian Mesin 3 per Unit (menit)~4~5~2|Pemakaian Mesin 4 per Unit (menit)~8~10~5|Pemakaian Mesin 5 per Unit (menit)~4~8~10|Harga Jual per Unit (Rp)~10.000~12.000~15.000|Biaya Bahan Baku Langsung per Unit (Rp)~6.000~7.000~8.000|Throughput per Unit (Rp)~4.000~5.000~7.000|Permintaan Pasar (Unit)~8.000~5.000~3.000", "<b>Catatan hitungan:</b> angka Permintaan Pasar di tabel (8.000; 5.000; 3.000) tidak cocok dengan hitungan di jawaban. Jawaban memakai permintaan <b>800, 500, dan 300 unit</b> (misalnya Mesin 1 untuk ABC: 10 menit x 800 = 8.000 menit; GHI 300 unit x 4 menit = 1.200 menit), jadi kemungkinan tabel di modul kelebihan satu nol. Di ujian ikuti angka yang diberikan soal.", "Kapasitas: mesin 1 = 15.000 menit, mesin 2 = 12.000, mesin 3 = 8.000, mesin 4 = 15.000, mesin 5 = 12.000. Terapkan lima tahap TOC.", "<b>Tahap 1: tentukan kendala.</b> Bandingkan total waktu yang dibutuhkan untuk memenuhi semua permintaan dengan kapasitas tiap mesin. Kapasitas kurang berarti <b>kendala internal</b>; kapasitas cukup berarti <b>kendala eksternal</b>.||lima kasir di supermarket: yang antreannya paling panjang itulah penentu seberapa cepat semua pelanggan selesai.", "##T|Tabel 6.11: Waktu yang Dibutuhkan Dibandingkan dengan Kapasitas Mesin (menit)|~ABC~DEF~GHI~Total~Kapasitas|Mesin 1~8.000~2.500~2.400~12.900~15.000|Mesin 2~9.600~3.000~1.200~13.800~12.000|Mesin 3~3.200~2.500~600~6.300~8.000|Mesin 4~6.400~5.000~1.500~12.900~15.000|Mesin 5~3.200~4.000~3.000~10.200~12.000", "Mesin 1, 3, 4, dan 5 kapasitasnya masih cukup. <b>Mesin 2</b> butuh 13.800 menit padahal kapasitasnya hanya 12.000 menit, jadi kendalanya adalah <b>kendala internal pada mesin 2</b>.", "<b>Tahap 2: manfaatkan kendala.</b> Prioritaskan produk dengan <i>throughput</i> per menit mesin 2 paling tinggi: ABC Rp4.000/12 = <b>Rp333,33</b>; DEF Rp5.000/6 = <b>Rp833,33</b>; GHI Rp7.000/4 = <b>Rp1.750</b>. Urutannya <b>GHI, DEF, ABC</b>.||satu oven kecil: panggang dulu kue yang untungnya paling besar per menit oven.", "##T|Tabel 6.12: Ringkasan Throughput per Menit Mesin 2 (Kendala)|~ABC~DEF~GHI|Throughput per unit (IDR)~4.000~5.000~7.000|Menit mesin 2 per unit~12~6~4|*Throughput per menit mesin 2 (IDR)~333,33~833,33~1.750", "Hitungan rencana produksi:@@GHI: 300 x 4 menit = <b>1.200 menit</b>@@DEF: 500 x 6 menit = <b>3.000 menit</b>@@Total DEF + GHI = 4.200 menit, sisa 12.000 - 4.200 = <b>7.800 menit</b> untuk ABC@@ABC: 7.800 / 12 menit = <b>650 unit</b>@@<i>Throughput</i> = (4.000 x 650) + (5.000 x 500) + (7.000 x 300) = <b>Rp7.200.000</b>", "##T|Tabel 6.13: Ringkasan Rencana Produksi PT Cemara Tinggi pada Mesin 2|Produk~Unit~Menit mesin 2~Throughput (IDR)|GHI~300~1.200~2.100.000|DEF~500~3.000~2.500.000|ABC~650~7.800~2.600.000|*Total~1.450~12.000~7.200.000", "<b>Tahap 3: sesuaikan keputusan lain.</b> Semua keputusan di mesin 1, 3, 4, dan 5 (misalnya <i>scheduling</i>) mengacu pada keputusan mesin 2. Ini disebut <b>drum-buffer-rope (DBR)</b>: mesin 2 jadi <b><i>drum</i></b> (irama kerja) bagi mesin 3, 4, 5 dan jadi <b><i>rope</i></b> (tali) yang membatasi produksi mesin 1.||konvoi mobil: kecepatan semua mobil mengikuti mobil yang paling lambat.", "<b>Tahap 4: tingkatkan kendala.</b> Tambah kapasitas mesin 2 lewat <b>lembur, <i>outsourcing</i>, atau mesin baru</b>, selama tambahan <i>throughput</i> masih lebih besar daripada tambahan biaya peningkatan kapasitasnya.||tambah oven kedua atau lembur, asal tambahan untungnya lebih besar dari biayanya.", "<b>Tahap 5: ulangi dari awal.</b> Kendala nggak ada akhirnya. Setelah kapasitas mesin 2 ditambah, kendala bisa <b>bergeser ke mesin lain</b>, atau bahkan <b>keluar</b> menjadi kendala eksternal karena kapasitas sudah melebihi yang bisa diserap pasar. Maka mulai lagi dari langkah pertama.||antrean terpanjang pindah ke kasir lain begitu kasir yang tadinya macet ditambah."]
});

"6.1":{"c":"Latar Belakang","r":[{"t":"Kegunaan sistem informasi akuntansi manajemen","k":[{"t":"Memberi informasi untuk pengambilan keputusan manajemen."},{"t":"Tidak semua informasi biaya dapat dipakai."}]}],"l":[{"t":"Masalah","k":[{"t":"Informasi biaya yang sudah terjadi (sunk costs) bisa membuat keputusan salah."},{"t":"Contoh: tiket film yang sudah dibeli itu sunk cost; yang dihitung hanya sisa waktu lebih baik dipakai apa.","x":1}]},{"t":"Kesimpulan","k":[{"t":"Penting membedakan biaya yang dapat dipakai dan yang tidak dapat dipakai."},{"t":"Tujuannya agar manajemen mengambil keputusan yang benar."}]}]},
"6.2":{"c":"Langkah-Langkah dalam Pengambilan Keputusan","r":[{"t":"Lima langkah","k":[{"t":"1. Menyadari dan mendefinisikan permasalahan."},{"t":"2. Mengidentifikasikan alternatif pemecahan masalah."},{"t":"3. Memperkirakan biaya dan pendapatan tiap alternatif, lalu membandingkan yang relevan."},{"t":"4. Menilai dampak faktor kualitatif terhadap tujuan perusahaan."},{"t":"5. Memilih alternatif paling menguntungkan yang tidak bertentangan dengan tujuan perusahaan."}]}],"l":[{"t":"Contoh: pesanan khusus","k":[{"t":"Masalah: perusahaan lesu, ada calon pembeli baru dengan harga di bawah normal, satu kali transaksi."},{"t":"Alternatif: terima atau tolak pesanan."},{"t":"Hitung tambahan pendapatan dan tambahan biaya."},{"t":"Faktor kualitatif: apakah harga khusus merusak harga normal."},{"t":"Terima jika tambahan pendapatan lebih besar dari tambahan biaya dan tidak merusak harga normal."}]}]},
"6.3":{"c":"Konsep-Konsep Biaya dalam Pengambilan Keputusan Jangka Pendek","r":[{"t":"Sunk costs (6.3.1)","k":[{"t":"Biaya yang sudah terjadi, tidak relevan."}]},{"t":"Opportunity costs (6.3.2)","k":[{"t":"Kesempatan yang hilang karena memilih alternatif tertentu."}]}],"l":[{"t":"Relevant costs (6.3.3)","k":[{"t":"Biaya yang dapat dipakai untuk keputusan."},{"t":"Belum terjadi dan berbeda untuk tiap alternatif."}]}]},
"6.3.1":{"c":"Sunk Costs","r":[{"t":"Pengertian","k":[{"t":"Biaya yang sudah terjadi atau sudah dikeluarkan."},{"t":"Uang yang dikeluarkan tidak dapat ditarik kembali."},{"t":"Hampir semua biaya di laporan laba-rugi yang sudah dibayar adalah sunk cost."},{"t":"Tidak relevan dan seharusnya tidak dipakai untuk keputusan."}]},{"t":"Sunk cost phenomenon","k":[{"t":"Manajemen justru memperhitungkan sunk cost dalam keputusan."},{"t":"Contoh: pesawat concorde; sudah jelas tidak menguntungkan tetapi pemerintah Inggris dan Perancis tetap menanamkan uang karena sudah banyak berinvestasi."},{"t":"Menurut psikologi: karena perusahaan tidak ingin membuang-buang uang.","x":1}]}],"l":[{"t":"Contoh: persediaan","k":[{"t":"Persediaan bahan mentah, barang dalam proses, dan barang jadi."},{"t":"Biaya produksi yang membentuk nilainya sudah dikeluarkan, jadi sunk cost."}]},{"t":"Implikasi","k":[{"t":"Biaya produksi tidak relevan untuk keputusan, termasuk penentuan harga."},{"t":"Barang yang sudah diproduksi: harga ditentukan oleh konsumen."},{"t":"Jual ke konsumen yang mau membayar lebih tinggi, meski masih di bawah biaya per unit."},{"t":"Contoh: baju biaya per unit Rp100.000 lebih baik dijual Rp80.000 daripada tidak laku.","x":1}]}]},
"6.3.2":{"c":"Opportunity Costs","r":[{"t":"Pengertian","k":[{"t":"Kesempatan yang hilang karena memilih satu alternatif dibanding alternatif lain."},{"t":"Wujudnya: pendapatan, marjin kontribusi, atau profit yang hilang."}]},{"t":"Contoh PT XYZ","k":[{"t":"Kapasitas penuh, ada pembeli baru (pesanan A) dengan marjin kontribusi Rp30.000.000."},{"t":"Harus mengorbankan pesanan B yang selama ini dilayani, marjin kontribusi Rp20.000.000."},{"t":"Opportunity cost memenuhi pesanan A = Rp20.000.000."}]}],"l":[{"t":"Kapan diperhitungkan","k":[{"t":"Terutama bila perusahaan memiliki keterbatasan (shortage) sumber daya."},{"t":"Contoh sumber daya: kapasitas mesin, kapasitas orang, jumlah bahan mentah."},{"t":"Contoh: dua tawaran kerja lepas di jam yang sama, A Rp30 juta dan B Rp20 juta; ambil A kehilangan Rp20 juta.","x":1}]}]},
"6.3.3":{"c":"Relevant Costs","r":[{"t":"Pengertian","k":[{"t":"Biaya yang dapat dipakai sebagai informasi pengambilan keputusan."},{"t":"Harus memenuhi dua persyaratan."}]},{"t":"Dua syarat","k":[{"t":"1. Belum terjadi dan baru terjadi bila keputusan dilaksanakan.","k":[{"t":"Sunk costs tidak dapat dipakai."}]},{"t":"2. Berbeda untuk setiap alternatif.","k":[{"t":"Walau belum dikeluarkan, bila biayanya sama di tiap alternatif, tidak relevan."}]}]}],"l":[{"t":"Contoh: kapasitas 100.000 unit, terpakai 80.000, tambahan 10.000 unit","k":[{"t":"Biaya variabel relevan.","k":[{"t":"Tidak muncul bila tidak memproduksi tambahan 10.000 unit."},{"t":"Nilainya berbeda untuk keputusan yang berbeda."}]},{"t":"Biaya tetap tidak relevan.","k":[{"t":"Produksi 80.000 atau 90.000 unit, total biaya tetap sama."}]},{"t":"Contoh: gaji pegawai tetap sama berapa pun unit yang diproduksi, tetapi bahan baku tambahan jelas menambah biaya.","x":1}]}]},
"6.4":{"c":"Penerapan Konsep Biaya Relevan dalam Situasi Tertentu","r":[{"t":"Pesanan khusus (6.4.1)","k":[{"t":"Terima pesanan dengan harga di bawah harga reguler?"}]},{"t":"Make or buy (6.4.2)","k":[{"t":"Produksi komponen sendiri atau beli dari pemasok?"}]}],"l":[{"t":"Keep or drop (6.4.3)","k":[{"t":"Pertahankan atau hentikan produk yang merugi?"}]},{"t":"Sell or process further (6.4.4)","k":[{"t":"Jual langsung atau proses lebih lanjut joint product?"}]},{"t":"Prinsip bersama","k":[{"t":"Bandingkan hanya biaya dan pendapatan relevan antar alternatif."}]}]},
"6.4.1":{"c":"Pesanan Khusus (Special Order)","r":[{"t":"Situasi","k":[{"t":"Perusahaan berproduksi di bawah kapasitas."},{"t":"Calon pembeli meminta harga di bawah harga reguler."}]},{"t":"Soal PT Serasi Selaras","k":[{"t":"Kapasitas 100.000 jam mesin, terpakai 60.000."},{"t":"Pesanan 5.000 kursi, butuh 10.000 jam mesin (2 jam per kursi)."},{"t":"Bahan Rp20.000, buruh 15 menit x Rp16.000 per jam, overhead variabel Rp6.000 per jam mesin."},{"t":"Overhead tetap Rp8.000 per jam mesin, harga normal Rp60.000."}]},{"t":"Jawaban 1: kapasitas longgar, tawaran Rp42.000","k":[{"t":"Biaya tetap tidak relevan."},{"t":"Biaya relevan = variabel: 20.000 + 4.000 + 12.000 = Rp36.000 per kursi."},{"t":"Pendapatan relevan Rp42.000 lebih besar, jadi pesanan diterima."},{"t":"Marjin kontribusi Rp6.000 per kursi, total Rp30.000.000."}]}],"l":[{"t":"Jawaban 2: kapasitas penuh","k":[{"t":"Perlu tambahan kapasitas, biaya tetap tambahan menjadi relevan."},{"t":"Alternatif: korbankan penjualan reguler."},{"t":"Bandingkan marjin kontribusi pesanan dengan yang dikorbankan, karena total biaya tetap tidak berubah."},{"t":"Marjin kontribusi reguler lebih besar, maka pesanan ditolak."}]},{"t":"Jawaban 3: terpakai 95.000 jam mesin","k":[{"t":"Kapasitas menganggur 5.000 jam, kebutuhan 10.000 jam."},{"t":"Yang diperoleh: (42.000 - 36.000) x 5.000 = Rp30.000.000."},{"t":"Yang dikorbankan: (60.000 - 36.000) x 2.500 = Rp60.000.000."},{"t":"Pesanan ditolak."}]},{"t":"Faktor kualitatif","k":[{"t":"Apakah transaksi menghalangi tujuan stratejik."},{"t":"Apakah pesanan khusus merusak harga reguler; bila ya, tetap ditolak walau menguntungkan."}]}]},
"6.4.2":{"c":"Membuat Sendiri atau Membeli dari Luar (Make or Buy)","r":[{"t":"Situasi","k":[{"t":"Komponen biasanya dibuat sendiri."},{"t":"Pemasok luar menawarkan harga lebih murah."},{"t":"Keputusan: produksi sendiri atau beli dari pemasok."}]},{"t":"Soal PT Indah Abadi (pisau kipas angin)","k":[{"t":"Bahan Rp10.000 per pisau, buruh Rp6.000 per jam, overhead variabel Rp4.000 per jam, 10 menit per pisau."},{"t":"Sewa mesin Rp100.000.000 per tahun, dapat dibatalkan."},{"t":"Penyusutan ruang pabrik Rp40.000.000 per tahun, ruangan menganggur bila berhenti."},{"t":"Produksi 20.000 pisau per tahun, pemasok Rp17.000."}]}],"l":[{"t":"Jawaban","k":[{"t":"Biaya variabel relevan: Rp11.000 per pisau."},{"t":"Biaya tetap relevan hanya bila dapat dihilangkan.","k":[{"t":"Sewa mesin relevan: Rp100.000.000 / 20.000 = Rp5.000."},{"t":"Penyusutan ruang pabrik tidak relevan."}]},{"t":"Total relevan Rp16.000 lebih murah dari Rp17.000, jadi produksi sendiri."},{"t":"Contoh: berhenti langganan gym menghilangkan iuran (relevan), cicilan rumah tetap jalan (tidak relevan).","x":1}]},{"t":"Faktor kualitatif","k":[{"t":"Kualitas bahan baku atau komponen."},{"t":"Kontinuitas pasokan."},{"t":"Ketepatan waktu kedatangan pasokan."},{"t":"Bila faktor kualitatif tidak mendukung, tetap produksi sendiri walau pasokan luar lebih murah."}]}]},
"6.4.3":{"c":"Mempertahankan atau Menghentikan (Keep or Drop)","r":[{"t":"Situasi","k":[{"t":"Ada produk yang tidak menguntungkan."},{"t":"Keputusan: pertahankan atau hentikan penjualan dan produksi."},{"t":"Berlaku juga untuk evaluasi cabang, pelanggan, dan sebagainya."}]},{"t":"Soal PT Bagus Hijau","k":[{"t":"Laba neto: A Rp40 juta, B Rp35 juta, C rugi Rp6 juta, total Rp69 juta."},{"t":"Marjin kontribusi C Rp137 juta; biaya tetap langsung C Rp85 juta; biaya tetap bersama C Rp58 juta."}]},{"t":"Biaya relevan","k":[{"t":"Semua biaya variabel relevan (menjadi nol bila produk dihentikan)."},{"t":"Biaya tetap langsung: khusus satu produk, lebih mudah dihilangkan; relevan bila dapat dihilangkan."},{"t":"Biaya tetap bersama: dipakai semua produk, biasanya tidak hilang; tidak relevan."}]}],"l":[{"t":"Hasil bila C dihentikan","k":[{"t":"Asumsi: biaya tetap langsung hilang, biaya tetap bersama tidak."},{"t":"Marjin kontribusi total Rp166 juta."},{"t":"Laba neto turun dari Rp69 juta menjadi Rp17 juta."},{"t":"Keputusan menghentikan C salah."},{"t":"Contoh: kehilangan marjin Rp137 juta, hemat hanya Rp85 juta, selisih Rp52 juta.","x":1}]},{"t":"Faktor kualitatif","k":[{"t":"Moral pegawai bila pegawai diberhentikan atau divisi ditutup."}]}]},
"6.4.4":{"c":"Langsung Dijual atau Diproses Lebih Lanjut (Sell or Process Further)","r":[{"t":"Situasi","k":[{"t":"Terkait perusahaan yang memproduksi joint product."},{"t":"Joint product berasal dari satu proses produksi yang menghasilkan beberapa jenis produk."}]}],"l":[{"t":"Biaya relevan","k":[{"t":"Alokasi joint costs bukan biaya relevan."},{"t":"Joint cost merupakan sunk cost."},{"t":"Keputusan dijual atau diproses lebih lanjut dibuat setelah joint process selesai."},{"t":"Contoh: biaya memelihara dan memotong sapi sudah keluar sebelum memutuskan kulit dijual mentah atau disamak.","x":1}]},{"t":"Keputusan","k":[{"t":"Bandingkan tambahan pendapatan dengan tambahan biaya bila diproses lebih lanjut."},{"t":"Tambahan pendapatan lebih besar: proses lebih lanjut."}]},{"t":"Contoh PT Kimia Rumit","k":[{"t":"AAA diproses menjadi AAA1: tambahan pendapatan Rp3.000/kg vs tambahan biaya Rp2.000/kg."},{"t":"Proses lebih lanjut, untung tambahan Rp1.000/kg.","x":1}]}]},"6.4.5":{"c": "Penentuan Bauran Produk dengan Kendala", "r": [{"t": "Situasi", "k": [{"t": "Kapasitas produksi terbatas."}, {"t": "Tidak semua permintaan dapat dipenuhi."}, {"t": "Contoh: cuma punya 1 jam masak, pilih menu yang untung per menitnya paling besar.", "x": 1}]}, {"t": "Dasar prioritas", "k": [{"t": "Marjin kontribusi per menit kendala (constraint) tertinggi."}, {"t": "Biaya tetap tidak relevan: bauran apa pun biaya tetapnya sama."}, {"t": "Memaksimalkan marjin kontribusi = memaksimalkan laba."}]}, {"t": "Langkah", "k": [{"t": "Hitung marjin kontribusi per unit kendala."}, {"t": "Urutkan dari tertinggi."}, {"t": "Produksi sampai permintaan terpenuhi, lanjut sampai kapasitas habis."}]}], "l": [{"t": "Contoh PT Cahaya Gelap", "k": [{"t": "Kapasitas 3.000 jam = 18.000 menit per tahun."}, {"t": "Marjin kontribusi per unit: A1 Rp5.000, A2 Rp4.000, A3 Rp3.500."}, {"t": "Waktu per unit: A1 10 menit, A2 4 menit, A3 2 menit."}, {"t": "Marjin kontribusi per menit: A1 Rp500, A2 Rp1.000, A3 Rp1.750."}]}, {"t": "Temuan", "k": [{"t": "A1 marjin per unit tertinggi, tapi per menit terendah."}, {"t": "Contoh: baju mewah untung besar tapi dikerjakan seharian, kalah dibanding kemeja cepat.", "x": 1}, {"t": "Prioritas: A3, lalu A2, lalu A1."}]}, {"t": "Hasil bauran", "k": [{"t": "A3: 3.000 unit, 6.000 menit, Rp10.500.000."}, {"t": "A2: 2.000 unit, 8.000 menit, Rp8.000.000."}, {"t": "A1: sisa 4.000 menit = 400 unit, Rp2.000.000."}, {"t": "Total marjin kontribusi Rp20.500.000.", "x": 1}]}]},"6.5":{"c": "Pengambilan Keputusan Jangka Pendek dengan Activity Based Costing", "r": [{"t": "Latar belakang", "k": [{"t": "Tarif overhead tradisional kurang akurat."}, {"t": "ABC diharapkan membuat biaya relevan lebih akurat."}]}, {"t": "Sumber daya fleksibel", "k": [{"t": "Diperoleh sesuai kebutuhan."}, {"t": "Aktivitas turun atau hilang, sumber daya ikut turun atau hilang."}, {"t": "Biayanya relevan."}, {"t": "Contoh: tenaga harian, tidak ada pesanan tidak dibayar.", "x": 1}]}, {"t": "Sumber daya terikat (committed)", "k": [{"t": "Diperoleh sebelum aktivitas, sudah ada komitmen."}, {"t": "Ada kegiatan atau tidak, tetap ada dan sulit dihilangkan."}, {"t": "Tidak relevan selama ada kapasitas menganggur."}, {"t": "Contoh: gaji karyawan tetap jalan terus.", "x": 1}]}, {"t": "Kapasitas", "k": [{"t": "Kebutuhan lebih kecil dari tersedia: kapasitas menganggur."}, {"t": "Kebutuhan melebihi tersedia: tambah sumber daya terikat, biayanya relevan."}, {"t": "Contoh: paket data dijual per paket, bukan per MB.", "x": 1}]}], "l": [{"t": "Soal PT Jelas Cermat", "k": [{"t": "Pesanan 10.000 kacamata dari PT Opportunis, Rp325.000 per kacamata."}, {"t": "Bukan pesanan reguler, satu kali pemesanan."}, {"t": "Kelipatan penambahan: set-up 25 jam, inspeksi 2.000 jam (Rp20.000.000), mesin sewa Rp20.000 per jam mesin dengan tambahan 2.500 jam mesin."}]}, {"t": "Langkah 1: biaya fleksibel", "k": [{"t": "Bahan mentah langsung Rp120.000.000."}, {"t": "Buruh langsung Rp100.000.000."}, {"t": "Set-up Rp9.600.000, inspeksi Rp6.400.000, pembuatan kacamata Rp18.000.000."}, {"t": "Total Rp254.000.000.", "x": 1}]}, {"t": "Langkah 2: tambahan committed", "k": [{"t": "Set-up: menganggur 45 jam, butuh 80 jam, tambah 50 jam = Rp20.000.000."}, {"t": "Inspeksi: tambah 2.000 jam = Rp20.000.000."}, {"t": "Pembuatan kacamata: kapasitas cukup, Rp0."}, {"t": "Total Rp40.000.000.", "x": 1}]}, {"t": "Keputusan", "k": [{"t": "Biaya relevan Rp294.000.000 = Rp294.000 per kacamata."}, {"t": "Lebih rendah dari harga Rp325.000, pesanan diterima."}, {"t": "Tambahan laba Rp31.000 per kacamata, Rp310.000.000 total.", "x": 1}]}]},"6.6":{"c": "Teori Kendala (Theory of Constraint)", "r": [{"t": "Jenis kendala", "k": [{"t": "Internal: dari dalam perusahaan, misalnya kapasitas terbatas."}, {"t": "Eksternal: dari luar perusahaan, misalnya pasokan bahan baku kurang atau permintaan pasar rendah."}, {"t": "Contoh: jalan tol macet di satu gerbang, gerbang yang sempit menentukan arus.", "x": 1}]}, {"t": "Throughput", "k": [{"t": "Penjualan dikurangi biaya bahan mentah langsung."}, {"t": "Hanya bahan mentah langsung yang dianggap variabel, biaya lain dianggap tetap."}, {"t": "Memaksimalkan throughput = memaksimalkan laba."}, {"t": "Contoh: kue Rp50.000, bahan Rp20.000, throughput Rp30.000.", "x": 1}]}, {"t": "Lima langkah", "k": [{"t": "1. Tentukan kendala."}, {"t": "2. Manfaatkan (exploit) kendala semaksimal mungkin."}, {"t": "3. Sesuaikan keputusan lain dengan keputusan kendala."}, {"t": "4. Tingkatkan hal yang terkendala."}, {"t": "5. Kendala terpecahkan: kembali ke langkah 1."}]}], "l": [{"t": "Soal PT Cemara Tinggi", "k": [{"t": "Produk ABC, DEF, GHI melalui lima mesin."}, {"t": "Kapasitas: M1 15.000, M2 12.000, M3 8.000, M4 15.000, M5 12.000 menit."}, {"t": "Catatan: permintaan di tabel modul kemungkinan salah ketik, hitungan memakai 800, 500, 300 unit."}]}, {"t": "Tahap 1: tentukan kendala", "k": [{"t": "Bandingkan waktu dibutuhkan dengan kapasitas tiap mesin."}, {"t": "Mesin 2: butuh 13.800 menit, kapasitas 12.000."}, {"t": "Kendala internal pada mesin 2."}, {"t": "Contoh: kasir dengan antrean terpanjang menentukan kecepatan semua pelanggan.", "x": 1}]}, {"t": "Tahap 2: manfaatkan kendala", "k": [{"t": "Throughput per menit M2: ABC 333,33; DEF 833,33; GHI 1.750."}, {"t": "Prioritas GHI, DEF, ABC."}, {"t": "GHI 300 unit (1.200 menit), DEF 500 unit (3.000 menit), sisa 7.800 menit untuk ABC = 650 unit."}, {"t": "Total throughput Rp7.200.000.", "x": 1}]}, {"t": "Tahap 3: drum-buffer-rope", "k": [{"t": "Keputusan mesin 1, 3, 4, 5 mengacu pada mesin 2."}, {"t": "Mesin 2 menjadi drum (irama) bagi mesin 3, 4, 5."}, {"t": "Mesin 2 menjadi rope (tali) pembatas produksi mesin 1."}, {"t": "Contoh: konvoi mobil mengikuti mobil paling lambat.", "x": 1}]}, {"t": "Tahap 4 dan 5", "k": [{"t": "Tingkatkan kapasitas M2: lembur, outsourcing, atau mesin baru."}, {"t": "Selama tambahan throughput lebih besar dari tambahan biaya."}, {"t": "Kendala bisa bergeser ke mesin lain atau menjadi kendala eksternal, ulangi dari langkah 1."}]}]}
});
M[0].bq[5]=[
["Mengapa tidak semua informasi biaya dapat dipakai untuk pengambilan keputusan?",["Karena biaya yang sudah terjadi (sunk costs) dapat membuat keputusan menjadi salah","Karena biaya variabel tidak pernah dicatat","Karena informasi biaya tidak pernah akurat","Karena biaya hanya dipakai untuk laporan pajak"],0,"Jika informasi biaya yang sudah terjadi (sunk costs) dipakai dalam keputusan, keputusan bisa salah. Karena itu perlu dibedakan biaya yang dapat dipakai dan yang tidak."],
["Langkah pertama dari lima langkah pengambilan keputusan adalah...",["Memilih alternatif yang paling menguntungkan","Menilai dampak faktor kualitatif","Menyadari adanya permasalahan dan mendefinisikan permasalahan tersebut","Membandingkan biaya dan pendapatan relevan"],2,"Urutan: menyadari dan mendefinisikan masalah, mengidentifikasi alternatif, memperkirakan dan membandingkan biaya dan pendapatan relevan, menilai faktor kualitatif, lalu memilih alternatif yang paling menguntungkan dan tidak bertentangan dengan tujuan perusahaan."],
["Pada langkah ketiga, yang diperbandingkan untuk setiap alternatif adalah...",["Seluruh biaya historis perusahaan","Biaya dan pendapatan relevan","Hanya biaya tetap","Hanya pendapatan"],1,"Langkah ketiga adalah mengidentifikasikan perkiraan biaya dan pendapatan setiap alternatif dan memperbandingkan biaya dan pendapatan relevan."],
["Pada contoh pesanan khusus dalam lima langkah, pesanan diterima apabila...",["Harga lebih rendah dari harga normal","Tambahan pendapatan lebih besar dari tambahan biaya dan tidak merusak harga normal perusahaan","Perusahaan beroperasi dalam kapasitas penuh","Pembeli adalah pelanggan lama"],1,"Pesanan diterima jika tambahan pendapatan melebihi tambahan biaya, serta tidak merusak harga normal perusahaan."],
["Biaya yang sudah terjadi atau sudah dikeluarkan perusahaan dan tidak dapat ditarik kembali disebut...",["Opportunity costs","Relevant costs","Sunk costs","Biaya variabel"],2,"Itulah sunk costs. Biaya ini tidak relevan dan seharusnya tidak dipakai dalam pengambilan keputusan."],
["Tindakan manajemen yang tetap memperhitungkan sunk cost dalam pengambilan keputusan disebut...",["Opportunity cost principle","Sunk cost phenomenon","Relevant cost analysis","Time equation"],1,"Contohnya pesawat concorde: pemerintah Inggris dan Perancis tetap menanamkan uang karena sudah banyak berinvestasi."],
["Biaya produksi pada persediaan barang jadi yang sudah selesai diproduksi, dalam penentuan harga jual, merupakan...",["Biaya relevan","Biaya yang berbeda untuk tiap alternatif","Opportunity cost","Sunk cost sehingga tidak relevan"],3,"Biaya produksi sudah dikeluarkan, sehingga sunk cost. Harga sepenuhnya ditentukan konsumen, dan perusahaan sebaiknya menjual ke yang mau membayar lebih tinggi walau masih di bawah biaya per unit."],
["Kesempatan yang hilang karena perusahaan memilih suatu alternatif dibandingkan alternatif lainnya disebut...",["Sunk cost","Opportunity cost","Biaya tetap bersama","Biaya variabel"],1,"Opportunity costs dapat berupa pendapatan, marjin kontribusi, atau profit yang hilang."],
["PT XYZ berkapasitas penuh. Pesanan A memberi marjin kontribusi Rp30.000.000, namun untuk memenuhinya harus mengorbankan pesanan B dengan marjin kontribusi Rp20.000.000. Opportunity cost memenuhi pesanan A adalah...",["Rp10.000.000","Rp30.000.000","Rp50.000.000","Rp20.000.000"],3,"Opportunity cost adalah marjin kontribusi yang dikorbankan, yaitu pesanan B sebesar Rp20.000.000."],
["Opportunity costs terutama harus diperhitungkan ketika perusahaan...",["Memiliki keterbatasan (shortage) sumber daya seperti kapasitas mesin atau bahan mentah","Memiliki kapasitas menganggur besar","Tidak memiliki biaya tetap","Hanya memiliki satu produk"],0,"Keterbatasan sumber daya membuat memilih satu alternatif berarti mengorbankan alternatif lain."],
["Dua persyaratan agar suatu biaya merupakan biaya relevan adalah...",["Sudah terjadi dan sama untuk semua alternatif","Belum terjadi dan berbeda untuk setiap alternatif","Biaya tetap dan sudah dibayar","Biaya langsung dan historis"],1,"Biaya harus belum terjadi (baru terjadi bila keputusan dilaksanakan) dan harus berbeda untuk setiap alternatif."],
["Kapasitas 100.000 unit, terpakai 80.000 unit, ada tambahan produksi 10.000 unit. Biaya yang relevan adalah...",["Biaya tetap","Biaya variabel","Biaya tetap dan biaya variabel","Tidak ada biaya yang relevan"],1,"Biaya variabel muncul hanya jika tambahan diproduksi. Total biaya tetap sama pada 80.000 maupun 90.000 unit, sehingga tidak relevan."],
["Situasi pesanan khusus (special order) umumnya muncul ketika...",["Perusahaan berproduksi dengan kapasitas di bawah yang dimiliki dan ada pembeli yang meminta harga di bawah harga reguler","Perusahaan kekurangan bahan baku","Pemasok luar menawarkan harga murah","Produk mengalami kerugian"],0,"Pesanan khusus adalah permintaan dengan harga jual di bawah harga reguler saat perusahaan memproduksi di bawah kapasitasnya."],
["PT Serasi Selaras: bahan Rp20.000, buruh langsung 15 menit dengan tarif Rp16.000 per jam, overhead variabel Rp6.000 per jam mesin (2 jam mesin per kursi). Biaya relevan per kursi adalah...",["Rp20.000","Rp36.000","Rp52.000","Rp44.000"],1,"Rp20.000 + (15/60 x Rp16.000 = Rp4.000) + (2 x Rp6.000 = Rp12.000) = Rp36.000. Overhead tetap tidak relevan."],
["Dengan tawaran Rp42.000 per kursi dan kapasitas masih longgar, total marjin kontribusi dari 5.000 kursi adalah...",["Rp30.000.000","Rp210.000.000","Rp180.000.000","Rp60.000.000"],0,"(Rp42.000 - Rp36.000) x 5.000 kursi = Rp30.000.000. Pesanan diterima."],
["Mengapa biaya overhead tetap tidak relevan pada pesanan khusus ketika kapasitas masih longgar?",["Karena nilainya selalu nol","Karena total biaya overhead tetap sama pada 60.000 maupun 100.000 jam mesin","Karena sudah dialokasikan ke produk lain","Karena dibebankan berdasarkan jam buruh"],1,"Karena nilainya sama pada kedua keadaan, biaya tersebut tidak berbeda antar alternatif."],
["Ketika perusahaan sudah berproduksi dalam kapasitas penuh, alternatif menerima pesanan khusus berarti...",["Menambah biaya tetap menjadi nol","Mengorbankan penjualan yang ada sekarang, sehingga yang dibandingkan adalah marjin kontribusi","Menurunkan harga reguler","Menolak semua penjualan reguler"],1,"Biaya tetap total tidak berubah, jadi yang dibandingkan marjin kontribusi pesanan dengan marjin kontribusi yang dikorbankan."],
["Terpakai 95.000 jam mesin. Pesanan 5.000 kursi butuh 10.000 jam mesin. Marjin kontribusi yang dikorbankan sebesar (Rp60.000 - Rp36.000) x 2.500 kursi adalah...",["Rp30.000.000","Rp60.000.000","Rp120.000.000","Rp6.000.000"],1,"Rp24.000 x 2.500 = Rp60.000.000. Lebih besar dari Rp30.000.000 yang diperoleh, sehingga pesanan ditolak."],
["Faktor kualitatif yang disebut modul untuk pesanan khusus adalah...",["Apakah pesanan khusus merusak harga reguler perusahaan","Warna produk","Jumlah karyawan","Lokasi pabrik"],0,"Jika pesanan khusus membuat harga reguler rusak, pesanan tetap harus ditolak walau secara kuantitatif menguntungkan."],
["Pada keputusan make or buy, biaya yang pasti relevan karena berbeda antara produksi sendiri dan beli dari luar adalah...",["Biaya variabel","Penyusutan gedung yang menganggur","Biaya historis","Seluruh biaya tetap bersama"],0,"Biaya variabel muncul jika produksi sendiri dan hilang jika membeli dari luar. Biaya tetap relevan hanya bila dapat dihilangkan."],
["PT Indah Abadi: sewa mesin Rp100.000.000 per tahun dapat dibatalkan dan produksi 20.000 pisau. Sewa mesin per pisau yang relevan adalah...",["Rp2.000","Rp5.000","Rp10.000","Rp500"],1,"Rp100.000.000 / 20.000 pisau = Rp5.000 per pisau."],
["Mengapa penyusutan ruangan pabrik Rp40.000.000 pada contoh make or buy bukan biaya relevan?",["Karena ruangan menganggur dan tidak dapat dipakai untuk apa pun, sehingga biayanya tetap sama","Karena nilainya terlalu kecil","Karena ruangan dijual","Karena merupakan biaya variabel"],0,"Penyusutan tetap ada baik membuat sendiri maupun membeli dari luar."],
["Biaya relevan membuat sendiri Rp16.000 per pisau sedangkan tawaran pemasok Rp17.000. Keputusan menurut hitungan kuantitatif adalah...",["Membeli dari pemasok luar","Membuat sendiri","Menghentikan produksi kipas angin","Tidak dapat diputuskan"],1,"Biaya relevan membuat sendiri lebih murah daripada tawaran pemasok."],
["Yang BUKAN faktor kualitatif pada keputusan make or buy menurut modul adalah...",["Kualitas bahan baku atau komponen","Kontinuitas pasokan","Ketepatan waktu kedatangan pasokan","Besarnya penyusutan gedung yang sudah terjadi"],3,"Faktor kualitatif: kualitas, kontinuitas pasokan, dan ketepatan waktu kedatangan pasokan."],

"7.1":["Analisis CVP adalah analisis yang <b>sederhana</b> dan seharusnya dapat diterapkan dalam proses perencanaan perusahaan. Analisis ini sudah sering dijelaskan di kelas akuntansi manajemen.","Namun demikian, analisis ini masih <b>jarang dipergunakan</b> dalam proses perencanaan perusahaan. Modul ini menjelaskan bagaimana cara menerapkan konsep CVP dalam kegiatan operasional perusahaan."],
"7.2":["Analisis <i>Cost Volume Profit</i> (CVP) atau analisis <b>biaya volume laba</b> adalah analisis yang dilakukan dalam tahap <b>perencanaan</b> untuk menentukan berapa <b>volume barang yang harus dijual</b> untuk mencapai suatu tingkat laba tertentu.","Untuk melakukan analisis CVP, semua biaya yang dikeluarkan perusahaan harus dibedakan menjadi <b>biaya tetap</b> dan <b>biaya variabel</b>. Penggolongan <b>biaya periode</b> dan <b>biaya produk</b> tidak relevan untuk analisis ini.","Dalam konteks CVP:","- <b>Biaya variabel:</b> total biaya yang akan <b>meningkat atau menurun secara proporsional</b> sesuai jumlah unit barang yang dijual.","- <b>Biaya tetap:</b> total biaya yang <b>tidak berubah</b>, berapa pun jumlah barang yang dijual, selama masih berada dalam kapasitas tertentu.","Karena pengelompokan tersebut, format laporan laba-rugi yang dibutuhkan juga berbeda. Biaya dibedakan menjadi biaya tetap dan biaya variabel, bukan biaya periode dan biaya produk. Laporan ini dinamakan laporan laba rugi dengan format <b><i>direct costing</i></b> atau <b><i>variable costing</i></b>. Bentuknya:",F71],
"7.3":["Dari format <i>direct costing</i> terlihat bahwa <b>tiga unsur pertama</b> (penjualan, biaya variabel, dan marjin kontribusi) semuanya bersifat <b>variabel</b>. Artinya, makin banyak unit terjual, makin besar penjualan, total biaya variabel, dan konsekuensinya total marjin kontribusi, dan sebaliknya.","Karena itu, bila perusahaan memaksimalkan <b>marjin kontribusi</b>, laba perusahaan otomatis ikut maksimal, sebab biaya tetap tidak berubah.","Jika perusahaan hanya menjual sejumlah unit tertentu sehingga <b>total marjin kontribusi sama dengan total biaya tetap</b>, perusahaan mencapai <b>titik impas (<i>break even point</i>)</b>.","<b>Rumus titik impas:</b>","- Titik Impas (unit) = Total Biaya Tetap / (Harga Jual per Unit \u2212 Biaya Variabel per Unit)","Perusahaan tentu tidak puas hanya dengan titik impas, melainkan ingin <b>keuntungan</b>. Target keuntungan biasanya bersifat absolut dan berperilaku seperti biaya tetap, misalnya Rp500.000.000 atau Rp1.000.000.000. Rumus unit yang harus dijual untuk mendapatkan keuntungan tertentu:","- Unit Terjual untuk Keuntungan Tertentu = (Total Biaya Tetap + Target Keuntungan) / (Harga Jual per Unit \u2212 Biaya Variabel per Unit)","Jadi untuk mendapatkan keuntungan tertentu, jumlah unit yang harus dijual tidak hanya menutup biaya tetap, tetapi juga mencapai tingkat keuntungan yang diinginkan.","Bila ada <b>pajak</b>, rumusnya dimodifikasi:","- Unit Terjual untuk Keuntungan Tertentu = (Total Biaya Tetap + Target Keuntungan Sebelum Pajak) / (Harga Jual per Unit \u2212 Biaya Variabel per Unit)","- Tingkat Keuntungan Sebelum Pajak = Tingkat Keuntungan Setelah Pajak / (1 \u2212 Tingkat Pajak)","Jika yang diinginkan adalah target penjualan <b>dalam rupiah</b>, bukan unit:","- Target Rupiah Terjual = (Total Biaya Tetap + Target Keuntungan) / Rasio Marjin Kontribusi","- Rasio Marjin Kontribusi = (Harga Jual per Unit \u2212 Biaya Variabel per Unit) / Harga Jual per Unit"],
"7.4":["<b>Contoh soal.</b> PT X sedang melakukan perencanaan laba. Informasi yang dikumpulkan:","- Harga jual per unit Rp500","- Biaya variabel per unit Rp250","- Total biaya tetap Rp10.000.000","- Total target keuntungan setelah pajak Rp15.000.000","- Tarif pajak 25%","Dengan rumus di atas, <b>titik impas</b> = Rp10.000.000 / (Rp500 \u2212 Rp250) = <b>40.000 unit</b>.","Untuk menghitung unit terjual guna mencapai target keuntungan, perusahaan harus lebih dulu menghitung keuntungan <b>sebelum pajak</b>: Rp15.000.000 / (1 \u2212 25%) = <b>Rp20.000.000</b>. Angka ini dipakai untuk menghitung target unit. Modul menuliskan hasilnya: Rp20.000.000 / (Rp500 \u2212 Rp250) = <b>80.000 unit</b>.",T72,"<b>Catatan:</b> pembagian Rp20.000.000 dengan Rp250 hanya menghitung unit <b>di atas titik impas</b>, karena biaya tetap belum ikut. Dengan rumus 7.3 lengkap, (Rp10.000.000 + Rp20.000.000) / Rp250 = <b>120.000 unit</b>, yaitu 40.000 (titik impas) + 80.000. Untuk jawaban ujian, pakai rumus 7.3.","Angka target unit (di modul 80.000 unit) belum dapat langsung dijadikan target penjualan tahun depan. Ada dua hal yang harus dicek:","- <b>Kapasitas produksi:</b> apakah kapasitas perusahaan cukup untuk target unit tersebut. Jika kurang, asumsi CVP harus diperbaiki, misalnya menaikkan harga jual, menambah kapasitas produksi, atau <i>outsourcing</i>.","- <b>Permintaan pasar:</b> apakah pasar dapat menyerap target penjualan tersebut. Jika permintaan maksimal di pasar hanya 75.000 unit, asumsi awal harus diubah lagi, misalnya mengurangi biaya tetap atau menambah biaya iklan.","Angka yang dipakai sebagai target penjualan tahun depan adalah angka yang <b>sesuai dengan kapasitas produksi</b> dan <b>diperkirakan dapat diserap pasar</b>."],
"7.5":["Semua ilustrasi di atas mengasumsikan produk yang dihasilkan hanya <b>satu jenis</b>. Bagaimana jika perusahaan memproduksi lebih dari satu jenis produk, bahkan puluhan atau ratusan? Hal yang harus diperhatikan:","- <b>1. Fasilitas.</b> Apakah produk dibuat dengan kapasitas (fasilitas) yang sama? Jika satu produk dengan produk lain dihasilkan dari fasilitas yang berbeda, analisis CVP dapat dilakukan <b>terpisah</b> untuk masing-masing produk.","- <b>2. Marjin kontribusi per unit sama.</b> Jika dihasilkan dari fasilitas yang sama dan marjin kontribusi per unit sama, analisis CVP dapat dilakukan seolah-olah produk-produk itu <b>satu produk</b>.","- <b>3. Marjin kontribusi per unit berbeda.</b> Jika dari fasilitas yang sama tetapi marjin kontribusinya berbeda, bisa saja biaya tetap dialokasikan ke tiap produk lalu CVP dihitung terpisah. Namun cara ini <b>tidak disarankan</b>, karena sulit mengalokasikan biaya secara akurat ke masing-masing produk. Yang disarankan: memakai marjin kontribusi per unit tiap produk berdasarkan <b>target bauran penjualan</b>. Hasilnya adalah rata-rata tertimbang marjin kontribusi (<i>Weighted Average Contribution Margin</i>).","Contoh perhitungan <i>Weighted Average Contribution Margin</i>:",T71,"Setelah angka tersebut diperoleh, analisis CVP dilakukan dengan rumus yang sama. Misalkan total biaya tetap perusahaan Rp18.200.000: unit yang harus dijual = Rp18.200.000 / 910 = <b>20.000 unit</b>. Dari total itu, <b>12.000 unit (60%)</b> produk A, <b>6.000 unit (30%)</b> produk B, dan <b>2.000 unit</b> produk C. Modul menulis produk C sebagai 20%, padahal 2.000 / 20.000 = <b>10%</b>, sesuai proporsi 0,1 di tabel.","Bagaimana jika perusahaan memproduksi <b>puluhan atau ratusan produk</b>? Produk-produk dikelompokkan berdasarkan <b>kesamaan marjin kontribusi per unit</b>. Biasanya produk yang marjin kontribusinya sama berasal dari satu lini produk, walaupun tidak selalu. Jika marjin kontribusi per unit sama atau hampir sama, produk-produk tersebut dapat digabungkan dan dianggap satu jenis produk tersendiri. Dengan cara ini jumlah kelompok yang dipakai analisis CVP dapat dikurangi."],
"7.6":["Masalah tersulit dalam analisis CVP adalah <b>membagi semua biaya</b> perusahaan menjadi biaya tetap dan biaya variabel. Analisis CVP tidak mengenal jenis biaya lain, seperti biaya semi variabel dan <i>step costs</i>. Semua biaya harus masuk salah satu dari dua kelompok, padahal tidak semua biaya mudah diklasifikasikan. Ada dua kelompok yang sulit:","- <b>Kelompok pertama: <i>mixed costs</i>.</b> Contohnya biaya listrik, air, dan telepon. Biaya ini punya unsur biaya tetap dan biaya variabel, sehingga unsurnya harus <b>dipisahkan</b>. Caranya bisa dengan <i>high-low point method</i> atau metode statistik. Disarankan memakai <b>metode statistik</b>, karena <i>high-low point method</i> tidak menghasilkan angka pemisahan yang akurat.","- <b>Kelompok kedua: biaya yang memang tidak dapat dikelompokkan</b> sebagai biaya tetap atau variabel. Dalam CVP, biaya variabel adalah biaya yang total biayanya berubah secara proporsional dengan unit terjual. Jika angkanya berubah-ubah tetapi perubahan itu tidak proporsional dengan unit terjual, biaya tersebut bukan biaya variabel.","<b>Contoh toko roti:</b> dalam analisis CVP-nya, toko memperkirakan setiap hari Sabtu dan Minggu karyawan lembur dua jam. Biaya lembur naik-turun sesuai jam lembur, tetapi tidak ada jaminan setiap jam lembur menghasilkan penjualan roti yang sama. Karena itu biaya lembur <b>bukan biaya variabel</b>. Karena CVP hanya punya dua golongan biaya, biaya lembur dimasukkan ke <b>biaya tetap</b>. Jadi definisi biaya tetap dalam CVP adalah <b>semua biaya yang tidak dapat dikategorikan sebagai biaya variabel</b>.","Masalah lain: rumus CVP mengharuskan biaya variabel dinyatakan <b>per unit</b>, padahal tidak semua biaya mudah dinyatakan per unit. Misalnya, membuat roti membutuhkan bahan baku termasuk air. Biaya air adalah biaya variabel, karena makin banyak roti, makin banyak air, dan kenaikannya proporsional. Namun jika perusahaan ingin memperlakukan air sebagai biaya variabel, perusahaan harus tahu biaya air per unit roti. Bila jenis roti banyak, perhitungan biaya air per unit menjadi sulit. Jika perusahaan juga tidak punya informasi angka total biaya air untuk membuat roti, biaya air tersebut, meskipun sebenarnya bersifat variabel, terpaksa dimasukkan ke <b>biaya tetap</b>.","Dari penjelasan ini terlihat bahwa dalam analisis CVP banyak biaya dalam kelompok biaya tetap sebenarnya <b>bukan biaya tetap</b> seperti definisi di awal modul."],
"7.7":["<b>Soal PT Jaja Marja</b> mengelola <b>jalan tol</b> sepanjang <b>80 Km</b> di dalam kota, sehingga tarifnya tidak tergantung jarak. Untuk satu kali masuk, kendaraan <b>sedan</b> dikenai tarif <b>Rp8.000</b> dan <b>truk</b> <b>Rp10.000</b>.","Data biaya dan pendapatan:","- <b>Petugas tol:</b> 12 orang, gaji Rp2.000.000 per bulan.","- <b>Lembur:</b> pada jam sibuk dibutuhkan petugas tambahan. Diperkirakan setiap Senin sampai Jumat total lembur 10 jam per hari, upah lembur Rp20.000 per jam.","- <b>Direksi dan karyawan lain:</b> 30 orang, total gaji Rp120.000.000 (modul menulis per bulan; lihat catatan di 7.8).","- <b>Pemeliharaan jalan:</b> Rp4.000.000 per kilometer per tahun.","- <b>Penyusutan jalan:</b> Rp300.000.000 per tahun.","- <b>Listrik penerangan jalan:</b> 20.000 Kwh per bulan, Rp1.000 per Kwh.","- <b>Karcis:</b> biaya mencetak buku karcis Rp100 per lembar, dan setiap kendaraan yang masuk menerima satu lembar.","- <b>Administrasi dan umum:</b> Rp100.000.000 per tahun (seluruhnya biaya tetap).","- <b>Iklan:</b> 12 spot tersedia di pinggir jalan tol, sewa Rp20.000.000 per spot per tahun, diperkirakan 10 spot dapat disewakan. Biaya membangun papan iklan Rp3.000.000 per spot. Pajak ke pemerintah daerah Rp1.000.000 per spot, tidak peduli papan iklan laku atau tidak.","Semua data adalah perkiraan tahun 20X2, dengan komposisi 90% kendaraan sedan dan 10% truk.","<b>Pertanyaan:</b>","- 1. Jumlah kendaraan sedan dan truk yang harus melewati jalan tol agar perusahaan mencapai titik impas.","- 2. Jumlah kendaraan sedan dan truk agar perusahaan memperoleh keuntungan setelah pajak Rp50.400.000 per tahun (pajak 20%)."],
"7.8":["<b>Tahap pertama</b> analisis CVP adalah menentukan mana biaya yang <b>tetap</b> dan mana yang <b>variabel</b>. Di sini biaya variabel hanya satu, yaitu <b>biaya pencetakan karcis</b>, karena itu satu-satunya biaya yang meningkat secara proporsional dengan jumlah kendaraan yang masuk. Semua biaya lain adalah biaya tetap, dengan total Rp1.261.980.000.",T73,"<b>Catatan angka di modul:</b> (1) gaji direksi dan karyawan ditulis Rp120.000.000 <b>per bulan</b> di soal, tetapi tabel memakai Rp120.000.000 tanpa dikali 12; (2) biaya administrasi dan umum di soal Rp100.000.000, di tabel Rp99.980.000. Tabel dipakai karena totalnya konsisten dengan Rp1.261.980.000.","Karena perusahaan punya <b>dua jenis produk</b> dengan marjin kontribusi berbeda, langkah berikutnya menghitung <b>rata-rata tertimbang</b> marjin kontribusi keduanya:",T74,"Titik impas = Rp1.261.980.000 / Rp8.100 = <b>155.800 kendaraan</b>, terdiri dari <b>15.580 truk (10%)</b> dan <b>140.220 mobil (90%)</b>.",T75,"Untuk pertanyaan kedua, lebih dulu dihitung target keuntungan <b>sebelum pajak</b>: Rp504.000.000 / (1 \u2212 20%) = <b>Rp630.000.000</b>. Perhatikan: soal menulis Rp50.400.000, tetapi jawaban modul memakai Rp504.000.000 (kemungkinan salah ketik di soal). Jumlah kendaraan = (Rp1.261.980.000 + Rp630.000.000) / Rp8.100 = <b>233.578 kendaraan</b>, terdiri dari <b>23.358 truk (10%)</b> dan <b>210.220 mobil (90%)</b>.",T76],
"7.9":["Analisis CVP dilakukan pada tahap perencanaan, ketika asumsi yang dibuat belum tentu sama dengan kondisi sebenarnya saat rencana dilaksanakan. Karena itu <b>unsur ketidakpastian</b> harus dipertimbangkan. Ada tiga cara menghadapinya:","- <b>Safety margin</b>","- <b>Operating leverage</b>","- <b>Analisis sensitivitas (<i>what-if analysis</i>)</b>","<b>Safety margin</b> adalah selisih antara unit yang diperkirakan dapat dijual pada periode analisis dengan unit yang harus terjual untuk mencapai titik impas.","- Safety margin <b>besar</b>: posisi perusahaan makin aman. Jika ada asumsi yang sedikit meleset, perkiraan posisi perusahaan masih jauh dari titik impas.","- Safety margin <b>rendah</b>: perusahaan berada dalam posisi rawan. Jika ada asumsi yang meleset, laba bisa terbawa ke titik impas, atau dengan kata lain perusahaan bisa merugi.","<b>Operating leverage</b> mengukur proporsi biaya tetap dibandingkan total biaya perusahaan. Makin tinggi operating leverage, makin tinggi proporsi biaya tetap, dan itu menambah risiko, karena fluktuasi laba cenderung makin besar. Rumusnya:","- Operating Leverage = Total Marjin Kontribusi / Total Laba Operasi","Contoh: operating leverage 5 berarti jika penjualan meleset 1%, laba meleset <b>5%</b>.","<b>Analisis sensitivitas</b> dilakukan untuk mencari <b>unsur yang paling sensitif</b> dalam analisis CVP, yaitu faktor yang jika meleset paling mempengaruhi laba. Misalnya perusahaan menganggap harga paling sensitif, maka harga dinaikkan atau diturunkan 1% dari rencana awal, lalu dilihat dampaknya terhadap laba. Faktor paling sensitif inilah yang harus dijaga agar tidak meleset dari rencana."],
"7.10":["Seperti dijelaskan di modul sebelumnya, ada <b>empat tingkatan aktivitas</b> dalam model <i>activity based costing</i>: <i>unit level</i>, <i>batch level</i>, <i>product level</i>, dan <i>facility level</i>.","Dalam CVP dengan model ABC, definisi biaya tetap dan biaya variabel dikaitkan bukan hanya dengan produk, tetapi dengan <b>aktivitas</b>.","- <b>Biaya variabel:</b> hanya biaya variabel dari aktivitas <b>tingkat unit</b>.","- <b>Biaya tetap:</b> biaya tetap untuk aktivitas tingkat unit, ditambah biaya dari tingkatan aktivitas lainnya (<i>batch</i>, <i>product</i>, dan <i>facility</i>), dikelompokkan sebagai biaya tetap.","Halaman modul yang tersedia berakhir di bagian ini."]
});

"Kenapa nggak alokasi biaya tetap per produk? Modul bilang itu <b>tidak disarankan</b>, karena sulit mengalokasikan biaya secara akurat ke masing-masing produk.",
T71,
"Total biaya tetap Rp18.200.000 / 910 = <b>20.000 unit</b>. Pembagiannya: A <b>12.000 unit (60%)</b>, B <b>6.000 unit (30%)</b>, C <b>2.000 unit</b>. Modul menulis C = 20%, padahal 2.000 / 20.000 = <b>10%</b> (cocok dengan proporsi 0,1).||tiap 10 unit yang laku, 6 unit A, 3 unit B, 1 unit C, dan 'sisa untung' rata-ratanya Rp910.",
"Kalau produknya <b>puluhan atau ratusan</b>, kelompokkan berdasarkan <b>kesamaan marjin kontribusi per unit</b> (biasanya satu lini produk). Produk dengan marjin sama atau hampir sama bisa digabung dan dianggap satu jenis produk, jadi jumlah kelompok di analisis CVP berkurang.||kayak ngelompokkin ratusan menu jadi 'minuman', 'makanan berat', 'camilan' biar hitungannya nggak ribet."],
"7.6":[
"Bagian tersulit CVP: <b>memilah semua biaya</b> jadi tetap atau variabel. CVP nggak kenal biaya semi variabel atau <i>step costs</i>, semua harus masuk salah satu. Ada dua jenis biaya yang bikin pusing:",
"<b>1. <i>Mixed costs</i></b> (listrik, air, telepon): ada unsur tetap dan variabelnya, jadi harus <b>dipisahkan</b>.@@Bisa pakai <i>high-low point method</i> atau metode statistik@@Disarankan <b>metode statistik</b>, karena high-low hasil pemisahannya <b>kurang akurat</b>||tagihan listrik toko: ada abonemen tetap tiap bulan, plus pemakaian yang naik kalau toko ramai.",
"<b>2. Biaya yang memang nggak bisa dimasukkan</b> ke tetap atau variabel. Biaya variabel di CVP harus berubah <b>proporsional</b> dengan unit terjual. Kalau berubah tapi nggak proporsional, bukan variabel.||lembur toko roti tiap Sabtu-Minggu 2 jam: nggak ada jaminan tiap jam lembur ngasilin roti yang sama, jadi bukan variabel.",
"Karena CVP cuma punya dua golongan, biaya lembur itu masuk <b>biaya tetap</b>. Jadi <b>biaya tetap di CVP</b> = semua biaya yang <b>nggak bisa dikategorikan sebagai biaya variabel</b>.",
"Masalah lain: rumus CVP minta biaya variabel dinyatakan <b>per unit</b>. Contoh air buat bikin roti: sebenarnya variabel (makin banyak roti, makin banyak air). Tapi kalau jenis roti banyak, ngitung air per roti susah; kalau info total biaya air-nya juga nggak ada, air terpaksa dimasukkan ke <b>biaya tetap</b>.||menghitung berapa tetes air untuk tiap roti dari 50 jenis roti itu hampir mustahil.",
"Kesimpulannya, banyak biaya di kelompok biaya tetap versi CVP sebenarnya <b>bukan biaya tetap</b> menurut definisi di awal modul."],
"7.7":[
"<b>Soal PT Jaja Marja:</b> mengelola <b>jalan tol 80 Km</b> dalam kota, tarif nggak tergantung jarak: <b>sedan Rp8.000</b>, <b>truk Rp10.000</b> sekali masuk.||kayak parkir flat: mau parkir sebentar atau lama, bayarnya sama.",
"Data biaya:@@<b>Petugas tol:</b> 12 orang, gaji Rp2.000.000 per bulan@@<b>Lembur:</b> Senin-Jumat 10 jam per hari, Rp20.000 per jam@@<b>Direksi dan karyawan lain:</b> 30 orang, gaji total Rp120.000.000 (modul tulis per bulan)@@<b>Pemeliharaan:</b> Rp4.000.000 per km per tahun@@<b>Penyusutan jalan:</b> Rp300.000.000 per tahun@@<b>Listrik:</b> 20.000 Kwh per bulan, Rp1.000 per Kwh@@<b>Karcis:</b> Rp100 per lembar, satu lembar per kendaraan@@<b>Administrasi dan umum:</b> Rp100.000.000 per tahun (tetap)",
"Data iklan:@@<b>12 spot</b> di pinggir jalan, sewa Rp20.000.000 per spot per tahun, diperkirakan <b>10 spot</b> laku@@Biaya bangun papan iklan Rp3.000.000 per spot@@Pajak daerah Rp1.000.000 per spot, <b>tetap dibayar</b> walau papan nggak laku",
"Komposisi kendaraan: <b>90% sedan</b>, <b>10% truk</b>. Pertanyaan: (1) kendaraan untuk <b>titik impas</b>; (2) kendaraan agar untung setelah pajak (pajak 20%) tercapai."],
"7.8":[
"<b>Langkah 1:</b> pilah biaya. <b>Biaya variabel cuma satu: pencetakan karcis</b> (naik proporsional dengan jumlah kendaraan). Semua biaya lain <b>tetap</b>, total <b>Rp1.261.980.000</b>.||gaji petugas dan perawatan jalan nggak ikut naik kalau mobil yang lewat nambah satu, tapi karcis jelas nambah satu lembar.",
T73,
"<b>Catatan angka di modul:</b> gaji direksi ditulis <b>per bulan</b> di soal tapi tabel memakai 120.000.000 tanpa dikali 12; biaya administrasi di soal Rp100.000.000 tapi tabel Rp99.980.000. Yang dipakai angka tabel.",
"<b>Langkah 2:</b> produknya dua (sedan dan truk) dengan marjin beda, jadi hitung <b>rata-rata tertimbang</b> marjin kontribusi.||tiap 10 kendaraan: 9 sedan nyumbang Rp7.900, 1 truk nyumbang Rp9.900.",
T74,
"<b>Langkah 3 (titik impas):</b> 1.261.980.000 / 8.100 = <b>155.800 kendaraan</b>: <b>15.580 truk</b> (10%) dan <b>140.220 mobil</b> (90%).",
T75,
"<b>Langkah 4 (target untung):</b> untung sebelum pajak = 504.000.000 / (1 \u2212 20%) = <b>Rp630.000.000</b>. Hati-hati: soal menulis Rp50.400.000, tapi jawaban modul memakai Rp504.000.000 (kemungkinan salah ketik di soal). Kendaraan = (1.261.980.000 + 630.000.000) / 8.100 = <b>233.578</b>: <b>23.358 truk</b> dan <b>210.220 mobil</b>.",
T76],
"7.9":[
"CVP disusun di tahap perencanaan, jadi asumsinya <b>belum tentu</b> sama dengan kenyataan. Tiga cara menghadapi ketidakpastian:@@<b>Safety margin</b>@@<b>Operating leverage</b>@@<b>Analisis sensitivitas</b> (<i>what-if</i>)||kayak ngecek ban cadangan, ukuran beban mobil, dan bagian mana yang paling gampang rusak sebelum perjalanan jauh.",
"<b>Safety margin</b> = selisih unit yang <b>diperkirakan terjual</b> dengan unit di <b>titik impas</b>.@@<b>Besar:</b> posisi aman, asumsi meleset sedikit masih jauh dari titik impas@@<b>Kecil:</b> posisi rawan, asumsi meleset bisa membawa laba ke titik impas atau rugi||perkiraan jual 1.000 unit, impas di 900: aman tipis. Impas di 400: aman lebar.",
"<b>Operating leverage</b> = proporsi biaya tetap dibanding total biaya. Makin tinggi, makin besar risiko karena laba makin <b>berfluktuasi</b>. Rumus: <b>Total marjin kontribusi / Total laba operasi</b>. Contoh: OL = 5 artinya penjualan meleset 1% membuat laba meleset <b>5%</b>.||perusahaan dengan sewa dan mesin mahal (biaya tetap tinggi) kayak sepeda dengan gigi berat: sekali jalan kencang, tapi susah kalau nanjak.",
"<b>Analisis sensitivitas</b> = cari <b>unsur paling sensitif</b> terhadap laba, yaitu faktor yang kalau meleset paling mempengaruhi laba. Misalnya harga dinaikkan atau diturunkan 1% lalu dilihat dampaknya ke laba. Faktor paling sensitif harus <b>dijaga</b> agar nggak meleset dari rencana.||kayak ngecek: kalau harga telur naik 1% dampaknya ke untung lebih besar daripada kalau tarif listrik naik 1%?"],
"7.10":[
"Di modul sebelumnya, ABC punya <b>empat tingkatan aktivitas</b>: <i>unit level</i>, <i>batch level</i>, <i>product level</i>, <i>facility level</i>.",
"Di <b>CVP dengan ABC</b>, definisi biaya variabel dikaitkan ke <b>aktivitas</b>, bukan cuma ke produk:@@<b>Biaya variabel:</b> hanya biaya variabel dari aktivitas <b>tingkat unit</b>@@<b>Biaya tetap:</b> biaya tetap aktivitas tingkat unit, plus biaya aktivitas tingkat <b>batch, product, dan facility</b>||biaya set-up mesin (aktivitas tingkat batch) di CVP-ABC dikelompokkan sebagai biaya tetap, bukan variabel.",
"Halaman modul yang tersedia berakhir di bagian ini."]
});
